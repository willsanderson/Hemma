          --ha-color-text-secondary: rgba(0,0,0,0.55);
          --wa-color-text-quiet: rgba(0,0,0,0.55);
          --ha-card-background: rgba(0,0,0,0.07);
          --ha-color-fill-primary-quiet-resting: rgba(0,0,0,0.07);
          --ha-color-fill-primary-quiet-hover: rgba(0,0,0,0.10);
          --md-list-container-color: rgba(0,0,0,0.07);
          color: rgba(0,0,0,0.88);
        }
        ha-adaptive-dialog {
          --wa-color-fill-loud: rgba(0,0,0,0.88);
          --wa-color-neutral-fill-loud: rgba(0,0,0,0.88);
          --wa-color-on-normal: rgba(0,0,0,0.88);
          --wa-color-on-quiet: rgba(0,0,0,0.55);
          --wa-color-neutral-on-quiet: rgba(0,0,0,0.55);
          --wa-color-text-normal: rgba(0,0,0,0.88);
          --wa-color-text-quiet: rgba(0,0,0,0.55);
          color: rgba(0,0,0,0.88);
        }
        .content-wrapper {
          color: rgba(0,0,0,0.88);
        }
      }

    ha-adaptive-dialog: |
      wa-drawer,
      wa-dialog {
        --wa-color-fill-loud: var(--primary-text-color, white);
        --wa-color-neutral-fill-loud: var(--primary-text-color, white);
        --wa-color-on-normal: var(--primary-text-color, white);
        --wa-color-on-quiet: var(--primary-text-color, white);
        --wa-color-neutral-on-quiet: var(--primary-text-color, white);
        --wa-color-text-normal: var(--primary-text-color, white);
        color: var(--primary-text-color, white);
      }

      @media (prefers-color-scheme: light) {
        wa-drawer,
        wa-dialog {
          --wa-color-fill-loud: rgba(0,0,0,0.88);
          --wa-color-neutral-fill-loud: rgba(0,0,0,0.88);
          --wa-color-on-normal: rgba(0,0,0,0.88);
          --wa-color-on-quiet: rgba(0,0,0,0.55);
          --wa-color-neutral-on-quiet: rgba(0,0,0,0.55);
          --wa-color-text-normal: rgba(0,0,0,0.88);
          --wa-color-text-quiet: rgba(0,0,0,0.55);
          color: rgba(0,0,0,0.88);
        }
      }

      @media (max-width: 767px) and (prefers-color-scheme: light) {
        wa-drawer {
          --wa-color-surface-raised: rgba(20,20,30,0.65) !important;
          --wa-color-surface: rgba(20,20,30,0.65) !important;
          background: rgba(20,20,30,0.65) !important;
          background-color: rgba(20,20,30,0.65) !important;
        }
      }

    more-info-light: |
      ha-card:hover,
      ha-card:focus-within {
        box-shadow: none !important;
        filter: none !important;
      }

    ha-app-layout: |
      @media (max-width: 767px) and (orientation: portrait) {
        #view {
          overflow-y: visible !important;
          overscroll-behavior: none !important;
          scrollbar-width: none !important;
        }

        #view::-webkit-scrollbar {
          display: none !important;
        }
      }

    ha-drawer: |
      .sidebar-shell {
        background-color: var(--sidebar-background-color) !important;
        backdrop-filter: blur(20px) saturate(1.2);
        -webkit-backdrop-filter: blur(20px) saturate(1.2);
        border-right: none !important;
        box-shadow: none !important;
      }

    browser-mod-popup: |
      :host {
        scrollbar-width: none !important;
        -ms-overflow-style: none !important;
      }
      :host::-webkit-scrollbar {
        display: none !important;
      }
      ha-dialog,
      ha-adaptive-dialog {
        --dialog-surface-margin-top: 85px !important;
        scrollbar-width: none !important;
        -ms-overflow-style: none !important;
      }

      @media (max-width: 767px) {
        ha-dialog,
        ha-adaptive-dialog {
          --dialog-box-shadow: none !important;
        }
      }

  card-mod-sidebar-yaml: |
    .: |
      :host {
        background: none !important;
        box-shadow: none !important;
        border: 0 !important;
        outline: none !important;
      }

      .menu {
        border-bottom: 0 !important;
        box-shadow: none !important;
      }

      ha-md-list-item,
      ha-md-list-item.selected::before,
      ha-list-item-button,
      ha-list-item-button.selected::before {
        border-radius: var(--ha-card-border-radius) !important;
        --ha-list-item-focus-radius: var(--ha-card-border-radius) !important;
      }

      @media (hover: none) {
        ha-md-list-item,
        ha-list-item-button {
          --md-list-item-hover-state-layer-opacity: 0 !important;
          --ha-ripple-hover-opacity: 0 !important;
        }
      }

  card-mod-drawer-yaml: |
    .: |
      .mdc-drawer, .sidebar-shell {
        background-color: var(--sidebar-background-color) !important;
        border-inline-end: none !important;
        box-shadow: none !important;
      }
    wa-drawer$: |
      dialog {
        backdrop-filter: blur(20px) saturate(1.2) !important;
        -webkit-backdrop-filter: blur(20px) saturate(1.2) !important;
      }

  card-mod-sidebar: |
    :host {
      background: none !important;
      backdrop-filter: var(--ha-card-backdrop-filter);
    }

  card-mod-view-yaml: |
    hui-view:
      $: |
        :host {
          background: none !important;
        }
        @media (max-width: 767px) and (orientation: portrait) {
          :host {
            overscroll-behavior: none !important;
          }
        }

    ha-card:
      $: |
        :host {
          --mdc-ripple-press-opacity: 0 !important;
          --mdc-ripple-hover-opacity: 0 !important;
          --mdc-ripple-focus-opacity: 0 !important;
          --mdc-ripple-color: transparent !important;
          -webkit-tap-highlight-color: transparent !important;
        }

  card-mod-card: |
    ha-card {
      background: var(--ha-card-background, rgba(0,0,0,0.2));
      border-radius: var(--ha-card-border-radius, 16px);
      transition: filter .22s ease, transform .12s ease, box-shadow .24s ease !important;
      will-change: filter, transform;
    }

    :host(.hemma-room) ha-card {
      will-change: auto !important;
      transition: none !important;
    }

    @media (hover:hover) {
      :host(:not(.hemma-room)) ha-card:not(.type-custom-navbar-card):hover {
        box-shadow: var(--hemma-card-hover-shadow, var(--button-card-box-shadow-hover, var(--ha-shadow-light-hover))) !important;
      }
      :host(:not(.hemma-room)) ha-card:not(.type-custom-navbar-card):hover,
      :host(:not(.hemma-room)) ha-card:not(.type-custom-navbar-card):focus-within {
        filter: var(--hemma-card-hover-filter, brightness(1.01)) !important;
      }
    }

    @media (hover:none) {
      :host(:not(.hemma-room)) ha-card:not(.type-custom-navbar-card):active {
        filter: var(--hemma-card-hover-filter, brightness(1.01)) !important;
        box-shadow: var(--hemma-card-hover-shadow, var(--button-card-box-shadow-hover, var(--ha-shadow-light-hover))) !important;
      }
    }

    :host(.hemma-entity) {
      position: relative !important;
      z-index: 0 !important;
      display: block !important;
      border-radius: var(--ha-card-border-radius, 28px) !important;
      overflow: visible !important;
      contain: none !important;
    }

    :host(.hemma-entity) ha-card {
      position: relative !important;
      z-index: 0 !important;
      border-radius: inherit !important;
      overflow: hidden !important;
      background-clip: padding-box;
    }

    :host(.hemma-entity) ha-card:active {
      transform: translateY(.5px);
      backface-visibility: hidden;
      will-change: transform;
    }

    :host(.hemma-hero),
    :host(.hemma-hero) ha-card,
    :host(.hemma-hero) .button-card-main,
    :host(.hemma-hero) .button-card-content{
      direction: ltr !important;
      text-align: left !important;
    }

    /* Energy dashboard */
    .mdc-data-table,
    .mdc-data-table__row,
    .mdc-data-table__header-cell,
    ha-sankey-chart {
      background: none !important;
    }

  # ============================================================================
  # UIX — VIEW BACKGROUNDS
  # ============================================================================

  uix-theme: "Hemma"

  uix-drawer: |
    .mdc-drawer, .sidebar-shell {
      background-color: var(--sidebar-background-color) !important;
      backdrop-filter: blur(20px) saturate(1.2);
      -webkit-backdrop-filter: blur(20px) saturate(1.2);
      border-right: none !important;
      box-shadow: none !important;
    }
    :host {
      {%- if panel.viewUrlPath == 'electricity' -%}
      --uix-view-background-cover: full;
      --uix-view-background: linear-gradient(rgba(55,55,55,0.50),rgba(55,55,55,0.50)),center/cover no-repeat url('/local/hemma/rooms/home.jpg')
      {%- endif -%};
    }
    @media (prefers-color-scheme: dark) {
      :host {
        {%- if panel.viewUrlPath == 'electricity' -%}
        --uix-view-background: linear-gradient(rgba(55,55,55,0.50),rgba(55,55,55,0.50)),center/cover no-repeat url('/local/hemma/rooms/home-night.jpg')
        {%- endif -%};
      }
    }
    @media (max-width: 767px) {
      :host {
        {%- if panel.viewUrlPath == 'electricity' -%}
        --uix-view-background: linear-gradient(rgba(80,80,80,0.20),rgba(80,80,80,0.20)),center/cover no-repeat url('/local/hemma/rooms/home-demo.jpg')
        {%- endif -%};
      }
    }
    @media (max-width: 767px) and (prefers-color-scheme: dark) {
      :host {
        {%- if panel.viewUrlPath == 'electricity' -%}
        --uix-view-background: linear-gradient(rgba(80,80,80,0.20),rgba(80,80,80,0.20)),center/cover no-repeat url('/local/hemma/rooms/home-demo-night.jpg')
        {%- endif -%};
      }
    }

  uix-view-background: |
    .uix-bg-image {
      filter: blur(4px) saturate(1.02) brightness(0.985);
    }
    @media (max-width: 767px) {
      .uix-bg-image {
        filter: saturate(var(--hero-img-saturate-mobile, 1.00)) brightness(var(--hero-img-brightness-mobile, 0.99));
      }
    }
