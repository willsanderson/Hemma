homeassistant:
  packages: !include_dir_named packages
# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
template: !include sensors.yaml

# Lovelace resources (smart-row.js, filter-overlay.js, etc.) are added via
# Settings → Dashboards → Resources — see the README installation steps.
lovelace:
  mode: storage
  dashboards:
    dashboard-hemma:
      mode: yaml
      title: "Hemma"
      icon: mdi:home
      show_in_sidebar: true
      filename: dashboards/hemma/hemma.yaml
    dashboard-hemma-mobile:
      mode: yaml
      title: "Hemma Mobile"
      icon: mdi:cellphone
      show_in_sidebar: false
      filename: dashboards/hemma/hemma_mobile.yaml
