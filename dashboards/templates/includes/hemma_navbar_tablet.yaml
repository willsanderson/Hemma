type: vertical-stack
cards:

  # Tablet Portrait
  - type: conditional
    conditions:
      - condition: state
        entity: input_boolean.hemma_mobile_navigation
        state: "off"
      - condition: screen
        media_query: "(orientation: portrait) and (min-width: 768px) and (max-width: 1400px) and (hover: none) and (pointer: coarse)"

    card:
      type: custom:navbar-card

      desktop:
        min_width: 1
        hidden: false
        mode: floating
        position: top
        show_labels: true
        show_popup_label_backgrounds: false

      mobile:
        hidden: true

      layout:
        auto_padding:
          enabled: false
          desktop_px: 0
          mobile_px: 0

      card_mod:
        style: |
          :host{ position: relative; z-index: 2147483647 !important; }
          ha-card{
            --mdc-ripple-press-opacity: 0 !important;
            --mdc-ripple-hover-opacity: 0 !important;
            --mdc-ripple-focus-opacity: 0 !important;
            --mdc-ripple-color: transparent !important;
            --state-layer-opacity: 0 !important;
            --mdc-theme-on-surface: transparent !important;
            background: transparent !important;
            box-shadow: none !important;
            overflow: visible !important;
            padding: 0 !important;
            touch-action: pan-x !important;
          }

      styles: |
        .navbar-card.mobile{ display:none !important; }

        ha-card.navbar-card.desktop{
          position: relative !important;
          inset: auto !important;
          transform: none !important;
          min-width: 0 !important;
          border-radius: 0 !important;
          padding: 4px !important;
          background: transparent !important;
          -webkit-backdrop-filter: none !important;
          backdrop-filter: none !important;
          border: none !important;
          box-shadow: none !important;
          overflow-x: auto !important;
          overflow-y: hidden !important;
          scrollbar-width: none !important;
          -webkit-overflow-scrolling: touch !important;
          justify-content: safe center !important;
          --navbar-primary-color: rgba(255,255,255,0.85) !important;
          --navbar-active-color: rgba(255,255,255,1) !important;
          --navbar-route-active-background: transparent !important;
          --navbar-route-active-color: inherit !important;
        }

        ha-card.navbar-card.desktop::-webkit-scrollbar,
        .navbar.desktop::-webkit-scrollbar{
          height: 0 !important;
          display: none !important;
        }

        @keyframes hemma-tablet-portrait-fade {
          0% {
            -webkit-mask-image: linear-gradient(to right, black, black calc(100% - 40px), transparent);
            mask-image: linear-gradient(to right, black, black calc(100% - 40px), transparent);
          }
          1%, 99% {
            -webkit-mask-image: linear-gradient(to right, rgba(0,0,0,0.2), rgba(0,0,0,0.4) 10px, black 50px, black calc(100% - 50px), transparent);
            mask-image: linear-gradient(to right, rgba(0,0,0,0.2), rgba(0,0,0,0.4) 10px, black 50px, black calc(100% - 50px), transparent);
          }
          100% {
            -webkit-mask-image: linear-gradient(to right, rgba(0,0,0,0.2), rgba(0,0,0,0.4) 10px, black 50px, black);
            mask-image: linear-gradient(to right, rgba(0,0,0,0.2), rgba(0,0,0,0.4) 10px, black 50px, black);
          }
        }

        @supports (animation-timeline: scroll()) {
          ha-card.navbar-card.desktop{
            animation: hemma-tablet-portrait-fade linear !important;
            animation-timeline: scroll(self inline) !important;
          }
        }

        @keyframes hemma-badge-pulse {
          0%, 100% { opacity: .9; transform: scale(1); }
          50%       { opacity: 0; transform: scale(0.85); }
        }

        .badge{
          width: 6px !important;
          height: 6px !important;
          border-radius: 999px !important;
          top: 9px !important;
          left: 44px !important;
          animation: hemma-badge-pulse 3s ease-in-out infinite !important;
        }

        .navbar.desktop{
          --navbar-route-icon-size: 0px !important;
          position: fixed !important;
          left: 50% !important;
          right: auto !important;
          transform: translateX(-50%) !important;
          top: 32px !important;
          bottom: auto !important;
          width: fit-content !important;
          max-width: calc(75vw - 35px) !important;
          display: flex !important;
          flex-wrap: nowrap !important;
          gap: 0 !important;
          padding: 0 3px !important;
          margin: 0 !important;
          border-radius: 9999px !important;
          background: var(--hemma-glass-background, rgba(255,255,255,0.10)) !important;
          -webkit-backdrop-filter: var(--hemma-nav-glass-backdrop, blur(24px) saturate(120%)) !important;
          backdrop-filter: var(--hemma-nav-glass-backdrop, blur(24px) saturate(120%)) !important;
          box-shadow: var(--hemma-nav-glass-rim, inset 0 1px .5px -0.5px rgba(255,255,255,0.55), inset 0 -1px .5px -0.5px rgba(255,255,255,0.48), inset 0 3px 6px -3px rgba(255,255,255,0.20), inset 0 -3px 6px -3px rgba(255,255,255,0.12), 2px 0 3px -2px rgba(0,0,0,0.45), -2px 0 3px -2px rgba(0,0,0,0.45), 0 4px 28px 2px rgba(0,0,0,0.07)) !important;
          overflow-x: auto !important;
          overflow-y: hidden !important;
          touch-action: pan-x !important;
          -webkit-overflow-scrolling: touch !important;
          scrollbar-width: none !important;
        }

        .icon, .image, ha-icon{ display:none !important; }

        .route{
          flex: 0 0 auto !important;
          display:flex !important;
          align-items:center !important;
          justify-content:center !important;
          padding: 0 12px 0 12px !important;
          background: transparent !important;
          overflow: visible !important;
        }

        .button{
          width: 100% !important;
          height: 100% !important;
          display:flex !important;
          align-items:center !important;
          justify-content:center !important;
          background: transparent !important;
          border: none !important;
          box-shadow: none !important;
          overflow: visible !important;
        }

        .label{
          display:inline-flex !important;
          align-items:center !important;
          justify-content:center !important;
          padding: 12px !important;
          border-radius: 9999px !important;
          line-height: 1 !important;
          white-space: nowrap !important;
          overflow: hidden !important;
          text-overflow: ellipsis !important;
          font-size: 16px !important;
          font-weight: 600 !important;
          color: var(--navbar-primary-color) !important;
          opacity: var(--hemma-nav-inactive-opacity, .82) !important;
          background: transparent !important;
        }

        .route.active .label,
        .label.active{
          background: var(--hemma-nav-active-fill, rgba(255,255,255,0.22)) !important;
          box-shadow: none !important;
          color: var(--navbar-active-color) !important;
          opacity: 1 !important;
        }

        .navbar-card.desktop .route{
          height: auto !important;
          min-height: 0 !important;
          width: auto !important;
          min-width: 0 !important;
          margin: 0 !important;
        }

        .navbar-card.desktop .button{
          width: auto !important;
          height: auto !important;
          padding: 0 !important;
        }

        .navbar-card.desktop .label{
          line-height: 1 !important;
        }

        .navbar-card.desktop{
          gap: 5px !important;
        }

        ha-ripple{ display:none !important; }
        .mdc-ripple-surface::before,
        .mdc-ripple-surface::after{
          content: none !important;
          display: none !important;
          opacity: 0 !important;
        }

        .navbar-popup{
          background: var(--hemma-glass-background, rgba(255,255,255,0.10)) !important;
          -webkit-backdrop-filter: var(--hemma-nav-glass-backdrop, blur(24px) saturate(120%)) !important;
          backdrop-filter: var(--hemma-nav-glass-backdrop, blur(24px) saturate(120%)) !important;
          border-radius: var(--hemma-navbar-popup-br, 22px) !important;
          box-shadow: var(--hemma-nav-glass-rim, inset 0 1px .5px -0.5px rgba(255,255,255,0.55), inset 0 -1px .5px -0.5px rgba(255,255,255,0.48), inset 0 3px 6px -3px rgba(255,255,255,0.20), inset 0 -3px 6px -3px rgba(255,255,255,0.12), 2px 0 3px -2px rgba(0,0,0,0.45), -2px 0 3px -2px rgba(0,0,0,0.45), 0 4px 28px 2px rgba(0,0,0,0.07)) !important;
          padding: 8px !important;
          width: max-content !important;
          max-width: calc(100vw - 24px) !important;
          box-sizing: border-box !important;
          display: flex !important;
          flex-direction: column !important;
          align-items: stretch !important;
          justify-content: flex-start !important;
          text-align: left !important;
          transition: all 0.2s cubic-bezier(.2,.8,.2,1) !important;
          --hemma-popup-label-size: 15px;
          --hemma-popup-label-weight: 400;
          --hemma-popup-label-active-weight: 550;
          --hemma-popup-label-inactive-opacity: .92;
          transform: none !important;
          transform-origin: top center !important;
        }

        .navbar-popup.open-bottom{
          margin-top: 14px !important;
        }

        .navbar-popup-backdrop.visible{ opacity: 0 !important; }

        .navbar-popup .popup-item{
          display: grid !important;
          grid-template-columns: 18px max-content !important;
          align-items: center !important;
          justify-items: start !important;
          column-gap: 11px !important;
          padding: 8px 15px 8px 10px !important;
          border-radius: 9999px !important;
          width: 100% !important;
          box-sizing: border-box !important;
          text-align: left !important;
          background: transparent !important;
          position: relative !important;
          overflow: visible !important;
        }

        .navbar-popup .popup-item:hover{ background: rgba(255,255,255,0.06) !important; }
        .navbar-popup .popup-item:active{ background: rgba(255,255,255,0.10) !important; }

        .navbar-popup .button:hover,
        .navbar-popup .button:focus,
        .navbar-popup .button:active,
        .navbar-popup .button:hover::before,
        .navbar-popup .button:hover::after,
        .navbar-popup ha-icon:hover{
          background: transparent !important;
          box-shadow: none !important;
          --state-layer-opacity: 0 !important;
          --md-ripple-hover-opacity: 0 !important;
        }

        .navbar-popup .popup-item .button{ position: static !important; }

        .navbar-popup .badge{
          right: 8px !important;
          top: 8px !important;
          transform: none !important;
          left: auto !important;
          width: 5px !important;
          height: 5px !important;
          animation: hemma-badge-pulse 3s ease-in-out infinite !important;
        }

        .navbar-popup ha-icon{
          width: 18px !important;
          height: 18px !important;
          --mdc-icon-size: 18px !important;
          display: inline-flex !important;
          align-items: center !important;
          justify-content: center !important;
          line-height: 1 !important;
          color: rgba(255,255,255,0.97) !important;
          opacity: var(--hemma-popup-label-inactive-opacity) !important;
          padding: 0 !important;
          margin: 0 !important;
        }

        .navbar-popup .label{
          font-size: var(--hemma-popup-label-size) !important;
          font-weight: var(--hemma-popup-label-weight) !important;
          line-height: 1.4 !important;
          margin: 0 !important;
          padding: 0 0 0 1px !important;
          color: rgba(255,255,255,0.97) !important;
          opacity: var(--hemma-popup-label-inactive-opacity) !important;
          background: transparent !important;
          width: 100% !important;
        }

        .navbar-popup :is(.popup-item.active ha-icon, .popup-item.active .label){
          opacity: 1 !important;
        }

        .navbar-popup .popup-item.active .label{
          font-weight: var(--hemma-popup-label-active-weight) !important;
        }

        .navbar-popup.visible .popup-item{
          transition-delay: calc(var(--index) * 0.01s) !important;
        }

        .navbar-popup ha-ripple{ display:none !important; }
        .navbar-popup .mdc-ripple-surface::before,
        .navbar-popup .mdc-ripple-surface::after{
          content: none !important;
          display: none !important;
          opacity: 0 !important;
        }

        .navbar-popup,
        .navbar-popup *{
          --mdc-theme-primary: rgba(255,255,255,0.97) !important;
          --mdc-theme-secondary: rgba(255,255,255,0.97) !important;
          --icon-primary-color: rgba(255,255,255,0.97) !important;
          --icon-secondary-color: rgba(255,255,255,0.97) !important;
        }

        .navbar-popup ha-icon{
          color: rgba(255,255,255,0.97) !important;
        }
        .navbar-popup .popup-item.active ha-icon{
          color: rgba(255,255,255,0.97) !important;
        }

        :host, :host *{
          -webkit-tap-highlight-color: transparent !important;
          --mdc-ripple-press-opacity: 0 !important;
          --mdc-ripple-hover-opacity: 0 !important;
          --mdc-ripple-focus-opacity: 0 !important;
          --mdc-ripple-color: transparent !important;
          --state-layer-opacity: 0 !important;
          --md-ripple-hover-opacity: 0 !important;
          --md-ripple-focus-opacity: 0 !important;
          --md-ripple-pressed-opacity: 0 !important;
          --md-ripple-color: transparent !important;
        }

        ha-ripple, mwc-ripple, md-ripple{
          display: none !important;
        }

        .mdc-ripple-surface,
        .mdc-ripple-surface::before,
        .mdc-ripple-surface::after{
          display: none !important;
          opacity: 0 !important;
          content: none !important;
        }

      # Buttons (Edit these)
      routes:
        # Home
        - url: /dashboard-hemma/home
          label: Home
          icon: mdi:home-variant
          icon_selected: mdi:home-variant

        # Living Room
        - url: /dashboard-hemma/living-room
          label: Living Room
          icon: mdi:sofa
          badge:
            show: >
              [[[
                const _s = hass.states['input_text.hemma_motion_living_room']?.state?.trim();
                return hass.states['input_boolean.hemma_motion_badges']?.state === 'on'
                  && !!_s && hass.states[_s]?.state === 'on';
              ]]]
            color: '#ffd700'

        # Kitchen
        - url: /dashboard-hemma/kitchen
          label: Kitchen
          icon: mdi:fridge

        # Bedroom
        - url: /dashboard-hemma/bedroom
          label: Bedroom
          icon: mdi:bed-king
          badge:
            show: >
              [[[
                const _s = hass.states['input_text.hemma_motion_bedroom']?.state?.trim();
                return hass.states['input_boolean.hemma_motion_badges']?.state === 'on'
                  && !!_s && hass.states[_s]?.state === 'on';
              ]]]
            color: '#ffd700'

        # Scenes (Dropdown Menu)
        - label: Scenes
          icon: mdi:layers
          icon_selected: mdi:layers
          tap_action:
            action: open-popup
          popup: |
            [[[
              const reg = hass.entities;

              const getRegEntry = (id) => {
                if (!reg) return null;
                if (Array.isArray(reg)) return reg.find(e => e?.entity_id === id) || null;
                return reg[id] || (reg.get ? reg.get(id) : null) || null;
              };

              // Keys-then-lookup: ownKeys doesn't register entities, get does.
              const scenes = Object.keys(hass.states || {})
                .filter(id => id.startsWith('scene.'))
                .map(id => hass.states[id])
                .filter(s => !s.entity_id.startsWith('scene.hemma_restore_'))
                // Exclude dynamically-created scenes (not in the entity registry)
                .filter(s => !!getRegEntry(s.entity_id))
                // Exclude scenes hidden/disabled in HA
                .filter(s => {
                  const e = getRegEntry(s.entity_id);
                  return !(e.hidden || e.hidden_by || e.disabled || e.disabled_by);
                })
                .slice()
                .sort((a,b) => (a.attributes?.friendly_name || a.entity_id)
                  .localeCompare(b.attributes?.friendly_name || b.entity_id));

              return scenes.map(s => ({
                label: s.attributes?.friendly_name || s.entity_id.replace('scene.',''),
                icon: s.attributes?.icon || 'mdi:layers',
                tap_action: {
                  action: 'call-service',
                  service: 'scene.turn_on',
                  service_data: { entity_id: s.entity_id, transition: 3 }
                }
              }));
            ]]]

