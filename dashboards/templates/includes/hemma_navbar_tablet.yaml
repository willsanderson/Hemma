          border-radius: var(--hemma-navbar-popup-br, 22px) !important;
          box-shadow: var(--hemma-nav-glass-rim, inset 0 1px .5px -0.5px rgba(255,255,255,0.55), inset 0 -1px .5px -0.5px rgba(255,255,255,0.48), inset 0 3px 6px -3px rgba(255,255,255,0.20), inset 0 -3px 6px -3px rgba(255,255,255,0.12), 2px 0 3px -2px rgba(0,0,0,0.45), -2px 0 3px -2px rgba(0,0,0,0.45), 0 4px 28px 2px rgba(0,0,0,0.07)) !important;
          padding: 8px !important;
          width: max-content !important;
          max-width: calc(100vw - 24px) !important;
          box-sizing: border-box !important;
          display: flex !important;
          flex-direction: column !important;
          align-items: stretch !important;
          justify-content: flex-start !important;
          text-align: left !important;
          transition: all 0.2s cubic-bezier(.2,.8,.2,1) !important;
          --hemma-popup-label-size: 15px;
          --hemma-popup-label-weight: 400;
          --hemma-popup-label-active-weight: 550;
          --hemma-popup-label-inactive-opacity: .92;
          transform: none !important;
          transform-origin: top center !important;
        }

        .navbar-popup.open-bottom{
          margin-top: 10px !important;
          transform: none !important;
        }

        .navbar-popup.open-up{
          margin-top: -8px !important;
          transform: translateY(-100%) !important;
        }

        .navbar-popup-backdrop{
          background: rgba(0,0,0,0.12) !important;
        }

        .navbar-popup-backdrop.visible{
          opacity: 0 !important;
        }

        .navbar-popup .popup-item{
          display: grid !important;
          grid-template-columns: 18px max-content !important;
          align-items: center !important;
          justify-items: start !important;
          column-gap: 11px !important;
          padding: 8px 12px 8px 10px !important;
          border-radius: 9999px !important;
          width: 100% !important;
          box-sizing: border-box !important;
          text-align: left !important;
          background: transparent !important;
          position: relative !important;
          overflow: visible !important;
        }

        .navbar-popup .popup-item:hover{ background: rgba(255,255,255,0.06) !important; }
        .navbar-popup .popup-item:active{ background: rgba(255,255,255,0.10) !important; }

        .navbar-popup .button:hover,
        .navbar-popup .button:focus,
        .navbar-popup .button:active,
        .navbar-popup .button:hover::before,
        .navbar-popup .button:hover::after,
        .navbar-popup ha-icon:hover{
          background: transparent !important;
          box-shadow: none !important;
          --state-layer-opacity: 0 !important;
          --md-ripple-hover-opacity: 0 !important;
        }

        .navbar-popup .popup-item .button{
          width: auto !important;
          height: auto !important;
          background: transparent !important;
          box-shadow: none !important;
          border: 0 !important;
          border-radius: 0 !important;
          padding: 0 !important;
          margin: 0 !important;
          display: inline-flex !important;
          align-items: center !important;
          justify-content: flex-start !important;
          position: static !important;
        }

        .navbar-popup .popup-item .button:hover,
        .navbar-popup .popup-item .button:active{
          background: transparent !important;
          box-shadow: none !important;
        }

        .navbar-popup ha-icon{
          width: 18px !important;
          height: 18px !important;
          --mdc-icon-size: 18px !important;
          display: inline-flex !important;
          align-items: center !important;
          justify-content: center !important;
          line-height: 1 !important;
          color: rgba(255,255,255,0.97) !important;
          opacity: var(--hemma-popup-label-inactive-opacity) !important;
          padding: 0 !important;
          margin: 0 !important;
        }

        .navbar-popup .label{
          font-size: var(--hemma-popup-label-size) !important;
          font-weight: var(--hemma-popup-label-weight) !important;
          line-height: 1.4 !important;
          margin: 0 !important;
          padding: 0 0 0 1px !important;
          color: rgba(255,255,255,0.97) !important;
          opacity: var(--hemma-popup-label-inactive-opacity) !important;
          background: transparent !important;
          width: 100% !important;
        }

        .navbar-popup :is(.popup-item.active ha-icon, .popup-item.active .label){
          opacity: 1 !important;
        }

        .navbar-popup .popup-item.active .label{
          font-weight: var(--hemma-popup-label-active-weight) !important;
        }

        .navbar-popup.visible .popup-item{
          transition-delay: calc(var(--index) * 0.01s) !important;
        }

        .navbar-popup ha-ripple{ display:none !important; }
        .navbar-popup .mdc-ripple-surface::before,
        .navbar-popup .mdc-ripple-surface::after{
          content: none !important;
          display: none !important;
          opacity: 0 !important;
        }

        .navbar-popup,
        .navbar-popup *{
          --mdc-theme-primary: rgba(255,255,255,0.97) !important;
          --mdc-theme-secondary: rgba(255,255,255,0.97) !important;
          --icon-primary-color: rgba(255,255,255,0.97) !important;
          --icon-secondary-color: rgba(255,255,255,0.97) !important;
        }

        .navbar-popup ha-icon{
          color: rgba(255,255,255,0.97) !important;
        }
        .navbar-popup .popup-item.active ha-icon{
          color: rgba(255,255,255,0.97) !important;
        }

        :host, :host *{
          -webkit-tap-highlight-color: transparent !important;
          --mdc-ripple-press-opacity: 0 !important;
          --mdc-ripple-hover-opacity: 0 !important;
          --mdc-ripple-focus-opacity: 0 !important;
          --mdc-ripple-color: transparent !important;
          --state-layer-opacity: 0 !important;
          --md-ripple-hover-opacity: 0 !important;
          --md-ripple-focus-opacity: 0 !important;
          --md-ripple-pressed-opacity: 0 !important;
          --md-ripple-color: transparent !important;
        }

        ha-ripple, mwc-ripple, md-ripple{
          display: none !important;
        }

        .mdc-ripple-surface,
        .mdc-ripple-surface::before,
        .mdc-ripple-surface::after{
          display: none !important;
          opacity: 0 !important;
          content: none !important;
        }

      # ── BUTTONS (Edit These) ──────────────────────────────────────────────
      routes:
        # Home
        - url: /dashboard-hemma/home
          label: Home
          icon: mdi:home-variant

        # Living Room
        - url: /dashboard-hemma/living-room
          label: Living Room
          icon: mdi:sofa
          badge:
            show: >
              [[[
                const _s = hass.states['input_text.hemma_motion_living_room']?.state?.trim();
                return hass.states['input_boolean.hemma_motion_badges']?.state === 'on'
                  && !!_s && hass.states[_s]?.state === 'on';
              ]]]
            color: '#ffd700'

        # Kitchen
        - url: /dashboard-hemma/kitchen
          label: Kitchen
          icon: mdi:fridge

        # Bedroom
        - url: /dashboard-hemma/bedroom
          label: Bedroom
          icon: mdi:bed-king
          badge:
            show: >
              [[[
                const _s = hass.states['input_text.hemma_motion_bedroom']?.state?.trim();
                return hass.states['input_boolean.hemma_motion_badges']?.state === 'on'
                  && !!_s && hass.states[_s]?.state === 'on';
              ]]]
            color: '#ffd700'

        - label: Scenes
          icon: mdi:layers
          icon_selected: mdi:layers
          tap_action:
            action: open-popup
          popup: |
            [[[
              const reg = hass.entities;

              const getRegEntry = (id) => {
                if (!reg) return null;
                if (Array.isArray(reg)) return reg.find(e => e?.entity_id === id) || null;
                return reg[id] || (reg.get ? reg.get(id) : null) || null;
              };

              const scenes = Object.keys(hass.states || {})
                .filter(id => id.startsWith('scene.'))
                .map(id => hass.states[id])
                .filter(s => !s.entity_id.startsWith('scene.hemma_restore_'))
                // Exclude dynamically-created scenes (not in the entity registry)
                .filter(s => !!getRegEntry(s.entity_id))
                // Exclude scenes hidden/disabled in HA
                .filter(s => {
                  const e = getRegEntry(s.entity_id);
                  return !(e.hidden || e.hidden_by || e.disabled || e.disabled_by);
                })
                .slice()
                .sort((a,b) => (a.attributes?.friendly_name || a.entity_id)
                  .localeCompare(b.attributes?.friendly_name || b.entity_id));

              return scenes.map(s => ({
                label: s.attributes?.friendly_name || s.entity_id.replace('scene.',''),
                icon: s.attributes?.icon || 'mdi:layers',
                tap_action: {
                  action: 'call-service',
                  service: 'scene.turn_on',
                  service_data: { entity_id: s.entity_id, transition: 3 }
                }
              }));
            ]]]
