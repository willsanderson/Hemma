hemma_doorbell:
  template:
    - hemma_entity

  variables:
    mobile_filter_category: security

  tap_action:
    action: more-info
  show_entity_picture: true
  show_name: true
  show_state: true
  name: Doorbell
  hold_action:
    action: more-info
  icon_tap_action:
    action: more-info
    entity: '[[[ return entity.entity_id ]]]'

  styles:
    img_cell:
      - color: var(--hemma-entity-name-active, var(--primary-text-color)) !important
    icon:
      - color: var(--hemma-entity-name-active, var(--primary-text-color)) !important