hemma_air_purifier:
  template: [hemma_air_device, hemma_popup_fan_panel]

  variables:
    icon: purifier

  styles:
    entity_picture:
      - width: 100%
      - height: 100%
      - object-fit: contain
      - opacity: 0.8
      - transition: opacity 0.2s ease, filter 0.2s ease, transform 0.15s ease
      - cursor: pointer

    img_cell:
      - background: transparent
      - box-shadow: none !important
      - transition: filter 0.2s ease
      - cursor: pointer
