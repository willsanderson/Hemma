hemma_air_purifier:
  template: [hemma_entity]

  show_icon: true
  show_name: true
  show_state: true

  tap_action:
    action: more-info
    entity: '[[[ return entity.entity_id ]]]'

  hold_action:
    action: more-info
    entity: '[[[ return entity.entity_id ]]]'

  icon_tap_action:
    action: toggle

  icon_hold_action:
    action: more-info
    entity: '[[[ return entity.entity_id ]]]'

  variables:
    mobile_filter_category: climate
    icon: purifier

  styles:
    entity_picture:
      - width: 100%
      - height: 100%
      - object-fit: contain
      - opacity: 0.8
      - transition: opacity 0.2s ease, filter 0.2s ease, transform 0.15s ease
      - cursor: pointer

    img_cell:
      - background: transparent
      - box-shadow: none !important
      - transition: filter 0.2s ease
      - cursor: pointer
