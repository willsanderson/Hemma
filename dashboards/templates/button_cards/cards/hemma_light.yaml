hemma_light:
  template:
    - hemma_entity
    - hemma_popup_light

  show_icon: false
  show_last_changed: false


  hold_action:
    haptic: medium
    action: >
      [[[
        return typeof window.browser_mod !== 'undefined' ? 'fire-dom-event' : 'more-info';
      ]]]
    browser_mod:
      service: browser_mod.popup
      data:
        tag: '[[[ return (entity?.entity_id || "hemma_light").replace(/\./g, "_") + "_popup"; ]]]'
        title: ""
        dismissable: true
        adaptive: true
        size: auto
        style: "--popup-width: 880px; --popup-max-width: 880px;"
        popup_styles:
          - style: all
            styles: |
              :host {
                --dialog-surface-margin-top: 100px;
                --ha-ripple-hover-opacity: 0;
                --ha-ripple-pressed-opacity: 0.04;
                opacity: 0;
                animation: hemma-popup-reveal 0s 0.8s ease forwards;
              }
              @keyframes hemma-popup-reveal { to { opacity: 1; } }
              .content .container > * {
                width: 100% !important;
                max-width: none !important;
                box-sizing: border-box !important;
              }
              .content .container {
                scrollbar-width: none;
                overscroll-behavior: contain;
                touch-action: pan-y;
                padding-bottom: 24px !important;
              }
              .content .container::-webkit-scrollbar { display: none; }
              wa-dialog { --width: min(880px, 92vw); }
              @media (max-width: 768px) {
                :host { --dialog-surface-margin-top: 0px; }
                wa-drawer {
                  --size: calc(100dvh - env(safe-area-inset-top, 0px) - 8dvh) !important;
                  height: calc(100dvh - env(safe-area-inset-top, 0px) - 8dvh) !important;
                  min-height: calc(100dvh - env(safe-area-inset-top, 0px) - 8dvh) !important;
                }
                .content .container {
                  min-height: calc(100dvh - env(safe-area-inset-top, 0px) - 8dvh) !important;
                }
              }
        content: |
          [[[
            if (typeof window._hemmaLPC === 'function') {
              return window._hemmaLPC(entity, states, typeof hass !== 'undefined' ? hass : null, variables);
            }
            return null;
          ]]]

  icon_tap_action:
    action: call-service
    service: script.turn_on
    service_data:
      entity_id: script.hemma_light_smart_toggle
      variables:
        light_entity: '[[[ return entity.entity_id ]]]'

  state_display: >
    [[[
      const memsOf = (eid) => {
        const m = states[eid]?.attributes?.entity_id;
        return Array.isArray(m) ? m.filter(x => typeof x === "string" && x.startsWith("light.")) : [];
      };
      const units = (eid, seen) => {
        if (!eid || seen.has(eid)) return [];
        const mems = memsOf(eid);
        // No members, or no member is itself a group -> one physical light.
        if (!mems.length || !mems.some(m => memsOf(m).length)) return [eid];
        seen.add(eid);
        return mems.flatMap(m => units(m, seen));
      };

      const seen = new Set();
      const all = [...new Set(units(entity?.entity_id, seen))];
      const onCount = all.filter(eid => states[eid]?.state === "on").length;

      return onCount === 0 ? "All Off"
           : onCount === all.length ? "All On"
           : `${onCount} On`;
    ]]]

  variables:
    mobile_filter_category: lights
    icon: light
    show_toggle: false
    toggle_service: script.turn_on
    toggle_service_data: |
      [[[
        return {
          entity_id: 'script.hemma_light_smart_toggle',
          variables: {
            light_entity: entity.entity_id
          }
        };
      ]]]

  styles:
    entity_picture:
      - width: 100%
      - height: 100%
      - object-fit: contain
      - opacity: 0.8
      - transition: opacity 0.2s ease, filter 0.2s ease, transform 0.15s ease
      - cursor: pointer

    img_cell:
      - background: transparent
      - box-shadow: none !important
      - transition: filter 0.2s ease
      - cursor: pointer
