
hemma_entity_actions:
  template:
    - hemma_entity

  variables:
    # Every other Hemma tile is domain-specific and names its own glyph. This
    # one takes anything, so it derives one - unset, hemma_entity resolves the
    # icon to `default`, which draws a question mark. A card that sets its own
    # `icon:` still wins: card variables override template variables.
    # The panel's preview carries the same map, so the two agree.
    icon: >
      [[[
        const dom = String(entity?.entity_id || '').split('.')[0];
        return ({
          light: 'light', switch: 'plug', input_boolean: 'plug',
          fan: 'fan', climate: 'thermostat', humidifier: 'humidifier',
          media_player: 'speaker', lock: 'lock-fill', cover: 'curtain-open',
          vacuum: 'vacuum', script: 'scenes', scene: 'scenes',
          automation: 'scenes', button: 'power_on', input_button: 'power_on',
          binary_sensor: 'person-walking-motion', remote: 'tv', water_heater: 'hot_water',
          valve: 'curtain-open', siren: 'person-walking-motion',
        })[dom] || 'default';
      ]]]
    svg_path: /hemma_assets/icons

    # Mirrored in hemma-core's HEMMA_TEMPLATE_SIZES, which reads the RAW config.
    size: large
    show_button_names: true

    action_1_enabled: true
    action_1_entity:
    action_1_label:
    action_1_icon:
    action_1_action: more-info
    action_1_navigation_path:
    action_1_service:
    action_1_service_data: {}

    action_2_enabled: true
    action_2_entity:
    action_2_label:
    action_2_icon:
    action_2_action: more-info
    action_2_navigation_path:
    action_2_service:
    action_2_service_data: {}

  tap_action:
    haptic: light
    action: |
      [[[
        return window.hemmaPopupAction ? window.hemmaPopupAction() : 'more-info';
      ]]]
    hemma_popup:
      title: ''
      dismissable: true
      close: false
      style: '--popup-min-width: 300px; --popup-max-width: 300px; --popup-min-width-narrow: 300px; --hemma-popup-radius: 34px; --hemma-popup-tint: rgba(0, 0, 5, 0.16);'
      content:
        type: custom:hemma-actions-panel
        entity: '[[[ return entity?.entity_id || null; ]]]'
        name: |
          [[[
            const n = String(this._config?.name || '').trim();
            return n.startsWith('[' + '[[') || n.indexOf('<') >= 0 ? '' : n;
          ]]]
        icon: '[[[ return variables.icon || null; ]]]'
        show_progress: '[[[ return variables.show_progress === true; ]]]'
        progress_entity: '[[[ return variables.progress_entity || null; ]]]'
        show_names: '[[[ return variables.show_button_names !== false; ]]]'
        action_1_enabled: '[[[ return variables.action_1_enabled ?? null; ]]]'
        action_1_entity: '[[[ return variables.action_1_entity ?? null; ]]]'
        action_1_label: '[[[ return variables.action_1_label ?? null; ]]]'
        action_1_icon: '[[[ return variables.action_1_icon ?? null; ]]]'
        action_1_action: '[[[ return variables.action_1_action ?? null; ]]]'
        action_1_navigation_path: '[[[ return variables.action_1_navigation_path ?? null; ]]]'
        action_1_service: '[[[ return variables.action_1_service ?? null; ]]]'
        action_1_service_data: '[[[ return variables.action_1_service_data ?? null; ]]]'
        action_1_active_color: '[[[ return variables.action_1_active_color ?? null; ]]]'
        action_2_enabled: '[[[ return variables.action_2_enabled ?? null; ]]]'
        action_2_entity: '[[[ return variables.action_2_entity ?? null; ]]]'
        action_2_label: '[[[ return variables.action_2_label ?? null; ]]]'
        action_2_icon: '[[[ return variables.action_2_icon ?? null; ]]]'
        action_2_action: '[[[ return variables.action_2_action ?? null; ]]]'
        action_2_navigation_path: '[[[ return variables.action_2_navigation_path ?? null; ]]]'
        action_2_service: '[[[ return variables.action_2_service ?? null; ]]]'
        action_2_service_data: '[[[ return variables.action_2_service_data ?? null; ]]]'
        action_2_active_color: '[[[ return variables.action_2_active_color ?? null; ]]]'

  hold_action:
    action: none

  double_tap_action:
    action: none
