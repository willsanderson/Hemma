# Thermostat Card
# Shows current temperature in a colored puck (teal = cooling, yellow = heating)
# over the room name/state. Tap toggles an overlay (driven by the shared
# input_boolean.hemma_thermostat_overlay, gated per-card by
# input_text.hemma_thermostat_active_entity) that slides in +/- controls and a
# "Set" button over the card, targeting input_number.hemma_thermostat_target_temperature.
# Only the card matching the active entity shows its overlay; tapping a
# different thermostat card switches the overlay to that card instead.
#
# Variables:
#   thermostat_toggle_helper - input_boolean that drives the +/- overlay (shared
#                              across all thermostat cards; input_text.hemma_thermostat_active_entity
#                              says WHICH card's overlay is actually showing)
#   temp_sensor              - optional separate sensor for the puck reading
#                              (falls back to the climate entity's own current_temperature)
hemma_thermostat:
  template: [hemma_entity]
  show_entity_picture: false
  show_icon: false
  show_label: false
  name: Thermostat

  variables:
    size: small
    has_controls: |
      [[[
        if (variables.size === 'large') return true;
        return !window.matchMedia('(max-width: 767px) and (orientation: portrait), (max-height: 500px) and (orientation: portrait), (max-height: 600px) and (orientation: landscape)').matches;
      ]]]
    mobile_filter_category: climate
    thermostat_toggle_helper: input_boolean.hemma_thermostat_overlay
    temp_sensor:
    show_toggle: |
      [[[ return variables.has_controls; ]]]
    toggle_service: climate.set_hvac_mode
    toggle_service_data: |
      [[[
        if (['cool','heat'].includes(entity?.state)) {
          return { entity_id: entity.entity_id, hvac_mode: 'off' };
        }
        return { entity_id: entity.entity_id, hvac_mode: states['input_select.hemma_thermostat_mode']?.state || 'cool' };
      ]]]

  state_display: |
    [[[
      const mode = entity?.state;
      const target = entity.attributes.temperature;
      if (mode === 'cool') {
        return "Cooling to " + target + "°";
      } else if (mode === 'heat') {
        return "Heating to " + target + "°";
      } else {
        return "Off";
      }
    ]]]

  tap_action:
    action: |
      [[[ return variables.has_controls ? 'call-service' : 'more-info'; ]]]
    service: script.turn_on
    service_data:
      entity_id: script.hemma_thermostat_overlay_toggle
      variables:
        thermostat_entity_id: '[[[ return entity.entity_id ]]]'

  custom_fields:
    temp_puck: |
      [[[
        let raw = entity?.attributes?.current_temperature;
        const eid = variables.temp_sensor;
        if (eid && states[eid] && !["unknown","unavailable"].includes(states[eid]?.state)) {
          raw = states[eid]?.state;
        }
        const n = Math.round(Number(raw));
        if (raw == null || Number.isNaN(n)) return '';

        const s = String(entity?.state || '').toLowerCase();
        const isCool = s === 'cool';
        const isHeat = s === 'heat';

        const circleBg = isCool
          ? '--hemma-icon-circle-bg:var(--hemma-puck-cool-color, #00d2e0);'
          : isHeat
            ? '--hemma-icon-circle-bg:var(--hemma-puck-heat-color, #ffd600);'
            : '';

        const eid2 = entity.entity_id;
        const stop = `event.stopPropagation();event.stopImmediatePropagation()`;
        const moreInfo = `${stop};this.dispatchEvent(new CustomEvent('hass-more-info',{bubbles:true,composed:true,detail:{entityId:'${eid2}'}}))`;
        const onMode = states['input_select.hemma_thermostat_mode']?.state || 'cool';
        const nextMode = ['cool','heat'].includes(entity?.state) ? 'off' : onMode;
        const smartToggle = `${stop};document.querySelector('home-assistant').hass.callService('climate','set_hvac_mode',{entity_id:'${eid2}',hvac_mode:'${nextMode}'})`;
        const info = variables.has_controls ? moreInfo : smartToggle;

        return `<div class="hemma-icon-circle" onpointerdown="${stop}" ontouchstart="${stop}" ontouchend="${info}" onclick="${info}" style="${circleBg}cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;color:rgba(255,255,255,0.9);font-weight:var(--hemma-puck-font-weight, 800);font-size:calc(var(--hemma-u, 10px) * 1.7);font-family:system-ui,-apple-system,sans-serif;">${n}</div>`;
      ]]]

    target_temperature:
      card:
        type: custom:button-card
        template: [hemma_default]
        entity: '[[[ return entity.entity_id ]]]'
        show_entity_picture: false
        show_icon: false
        show_state: true
        name: Target Temp
        state_display: |
          [[[
            const raw = states['input_number.hemma_thermostat_target_temperature']?.state;
            const n = Number(raw);
            if (raw == null || raw === 'unknown' || raw === 'unavailable' || Number.isNaN(n)) return '';
            return Number.isInteger(n) ? `${n}°` : `${n.toFixed(1)}°`;
          ]]]
        tap_action:
          action: call-service
          service: script.turn_on
          service_data:
            entity_id: script.hemma_thermostat_overlay_toggle
            variables:
              thermostat_entity_id: '[[[ return entity.entity_id ]]]'

        extra_styles: |
          :host {
            display: block !important;
            height: 100% !important;
          }
          ha-card {
            height: 100% !important;
            padding: 0 !important;
            box-sizing: border-box !important;
            box-shadow: none !important;
            border: none !important;
          }
          #container {
            height: 100% !important;
            box-sizing: border-box !important;
            align-items: start !important;
            align-content: start !important;
            justify-items: start !important;
            text-align: left !important;
            padding: 0 0 var(--hemma-entity-inner-pad-current, var(--hemma-entity-inner-pad-desktop, 20px)) var(--hemma-entity-inner-pad-current, var(--hemma-entity-inner-pad-desktop, 20px)) !important;
          }
          ha-card::before {
            display: none !important;
          }
          ha-card::after {
            opacity: 0 !important;
          }

        styles:
          card:
            - background: transparent !important
            - background-color: transparent !important
            - backdrop-filter: none !important
            - animation: none !important
            - box-shadow: none !important
            - border: none !important
          grid:
            - grid-template-columns: 1fr
            - grid-template-rows: 1fr min-content min-content
            - grid-template-areas: |
                "placeholder"
                "n"
                "s"
            - row-gap: 4px
          name:
            - color: var(--thermostat-overlay-text-name, var(--hemma-entity-name, rgba(255,255,255,0.9))) !important
            - font-weight: 600
            - font-size: var(--hemma-entity-name-font-current, var(--hemma-entity-name-font-desktop, 18px))
            - text-shadow: var(--hemma-entity-text-shadow, 0 1px 4px rgba(0,0,0,0.35))
            - justify-self: start
            - text-align: left
            - line-height: 1.15
            - white-space: nowrap
            - overflow: hidden
            - text-overflow: ellipsis
            - margin-bottom: -2px
            - transition: color .15s ease
          state:
            - color: var(--thermostat-overlay-text-state, var(--hemma-entity-state, var(--secondary-text-color))) !important
            - font-weight: 600
            - font-size: var(--hemma-entity-state-font-current, var(--hemma-entity-state-font-desktop, 15px))
            - text-shadow: var(--hemma-entity-text-shadow, 0 0 5px rgba(0,0,0,0.1))
            - justify-self: start
            - text-align: left
            - line-height: 1.15
            - transition: color .15s ease
          icon:
            - background: transparent !important
          img_cell:
            - background: transparent !important

    ctl_up: |
      [[[
        const stop = "event.stopPropagation();event.stopImmediatePropagation();";
        const noGhost = "event.preventDefault();";
        const getHass = "const h=document.querySelector('home-assistant').hass;";
        const fx = "const w=this.parentElement;"
          + "const d=(getComputedStyle(w).getPropertyValue('--thermo-btn-press-scale')||'0.92').trim();"
          + "w.animate([{transform:'scale(1)'},{transform:'scale('+d+')',offset:0.38},{transform:'scale(1)'}],"
          + "{duration:280,easing:'ease-out'});";
        const svc = "h.callService('input_number','increment',{entity_id:'input_number.hemma_thermostat_target_temperature'});";
        const body = fx + getHass + svc;
        const tap = stop + noGhost + body + "window._hemmaCtlTouch=Date.now();";
        const clk = stop + "if(window._hemmaCtlTouch&&Date.now()-window._hemmaCtlTouch<600)return;" + body;
        return `<div class="hemma-ctl-hit" onpointerdown="${stop}" onpointerup="${stop}" ontouchstart="${stop}" ontouchend="${tap}" onclick="${clk}"></div>`;
      ]]]

    ctl_set: |
      [[[
        const stop = "event.stopPropagation();event.stopImmediatePropagation();";
        const noGhost = "event.preventDefault();";
        const getHass = "const h=document.querySelector('home-assistant').hass;";
        const fx = "const w=this.parentElement;"
          + "const d=(getComputedStyle(w).getPropertyValue('--thermo-btn-press-scale')||'0.92').trim();"
          + "w.animate([{transform:'scale(1)'},{transform:'scale('+d+')',offset:0.38},{transform:'scale(1)'}],"
          + "{duration:280,easing:'ease-out'});";
        const svc = "window._hemmaThermoCommit=Date.now();"
          + "h.callService('input_boolean','turn_off',{entity_id:'input_boolean.hemma_thermostat_overlay'});"
          + "const t=parseFloat(h.states['input_number.hemma_thermostat_target_temperature']?.state);"
          + "try{if(Number.isFinite(t))h.callService('climate','set_temperature',"
          + "{entity_id:'" + entity.entity_id + "',temperature:t});}catch(e){}";
        const confirm = "const c1=(getComputedStyle(this.parentElement)"
          + ".getPropertyValue('--thermo-btn-confirm')||'rgba(255,255,255,0.55)').trim();"
          + "this.animate([{backgroundColor:c1,offset:0},{backgroundColor:c1,offset:0.62},"
          + "{backgroundColor:'rgba(255,255,255,0)',offset:1}],{duration:340,easing:'ease-out'});";
        const body = fx + confirm + getHass + svc;
        const tap = stop + noGhost + body + "window._hemmaCtlTouch=Date.now();";
        const clk = stop + "if(window._hemmaCtlTouch&&Date.now()-window._hemmaCtlTouch<600)return;" + body;
        return `<div class="hemma-ctl-hit" onpointerdown="${stop}" onpointerup="${stop}" ontouchstart="${stop}" ontouchend="${tap}" onclick="${clk}"></div>`;
      ]]]

    ctl_down: |
      [[[
        const stop = "event.stopPropagation();event.stopImmediatePropagation();";
        const noGhost = "event.preventDefault();";
        const getHass = "const h=document.querySelector('home-assistant').hass;";
        const fx = "const w=this.parentElement;"
          + "const d=(getComputedStyle(w).getPropertyValue('--thermo-btn-press-scale')||'0.92').trim();"
          + "w.animate([{transform:'scale(1)'},{transform:'scale('+d+')',offset:0.38},{transform:'scale(1)'}],"
          + "{duration:280,easing:'ease-out'});";
        const svc = "h.callService('input_number','decrement',{entity_id:'input_number.hemma_thermostat_target_temperature'});";
        const body = fx + getHass + svc;
        const tap = stop + noGhost + body + "window._hemmaCtlTouch=Date.now();";
        const clk = stop + "if(window._hemmaCtlTouch&&Date.now()-window._hemmaCtlTouch<600)return;" + body;
        return `<div class="hemma-ctl-hit" onpointerdown="${stop}" onpointerup="${stop}" ontouchstart="${stop}" ontouchend="${tap}" onclick="${clk}"></div>`;
      ]]]

  extra_styles: |
    /* Optical sizing: 800 is right at 17px, too heavy once the puck scales up.
       1740px is where --hemma-u leaves its floor, i.e. where the digits start growing. */
    :host { --hemma-puck-font-weight: 800; }
    @media (min-width: 1740px) { :host { --hemma-puck-font-weight: 700; } }

    #temp_puck {
      grid-area: i !important;
      height: var(--hemma-icon-circle-size, 44px);
    }

    /* Closed by default; the JS-templated opacity lands a frame later. */
    #target_temperature, #ctl_up, #ctl_set, #ctl_down {
      opacity: 0;
      pointer-events: none;
    }

    .hemma-ctl-hit {
      position: absolute;
      inset: 0;
      /* Under the glyph/label pseudo (z-index 1), which is pointer-events:none
         and so does not intercept the tap. */
      z-index: 0;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    /* Control glyphs */
    #ctl_up::before,
    #ctl_down::before,
    #ctl_set::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background-repeat: no-repeat;
      background-position: center center;
      background-size: var(--thermo-glyph-size, 68%) auto;
      filter: var(--thermostat-control-icon-filter, none);
    }
    /* Optical centering */
    #ctl_up::before {
      background-image: var(--thermo-icon-up);
      background-position: center calc(50% - 1px);
    }
    #ctl_down::before {
      background-image: var(--thermo-icon-down);
      background-position: center calc(50% + 1px);
    }
    /* Hover/press */
    @media (hover: hover) {
      #ctl_up:hover,
      #ctl_set:hover,
      #ctl_down:hover {
        background: var(--thermo-btn-bg-hover, rgba(255,255,255,0.16)) !important;
        transform: scale(var(--thermo-btn-hover-scale, 1.02));
      }
    }

    #ctl_set::before {
      content: 'Set';
      display: flex;
      align-items: center;
      justify-content: center;
      background-image: none;
      filter: none;
      font-size: var(--thermo-set-font, 18px);
      font-weight: 700;
      line-height: 1.15;
      color: var(--thermo-set-color, #fff);
    }

  card_mod:
    style: |
      ha-card::after {
        transition: opacity var(--hemma-active-overlay-dur, .40s) ease, background-color .35s ease !important;
      }
      @media (hover: hover) {
        :host(:hover) ha-card::after {
          transition: opacity .18s ease, background-color .18s ease !important;
        }
        :host(:hover) ha-card {
          --hemma-active-overlay-opacity: var(--hemma-hover-overlay-opacity, 0.10);
          --hemma-entity-overlay-tint: var(--hemma-entity-hover-tint, rgba(255,255,255,0.55));
        }
      }

  styles:
    card:
      - --rail-w: |
          [[[
            const isMobile = window.matchMedia('(max-width: 767px), (max-height: 600px)').matches;
            return isMobile ? '46px' : '56px';
          ]]]
      - --thermostat-control-opacity: |
          [[[
            return ['cool','heat'].includes(entity?.state) ? '1' : '0.8';
          ]]]
      - --thermostat-control-color: |
          [[[
            return ['cool','heat'].includes(entity?.state) ? 'rgba(0,0,0,0.75)' : 'rgba(255,255,255,0.9)';
          ]]]
      - --thermostat-control-icon-filter: |
          [[[
            return ['cool','heat'].includes(entity?.state) ? 'brightness(0)' : 'none';
          ]]]
      - --thermo-btn-bg: |
          [[[
            return ['cool','heat'].includes(entity?.state) ? 'rgba(0,0,0,0.13)' : 'rgba(255,255,255,0.13)';
          ]]]
      - --thermo-btn-hover-scale: '1.02'
      - --thermo-btn-press-scale: '0.92'
      - --thermo-btn-confirm: |
          [[[
            return ['cool','heat'].includes(entity?.state) ? 'rgba(0,0,0,0.45)' : 'rgba(255,255,255,0.55)';
          ]]]
      - --thermo-btn-bg-hover: |
          [[[
            return ['cool','heat'].includes(entity?.state) ? 'rgba(0,0,0,0.165)' : 'rgba(255,255,255,0.165)';
          ]]]
      # The chevrons are a white SVG flipped to solid black by brightness(0)
      # when the card is active, so the label has to be full strength beside them.
      - --thermo-set-color: |
          [[[
            return ['cool','heat'].includes(entity?.state) ? 'rgba(0,0,0,0.92)' : '#fff';
          ]]]
      - --thermo-btn-hover-tint: |
          [[[
            return ['cool','heat'].includes(entity?.state) ? 'rgba(0,0,0,0.10)' : 'rgba(255,255,255,0.13)';
          ]]]
      - --thermo-btn-rim: |
          [[[
            return ['cool','heat'].includes(entity?.state)
              ? 'inset 0 1px .5px -0.5px rgba(255,255,255,0.30), inset 0 -1px .5px -0.5px rgba(0,0,0,0.05), 0 1px 2px rgba(0,0,0,0.07)'
              : 'inset 0 1px .5px -0.5px rgba(255,255,255,0.42), inset 0 -1px .5px -0.5px rgba(255,255,255,0.18), inset 0 3px 6px -3px rgba(255,255,255,0.16), 0 2px 6px rgba(0,0,0,0.16)';
          ]]]
      - --thermo-btn-radius: |
          [[[
            const isMobile = window.matchMedia('(max-width: 767px), (max-height: 600px)').matches;
            return isMobile ? '18px' : '22px';
          ]]]
      - --thermo-pad: var(--hemma-entity-inner-pad-current, var(--hemma-entity-inner-pad-desktop, 20px))
      - --thermo-rail-top: calc(var(--thermo-pad) - 2px)
      - --thermo-btn-h: "calc((100% - 2 * var(--thermo-pad) + 4px - 2 * var(--thermo-btn-gap, 6px)) / 3)"
      - --thermo-toggle-top: calc(var(--thermo-pad) + (var(--hemma-entity-icon-size-current, var(--hemma-entity-icon-size-desktop, 34px)) - 20px) / 2)
      - --thermo-toggle-h: 26px
      - --thermo-toggle-r: 13px
      - --thermo-toggle-w: |
          [[[
            const isMobile = window.matchMedia('(max-width: 767px), (max-height: 600px)').matches;
            return isMobile ? '40px' : '46px';
          ]]]
      - --thermo-btn-gap: |
          [[[
            const isMobile = window.matchMedia('(max-width: 767px), (max-height: 600px)').matches;
            return isMobile ? '5px' : '6px';
          ]]]
      - --thermo-icon-up: |
          [[[ return `url('${window.hemmaIconUrl('increase')}')`; ]]]
      - --thermo-icon-down: |
          [[[ return `url('${window.hemmaIconUrl('decrease')}')`; ]]]
      - --thermo-glyph-size: |
          [[[
            const isMobile = window.matchMedia('(max-width: 767px), (max-height: 600px)').matches;
            return isMobile ? '38%' : '34%';
          ]]]
      - --thermo-set-font: |
          [[[
            const isMobile = window.matchMedia('(max-width: 767px), (max-height: 600px)').matches;
            return isMobile ? '14px' : '15px';
          ]]]
      - --thermo-ease: |
          [[[
            const on = states[variables.thermostat_toggle_helper]?.state === "on" && states['input_text.hemma_thermostat_active_entity']?.state === entity.entity_id;
            return on
              ? 'linear(0, 0.04331, 0.1493, 0.2881, 0.4371, 0.5809, 0.7096, 0.818, 0.9041, 0.9686, 1.014, 1.042, 1.058, 1.063, 1.062, 1.056, 1.047, 1.038, 1.029, 1.02, 1.013, 1.007, 1.003, 0.9997, 0.9977, 0.9965, 1)'
              : 'cubic-bezier(.4, 0, .7, .35)';
          ]]]
      - --thermo-dur-move: |
          [[[
            const on = states[variables.thermostat_toggle_helper]?.state === "on" && states['input_text.hemma_thermostat_active_entity']?.state === entity.entity_id;
            return on ? '0.27s' : '0.16s';
          ]]]
      - --thermo-dur-fade: |
          [[[
            const on = states[variables.thermostat_toggle_helper]?.state === "on" && states['input_text.hemma_thermostat_active_entity']?.state === entity.entity_id;
            return on ? '0.08s' : '0.05s';
          ]]]
      - --thermostat-overlay-text-name: |
          [[[
            return ['cool','heat'].includes(entity?.state)
              ? 'var(--hemma-entity-name-active, rgba(0,0,0,0.88))'
              : 'var(--hemma-entity-name, rgba(255,255,255,0.9))';
          ]]]
      - --thermostat-overlay-text-state: |
          [[[
            return ['cool','heat'].includes(entity?.state)
              ? 'var(--hemma-entity-state-active, rgba(0,0,0,0.55))'
              : 'var(--hemma-entity-state, rgba(240,240,240,0.85))';
          ]]]
    img_cell:
      - background: "transparent !important"

    name:
      - opacity: |
          [[[
            if (!variables.has_controls) return "1";
            const on = states[variables.thermostat_toggle_helper]?.state === "on" && states['input_text.hemma_thermostat_active_entity']?.state === entity.entity_id;
            return on ? "0" : "1";
          ]]]
      - transition: |
          [[[
            const on = states[variables.thermostat_toggle_helper]?.state === "on" && states['input_text.hemma_thermostat_active_entity']?.state === entity.entity_id;
            const commit = !!(window._hemmaThermoCommit && Date.now() - window._hemmaThermoCommit < 1500);
            return on ? 'opacity 0.1s ease' : (commit ? 'opacity 0.16s ease 0.20s' : 'opacity 0.10s ease 0.11s');
          ]]]
    state:
      - opacity: |
          [[[
            if (!variables.has_controls) return "0.85";
            const on = states[variables.thermostat_toggle_helper]?.state === "on" && states['input_text.hemma_thermostat_active_entity']?.state === entity.entity_id;
            return on ? "0" : "0.85";
          ]]]
      - transition: |
          [[[
            const on = states[variables.thermostat_toggle_helper]?.state === "on" && states['input_text.hemma_thermostat_active_entity']?.state === entity.entity_id;
            const commit = !!(window._hemmaThermoCommit && Date.now() - window._hemmaThermoCommit < 1500);
            return on ? 'opacity 0.1s ease' : (commit ? 'opacity 0.16s ease 0.20s' : 'opacity 0.10s ease 0.11s');
          ]]]

    custom_fields:
      temp_puck:
        - position: |
            [[[ return variables.has_controls ? 'absolute' : 'static'; ]]]
        # margin-top is the only nudge, same as #img-cell — the -2px used to be
        # in `top` as well and double-counted.
        - top: var(--hemma-entity-inner-pad-current, var(--hemma-entity-inner-pad-desktop, 20px))
        - left: var(--hemma-entity-inner-pad-current, var(--hemma-entity-inner-pad-desktop, 20px))
        - align-self: var(--hemma-tile-icon-align, start)
        - margin-top: var(--hemma-tile-icon-mt, -2px)
        - z-index: 4
        - overflow: visible

      toggle:
        - transform-origin: 100% 50%
        - opacity: |
            [[[
              const on = states[variables.thermostat_toggle_helper]?.state === "on" && states['input_text.hemma_thermostat_active_entity']?.state === entity.entity_id;
              return on ? '0' : '1';
            ]]]
        - transform: |
            [[[
              const on = states[variables.thermostat_toggle_helper]?.state === "on" && states['input_text.hemma_thermostat_active_entity']?.state === entity.entity_id;
              return on ? 'scale(0.72)' : 'scale(1)';
            ]]]
        - pointer-events: |
            [[[
              const on = states[variables.thermostat_toggle_helper]?.state === "on" && states['input_text.hemma_thermostat_active_entity']?.state === entity.entity_id;
              return on ? 'none' : 'auto';
            ]]]
        - transition: |
            [[[
              const on = states[variables.thermostat_toggle_helper]?.state === "on" && states['input_text.hemma_thermostat_active_entity']?.state === entity.entity_id;
              const commit = !!(window._hemmaThermoCommit && Date.now() - window._hemmaThermoCommit < 1500);
              return on
                ? 'opacity 0.09s linear, transform 0.12s ease'
                : commit
