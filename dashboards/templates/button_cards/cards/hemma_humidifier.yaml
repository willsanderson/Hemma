hemma_humidifier:
  template: [hemma_entity]

  variables:
    mobile_filter_category: climate

  # show_icon: true is required for icon_tap_action to work
  show_icon: true
  show_name: true
  show_state: true
  name: Humidifier

  tap_action:
    action: more-info
    entity: '[[[ return entity.entity_id ]]]'

  hold_action:
    action: more-info
    entity: '[[[ return entity.entity_id ]]]'

  icon_tap_action:
    action: toggle

  icon_hold_action:
    action: more-info
    entity: '[[[ return entity.entity_id ]]]'

  entity_picture: "[[[ return window.hemmaIconUrl('humidifier'); ]]]"

  styles:
    entity_picture:
      - width: 100%
      - height: 100%
      - object-fit: contain
      - opacity: 0.8
      - transition: opacity 0.2s ease, filter 0.2s ease, transform 0.15s ease
      - cursor: pointer

    img_cell:
      - box-shadow: none !important
      - transition: filter 0.2s ease
      - cursor: pointer
