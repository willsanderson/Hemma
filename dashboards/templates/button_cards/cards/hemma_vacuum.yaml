hemma_vacuum:
  template: [hemma_entity]

  variables:
    mobile_filter_category: unfiltered

  show_icon: false
  show_label: false

  name: Vacuum

  tap_action:
    action: more-info
    entity: '[[[ return entity.entity_id ]]]'

  hold_action:
    action: more-info
    entity: '[[[ return entity.entity_id ]]]'

  icon_tap_action:
    action: toggle

  icon_hold_action:
    action: more-info
    entity: '[[[ return entity.entity_id ]]]'

  entity_picture: |
    [[[
      const s = (entity?.state || '').toLowerCase();
      if (s === 'cleaning' || s === 'returning') return window.hemmaIconUrl('vacuum-clean');
      if (s === 'charging')                      return window.hemmaIconUrl('vacuum-charge');
      return window.hemmaIconUrl('vacuum');
    ]]]

  show_entity_picture: |
    [[[
      const s = (entity?.state || '').toLowerCase();
      return !['unknown', 'unavailable'].includes(s);
    ]]]

  styles:
    card:
      - --hemma-icon-mask-image: |
          [[[
            const s = (entity?.state || '').toLowerCase();
            if (s === 'cleaning' || s === 'returning') return `url('${window.hemmaIconUrl('vacuum-clean')}')`;
            if (s === 'charging')                      return `url('${window.hemmaIconUrl('vacuum-charge')}')`;
            return `url('${window.hemmaIconUrl('vacuum')}')`;
          ]]]