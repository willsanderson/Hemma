# Room
hemma_room:
  classes:
    card:
      - hemma-room
  template:
    - hemma_default
    - hemma_shared

  variables:
    image:
    image_night:
    image_position:

    show_climate_inline: false  # true = show individual badges (temp/humidity/air quality) directly on the top row instead of the group badge
    climate_entity_1:
    climate_entity_2:
    climate_entity_3:

    temp_sensor_1:
    temp_sensor_2:
    temp_sensor_3:
    temp_sensor_4:
    temp_sensor_5:
    temp_unit: 'F'  # 'F' or 'C' — sets comfort-level thresholds on the temperature sub-badge

    humidity_sensor:

    quality_sensor:
    room_name:
    aqi_room_name:
    aqi_entity_pm25:
    aqi_entity_pm10:
    aqi_entity_voc:
    aqi_entity_co2:
    aqi_entity_temp:
    aqi_entity_humidity:

    presence_entity_1:
    presence_entity_2:
    presence_entity_3:
    presence_entity_4:

    pause_timeout_minutes: 10

    media_player_1:
    media_player_2:
    media_player_3:
    media_player_4:
    media_player_5:
    media_player_6:
    media_player_7:
    media_player_8:
    media_player_9:
    media_player_10:

    plex_stream_1:
    plex_stream_2:

    psn_1:
    psn_2:

    show_now_playing: false
    # '0' = tiles float free, right-aligned, no container (default).
    # '1' = tiles wrapped in a glass panel with a "Now Playing" header.
    now_playing_panel: '0'

    energy_power_entity: null
    energy_usage_today: null
    energy_usage_month: null
    energy_cost_today: null
    energy_cost_month: null

    energy_popup_name_1: null
    energy_popup_power_1: null
    energy_popup_today_1: null
    energy_popup_month_1: null
    energy_popup_cost_today_1: null
    energy_popup_cost_month_1: null
    energy_popup_name_2: null
    energy_popup_power_2: null
    energy_popup_today_2: null
    energy_popup_month_2: null
    energy_popup_cost_today_2: null
    energy_popup_cost_month_2: null
    energy_popup_name_3: null
    energy_popup_power_3: null
    energy_popup_today_3: null
    energy_popup_month_3: null
    energy_popup_cost_today_3: null
    energy_popup_cost_month_3: null
    energy_popup_name_4: null
    energy_popup_power_4: null
    energy_popup_today_4: null
    energy_popup_month_4: null
    energy_popup_cost_today_4: null
    energy_popup_cost_month_4: null
    energy_popup_name_5: null
    energy_popup_power_5: null
    energy_popup_today_5: null
    energy_popup_month_5: null
    energy_popup_cost_today_5: null
    energy_popup_cost_month_5: null
    energy_popup_name_6: null
    energy_popup_power_6: null
    energy_popup_today_6: null
    energy_popup_month_6: null
    energy_popup_cost_today_6: null
    energy_popup_cost_month_6: null
    energy_entity_1: null
    energy_label_1: null
    energy_unit_1: null
    energy_cost_1: null
    energy_entity_2: null
    energy_label_2: null
    energy_unit_2: null
    energy_cost_2: null
    energy_entity_3: null
    energy_label_3: null
    energy_unit_3: null
    energy_cost_3: null
    energy_entity_4: null
    energy_label_4: null
    energy_unit_4: null
    energy_cost_4: null
    energy_entity_5: null
    energy_label_5: null
    energy_unit_5: null
    energy_cost_5: null
    energy_entity_6: null
    energy_label_6: null
    energy_unit_6: null
    energy_cost_6: null

    # Security row. Any mix of lock / binary_sensor / camera / alarm_control_panel
    # / cover — hemma_badge_security picks icon and wording from the domain.
    security_locks: null
    security_locks_label: null
    security_lock_batteries: null
    security_door_sensors: null
    security_lock_entity: null
    security_lock_entity_2: null
    security_entity_1: null
    security_label_1: null
    security_entity_2: null
    security_label_2: null
    security_entity_3: null
    security_label_3: null
    security_entity_4: null
    security_label_4: null
    security_entity_5: null
    security_label_5: null
    security_entity_6: null
    security_label_6: null
    security_entity_7: null
    security_label_7: null
    security_entity_8: null
    security_label_8: null
    light_group_entity:
    light_entity_1:
    light_entity_2:
    light_entity_3:
    light_entity_4:
    light_entity_5:
    light_entity_6:
    light_entity_7:
    light_entity_8:
    light_entity_9:
    light_entity_10:

    weather_entity:
    weather_temp_sensor:

  tap_action: { action: none }
  hold_action: { action: none }
  double_tap_action: { action: none }

  styles:
    card:
      - --hemma-badge-enter-ease: >
          [[[
            const st = states['input_select.hemma_expanded_row']?.state;
            return (st && st !== 'none')
              ? 'cubic-bezier(0.34, 1.26, 0.44, 1)'
              : 'cubic-bezier(0.4, 0, 0.2, 1)';
          ]]]
      - height: 100svh
      - padding-top: >
          [[[
            const mm = (q) => (window.matchMedia ? window.matchMedia(q).matches : false);
            const isPhonePortrait =
              (mm('(pointer: coarse)') || mm('(hover: none)')) &&
              mm('(max-width: 767px)') &&
              mm('(orientation: portrait)');

            if (isPhonePortrait) return 'calc(var(--hero-top) - 20px)';
            return 'var(--hero-top)';
          ]]]
      - padding-left: var(--hero-gutter)
      - padding-right: var(--hero-gutter)
      - padding-bottom: >
          [[[
            const mm = (q) => (window.matchMedia ? window.matchMedia(q).matches : false);
            const isPhonePortrait =
              (mm('(pointer: coarse)') || mm('(hover: none)')) &&
              mm('(max-width: 767px)') &&
              mm('(orientation: portrait)');

            return isPhonePortrait
              ? `calc(env(safe-area-inset-bottom, 0px) + var(--hemma-entity-mobile-bottom-gap, 20px))`
              : `calc(130px + env(safe-area-inset-bottom))`;
          ]]]
      - box-shadow: none !important
      - --hero-img-scale: 1.08
      - --hero-img: >
          [[[
            const isDark =
              typeof hass?.themes?.darkMode === 'boolean'
                ? hass.themes.darkMode
                : window.matchMedia('(prefers-color-scheme: dark)').matches;

            const base = variables.image || 'default';
            const picked = isDark ? (variables.image_night || `${base}-night`) : base;
            return `url("/local/hemma/rooms/${picked}.jpg")`;
          ]]]
      - --hero-img-pos: >
          [[[
            return variables.image_position || 'center center';
          ]]]
      - --hemma-time-nav-open: >
          [[[
            const navOpen = states['input_boolean.hemma_mobile_navigation']?.state === 'on';
            return navOpen ? 'none' : 'block';
          ]]]
      - --hemma-time-reserve: >
          [[[
            const w = window?.innerWidth || 1024;
            const h = window?.innerHeight || 800;
            const isTablet = (w >= 768 && w <= 1400 && h > 500);
            return isTablet ? '140px' : '160px';
          ]]]
      - --hemma-room-nav: >
          [[[
            const k = variables.image || 'default';
            const prev = window._hemmaRoomNav;
            if (!prev || prev.key !== k) {
              window._hemmaRoomNav = { key: k };
              const isActive = eid => {
                if (!eid) return false;
                const s = hass.states[eid];
                if (!s) return false;
                const st = (s.state || '').toLowerCase();
                if (['playing','buffering','on'].includes(st)) return true;
                if (st === 'paused') {
                  const a = s.attributes || {};
                  const hasContent = !!(
                    String(a.media_title || '').trim() ||
                    String(a.media_artist || a.artist || a.media_album_artist || '').trim()
                  );
                  if (!hasContent) return false;
                  const timeout = Number(variables.pause_timeout_minutes ?? 10);
                  if (timeout <= 0) return true;
                  return ((new Date() - new Date(s.last_changed)) / 60000) <= timeout;
                }
                return false;
              };
              const mediaEids = [
                !!variables.media_player_1 && variables.media_player_1,
                !!variables.media_player_2 && variables.media_player_2,
                !!variables.media_player_3 && variables.media_player_3,
                !!variables.media_player_4 && variables.media_player_4,
                !!variables.media_player_5 && variables.media_player_5,
                !!variables.media_player_6 && variables.media_player_6,
                !!variables.media_player_7 && variables.media_player_7,
                !!variables.media_player_8 && variables.media_player_8,
                !!variables.media_player_9 && variables.media_player_9,
                !!variables.media_player_10 && variables.media_player_10,
                !!variables.plex_stream_1 && variables.plex_stream_1,
                !!variables.plex_stream_2 && variables.plex_stream_2,
                !!variables.psn_1 && variables.psn_1,
                !!variables.psn_2 && variables.psn_2,
              ].filter(Boolean);
              const _pc = window._hemmaPCSources?.(hass.states, variables) || {};
              const pcActive = !!(_pc.discord || _pc.steam);
              const opt = (!variables.show_now_playing &&
                (mediaEids.some(isActive) || pcActive)) ? 'media' : 'none';
              hass.callService('input_select', 'select_option', {
                entity_id: 'input_select.hemma_expanded_row',
                option: opt
              });
            }
            return k;
          ]]]

    name:
      - grid-area: n
      - color: var(--primary-text-color)
      - opacity: 0.9
      - font-size: var(--hero-room-name-size-current, clamp(48px, 6vw + 12px, 100px))
      - letter-spacing: var(--hero-room-name-letter-spacing-current, -2px)
      - font-weight: 700
      - justify-self: start
      - padding-left: 0
      - line-height: var(--hero-room-name-line-height-current, 1.2)
      - margin-left: var(--hero-room-name-margin-left-current, 0px)
      - overflow: visible

    grid: []  # Inherits from hemma_shared

    custom_fields:
      temperature:
        - grid-area: temperature
        - display: >
            [[[
              const w = window?.innerWidth || 1024;
              const h = window?.innerHeight || 800;
              const isMobileSize = w <= 767 || h <= 500;
              if (variables.weather_entity) { window._hemmaWx = variables.weather_entity; try { localStorage.setItem('hemma_weather_entity', variables.weather_entity); } catch(e) {} }
              const wx = variables.weather_entity || window._hemmaWx || (window._hemmaWx = localStorage.getItem('hemma_weather_entity') || '');
              return (!isMobileSize && !!wx) ? 'block' : 'none';
            ]]]
        - position: absolute
        - top: >
            calc(
              var(--hero-top)
              + var(--hero-temp-reserve, 22px)
              + var(--hero-header-gap-current, 6px)
              - var(--hero-weather-hero-height, 48px)
              + var(--weather-hero-widget-position-nudge, -12px))
        - left: >
            calc(
              var(--hero-gutter)
              + var(--hero-room-name-margin-left-current, 0px)
              + var(--hemma-header-temp-nudge, 0px))
        - z-index: 5
        - pointer-events: auto
        - cursor: pointer
        - overflow: visible
        - color: var(--primary-text-color)
        - background: transparent !important
        - background-color: transparent !important

      time:
        - position: fixed
        - z-index: 10
        - pointer-events: auto
        - "--mdc-ripple-press-opacity": 0
        - "-webkit-tap-highlight-color": transparent
        - "--ha-card-padding": "0px"

      weather:
        - grid-area: weather
        - display: >
            [[[
              const mm = (q) => (window.matchMedia ? window.matchMedia(q).matches : false);
              const isPhonePortrait =
                (mm('(pointer: coarse)') || mm('(hover: none)')) &&
                mm('(max-width: 767px)') &&
                mm('(orientation: portrait)');
              if (variables.weather_entity) { window._hemmaWx = variables.weather_entity; try { localStorage.setItem('hemma_weather_entity', variables.weather_entity); } catch(e) {} }
              if (variables.weather_temp_sensor) { window._hemmaWxTemp = variables.weather_temp_sensor; try { localStorage.setItem('hemma_weather_temp_sensor', variables.weather_temp_sensor); } catch(e) {} }
              const wx = variables.weather_entity || window._hemmaWx || (window._hemmaWx = localStorage.getItem('hemma_weather_entity') || '');
              const wxt = variables.weather_temp_sensor || window._hemmaWxTemp || (window._hemmaWxTemp = localStorage.getItem('hemma_weather_temp_sensor') || '');
              const hasData = !!(wx || wxt);
              const ok = !!wx && hasData;
              return (isPhonePortrait && ok) ? 'block' : 'none';
            ]]]
        - position: absolute
        - top: >
            calc(
              var(--hero-top)
              + var(--hero-room-name-size-current, 38px) * var(--hero-room-name-line-height-current, 1.1)
              - var(--hero-weather-title-size, 16px)
              - var(--hero-weather-sub-size, 13px) * 1.1
              - 1px
              + var(--weather-mobile-badge-nudge, 0px))
        - left: var(--hero-gutter, var(--page-gutter-mobile, 11px))
        - right: calc(var(--hero-gutter, var(--page-gutter-mobile, 11px)) + 6px)
        - z-index: 10
        - text-align: right
        - justify-self: end
        - margin: 0
        - width: auto
        - max-width: none
        - overflow: visible
        - pointer-events: auto

      badges:
        - grid-area: badges
        - --hemma-converge-init: >
            [[[
              if (!window._hemmaEnterPReg) {
                window._hemmaEnterPReg = true;
                try {
                  CSS.registerProperty({
                    name: '--hemma-badge-enter-p',
                    syntax: '<number>',
                    inherits: true,
                    initialValue: '0'
                  });
                } catch (e) {}
              }
              if (!window._hemmaMediaAnim) {
                window._hemmaMediaAnim = function (rootEl) {
                  try {
                    const row = rootEl.querySelector('#badges_media');
                    if (!row) return;
                    const SPRING = 'cubic-bezier(0.32, 0.72, 0, 1)';
                    const OUT    = 'cubic-bezier(0.4, 0, 0.2, 1)';
                    const dig = (el, out, d) => {
                      if (!el || d > 8) return out;
                      for (const c of Array.from(el.children || [])) {
                        const t = c.localName === 'button-card' && c._config && c._config.template;
                        if (t) { out.push(c); continue; }
                        if (c.shadowRoot) dig(c.shadowRoot, out, d + 1);
                        dig(c, out, d + 1);
                      }
                      return out;
                    };
                    requestAnimationFrame(() => {
                      for (const b of dig(row, [], 0)) {
                        const f = b.parentElement;
                        if (!f || !f.id) continue;
                        const op = parseFloat(
                          getComputedStyle(b).getPropertyValue('--hemma-badge-opacity')) || 0;
                        const vis = op > 0;
                        if (b._hemmaVis === vis) continue;
                        const first = b._hemmaVis === undefined;
                        b._hemmaVis = vis;
                        if (b._hemmaA) { b._hemmaA.cancel(); b._hemmaA = null; }
                        if (f._hemmaA) { f._hemmaA.cancel(); f._hemmaA = null; }
                        const gap = parseFloat(getComputedStyle(f).marginRight) || 10;
                        if (first) {
                          // No animation on the first pass; just settle state.
                          b.style.setProperty('--hemma-badge-enter-p', vis ? '0' : '1');
                          continue;
                        }
                        if (vis) {
                          f.style.maxWidth = 'none';
                          void row.offsetWidth;
                          const w = b.offsetWidth || 0;
                          f.style.maxWidth = '';
                          f.style.setProperty('--hemma-field-ovf', 'hidden');
                          f._hemmaA = f.animate(
                            [{ maxWidth: '0px', marginRight: '0px' },
                             { maxWidth: w + 'px', marginRight: gap + 'px' }],
                            { duration: 420, easing: SPRING, fill: 'none' });
                          f._hemmaA.onfinish = () => { f.style.removeProperty('--hemma-field-ovf'); };
                          b.style.setProperty('--hemma-badge-enter-p', '1');
                          b._hemmaA = b.animate(
                            [{ '--hemma-badge-enter-p': 1 }, { '--hemma-badge-enter-p': 0 }],
                            { duration: 460, easing: SPRING, fill: 'forwards' });
                        } else {
                          const w = f.offsetWidth || 0;
                          // Badge leaves in full view first, then the gap closes
                          // behind it — never clipped, so the rise is visible.
                          b._hemmaA = b.animate(
                            [{ '--hemma-badge-enter-p': 0 }, { '--hemma-badge-enter-p': 1 }],
                            { duration: 320, easing: OUT, fill: 'forwards' });
                          b._hemmaA.onfinish = () => {
                            f._hemmaA = f.animate(
                              [{ maxWidth: w + 'px', marginRight: gap + 'px' },
                               { maxWidth: '0px', marginRight: '0px' }],
                              { duration: 380, easing: SPRING, fill: 'forwards' });
                          };
                        }
                      }
                    });
                  } catch (e) {}
                };
              }
              if (!window._hemmaConverge) {
                window._hemmaConverge = function (rootEl, rowId, groupTpl, useRects, cold) {
                  try {
                    const row = rootEl.querySelector('#' + rowId);
                    const top = rootEl.querySelector('#badges');
                    if (!row || !top) return;
                    if (!cold && getComputedStyle(row).getPropertyValue('--hemma-row-fade').trim() !== '1') return;
                    const dig = (el, out, d) => {
                      if (!el || d > 8) return out;
                      for (const c of Array.from(el.children || [])) {
                        const t = c.localName === 'button-card' && c._config && c._config.template;
                        if (t) { out.push(c); continue; }
                        if (c.shadowRoot) dig(c.shadowRoot, out, d + 1);
                        dig(c, out, d + 1);
                      }
                      return out;
                    };
                    const isTpl = (c) => {
                      const t = c._config && c._config.template;
                      return Array.isArray(t) ? t.indexOf(groupTpl) >= 0 : t === groupTpl;
                    };
                    const group = dig(top, [], 0).filter(isTpl)[0];
                    if (!group) return;
                    const cx = (el) => {
                      if (useRects) {
                        const r = el.getBoundingClientRect();
                        return r.width ? r.left + r.width / 2 : null;
                      }
                      return el.offsetWidth ? el.offsetLeft + el.offsetWidth / 2 : null;
                    };
                    const gx = cx(group);
                    if (gx === null) return;
                    for (const b of dig(row, [], 0)) {
                      // A cold pass must not read a badge it already moved.
                      if (cold && b.style.getPropertyValue('--hemma-badge-converge-x')) continue;
                      const bx = cx(b);
                      if (bx === null) continue;
                      b.style.setProperty('--hemma-badge-converge-x',
                        (gx - bx).toFixed(1) + 'px');
                    }
                  } catch (e) {}
                };
              }
              return '0';
            ]]]
        - justify-self: start !important
        - align-self: start !important
        - place-self: start !important
        - text-align: left !important
        - margin-left: >
            calc(
              var(--hero-room-name-margin-left-current, 0px) +
              var(--hemma-header-badge-nudge, 0px))
        - margin-right: auto !important
        - width: max-content
        - max-width: 100%
        - margin-top: var(--hero-header-gap-current, 6px)
        - margin-bottom: 0
        - padding-left: 0
        - pointer-events: auto
        - touch-action: pan-x
        - overscroll-behavior-x: contain
        - height: auto !important
        - display: >
            [[[
              return (states['input_boolean.hemma_mobile_navigation']?.state === 'on')
                ? 'none'
                : 'block';
            ]]]

      badges_climate:
        - grid-area: badges_climate
        - justify-self: start !important
        - align-self: start !important
        - place-self: start !important
        - text-align: left !important
        - margin-left: >
            calc(
              var(--hero-room-name-margin-left-current, 0px) +
              var(--hemma-header-badge-nudge, 0px))
        - margin-right: auto !important
        - width: max-content
        - max-width: 100%
        - margin-top: >
            [[[
              if (!(!!variables.climate_entity_1||!!variables.temp_sensor_1||!!variables.humidity_sensor||!!variables.quality_sensor) || variables.show_climate_inline) return '0';
              if (states['input_boolean.hemma_mobile_navigation']?.state === 'on') return '0';
              return states['input_select.hemma_expanded_row']?.state === 'climate'
                ? 'var(--hemma-badge-subrow-gap-current, 6px)' : '0';
            ]]]
        - margin-bottom: 0
        - padding-left: 0
        - pointer-events: auto
        - height: auto !important
        - opacity: >
            [[[
              if (!(!!variables.climate_entity_1||!!variables.temp_sensor_1||!!variables.humidity_sensor||!!variables.quality_sensor) || variables.show_climate_inline) return 0;
              if (states['input_boolean.hemma_mobile_navigation']?.state === 'on') return 0;
              return states['input_select.hemma_expanded_row']?.state === 'climate' ? 1 : 0;
            ]]]
        - display: >
            [[[
              if (states['input_boolean.hemma_mobile_navigation']?.state === 'on') return 'none';
              if (!(!!variables.climate_entity_1||!!variables.temp_sensor_1||!!variables.humidity_sensor||!!variables.quality_sensor) || variables.show_climate_inline) return 'none';
              return 'block';
            ]]]
        - max-height: >
            [[[
              if (!(!!variables.climate_entity_1||!!variables.temp_sensor_1||!!variables.humidity_sensor||!!variables.quality_sensor) || variables.show_climate_inline) return '0';
              if (states['input_boolean.hemma_mobile_navigation']?.state === 'on') return '0';
              return states['input_select.hemma_expanded_row']?.state === 'climate' ? '200px' : '0';
            ]]]
        - overflow-x: auto
        - overflow-y: hidden
        - touch-action: pan-x
        - overscroll-behavior-x: contain
        - --hemma-row-fade: >
            [[[
              if (!(!!variables.climate_entity_1||!!variables.temp_sensor_1||!!variables.humidity_sensor||!!variables.quality_sensor) || variables.show_climate_inline) return 0;
              if (states['input_boolean.hemma_mobile_navigation']?.state === 'on') return 0;
              return states['input_select.hemma_expanded_row']?.state === 'climate' ? 1 : 0;
            ]]]

        - --hemma-converge-climate: >
            [[[
              const st = states['input_select.hemma_expanded_row']?.state;
              const token = st + '|' + (window.innerWidth || 0);
              if (this._hemmaCvClimate !== token) {
                this._hemmaCvClimate = token;
                const rootEl = this.shadowRoot;
                if (st === 'climate' && rootEl) {
                  const go = (r) => {
                    if (typeof window._hemmaConverge === 'function') {
                      window._hemmaConverge(rootEl, 'badges_climate', 'hemma_badge_climate_group', r);
                    }
                  };
                    requestAnimationFrame(() => go(false));
                  setTimeout(() => go(true), 700);
                }
              }
              return '0';
            ]]]
        - transition: >
            [[[
              if (!this._hemmaClimateRowMountTime) this._hemmaClimateRowMountTime = Date.now();
              if (Date.now() - this._hemmaClimateRowMountTime < 400) return 'none';

              const currentState = states['input_select.hemma_expanded_row']?.state;
              const isExpanded = currentState === 'climate';

              if (isExpanded) return 'max-height 0s, margin-top 0s';
              const isSwitching = currentState !== 'none';
              return isSwitching
                ? 'none'
                : 'opacity 0s 0.32s, visibility 0s 0.32s, max-height 0s 0.34s, margin-top 0s 0.34s';
            ]]]
        - visibility: >
            [[[
              return states['input_select.hemma_expanded_row']?.state === 'climate' ? 'visible' : 'hidden';
            ]]]
        - pointer-events: >
            [[[
              return states['input_select.hemma_expanded_row']?.state === 'climate' ? 'auto' : 'none';
            ]]]

