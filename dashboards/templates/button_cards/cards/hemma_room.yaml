        --hemma-time-letter-spacing: normal;
        --hemma-time-sub-spacing: normal;
        --hemma-time-opacity: var(--hemma-nav-label-inactive-opacity, 0.84);
      }
    }

    @media (min-width: 768px) and (max-width: 1600px) and (min-height: 501px) and (orientation: portrait) and (pointer: coarse),
           (min-width: 768px) and (max-width: 1600px) and (min-height: 501px) and (orientation: portrait) and (hover: none) {
      /* Portrait: the clock is a small status line above the nav row, and the buttons always share the capsule. */
      #time {
        display: none !important;
        top: calc(env(safe-area-inset-top, 0px) + 12px);
        left: var(--hero-gutter);
        right: auto;
        --hemma-chrome-font-size: 16px;
        --hemma-time-letter-spacing: normal;
        --hemma-time-sub-spacing: normal;
        --hemma-time-opacity: var(--hemma-nav-label-inactive-opacity, 0.84);
      }
      #chrome_pill { display: block !important; --cap-n: var(--cap-n-portrait) !important; --cap-np: 0; }
      ha-card {
        --hemma-chrome-capsule: 1 !important;
        --hemma-chrome-fill: transparent !important;
        --hemma-chrome-fill-hover: rgba(255,255,255,0.10) !important;
        --hemma-bell-fill: transparent !important;
        --hemma-settings-fill: transparent !important;
        --hemma-assist-fill: transparent !important;
        --hemma-np-invert: 0 !important;
      }
    }

    /* Now Playing Text - Hidden on Tablet */
    /* The settings button and the Now Playing waveform share this row, so one
       number moves both and they cannot drift apart. Desktop is measured off the
       nav label (y 16, height 26, center 29) less half a 34px button. */
    :host {
      --hemma-chrome-btn-size: 34px;
      --hemma-chrome-btn-top: calc(var(--hemma-chrome-row-center-desktop, 56px)
        - (var(--hemma-chrome-btn-size, 34px) / 2));
    }

    @media (min-width: 768px) and (max-width: 1600px) and (min-height: 501px) and (orientation: landscape) and (pointer: coarse),
           (min-width: 768px) and (max-width: 1600px) and (min-height: 501px) and (orientation: landscape) and (hover: none) {
      :host {
        --hemma-chrome-btn-size: var(--hemma-chrome-btn-size-tablet, 34px);
        --hemma-chrome-step: calc(var(--hemma-chrome-btn-size-tablet, 34px) + 12px);
        --hemma-chrome-btn-top: calc(var(--hemma-chrome-row-center-tablet, 66px) - (var(--hemma-chrome-btn-size, 34px) / 2));
      }
    }

    /* Portrait sits the pill 2px lower, so the buttons follow it. Without this
       the row fell back to the desktop center and every button sat 9px low. */
    @media (min-width: 768px) and (max-width: 1600px) and (min-height: 501px) and (orientation: portrait) and (pointer: coarse),
           (min-width: 768px) and (max-width: 1600px) and (min-height: 501px) and (orientation: portrait) and (hover: none) {
      :host {
        --hemma-chrome-btn-size: var(--hemma-chrome-btn-size-tablet, 34px);
        --hemma-chrome-step: calc(var(--hemma-chrome-btn-size-tablet, 34px) + 12px);
        --hemma-chrome-btn-top: calc(var(--hemma-chrome-row-center-tablet-portrait, 66px) - (var(--hemma-chrome-btn-size, 34px) / 2));
      }

      /* Portrait alone cannot fit the waveform beside the pill, so it gives up
         its seat in the row and takes the one below. Assist is already in the
         dots menu on every tablet - see the block after this one. */
      #now_playing { --hemma-np-head-inset: 0px !important; }
    }

    /* A tablet keeps Assist in the dots menu in BOTH orientations. Landscape has
       the width for it, but a control that moves when the iPad is turned is
       worse than one that lives in one place. The row collapses the way a UIKit
       toolbar does; the bell then closes Assist's gap and the waveform's own
       reserve drops a step with it. !important because every one of these is
       stamped inline from styles.custom_fields.
       --hemma-chrome-side-reserve-tablet* in the theme counts what is left;
       changing what shows here means changing those. */
    @media (min-width: 768px) and (max-width: 1600px) and (min-height: 501px) and (pointer: coarse),
           (min-width: 768px) and (max-width: 1600px) and (min-height: 501px) and (hover: none) {
      #assist { display: none !important; }

      #notifications {
        transform: translateX(calc(-1 * var(--hemma-chrome-dots-step, 46px))) !important;
      }

      #now_playing {
        --hemma-np-head-inset: calc(var(--hemma-chrome-dots-step, 46px)
          + var(--hemma-chrome-bell-step, 46px) + var(--hemma-capsule-np-extra, 0px)) !important;
      }

      #chrome_pill { --cap-n: var(--cap-n-tablet); }
    }

    /* Portrait again, last: its waveform is not in the row at all, so it
       reserves nothing. Same weight as the block above, so order settles it. */
    @media (min-width: 768px) and (max-width: 1600px) and (min-height: 501px) and (orientation: portrait) and (pointer: coarse),
           (min-width: 768px) and (max-width: 1600px) and (min-height: 501px) and (orientation: portrait) and (hover: none) {
      #now_playing { --hemma-np-head-inset: 0px !important; }
    }

    #battery { display: none; }
    /* Tablets only: the capsule and battery sit 16pt from the edge, as in Apple Home. */
    @media (min-width: 768px) and (max-width: 1600px) and (min-height: 501px) and (pointer: coarse),
           (min-width: 768px) and (max-width: 1600px) and (min-height: 501px) and (hover: none) {
      #battery { display: flex; }
      :host { --hemma-chrome-right: 16px; }
      /* Tablets group the top buttons into one glass capsule; desktop keeps flat, separate ones. */
      #chrome_pill { display: block !important; }
      ha-card {
        --hemma-chrome-capsule: 1 !important;
        --hemma-capsule-np-extra: 6px !important;
        --hemma-chrome-fill: transparent !important;
        --hemma-chrome-fill-hover: rgba(255,255,255,0.10) !important;
        --hemma-bell-fill: transparent !important;
        --hemma-settings-fill: transparent !important;
        --hemma-assist-fill: transparent !important;
        --hemma-np-invert: 0 !important;
      }
    }

    /* The phone capsule's divider: the menu apart from the actions. */
    #chrome_pill::before {
      content: "";
      display: var(--cap-sep, none);
      position: absolute;
      right: calc(6px + var(--hemma-chrome-btn-size, 34px) + 6px);
      top: 50%;
      width: 1px;
      height: 18px;
      transform: translate(50%, -50%);
      background: var(--hemma-pill-divider, rgba(60,60,67,0.36));
      pointer-events: none;
    }

    #chrome_pill .cp-flash {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      opacity: 0;
      pointer-events: none;
    }

    #chrome_pill::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      -webkit-backdrop-filter: var(--hemma-pill-highlight, brightness(1.45));
      backdrop-filter: var(--hemma-pill-highlight, brightness(1.45));
      padding: 1px;
      box-sizing: border-box;
      -webkit-mask: linear-gradient(to bottom, #000 0, rgba(0,0,0,.45) 13%, transparent 31%, transparent 69%, rgba(0,0,0,.45) 87%, #000 100%), linear-gradient(#000 0 0), linear-gradient(#000 0 0) content-box;
      -webkit-mask-composite: source-in, source-out;
      mask: linear-gradient(to bottom, #000 0, rgba(0,0,0,.45) 13%, transparent 31%, transparent 69%, rgba(0,0,0,.45) 87%, #000 100%), linear-gradient(#000 0 0), linear-gradient(#000 0 0) content-box;
      mask-composite: intersect, subtract;
    }

    #now_playing {
      --np-vp: 0;
      pointer-events: none;
    }

    /* The container is only a positioning box: right-anchored and up to 560px
       wide, it reaches across chrome it does not draw. Left capturing pointer
       events it swallowed every click on the settings button beside it whenever
       media was playing - and did nothing when nothing was. Only what it
       actually paints should be clickable, so the box stays transparent to
       pointers and its content opts back in. This does not depend on z-index. */
    #now_playing { pointer-events: none !important; }
    #now_playing > * { pointer-events: auto; }

    @media (min-width: 769px) and (hover: hover) and (pointer: fine) {
      #now_playing {
        --np-vp: 1;
        pointer-events: auto;
        top: calc(env(safe-area-inset-top, 0px) + var(--hemma-chrome-btn-top, 12px));
        right: calc(var(--hero-gutter) + var(--hero-room-name-margin-left-current, 0px));
        max-width: min(560px, 34vw);
      }
    }

    /* Tablet - Now Playing */
    @media (min-width: 768px) and (max-width: 1600px) and (min-height: 501px) and (orientation: landscape) and (pointer: coarse),
           (min-width: 768px) and (max-width: 1600px) and (min-height: 501px) and (orientation: landscape) and (hover: none) {
      #now_playing {
        --np-vp: 1;
        pointer-events: auto;
        top: calc(env(safe-area-inset-top, 0px) + var(--hemma-chrome-btn-top, 12px));
        right: calc(var(--hemma-chrome-right, var(--hero-gutter)) - var(--hemma-capsule-np-extra, 0px));
        max-width: min(480px, 52vw);
      }
    }

    @media (min-width: 768px) and (max-width: 1600px) and (min-height: 501px) and (orientation: portrait) and (pointer: coarse),
