  extra_styles: |
    /* Same exemption themes/hemma/hemma.yaml gives .hemma-entity cards via
       :host(.hemma-entity){ contain: none !important; } — this card doesn't
       carry that class, but contain establishes a backdrop root just like
       transform/filter/isolation, and it sits above every Now Playing tile. */
    :host{
      contain: none !important;
    }
    #name, #temperature, [id^="badges"] {
      translate: var(--hemma-side-shift, none);
    }
    /* The clock's display is stamped inline, so the sidebar's copy stands it down by visibility. */
    #time {
      visibility: var(--hemma-side-time, var(--hemma-boot-ov, visible));
    }
    /* The Overview layout's page draws these in the same place. */
    #chrome_pill, #settings, #assist, #notifications, #battery {
      visibility: var(--hemma-page-chrome, var(--hemma-boot-ov, visible));
