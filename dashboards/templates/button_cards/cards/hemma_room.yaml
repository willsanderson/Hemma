                    if (!!!variables.media_player_1 || !variables.media_player_1) return '0px';
                    return '450px';
                  ]]]
              - margin-right: >
                  [[[
                    if (!!!variables.media_player_1 || !variables.media_player_1) return '0px';
                    const s = states[variables.media_player_1]; if (!s) return '0px';
                    const st = String(s.state || '');
                    if (['unavailable','unknown','off','standby'].includes(st)) return '0px';
                    const a = s.attributes || {};
                    if (!String(a.media_title||'').trim() && !String(a.media_artist||a.artist||a.media_album_artist||'').trim()) return '0px';
                    if (st === 'paused') { const t = Number(variables.pause_timeout_minutes ?? 10); if (t > 0 && (new Date() - new Date(s.last_changed)) / 60000 > t) return '0px'; }
                    return 'var(--badge-gap-current, var(--badge-gap, 10px))';
