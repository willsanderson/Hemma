      #now_playing {
        --np-vp: 1;
        pointer-events: auto;
        top: calc(env(safe-area-inset-top, 0px)
          + var(--hemma-now-playing-top-tablet-portrait,
              calc(var(--hemma-chrome-row-top-tablet-portrait, 32px)
                + var(--hemma-nav-pill-height-tablet, 46px) + 8px)));
        right: calc(var(--hemma-chrome-right, var(--hero-gutter)) - var(--hemma-capsule-np-extra, 0px));
        max-width: min(420px, 60vw);
      }
    }