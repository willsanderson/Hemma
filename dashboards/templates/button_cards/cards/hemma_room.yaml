              room_name: '[[[ return variables.energy_popup_power_6 ? (variables.energy_popup_name_6 || variables.energy_label_6) : variables.room_name || variables.aqi_room_name ]]]'
              entity_power: '[[[ return variables.energy_popup_power_6 || variables.energy_power_entity ]]]'
              entity_usage_today: '[[[ return variables.energy_popup_power_6 ? variables.energy_popup_today_6 : variables.energy_usage_today ]]]'
              entity_usage_month: '[[[ return variables.energy_popup_power_6 ? variables.energy_popup_month_6 : variables.energy_usage_month ]]]'
              entity_cost_today: '[[[ return variables.energy_popup_power_6 ? variables.energy_popup_cost_today_6 : variables.energy_cost_today ]]]'
              entity_cost_month: '[[[ return variables.energy_popup_power_6 ? variables.energy_popup_cost_month_6 : variables.energy_cost_month ]]]'

  extra_styles: |
    /* Same exemption themes/hemma/hemma.yaml gives .hemma-entity cards via
       :host(.hemma-entity){ contain: none !important; } — this card doesn't
       carry that class, but contain establishes a backdrop root just like
       transform/filter/isolation, and it sits above every Now Playing tile. */
    :host{
      contain: none !important;
    }
    ha-card{
      contain: none !important;
    }

    #mp1, #mp2, #mp3, #mp4,
    #plex, #plex_2,
    #activity1, #activity2 {
      overflow: visible;
    }

    #badges,
    #badges_climate,
    #badges_presence,
    #badges_media,
    #badges_lights,
    #badges_security,
    #badges_energy {
      overflow-x: visible !important;
      overflow-y: visible !important;
      overscroll-behavior-x: contain !important;
      scrollbar-width: none !important;
      -ms-overflow-style: none !important;
    }

    #badges::-webkit-scrollbar,
    #badges_climate::-webkit-scrollbar,
    #badges_presence::-webkit-scrollbar,
    #badges_media::-webkit-scrollbar,
    #badges_lights,
    #badges_security,
    #badges_energy::-webkit-scrollbar {
      display: none;
    }

    @media (max-width: 767px) and (orientation: portrait) {
      :host .button-card-main {
        padding-top: var(--hero-top) !important;
      }

      #badges,
      #badges_climate,
      #badges_presence,
      #badges_media,
      #badges_lights,
      #badges_security,
      #badges_energy {
        overflow-x: auto !important;
        width: calc(100% + 2 * var(--hero-gutter) - var(--hemma-header-badge-nudge, 0px)) !important;
        max-width: none !important;
        margin-left: calc(-1 * var(--hero-gutter) + var(--hemma-header-badge-nudge, 0px)) !important;
        padding-left: var(--hero-gutter) !important;
        padding-right: var(--hero-gutter) !important;
        box-sizing: border-box !important;
      }

      #badges_media {
        padding-left: calc(var(--hero-gutter) + var(--hemma-header-media-badge-nudge-current, 0px)) !important;
      }
    }

    @media (hover: none) and (pointer: coarse) and (orientation: landscape) and (max-height: 600px) {
      #badges,
      #badges_climate,
      #badges_presence,
      #badges_media,
      #badges_lights,
      #badges_security,
      #badges_energy {
        max-width: calc(100vw - (2 * var(--hemma-entity-col-width-landscape, 200px)) - 8px - var(--hemma-tiles-right-pad-landscape, 0px) - var(--hero-gutter, 18px) - var(--hemma-landscape-badge-stop-pad, 60px)) !important;
        overflow-x: auto !important;
        box-sizing: border-box !important;
      }
    }

    #time {
      display: none;
    }

    @media (min-width: 769px) and (hover: hover) and (pointer: fine) {
      #time {
        display: var(--hemma-time-nav-open, block);
        top: calc(env(safe-area-inset-top, 0px) + var(--hemma-nav-top-current, 60px) - 8px);
        left: var(--hemma-time-left, calc(var(--hero-gutter) + var(--hero-room-name-margin-left-current, 0px)));
      }
    }

    @media (min-width: 600px) and (max-width: 767px) and (min-height: 501px) {
      #time {
        display: var(--hemma-time-nav-open, block);
        top: calc(env(safe-area-inset-top, 0px) + var(--hemma-nav-top-current, 46px) - var(--hemma-time-nudge-small-tablet, 43px));
        left: var(--hemma-time-left, calc(var(--hero-gutter) + var(--hero-room-name-margin-left-current, 0px)));
      }
    }

    /* Tablet - Time */
    @media (min-width: 768px) and (max-width: 1400px) and (min-height: 501px) and (pointer: coarse),
           (min-width: 768px) and (max-width: 1400px) and (min-height: 501px) and (hover: none) {
      #time {
        display: var(--hemma-time-nav-open, block);
        top: calc(env(safe-area-inset-top, 0px) + var(--hemma-time-top-tablet, 20px));
        left: auto;
        right: calc(var(--hero-gutter) - var(--hemma-time-right-nudge-tablet, 6px));
      }
    }

    /* Now Playing Text - Hidden on Tablet */
    #now_playing {
      --np-vp: 0;
      pointer-events: none;
    }

    @media (min-width: 769px) and (hover: hover) and (pointer: fine) {
      #now_playing {
        --np-vp: 1;
        pointer-events: auto;
        top: calc(env(safe-area-inset-top, 0px) + var(--hemma-nav-top-current, 60px) + var(--hemma-now-playing-drop, -12px));
        right: calc(var(--hero-gutter) + var(--hero-room-name-margin-left-current, 0px));
        max-width: min(560px, 34vw);
      }
    }

    /* Tablet - Now Playing */
    @media (min-width: 768px) and (max-width: 1400px) and (min-height: 501px) and (orientation: landscape) and (pointer: coarse),
           (min-width: 768px) and (max-width: 1400px) and (min-height: 501px) and (orientation: landscape) and (hover: none) {
      #now_playing {
        --np-vp: 1;
        pointer-events: auto;
        top: calc(env(safe-area-inset-top, 0px) + var(--hemma-now-playing-top-tablet-landscape, 58px));
        right: var(--hero-gutter);
        max-width: min(480px, 52vw);
      }
    }

    @media (min-width: 768px) and (max-width: 1400px) and (min-height: 501px) and (orientation: portrait) and (pointer: coarse),
           (min-width: 768px) and (max-width: 1400px) and (min-height: 501px) and (orientation: portrait) and (hover: none) {
      #now_playing {
        --np-vp: 1;
        pointer-events: auto;
        top: calc(env(safe-area-inset-top, 0px) + var(--hemma-now-playing-top-tablet-portrait, 56px));
        right: var(--hero-gutter);
        max-width: min(420px, 60vw);
      }
    }