# Room
hemma_room:
  classes:
    card:
      - hemma-room
  template:
    - hemma_default
    - hemma_shared

  variables:
    image:
    image_night:
    image_position:

    # Dashboard-wide typeface. Unset leaves the theme's primary-font-family
    # alone; 'inter', 'hanken' or 'system' override it for the whole document.
    font:

    # Per-group switches. A group needs its entities *and* its switch; the
    # switch off hides it without disturbing what is configured underneath.
    show_climate: true
    show_lights: true
    show_people: true
    show_security: true
    show_energy: true
    show_media: true

    # The bell in the chrome row. On by default: it is dashboard chrome, not a
    # room feature, and it has content on any install with a lock or a doorbell.
    show_notifications: true
    show_assist: true
    # What the bell reports. Written by Hemma's Notifications section,
    # which sets every room at once - the bell is dashboard chrome, so two
    # rooms must not be able to disagree about it. Absent means on.
    notify_safety: true
    notify_air: true
    notify_locks: true
    notify_alarm: true
    notify_doorbell: true
    notify_doors: true
    notify_people: true
    notify_vacuum: true
    notify_appliances: true
    notify_plants: true
    notify_battery: true
    notify_updates: true
    notify_restart: true
    # An appliance cannot be detected, so it is named: a list of entities and,
    # beside it, whichever sensor counts that appliance down.
    notification_appliances: null
    notification_appliance_timers: null
    notification_co2_ppm: null
    notification_open_minutes: null
    notification_battery_threshold: null
    # A glitched reading (100 -> 3 -> 100) must not raise a notice: a battery
    # counts as low only once it has read low for this long.
    notification_battery_hold_minutes: null
    # A helper (input_datetime, input_text or input_number) holding when
    # notifications were last marked read. Set it and every surface shares
    # one read state; leave it null and each browser keeps its own.
    notification_read_entity: null

    # Applied from whichever layout is on screen. force_eval so a change in
    # Hemma lands on the next render instead of waiting for a reload.
    hemma_notify_config:
      force_eval: true
      value: |
        [[[
          // Stash regardless: on a cold load this runs before hemma-core.js,
          // and the module picks the stash up when it initializes. Without it
          // a layout that renders once - the phone - never applied its
          // switches at all.
          window._hemmaNotifyCfg = variables;
          if (window._hemmaNotify) window._hemmaNotify.configureFrom(variables);
          return true;
        ]]]

    show_climate_inline: false  # true = show individual badges (temp/humidity/air quality) directly on the top row instead of the group badge
    climate_entity_1:
    climate_entity_2:
    climate_entity_3:

    temp_sensor_1:
    temp_sensor_2:
    temp_sensor_3:
    temp_sensor_4:
    temp_sensor_5:
    temp_unit: 'F'  # 'F' or 'C' — sets comfort-level thresholds on the temperature sub-badge

    humidity_sensor:

    quality_sensor:
    room_name:
    aqi_room_name:
    aqi_entity_pm25:
    aqi_entity_pm10:
    aqi_entity_voc:
    aqi_entity_co2:
    aqi_entity_temp:
    aqi_entity_humidity:

    # The order the badge pills sit in, as a list of category ids:
    # climate, lights, people, media, security, energy. Absent is the built-in
    # order, and a list may name only the ones that moved.
    badge_order:

    presence_entity_1:
    presence_entity_2:
    presence_entity_3:
    presence_entity_4:

    pause_timeout_minutes: 10

    media_player_1:
    media_player_2:
    media_player_3:
    media_player_4:
    media_player_5:
    media_player_6:
    media_player_7:
    media_player_8:
    media_player_9:
    media_player_10:

    plex_stream_1:
    plex_stream_2:

    psn_1:
    psn_2:

    show_now_playing: false

    energy_power_entity: null
    energy_usage_today: null
    energy_usage_month: null
    energy_cost_today: null
    energy_cost_month: null

    energy_popup_name_1: null
    energy_popup_power_1: null
    energy_popup_today_1: null
    energy_popup_month_1: null
    energy_popup_cost_today_1: null
    energy_popup_cost_month_1: null
    energy_popup_name_2: null
    energy_popup_power_2: null
    energy_popup_today_2: null
    energy_popup_month_2: null
    energy_popup_cost_today_2: null
    energy_popup_cost_month_2: null
    energy_popup_name_3: null
    energy_popup_power_3: null
    energy_popup_today_3: null
    energy_popup_month_3: null
    energy_popup_cost_today_3: null
    energy_popup_cost_month_3: null
    energy_popup_name_4: null
    energy_popup_power_4: null
    energy_popup_today_4: null
    energy_popup_month_4: null
    energy_popup_cost_today_4: null
    energy_popup_cost_month_4: null
    energy_popup_name_5: null
    energy_popup_power_5: null
    energy_popup_today_5: null
    energy_popup_month_5: null
    energy_popup_cost_today_5: null
    energy_popup_cost_month_5: null
    energy_popup_name_6: null
    energy_popup_power_6: null
    energy_popup_today_6: null
    energy_popup_month_6: null
    energy_popup_cost_today_6: null
    energy_popup_cost_month_6: null
    energy_entity_1: null
    energy_label_1: null
    energy_unit_1: null
    energy_cost_1: null
    energy_entity_2: null
    energy_label_2: null
    energy_unit_2: null
    energy_cost_2: null
    energy_entity_3: null
    energy_label_3: null
    energy_unit_3: null
    energy_cost_3: null
    energy_entity_4: null
    energy_label_4: null
    energy_unit_4: null
    energy_cost_4: null
    energy_entity_5: null
    energy_label_5: null
    energy_unit_5: null
    energy_cost_5: null
    energy_entity_6: null
    energy_label_6: null
    energy_unit_6: null
    energy_cost_6: null

    # Security row. Any mix of lock / binary_sensor / camera / alarm_control_panel
    # / cover - hemma_badge_security picks icon and wording from the domain.
    security_locks: null
    security_locks_label: null
    security_lock_batteries: null
    security_door_sensors: null
    security_lock_entity: null
    security_lock_entity_2: null
    security_cameras: null
    security_cameras_label: null
    security_entity_1: null
    security_label_1: null
    security_entity_2: null
    security_label_2: null
    security_entity_3: null
    security_label_3: null
    security_entity_4: null
    security_label_4: null
    security_entity_5: null
    security_label_5: null
    security_entity_6: null
    security_label_6: null
    security_entity_7: null
    security_label_7: null
    security_entity_8: null
    security_label_8: null
    light_group_entity:
    light_entity_1:
    light_entity_2:
    light_entity_3:
    light_entity_4:
    light_entity_5:
    light_entity_6:
    light_entity_7:
    light_entity_8:
    light_entity_9:
    light_entity_10:

    weather_entity:
    weather_temp_sensor:

  tap_action: { action: none }
  hold_action: { action: none }
  double_tap_action: { action: none }

  styles:
    card:
      - "--hemma-chrome-dots-step": "var(--hemma-chrome-step, 46px)"
      - "--hemma-chrome-fill": "rgba(0,0,0,0.40)"
      - "--hemma-chrome-fill-hover": "rgba(0,0,0,0.55)"
      - "--hemma-chrome-capsule": "0"
      - "--hemma-bell-fill": "initial"
      - "--hemma-settings-fill": "initial"
      - "--hemma-assist-fill": "initial"
      - "--hemma-capsule-np-extra": "0px"
      - "--hemma-np-invert": "1"
      # hemma-core decides Overview after this card has painted; its last answer for this dashboard hides the Focus chrome from frame one.
      - "--hemma-boot-ov": '[[[ try { return localStorage.getItem("hemma_ov_boot") === location.pathname.split("/")[1] ? "hidden" : "visible"; } catch (e) { return "visible"; } ]]]'
      - "--hemma-chrome-bell-step": '[[[ return variables.show_notifications === false ? "0px" : "var(--hemma-chrome-step, 46px)" ]]]'

      - "--hemma-badge-order-climate": >
          [[[
            const o = variables.badge_order;
            if (!Array.isArray(o)) return 1;
            const i = o.indexOf('climate');
            return i < 0 ? o.length + 1 : i + 1;
          ]]]
      - "--hemma-badge-order-lights": >
          [[[
            const o = variables.badge_order;
            if (!Array.isArray(o)) return 2;
            const i = o.indexOf('lights');
            return i < 0 ? o.length + 2 : i + 1;
          ]]]
      - "--hemma-badge-order-people": >
          [[[
            const o = variables.badge_order;
            if (!Array.isArray(o)) return 3;
            const i = o.indexOf('people');
            return i < 0 ? o.length + 3 : i + 1;
          ]]]
      - "--hemma-badge-order-media": >
          [[[
            const o = variables.badge_order;
            if (!Array.isArray(o)) return 4;
            const i = o.indexOf('media');
            return i < 0 ? o.length + 4 : i + 1;
          ]]]
      - "--hemma-badge-order-security": >
          [[[
            const o = variables.badge_order;
            if (!Array.isArray(o)) return 5;
            const i = o.indexOf('security');
            return i < 0 ? o.length + 5 : i + 1;
          ]]]
      - "--hemma-badge-order-energy": >
          [[[
            const o = variables.badge_order;
            if (!Array.isArray(o)) return 6;
            const i = o.indexOf('energy');
            return i < 0 ? o.length + 6 : i + 1;
          ]]]

      - --hemma-font-set: >
          [[[
            const STACKS = {
              inter:  '"Inter", -apple-system, BlinkMacSystemFont, system-ui, sans-serif',
              hanken: '"Hanken Grotesk", -apple-system, BlinkMacSystemFont, system-ui, sans-serif',
              system: '-apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, sans-serif'
            };
            const want = STACKS[String(variables.font || '').trim().toLowerCase()] || '';
            const ID = 'hemma-font-v1';
            let el = document.getElementById(ID);
            if (!want) { if (el) el.remove(); return '0'; }
            if (!el) {
              el = document.createElement('style');
              el.id = ID;
              document.head.appendChild(el);
            }
            const css = 'html{--primary-font-family:' + want + ' !important;}';
            if (el.textContent !== css) el.textContent = css;
            return '1';
          ]]]
      - --hemma-perf-set: >
          [[[
            const p = window._hemmaPerf;
            return p ? p.dashboard(variables.performance) : '0';
          ]]]
      # Shortened by anything placed under the tile row, so the view never scrolls.
      - height: calc(100svh - var(--hemma-extras-h, 0px))
      - padding-top: >
          [[[
            const mm = (q) => (window.matchMedia ? window.matchMedia(q).matches : false);
            const isPhonePortrait =
              (mm('(pointer: coarse)') || mm('(hover: none)')) &&
              mm('(max-width: 767px)') &&
              mm('(orientation: portrait)');

            if (isPhonePortrait) return 'calc(var(--hero-top) - 20px)';
            return 'var(--hero-top)';
          ]]]
      - padding-left: var(--hero-gutter)
      - padding-right: var(--hero-gutter)
      - padding-bottom: >
          [[[
            const mm = (q) => (window.matchMedia ? window.matchMedia(q).matches : false);
            const isPhonePortrait =
              (mm('(pointer: coarse)') || mm('(hover: none)')) &&
              mm('(max-width: 767px)') &&
              mm('(orientation: portrait)');

            return isPhonePortrait
              ? `calc(env(safe-area-inset-bottom, 0px) + var(--hemma-entity-mobile-bottom-gap, 20px))`
              : `calc(130px + env(safe-area-inset-bottom))`;
          ]]]
      - box-shadow: none !important
      - --hero-img-scale: 1.08
      - --hero-img: >
          [[[
            const isDark =
              typeof hass?.themes?.darkMode === 'boolean'
                ? hass.themes.darkMode
                : window.matchMedia('(prefers-color-scheme: dark)').matches;

            const base = variables.image || 'default';
            const picked = isDark ? (variables.image_night || `${base}-night`) : base;
            return `url("/local/hemma/rooms/${picked}.jpg")`;
          ]]]
      - --hero-img-pos: >
          [[[
            return variables.image_position || 'center center';
          ]]]
      - --hemma-time-nav-open: >
          [[[
            const navOpen = states['input_boolean.hemma_mobile_navigation']?.state === 'on';
            return navOpen ? 'none' : 'block';
          ]]]
      - --hemma-time-reserve: >
          [[[
            const w = window?.innerWidth || 1024;
            const h = window?.innerHeight || 800;
            const isTablet = (w >= 768 && w <= 1400 && h > 500);
            return isTablet ? '140px' : '160px';
          ]]]
    name:
      - grid-area: n
      - color: var(--primary-text-color)
      - opacity: 1
      - font-size: var(--hero-room-name-size-current, clamp(48px, 6vw + 12px, 100px))
      - letter-spacing: var(--hero-room-name-letter-spacing-current, -2px)
      - font-weight: 700
      - justify-self: start
      - padding-left: 0
      - line-height: var(--hero-room-name-line-height-current, 1.2)
      - margin-left: var(--hero-room-name-margin-left-current, 0px)
      - overflow: visible

    grid: []  # Inherits from hemma_shared

    custom_fields:
      temperature:
        - grid-area: temperature
        - display: >
            [[[
              const w = window?.innerWidth || 1024;
              const h = window?.innerHeight || 800;
              const isMobileSize = w <= 767 || h <= 500;
              const wx = window.hemmaWx ? window.hemmaWx(variables, 'entity') : (variables.weather_entity || '');
              return (!isMobileSize && (!!wx || variables.hero_line === 'date')) ? 'block' : 'none';
            ]]]
        - --hero-date-lift: "[[[ return variables.hero_line === 'date' ? '-14px' : '0px'; ]]]"
        - --hero-greet-drop: "[[[ return variables.hero_line === 'date' ? 'calc(var(--hemma-u-weather, 10px) * -0.25)' : 'calc(var(--hemma-u-weather, 10px) * 1.79)'; ]]]"
        - position: absolute
        - top: >
            calc(
              var(--hero-top)
              + var(--hero-temp-reserve, 22px)
              + var(--hero-header-gap-current, 6px)
              - var(--hero-weather-hero-height, 48px)
              + var(--weather-hero-widget-position-nudge, -12px)
              - var(--hero-date-lift, 0px)
              + var(--hero-greet-drop, 0em)
              - var(--hero-wx-raise-current, 0px))
        - left: >
            calc(
              var(--hero-gutter)
              + var(--hero-room-name-margin-left-current, 0px)
              + var(--hemma-header-temp-nudge, 0px))
        - z-index: 5
        - pointer-events: auto
        - cursor: pointer
        - overflow: visible
        - color: var(--primary-text-color)
        - background: transparent !important
        - background-color: transparent !important

      time:
        # Hemma owns the clock on a managed dashboard: unset means no clock,
        # rather than the sensor.time fallback a hand-written config still gets.
        - display: >
            [[[
              return (variables.hemma_ui_managed && !variables.time_entity) ? 'none' : 'block';
            ]]]
        - position: fixed
        - z-index: 10
        - pointer-events: auto
        - "--mdc-ripple-press-opacity": 0
        - "-webkit-tap-highlight-color": transparent
        - "--ha-card-padding": "0px"

      weather:
        - grid-area: weather
        - display: >
            [[[
              const mm = (q) => (window.matchMedia ? window.matchMedia(q).matches : false);
              const isPhonePortrait =
                (mm('(pointer: coarse)') || mm('(hover: none)')) &&
                mm('(max-width: 767px)') &&
                mm('(orientation: portrait)');
              const wx = window.hemmaWx ? window.hemmaWx(variables, 'entity') : (variables.weather_entity || '');
              const wxt = window.hemmaWx ? window.hemmaWx(variables, 'temp') : (variables.weather_temp_sensor || '');
              const hasData = !!(wx || wxt);
              const ok = !!wx && hasData;
              return (isPhonePortrait && ok) ? 'block' : 'none';
            ]]]
        - position: absolute
        - top: >
            calc(
              var(--hero-top)
              + var(--hero-room-name-size-current, 38px) * var(--hero-room-name-line-height-current, 1.1)
              - var(--hero-weather-title-size, 16px)
              - var(--hero-weather-sub-size, 13px) * 1.1
              - 1px
              + var(--weather-mobile-badge-nudge, 0px))
        - left: var(--hero-gutter, var(--page-gutter-mobile, 11px))
        - right: calc(var(--hero-gutter, var(--page-gutter-mobile, 11px)) + 6px)
        - z-index: 10
        - text-align: right
        - justify-self: end
        - margin: 0
        - width: auto
        - max-width: none
        - overflow: visible
        - pointer-events: auto

      badges:
        - grid-area: badges
        - justify-self: start !important
        - align-self: start !important
        - place-self: start !important
        - text-align: left !important
        - margin-left: >
            calc(
              var(--hero-room-name-margin-left-current, 0px) +
              var(--hemma-header-badge-nudge, 0px))
        - margin-right: auto !important
        - width: max-content
        - max-width: 100%
        - margin-top: calc(var(--hero-header-gap-current, 6px) + var(--hero-badge-gap-extra-current, 0px))
        - margin-bottom: 0
        - padding-left: 0
        - pointer-events: auto
        - touch-action: pan-x
        - overscroll-behavior-x: contain
        - height: auto !important
        - display: >
            [[[
              return (states['input_boolean.hemma_mobile_navigation']?.state === 'on')
                ? 'none'
                : 'block';
            ]]]

      now_playing:
        - --hemma-np-head-inset: >
            [[[
              const STEP = 46;
              const dots = STEP;
              const assist = variables.show_assist !== false && ((hass && hass.config && hass.config.components) || []).includes("conversation") ? STEP : 0;
              const bell = variables.show_notifications === false ? 0 : STEP;
              return 'max(0px, calc(' + (dots + assist + bell) + 'px'
                + ' + var(--hemma-capsule-np-extra, 0px)'
                + ' - var(--hero-room-name-margin-left-current, 0px)))';
            ]]]
        - position: fixed
        - z-index: 12
        - text-align: left !important
        - min-width: 0
        - margin: 0
        - display: >
            [[[
              if (!variables.show_now_playing) return 'none';
              if (states['input_boolean.hemma_mobile_navigation']?.state === 'on') return 'none';
              return 'block';
            ]]]
        - overflow: visible

      navigation:
        - position: fixed
        - top: 46px
        - left: 0
        - right: 0
        - z-index: 50
        - overflow: visible
        - pointer-events: auto
        - touch-action: none
        - "--mdc-ripple-press-opacity": 0
        - "-webkit-tap-highlight-color": transparent
        - filter: none

      battery:
        - position: fixed
        - top: calc(env(safe-area-inset-top, 0px) + 7px)
        - right: calc(var(--hemma-chrome-right, var(--hero-gutter)) - 1px)
        - left: auto
        - height: 18px
        - align-items: center
        - z-index: 10
        - pointer-events: none
        - opacity: var(--hemma-nav-label-inactive-opacity, 0.84)

      chrome_pill:
        - display: none
        - --cap-n-desktop: >
            [[[
              const assist = variables.show_assist !== false && ((hass && hass.config && hass.config.components) || []).includes("conversation");
              return String(1 + (assist ? 1 : 0) + (variables.show_notifications === false ? 0 : 1));
            ]]]
        - --cap-n-tablet: >
            [[[
              return String(1 + (variables.show_notifications === false ? 0 : 1));
            ]]]
        - --cap-sep: >
            [[[
              const assist = variables.show_assist !== false && ((hass && hass.config && hass.config.components) || []).includes("conversation");
              const np = variables.show_media !== false && !!variables.show_now_playing;
              return variables.show_notifications !== false || assist || np ? 'block' : 'none';
            ]]]
        - --cap-n-portrait: >
            [[[
              return String(1 + (variables.show_notifications === false ? 0 : 1));
            ]]]
        - position: fixed
        - top: calc(var(--hemma-chrome-btn-top, 12px) - 6px)
        - right: calc(var(--hemma-chrome-right, var(--hero-gutter)) - 6px)
        - left: auto
        - height: calc(var(--hemma-chrome-btn-size, 34px) + 12px)
        - width: calc((var(--cap-n, var(--cap-n-desktop)) + var(--cap-np, var(--np-head-on, 0)) - 1) * var(--hemma-chrome-step, 46px) + var(--hemma-chrome-btn-size, 34px) + 12px)
        - transition: width .24s cubic-bezier(0.25, 0.8, 0.25, 1)
        - border-radius: 9999px
        - z-index: 11
        - pointer-events: none
        - background: var(--hemma-pill-fill, rgba(255,255,255,0.10))
        - backdrop-filter: var(--hemma-pill-backdrop, blur(12px) saturate(1.4))
        - -webkit-backdrop-filter: var(--hemma-pill-backdrop, blur(12px) saturate(1.4))
        - box-shadow: "var(--hemma-pill-rim, inset 0 0.5px 0 rgba(255,255,255,0.10), inset 0 -0.5px 0 rgba(255,255,255,0.10)), inset 1px 0 0 var(--hemma-pill-edge, rgba(0,0,0,0.50)), inset -1px 0 0 var(--hemma-pill-edge, rgba(0,0,0,0.50))"

      settings:
        - display: block
        - position: fixed
        - top: var(--hemma-chrome-btn-top, 12px)
        - right: var(--hemma-chrome-right, var(--hero-gutter))
        - left: auto
        - transform: "translateX(calc(-1 * var(--hemma-chrome-shift, 0px)))"
        - transition: "transform 420ms cubic-bezier(0.32, 0.72, 0, 1)"
        - width: var(--hemma-chrome-btn-size, 34px)
        - height: var(--hemma-chrome-btn-size, 34px)
        - z-index: 20
        - pointer-events: auto

      assist:
        - display: '[[[ return variables.show_assist !== false && ((hass && hass.config && hass.config.components) || []).includes("conversation") ? "block" : "none" ]]]'
        - position: fixed
        - top: var(--hemma-chrome-btn-top, 12px)
        - right: var(--hemma-chrome-right, var(--hero-gutter))
        - left: auto
        - transform: >
            [[[
              const rest = 'var(--hemma-chrome-step, 46px)';
              return `translateX(calc(-1 * var(--hemma-chrome-shift, ${rest})))`;
            ]]]
        - transition: "transform 420ms cubic-bezier(0.32, 0.72, 0, 1)"
        - width: var(--hemma-chrome-btn-size, 34px)
        - height: var(--hemma-chrome-btn-size, 34px)
        - z-index: 21
        - pointer-events: auto

      notifications:
        - display: '[[[ return variables.show_notifications === false ? "none" : "block" ]]]'
        - position: fixed
        - top: var(--hemma-chrome-btn-top, 12px)
        - right: var(--hemma-chrome-right, var(--hero-gutter))
        - left: auto
        - transform: >
            [[[
              const n = 1 + (variables.show_assist !== false && ((hass && hass.config && hass.config.components) || []).includes("conversation") ? 1 : 0);
              return `translateX(calc(-1 * var(--hemma-chrome-shift, calc(${n} * var(--hemma-chrome-step, 46px)))))`;
            ]]]
        - transition: "transform 420ms cubic-bezier(0.32, 0.72, 0, 1)"
        - width: var(--hemma-chrome-btn-size, 34px)
        - height: var(--hemma-chrome-btn-size, 34px)
        - z-index: 21
        - pointer-events: auto

      menu:
