hemma_custom:
  template:
    - hemma_entity
  show_name: false
  show_state: false
  show_icon: false
  show_entity_picture: false
  tap_action:
    action: none
  hold_action:
    action: none

  variables:
    icon: null

  # Studio stores the pasted card as custom_fields.card itself; button-card only draws a field
  # that holds `card:`, so the template adds it, handing back the user's card without it.
  custom_fields:
    card:
      card: |
        [[[
          const f = Object.assign({}, (this._config.custom_fields || {}).card);
          delete f.card;
          return f;
        ]]]

  styles:
    grid:
      - grid-template-columns: 1fr
      - grid-template-rows: 1fr
      - grid-template-areas: '"card"'
      - gap: 0
      - align-content: stretch
      - align-items: stretch
      - justify-items: stretch
    custom_fields:
      card:
        - grid-area: card
        - width: 100%
        - height: 100%
        - min-width: 0
        - min-height: 0
        - overflow: hidden
        - border-radius: inherit
        # The tile is the surface. Vars cross the shadow boundary, so the
        # hosted card draws on it instead of bringing a second card with it.
        - "--ha-card-background": transparent
        - "--ha-card-box-shadow": none
        - "--ha-card-border-width": "0"
        - "--ha-card-border-color": transparent
        - "--ha-card-backdrop-filter": none
        - "--hemma-card-backdrop": none
