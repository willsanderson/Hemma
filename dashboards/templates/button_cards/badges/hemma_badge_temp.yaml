hemma_badge_temp:
  template: [hemma_badge_base, hemma_popup_base, hemma_climate_panel]

  variables:
    enabled: true
    temp_unit: 'F'
    room_name: null
    entity_quality: null
    entity_temp: null
    entity_humidity: null
    sensors: null

  icon: mdi:thermometer

  extra_styles: >
    [[[
      const ev = variables?.enabled;
      const enabled = (ev === undefined || ev === null) ? true :
        (typeof ev === 'boolean') ? ev :
        (typeof ev === 'number') ? ev !== 0 :
        !['false','0','no','off','disabled'].includes(String(ev).trim().toLowerCase());

      const hasEnt = !!entity?.entity_id;
      const stRaw  = String(entity?.state ?? '').trim();
      const st     = stRaw.toLowerCase();
      const v      = parseFloat(stRaw);
      const hide   = !enabled || !hasEnt || !stRaw || ['unknown','unavailable','none'].includes(st) || Number.isNaN(v);

      const unit = String(variables?.temp_unit || 'F').toUpperCase();
      const t = (unit === 'F')
        ? { cool: 70, warm: 81 }
        : { cool: 21, warm: 27 };

      let svgUrl;
      if      (v <= t.cool) svgUrl = window.hemmaIconUrl('temp-low');
      else if (v <= t.warm) svgUrl = window.hemmaIconUrl('temp-medium');
      else                  svgUrl = window.hemmaIconUrl('temp-high');

      let gaugeCSS = '';
      if (variables?.gauge && !hide) {
        const gf  = Math.max(0.05, Math.min(1,
          unit === 'F' ? (v - 45) / 50 : (v - 7) / 28));
        const arc = Math.round(gf * 270);
        const rr = 13.5, C = 16, W = 3;
        const pt = (deg) => {
          const a = deg * Math.PI / 180;
          return `${(C + rr * Math.sin(a)).toFixed(3)} ${(C - rr * Math.cos(a)).toFixed(3)}`;
        };
        const arcPath = (a0, a1) =>
          `M ${pt(a0)} A ${rr} ${rr} 0 ${(a1 - a0) > 180 ? 1 : 0} 1 ${pt(a1)}`;
        let paths = '';
        if (arc < 269) paths += `<path d='${arcPath(225 + arc, 495)}' stroke='white' stroke-opacity='0.30' stroke-width='${W}' stroke-linecap='round' fill='none'/>`;
        paths += `<path d='${arcPath(225, 225 + arc)}' stroke='white' stroke-width='${W}' stroke-linecap='round' fill='none'/>`;

        const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'>${paths}</svg>`;
        const maskUrl = `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
        gaugeCSS = `
          #img-cell::before, .img-cell::before {
            background-color: var(--hemma-badge-icon-fg, var(--hemma-icon-color, var(--primary-text-color))) !important;
          }

          #img-cell::after, .img-cell::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 9999px;
            background: var(--hemma-icon-color, #fff);
            -webkit-mask: ${maskUrl} no-repeat center / 100% 100%;
            mask: ${maskUrl} no-repeat center / 100% 100%;
            transform: translateZ(0);
            -webkit-transform: translateZ(0);
          }

          ha-card.button-card-main, ha-card.button-card-main:hover, ha-card.button-card-main:active,
          :host(:hover) ha-card, :host(:active) ha-card {
            background: transparent !important;
            box-shadow: none !important;
            filter: none !important;
            -webkit-filter: none !important;
            -webkit-tap-highlight-color: transparent !important;
          }
          ha-ripple, mwc-ripple { display: none !important; }
        `;
      }

      return `
        :host{display:${hide ? 'none' : 'inline-block'} !important;order:var(--hemma-badge-order-climate,1);}
        #img-cell, .img-cell { position: relative; }
        #img-cell #icon, .img-cell #icon { color: transparent !important; opacity: 0 !important; }
        #img-cell::before, .img-cell::before {
          content: '';
          position: absolute;
          inset: 0;
          background-color: var(--hemma-icon-color, var(--primary-text-color));
          -webkit-mask: url('${svgUrl}') no-repeat center / var(--hemma-badge-icon-scale, 85%) var(--hemma-badge-icon-scale, 85%);
          mask: url('${svgUrl}') no-repeat center / var(--hemma-badge-icon-scale, 85%) var(--hemma-badge-icon-scale, 85%);
          transform: translateZ(0);
        }
      ` + gaugeCSS;
    ]]]

  styles:
    card:
      - display: >
          [[[
            const ev = variables?.enabled;
            const enabled = (ev === undefined || ev === null) ? true :
              (typeof ev === 'boolean') ? ev :
              (typeof ev === 'number') ? ev !== 0 :
              !['false','0','no','off','disabled'].includes(String(ev).trim().toLowerCase());

            const hasEnt = !!entity?.entity_id;
            const stRaw  = String(entity?.state ?? '').trim();
            const st     = stRaw.toLowerCase();
            const v      = parseFloat(stRaw);
            const hide   = !enabled || !hasEnt || !stRaw || ['unknown','unavailable','none'].includes(st) || Number.isNaN(v);

            return hide ? 'none' : 'inline-grid';
          ]]]
      - --hemma-icon-color: >
          [[[
            const v    = parseFloat(entity?.state);
            const unit = String(variables?.temp_unit || 'F').toUpperCase();
            if (isNaN(v)) return 'var(--disabled-text-color)';
            const t = (unit === 'F')
              ? { veryCold: 65, cool: 70, comfortable: 76, warm: 81, hot: 85 }
              : { veryCold: 18, cool: 21, comfortable: 24, warm: 27, hot: 29 };
            if (v <= t.veryCold)    return 'var(--hemma-badge-temp-very-cold-color)';
            if (v <= t.cool)        return 'var(--hemma-badge-temp-cool-color)';
            if (v <= t.comfortable) return 'var(--hemma-badge-temp-comfortable-color)';
            if (v <= t.warm)        return 'var(--hemma-badge-temp-warm-color)';
            if (v <= t.hot)         return 'var(--hemma-badge-temp-hot-color)';
            return 'var(--hemma-badge-temp-very-hot-color)';
          ]]]
    icon:
      - color: transparent

  name: >
    [[[
      const v    = parseFloat(entity?.state);
      const unit = String(variables?.temp_unit || 'F').toUpperCase();
      if (isNaN(v)) return '';

      const t = (unit === 'F')
        ? { veryCold: 65, cool: 70, comfortable: 76, warm: 81, hot: 85 }
        : { veryCold: 18, cool: 21, comfortable: 24, warm: 27, hot: 29 };

      const T = window._hemmaT || ((k, en, v) => String(en).replace(/\{(\w+)\}/g,
        (m, p) => (v && Object.prototype.hasOwnProperty.call(v, p) ? String(v[p]) : m)));
      let label = T('temp.unknown', 'Unknown');
      if      (v <= t.veryCold)    label = T('temp.very_cold', 'Very Cold');
      else if (v <= t.cool)        label = T('temp.cool', 'Cool');
      else if (v <= t.comfortable) label = T('temp.comfortable', 'Comfortable');
      else if (v <= t.warm)        label = T('temp.warm', 'Warm');
      else if (v <= t.hot)         label = T('temp.hot', 'Hot');
      else                         label = T('temp.very_hot', 'Very Hot');

      const dispVal = `${Math.round(v)}°`;
      const esc = (s) => String(s || '').replaceAll('"', '&quot;');

      return `
        <div class="badge-wrap">
          <div class="badge-title">${T('temp.title', 'Temperature')}</div>
          <div class="badge-sub">${esc(label)} · ${dispVal}</div>
        </div>
      `;
    ]]]
