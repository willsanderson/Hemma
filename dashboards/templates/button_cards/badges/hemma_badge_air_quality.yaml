# Air Quality Badge
# Shows air quality sensor with color-coded status.
# Tap: opens hemma_climate_popup (shared climate popup).
#
# Variables:
#   enabled         - show/hide this badge (default: true)
#   room_name       - display name shown in the climate popup
#   entity_quality  - air quality sensor entity_id
#   entity_temp     - temperature sensor entity_id (passed through to the popup)
#   entity_humidity - humidity sensor entity_id (passed through to the popup)
#   sensors         - array of raw pollutant sensor entity_ids for the popup breakdown

hemma_badge_air_quality:
  template: [hemma_badge_base, hemma_popup_base, hemma_climate_popup]

  variables:
    enabled: true
    room_name: null
    entity_quality: null
    entity_temp: null
    entity_humidity: null
    sensors: null

  icon: mdi:air-filter

  extra_styles: >
    [[[
      const ev = variables?.enabled;
      const enabled = (ev === undefined || ev === null) ? true :
        (typeof ev === 'boolean') ? ev :
        (typeof ev === 'number') ? ev !== 0 :
        !['false','0','no','off','disabled'].includes(String(ev).trim().toLowerCase());

      const hasEnt  = !!entity?.entity_id;
      const stRaw   = String(entity?.state ?? '').trim();
      const st      = stRaw.toLowerCase();
      const hide    = !enabled || !hasEnt || !stRaw || ['unknown','unavailable','none'].includes(st);

      const svgUrl = ['poor', 'bad', 'very bad'].includes(st)
        ? window.hemmaIconUrl('aqi-high')
        : window.hemmaIconUrl('aqi-medium');

      let gaugeCSS = '';
      if (variables?.gauge && !hide) {
        const levels = { excellent: 1, good: 0.8, fair: 0.55, moderate: 0.55,
                         poor: 0.3, bad: 0.15, 'very bad': 0.15, 'very poor': 0.15 };
        const gf  = levels[st] ?? 0.5;
        const arc = Math.round(gf * 270);
        const rr = 13.5, C = 16, W = 3;
        const pt = (deg) => {
          const a = deg * Math.PI / 180;
          return `${(C + rr * Math.sin(a)).toFixed(3)} ${(C - rr * Math.cos(a)).toFixed(3)}`;
        };
        const arcPath = (a0, a1) =>
          `M ${pt(a0)} A ${rr} ${rr} 0 ${(a1 - a0) > 180 ? 1 : 0} 1 ${pt(a1)}`;
        let paths = '';
        if (arc < 269) paths += `<path d='${arcPath(225 + arc, 495)}' stroke='white' stroke-opacity='0.30' stroke-width='${W}' stroke-linecap='round' fill='none'/>`;
        paths += `<path d='${arcPath(225, 225 + arc)}' stroke='white' stroke-width='${W}' stroke-linecap='round' fill='none'/>`;

        const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'>${paths}</svg>`;
        const maskUrl = `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
        gaugeCSS = `
          #img-cell::before, .img-cell::before {
            background-color: var(--hemma-badge-icon-fg, var(--hemma-icon-color, var(--primary-text-color))) !important;
          }

          #img-cell::after, .img-cell::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 9999px;
            background: var(--hemma-icon-color, #fff);
            -webkit-mask: ${maskUrl} no-repeat center / 100% 100%;
            mask: ${maskUrl} no-repeat center / 100% 100%;
            transform: translateZ(0);
            -webkit-transform: translateZ(0);
          }

          #container { column-gap: var(--hemma-gauge-col-gap, 12px) !important; }

          ha-card.button-card-main, ha-card.button-card-main:hover, ha-card.button-card-main:active,
          :host(:hover) ha-card, :host(:active) ha-card {
            background: transparent !important;
            box-shadow: none !important;
            filter: none !important;
            -webkit-filter: none !important;
            -webkit-tap-highlight-color: transparent !important;
          }
          ha-ripple, mwc-ripple { display: none !important; }
        `;
      }

      return `
        :host{display:${hide ? 'none' : 'inline-block'} !important;}
        #img-cell, .img-cell { position: relative; }
        #img-cell #icon, .img-cell #icon { color: transparent !important; opacity: 0 !important; }
        #img-cell::before, .img-cell::before {
          content: '';
          position: absolute;
          inset: 0;
          background-color: var(--hemma-icon-color, var(--primary-text-color));
          -webkit-mask: url('${svgUrl}') no-repeat center / var(--hemma-badge-icon-scale, 85%) var(--hemma-badge-icon-scale, 85%);
          mask: url('${svgUrl}') no-repeat center / var(--hemma-badge-icon-scale, 85%) var(--hemma-badge-icon-scale, 85%);
          transform: translateZ(0);
        }
      ` + gaugeCSS;
    ]]]

  styles:
    card:
      - display: >
          [[[
            const ev = variables?.enabled;
            const enabled = (ev === undefined || ev === null) ? true :
              (typeof ev === 'boolean') ? ev :
              (typeof ev === 'number') ? ev !== 0 :
              !['false','0','no','off','disabled'].includes(String(ev).trim().toLowerCase());

            const hasEnt  = !!entity?.entity_id;
            const stRaw   = String(entity?.state ?? '').trim();
            const st      = stRaw.toLowerCase();
            const hide    = !enabled || !hasEnt || !stRaw || ['unknown','unavailable','none'].includes(st);

            return hide ? 'none' : 'inline-grid';
          ]]]
      - --hemma-icon-color: >
          [[[
            const s = String(entity?.state || 'unknown').toLowerCase();
            if (s === 'excellent') return 'var(--hemma-badge-air-quality-excellent-color)';
            if (s === 'good')      return 'var(--hemma-badge-air-quality-good-color)';
            if (s === 'moderate' || s === 'fair') return 'var(--hemma-badge-air-quality-moderate-color)';
            if (s === 'poor')      return 'var(--hemma-badge-air-quality-poor-color)';
            if (s === 'bad' || s === 'very bad' || s === 'very poor') return 'var(--hemma-badge-air-quality-bad-color)';
            return 'var(--disabled-text-color)';
          ]]]
    icon:
      - color: transparent

  name: >
    [[[
      // entity is undefined during HA startup — formatEntityState(undefined) throws.
      const raw = (entity ? hass.formatEntityState(entity) : '') || entity?.state || 'Unknown';
      const nice = raw.charAt(0).toUpperCase() + raw.slice(1);
      const esc = (t) => String(t || '').replaceAll('"','&quot;');
      return `
        <div class="badge-wrap">
          <div class="badge-title">Air Quality</div>
          <div class="badge-sub">${esc(nice)}</div>
        </div>
      `;
    ]]]
