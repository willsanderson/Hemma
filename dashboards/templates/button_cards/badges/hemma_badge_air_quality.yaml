
hemma_badge_air_quality:
  template: [hemma_badge_base, hemma_popup_base, hemma_climate_panel]

  variables:
    enabled: true
    room_name: null
    entity_quality: null
    entity_temp: null
    entity_humidity: null
    sensors: null

  icon: mdi:air-filter

  extra_styles: >
    [[[
      const ev = variables?.enabled;
      const enabled = (ev === undefined || ev === null) ? true :
        (typeof ev === 'boolean') ? ev :
        (typeof ev === 'number') ? ev !== 0 :
        !['false','0','no','off','disabled'].includes(String(ev).trim().toLowerCase());

      const hasEnt  = !!entity?.entity_id;
      const stRaw   = String(entity?.state ?? '').trim();
      const st      = stRaw.toLowerCase();
      const hide    = !enabled || !hasEnt || !stRaw || ['unknown','unavailable','none'].includes(st);

      const aqLevel = (() => { const st0 = String(entity?.state ?? '').trim().toLowerCase(); const base = { excellent: 0, good: 0.5, moderate: 1, fair: 1, poor: 2, bad: 3, 'very bad': 3, 'very poor': 3 }[st0]; const sns = Array.isArray(variables?.sensors) ? variables.sensors.filter(Boolean) : []; let worst = -1; sns.forEach((eid) => { const n = parseFloat(states[eid]?.state); if (isNaN(n)) return; const id = eid.toLowerCase(); const a = states[eid]?.attributes || {}; const dc = String(a.device_class || '').toLowerCase(); const idx = id.endsWith('_index') || String(a.unit_of_measurement || '').toLowerCase() === 'index'; const t = (id.includes('pm25') || id.includes('pm2_5') || dc === 'pm25') ? [12, 35.4, 55.4] : (id.includes('pm10') || dc === 'pm10') ? [54, 154, 254] : (id.includes('voc') || id.includes('volatile_organic') || dc.includes('volatile_organic')) ? (idx ? [6, 8, 9] : [100, 200, 300]) : (id.includes('no2') || id.includes('nitrogen_dioxide') || dc === 'nitrogen_dioxide') ? (idx ? [6, 8, 9] : [53, 100, 360]) : (id.includes('co2') || id.includes('carbon') || dc === 'carbon_dioxide') ? [1000, 1500, 2000] : null; if (!t) { worst = Math.max(worst, 0); return; } worst = Math.max(worst, n <= t[0] ? 0 : n <= t[1] ? 1 : n <= t[2] ? 2 : 3); }); return worst >= 0 ? worst : base; })();
      const svgUrl = aqLevel >= 2
        ? window.hemmaIconUrl('aqi-high')
        : window.hemmaIconUrl('aqi-medium');

      let gaugeCSS = '';
      if (variables?.gauge && !hide) {
        const gf  = { 0: 1, 0.5: 0.8, 1: 0.55, 2: 0.3, 3: 0.15 }[aqLevel] ?? 0.5;
        const arc = Math.round(gf * 270);
        const rr = 13.5, C = 16, W = 3;
        const pt = (deg) => {
          const a = deg * Math.PI / 180;
          return `${(C + rr * Math.sin(a)).toFixed(3)} ${(C - rr * Math.cos(a)).toFixed(3)}`;
        };
        const arcPath = (a0, a1) =>
          `M ${pt(a0)} A ${rr} ${rr} 0 ${(a1 - a0) > 180 ? 1 : 0} 1 ${pt(a1)}`;
        let paths = '';
        if (arc < 269) paths += `<path d='${arcPath(225 + arc, 495)}' stroke='white' stroke-opacity='0.30' stroke-width='${W}' stroke-linecap='round' fill='none'/>`;
        paths += `<path d='${arcPath(225, 225 + arc)}' stroke='white' stroke-width='${W}' stroke-linecap='round' fill='none'/>`;

        const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'>${paths}</svg>`;
        const maskUrl = `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
        gaugeCSS = `
          #img-cell::before, .img-cell::before {
            background-color: var(--hemma-badge-icon-fg, var(--hemma-icon-color, var(--primary-text-color))) !important;
          }

          #img-cell::after, .img-cell::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 9999px;
            background: var(--hemma-icon-color, #fff);
            -webkit-mask: ${maskUrl} no-repeat center / 100% 100%;
            mask: ${maskUrl} no-repeat center / 100% 100%;
            transform: translateZ(0);
            -webkit-transform: translateZ(0);
          }

          #container { column-gap: var(--hemma-gauge-col-gap, 12px) !important; }

          ha-card.button-card-main, ha-card.button-card-main:hover, ha-card.button-card-main:active,
          :host(:hover) ha-card, :host(:active) ha-card {
            background: transparent !important;
            box-shadow: none !important;
            filter: none !important;
            -webkit-filter: none !important;
            -webkit-tap-highlight-color: transparent !important;
          }
          ha-ripple, mwc-ripple { display: none !important; }
        `;
      }

      return `
        :host{display:${hide ? 'none' : 'inline-block'} !important;order:var(--hemma-badge-order-climate,1);}
        #img-cell, .img-cell { position: relative; }
        #img-cell #icon, .img-cell #icon { color: transparent !important; opacity: 0 !important; }
        #img-cell::before, .img-cell::before {
          content: '';
          position: absolute;
          inset: 0;
          background-color: var(--hemma-icon-color, var(--primary-text-color));
          -webkit-mask: url('${svgUrl}') no-repeat center / var(--hemma-badge-icon-scale, 85%) var(--hemma-badge-icon-scale, 85%);
          mask: url('${svgUrl}') no-repeat center / var(--hemma-badge-icon-scale, 85%) var(--hemma-badge-icon-scale, 85%);
          transform: translateZ(0);
        }
      ` + gaugeCSS;
    ]]]

  styles:
    card:
      - display: >
          [[[
            const ev = variables?.enabled;
            const enabled = (ev === undefined || ev === null) ? true :
              (typeof ev === 'boolean') ? ev :
              (typeof ev === 'number') ? ev !== 0 :
              !['false','0','no','off','disabled'].includes(String(ev).trim().toLowerCase());

            const hasEnt  = !!entity?.entity_id;
            const stRaw   = String(entity?.state ?? '').trim();
            const st      = stRaw.toLowerCase();
            const hide    = !enabled || !hasEnt || !stRaw || ['unknown','unavailable','none'].includes(st);

            return hide ? 'none' : 'inline-grid';
          ]]]
      - --hemma-icon-color: >
          [[[
            const aqLevel = (() => { const st0 = String(entity?.state ?? '').trim().toLowerCase(); const base = { excellent: 0, good: 0.5, moderate: 1, fair: 1, poor: 2, bad: 3, 'very bad': 3, 'very poor': 3 }[st0]; const sns = Array.isArray(variables?.sensors) ? variables.sensors.filter(Boolean) : []; let worst = -1; sns.forEach((eid) => { const n = parseFloat(states[eid]?.state); if (isNaN(n)) return; const id = eid.toLowerCase(); const a = states[eid]?.attributes || {}; const dc = String(a.device_class || '').toLowerCase(); const idx = id.endsWith('_index') || String(a.unit_of_measurement || '').toLowerCase() === 'index'; const t = (id.includes('pm25') || id.includes('pm2_5') || dc === 'pm25') ? [12, 35.4, 55.4] : (id.includes('pm10') || dc === 'pm10') ? [54, 154, 254] : (id.includes('voc') || id.includes('volatile_organic') || dc.includes('volatile_organic')) ? (idx ? [6, 8, 9] : [100, 200, 300]) : (id.includes('no2') || id.includes('nitrogen_dioxide') || dc === 'nitrogen_dioxide') ? (idx ? [6, 8, 9] : [53, 100, 360]) : (id.includes('co2') || id.includes('carbon') || dc === 'carbon_dioxide') ? [1000, 1500, 2000] : null; if (!t) { worst = Math.max(worst, 0); return; } worst = Math.max(worst, n <= t[0] ? 0 : n <= t[1] ? 1 : n <= t[2] ? 2 : 3); }); return worst >= 0 ? worst : base; })();
            if (aqLevel === 0)   return 'var(--hemma-badge-air-quality-excellent-color)';
            if (aqLevel === 0.5) return 'var(--hemma-badge-air-quality-good-color)';
            if (aqLevel === 1)   return 'var(--hemma-badge-air-quality-moderate-color)';
            if (aqLevel === 2)   return 'var(--hemma-badge-air-quality-poor-color)';
            if (aqLevel === 3)   return 'var(--hemma-badge-air-quality-bad-color)';
            return 'var(--disabled-text-color)';
          ]]]
    icon:
      - color: transparent

  name: >
    [[[
      const L = (k, en) => { const v = hass?.localize?.(k); return (v && v !== k) ? v : en; };
      const T = window._hemmaT || ((k, en, v) => { let s = String(en); if (v) for (const p in v) s = s.split('{' + p + '}').join(String(v[p])); return s; });
      const aqLevel = (() => { const st0 = String(entity?.state ?? '').trim().toLowerCase(); const base = { excellent: 0, good: 0.5, moderate: 1, fair: 1, poor: 2, bad: 3, 'very bad': 3, 'very poor': 3 }[st0]; const sns = Array.isArray(variables?.sensors) ? variables.sensors.filter(Boolean) : []; let worst = -1; sns.forEach((eid) => { const n = parseFloat(states[eid]?.state); if (isNaN(n)) return; const id = eid.toLowerCase(); const a = states[eid]?.attributes || {}; const dc = String(a.device_class || '').toLowerCase(); const idx = id.endsWith('_index') || String(a.unit_of_measurement || '').toLowerCase() === 'index'; const t = (id.includes('pm25') || id.includes('pm2_5') || dc === 'pm25') ? [12, 35.4, 55.4] : (id.includes('pm10') || dc === 'pm10') ? [54, 154, 254] : (id.includes('voc') || id.includes('volatile_organic') || dc.includes('volatile_organic')) ? (idx ? [6, 8, 9] : [100, 200, 300]) : (id.includes('no2') || id.includes('nitrogen_dioxide') || dc === 'nitrogen_dioxide') ? (idx ? [6, 8, 9] : [53, 100, 360]) : (id.includes('co2') || id.includes('carbon') || dc === 'carbon_dioxide') ? [1000, 1500, 2000] : null; if (!t) { worst = Math.max(worst, 0); return; } worst = Math.max(worst, n <= t[0] ? 0 : n <= t[1] ? 1 : n <= t[2] ? 2 : 3); }); return worst >= 0 ? worst : base; })();
      const st = String(entity?.state ?? '').trim().toLowerCase();
      const word = aqLevel === 0 ? T('air_quality.excellent', 'Excellent')
        : aqLevel === 0.5 ? T('air_quality.good', 'Good')
        : aqLevel === 1 ? (st === 'fair' ? T('air_quality.fair', 'Fair') : T('air_quality.moderate', 'Moderate'))
        : aqLevel === 2 ? T('air_quality.poor', 'Poor')
        : aqLevel === 3 ? T('air_quality.bad', 'Bad') : null;
      // entity is undefined during HA startup - formatEntityState(undefined) throws.
      const raw = word || (entity ? hass.formatEntityState(entity) : '') || entity?.state || L('state.default.unknown', 'Unknown');
      const nice = raw.charAt(0).toUpperCase() + raw.slice(1);
      const esc = (t) => String(t || '').replaceAll('"','&quot;');
      return `
        <div class="badge-wrap">
          <div class="badge-title">${T('air_quality.title', 'Air Quality')}</div>
          <div class="badge-sub">${esc(nice)}</div>
        </div>
      `;
    ]]]
