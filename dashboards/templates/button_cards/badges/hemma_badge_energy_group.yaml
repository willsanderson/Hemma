hemma_badge_energy_group:
  template: [hemma_badge_base, hemma_popup_energy]

  show_state: false
  show_label: false
  show_icon: true
  icon: mdi:lightning-bolt

  variables:
    enabled: true
    power_entity: null
    # The mobile badge row passes its filter, so the badge shows as selected there.
    row_entity: null

  tap_action:
    action: fire-dom-event
    hemma_category: energy

  # hold_action comes from hemma_popup_energy (this room's energy popup).
  double_tap_action:
    action: none

  styles:
    card:
      - background: >
          [[[
            return states[variables.row_entity]?.state === 'energy'
              ? 'var(--badge-active-color, rgba(255,255,255,0.85))'
              : 'var(--badge-background, rgba(10,12,14,0.65))';
          ]]]
      - display: >
          [[[
            const ev = variables?.enabled;
            const enabled = (ev === undefined || ev === null) ? true :
              (typeof ev === 'boolean') ? ev :
              (typeof ev === 'number') ? ev !== 0 :
              !['false','0','no','off','disabled'].includes(String(ev).trim().toLowerCase());
            return enabled ? 'inline-grid' : 'none';
          ]]]
      - --badge-title-color: >
          [[[
            return states[variables.row_entity]?.state === 'energy' ? 'rgba(0,0,0,0.85)' : 'var(--primary-text-color)';
          ]]]
      - --badge-sub-color: >
          [[[
            return states[variables.row_entity]?.state === 'energy' ? 'rgba(0,0,0,0.6)' : 'var(--secondary-text-color)';
          ]]]
      # A bare yellow glyph washes out on the white selected pill; deepen it there.
      - --hemma-badge-energy-medium-color: >
          [[[
            return states[variables.row_entity]?.state === 'energy'
              ? 'var(--hemma-color-yellow-dark, #F4C403)'
              : 'var(--hemma-color-yellow, #FFCC00)';
          ]]]
      - --hemma-badge-icon-color: >
          [[[
            const pid = variables.power_entity || variables.entity_power;
            const w = pid ? parseFloat(states[pid]?.state) : NaN;
            if (!Number.isFinite(w)) return 'var(--hemma-badge-energy-color, #30D158)';
            if (w >= Number(variables.extreme_threshold ?? 3000)) return 'var(--hemma-badge-energy-very-high-color, #FF4245)';
            if (w >= Number(variables.heavy_threshold   ?? 1000)) return 'var(--hemma-badge-energy-high-color, #FF9230)';
            if (w >= Number(variables.normal_threshold  ?? 200))  return 'var(--hemma-badge-energy-medium-color, #FFD600)';
            return 'var(--hemma-badge-energy-low-color, #30D158)';
          ]]]
      - --icon-primary-color: var(--hemma-badge-icon-color)
      - --paper-item-icon-color: var(--hemma-badge-icon-color)
      - --state-icon-color: var(--hemma-badge-icon-color)

    icon:
      - color: var(--hemma-badge-icon-color)

  name: >
    [[[
      const T = window._hemmaT || ((k, en, v) => { let s = String(en); if (v) for (const p in v) s = s.split(String.fromCharCode(123) + p + String.fromCharCode(125)).join(String(v[p])); return s; });
      const eid = variables.power_entity;
      const power = eid ? parseFloat(states[eid]?.state) : NaN;
      let sub = '';
      if (!isNaN(power)) {
        sub = power >= Number(variables.extreme_threshold ?? 3000) ? T('energy.extreme_usage', 'Extreme Usage')
            : power >= Number(variables.heavy_threshold   ?? 1000) ? T('energy.heavy_usage', 'Heavy Usage')
            : power >= Number(variables.normal_threshold  ?? 200)  ? T('energy.normal', 'Normal')
            : T('energy.idle', 'Idle');
      }
      return `
        <div class="badge-wrap">
          <div class="badge-title">${T('filter.energy', 'Energy')}</div>
          ${sub ? `<div class="badge-sub">${sub}</div>` : ''}
        </div>
      `;
    ]]]

  extra_styles: >
    [[[
      const ev = variables?.enabled;
      const enabled = (ev === undefined || ev === null) ? true :
        (typeof ev === 'boolean') ? ev :
        (typeof ev === 'number') ? ev !== 0 :
        !['false','0','no','off','disabled'].includes(String(ev).trim().toLowerCase());
      const URL = window.hemmaIconUrl('energy');

      return `:host{display:${enabled ? 'inline-block' : 'none'} !important;order:var(--hemma-badge-order-energy,6);}
        #img-cell, .img-cell{ position: relative; }

        #img-cell #icon, .img-cell #icon{
          color: transparent !important;
          opacity: 0 !important;
        }

        #img-cell::before,
        .img-cell::before{
          content: '';
          position: absolute;
          inset: 0;
          background-color: var(--hemma-badge-icon-color, var(--hemma-badge-energy-color, #30D158)) !important;
          -webkit-mask: url('${URL}') no-repeat center / auto 82%;
          mask: url('${URL}') no-repeat center / auto 82%;
          transform: translateZ(0);
        }`;
    ]]]
