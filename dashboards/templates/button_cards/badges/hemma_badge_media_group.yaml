# Media Group Badge
# Shows how many of several media players / game sessions are currently active.
# Tap to expand/collapse the individual media sub-badges row
# (driven by input_select.hemma_expanded_row).
#
# Variables:
#   enabled                    - show/hide this badge (default: true)
#   always_visible             - show even when nothing is active (default: false)
#   pause_timeout_minutes      - minutes a paused player still counts as active (default: 10)
#   entity_1 – entity_14       - media_player entity IDs to track
#   pc_count                   - number of live PC sources (Discord/Steam); hemma_room computes it
hemma_badge_media_group:
  template: [hemma_badge_base]

  entity: input_select.hemma_expanded_row

  variables:
    enabled: true
    always_visible: false
    pause_timeout_minutes: 10
    entity_1: null
    entity_2: null
    entity_3: null
    entity_4: null
    entity_5: null
    entity_6: null
    entity_7: null
    entity_8: null
    entity_9: null
    entity_10: null
    entity_11: null
    entity_12: null
    entity_13: null
    entity_14: null
    # Count of live PC sources (Discord / Steam), computed by hemma_room.
    pc_count: 0

  show_state: false
  show_label: false
  show_icon: true
  icon: mdi:television-speaker

  tap_action:
    action: call-service
    service: input_select.select_option
    service_data:
      entity_id: input_select.hemma_expanded_row
      option: >
        [[[
          return states['input_select.hemma_expanded_row']?.state === 'media' ? 'none' : 'media';
        ]]]

  hold_action:
    action: none
  double_tap_action:
    action: none

  extra_styles: >
    [[[
      const _d = (() => {
        const enabled = (v) => {
          if (v === undefined || v === null) return true;
          if (typeof v === 'boolean') return v;
          if (typeof v === 'number') return v !== 0;
          return !['false','0','no','off','disabled'].includes(String(v).trim().toLowerCase());
        };
      
        if (!enabled(variables?.enabled)) return 'none';
        if (variables?.always_visible) return 'inline-grid';
      
        const isActive = (eid) => {
          if (!eid) return false;
          const s = hass.states[eid];
          if (!s) return false;
          const st = String(s.state || '').toLowerCase();
          if (['unavailable','unknown','off','standby'].includes(st)) return false;
          if (['playing','buffering','on'].includes(st)) return true;
          const a = s.attributes || {};
          const hasContent = !!(
            String(a.media_title || '').trim() ||
            String(a.media_artist || a.artist || a.media_album_artist || '').trim()
          );
          if (!hasContent) return false;
          if (st === 'paused') {
            const timeout = Number(variables?.pause_timeout_minutes ?? 10);
            if (timeout <= 0) return true;
            return ((new Date() - new Date(s.last_changed)) / 60000) <= timeout;
          }
          return st === 'idle';
        };
      
      
        const eids = [
          variables?.entity_1, variables?.entity_2, variables?.entity_3, variables?.entity_4,
          variables?.entity_5, variables?.entity_6, variables?.entity_7, variables?.entity_8,
          variables?.entity_9, variables?.entity_10, variables?.entity_11, variables?.entity_12,
          variables?.entity_13, variables?.entity_14
        ].filter(Boolean);
      
        const activeCount = eids.filter(e => isActive(e)).length + Number(variables?.pc_count || 0);
        return activeCount > 0 ? 'inline-grid' : 'none';
      })();
      const _hide = String(_d).trim() === 'none';
      return `:host{display:${_hide ? 'none' : 'inline-block'} !important;}` + `
    #img-cell, .img-cell{ position: relative; }

    #img-cell #icon, .img-cell #icon{
      color: transparent !important;
      opacity: 0 !important;
      --icon-primary-color: var(--hemma-icon-color) !important;
      --paper-item-icon-color: var(--hemma-icon-color) !important;
      --state-icon-color: var(--hemma-icon-color) !important;
      --card-mod-icon-color: var(--hemma-icon-color) !important;
    }

    #img-cell::before,
    .img-cell::before{
      content: '';
      position: absolute;
      inset: 2px;
      z-index: 5;
      background-color: var(--hemma-icon-color, var(--primary-text-color)) !important;

