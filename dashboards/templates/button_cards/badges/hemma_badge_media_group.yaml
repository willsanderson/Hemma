) no-repeat center / 100% 100%;
      mask: url('data:image/svg+xml,%3C%3Fxml%20version%3D%221.0%22%20encoding%3D%22UTF-8%22%3F%3E%0A%3C%21--Generator%3A%20Apple%20Native%20CoreSVG%20341--%3E%0A%3C%21DOCTYPE%20svg%0APUBLIC%20%22-%2F%2FW3C%2F%2FDTD%20SVG%201.1%2F%2FEN%22%0A%20%20%20%20%20%20%20%22http%3A%2F%2Fwww.w3.org%2FGraphics%2FSVG%2F1.1%2FDTD%2Fsvg11.dtd%22%3E%0A%3Csvg%20version%3D%221.1%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20xmlns%3Axlink%3D%22http%3A%2F%2Fwww.w3.org%2F1999%2Fxlink%22%20viewBox%3D%220%200%2036.1289%2029.6133%22%3E%0A%20%3Cg%3E%0A%20%20%3Crect%20height%3D%2229.6133%22%20opacity%3D%220%22%20width%3D%2236.1289%22%20x%3D%220%22%20y%3D%220%22%2F%3E%0A%20%20%3Cpath%20d%3D%22M20.3555%2025.5C20.3555%2025.8658%2020.3859%2026.2059%2020.4452%2026.5195L9.99609%2026.5195C9.48047%2026.5195%209.05859%2026.0977%209.05859%2025.5703C9.05859%2025.043%209.48047%2024.6211%209.99609%2024.6211L20.3555%2024.6211ZM30.5391%206.09375L30.5391%2010.0781L28.6523%2010.0781L28.6523%206.11719C28.6523%205.40234%2028.2188%204.96875%2027.5039%204.96875L4.28906%204.96875C3.5625%204.96875%203.12891%205.40234%203.12891%206.11719L3.12891%2019.5117C3.12891%2020.2266%203.5625%2020.6602%204.28906%2020.6602L20.3555%2020.6602L20.3555%2022.5469L4.25391%2022.5469C2.39062%2022.5469%201.24219%2021.3984%201.24219%2019.5352L1.24219%206.09375C1.24219%204.23047%202.39062%203.08203%204.25391%203.08203L27.5391%203.08203C29.4023%203.08203%2030.5391%204.23047%2030.5391%206.09375Z%22%20fill%3D%22white%22%20fill-opacity%3D%220.5%22%2F%3E%0A%20%20%3Cpath%20d%3D%22M24.4336%2028.0078L32.0508%2028.0078C33.6914%2028.0078%2034.5352%2027.1758%2034.5352%2025.5L34.5352%2014.1914C34.5352%2012.5156%2033.6914%2011.6719%2032.0508%2011.6719L24.4336%2011.6719C22.7695%2011.6719%2021.9492%2012.5156%2021.9492%2014.1914L21.9492%2025.5C21.9492%2027.1758%2022.7695%2028.0078%2024.4336%2028.0078ZM28.2539%2017.6484C27.1172%2017.6484%2026.2148%2016.7461%2026.2266%2015.6094C26.2383%2014.4844%2027.1172%2013.6055%2028.2539%2013.6055C29.3789%