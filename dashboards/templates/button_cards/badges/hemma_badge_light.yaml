# Light Badge
# Shows individual light entity with on/off state and brightness.
# Tap: group entity → opens full multi-room light popup, pre-selecting this room
#      individual light → more-info
# Hold: toggle via script.hemma_light_smart_toggle
hemma_badge_light:
  template: [hemma_badge_base]

  variables:
    enabled: true

  show_state: false
  show_label: false
  show_icon: true
  icon: mdi:lightbulb

  tap_action:
    haptic: light
    action: |
      [[[
        if (typeof window.browser_mod === 'undefined') return 'more-info';
        const members = entity?.entity_id ? states[entity.entity_id]?.attributes?.entity_id : null;
        return Array.isArray(members) && members.length > 0 ? 'fire-dom-event' : 'more-info';
      ]]]
    entity: '[[[ return entity.entity_id ]]]'
    browser_mod:
      service: browser_mod.popup
      data:
        tag: |
          [[[
            const eid = entity?.entity_id;
            if (!eid) return 'hemma_light_popup';
            for (const sid of Object.keys(states)) {
              if (!sid.startsWith('light.') || sid === eid) continue;
              const st = states[sid];
              const mems = st.attributes?.entity_id;
              if (Array.isArray(mems) && mems.includes(eid) && mems.length > 1
                  && Array.isArray(states[mems[0]]?.attributes?.entity_id)) {
                return sid.replace(/\./g, '_') + '_popup';
              }
            }
            return eid.replace(/\./g, '_') + '_popup';
          ]]]
        title: ""
        dismissable: true
        adaptive: true
        size: auto
        style: "--popup-min-width: min(880px, 92vw); --popup-max-width: min(880px, 92vw);"
        popup_styles:
          - style: all
            styles: |
              :host {
                --dialog-surface-margin-top: 100px;
                --ha-ripple-hover-opacity: 0;
                --ha-ripple-pressed-opacity: 0.04;
                opacity: 0;
                animation: hemma-popup-reveal 0s 0.8s ease forwards;
              }
              @keyframes hemma-popup-reveal { to { opacity: 1; } }
              .content .container > * {
                width: 100% !important;
                max-width: none !important;
                box-sizing: border-box !important;
              }
              .content .container {
                scrollbar-width: none;
                overscroll-behavior: contain;
                touch-action: pan-y;
                padding-bottom: 24px !important;
              }
              .content .container::-webkit-scrollbar {
                display: none;
              }
              @media (max-width: 768px) {
                :host {
                  --dialog-surface-margin-top: 0px;
                }
                wa-drawer {
                  --size: calc(100dvh - env(safe-area-inset-top, 0px) - 8dvh) !important;
                  height: calc(100dvh - env(safe-area-inset-top, 0px) - 8dvh) !important;
                  min-height: calc(100dvh - env(safe-area-inset-top, 0px) - 8dvh) !important;
                }
                .content .container {
                  min-height: calc(100dvh - env(safe-area-inset-top, 0px) - 8dvh) !important;
                }
                wa-drawer.hemma-h-auto {
                  --size: var(--ha-bottom-sheet-height, auto) !important;
                  height: auto !important;
                  min-height: 0 !important;
                }
                wa-drawer.hemma-h-auto .content .container {
                  min-height: 0 !important;
                }
              }
        content: |
          [[[
            const _h = typeof hass !== 'undefined' ? hass : null;
            if (typeof window._hemmaLPC === 'function') {
              return window._hemmaLPC(entity, states, _h, {
                popup_group: entity?.entity_id || null,
                lights: [],
                group_rooms: true,
              });
            }
            return null;
          ]]]
  hold_action:
    action: call-service
    service: script.turn_on
    service_data:
      entity_id: script.hemma_light_smart_toggle
      variables:
        light_entity: '[[[ return entity.entity_id ]]]'

  double_tap_action:
    action: none

  extra_styles: >
    [[[
      const SVG_URL  = window.hemmaIconUrl('light');
      const ICON_PCT = 85;

      return `
        #img-cell, .img-cell{ position: relative; }

        #img-cell #icon, .img-cell #icon{
          color: transparent !important;
          opacity: 0 !important;
        }

        #img-cell::before,
        .img-cell::before{
          content: '';
          position: absolute;
          inset: 0;
          background-color: var(--hemma-icon-color, var(--primary-text-color)) !important;
          -webkit-mask: url('${SVG_URL}') no-repeat center / auto ${ICON_PCT}%;
          mask: url('${SVG_URL}') no-repeat center / auto ${ICON_PCT}%;
          transform: translateZ(0);
        }
      `;
    ]]]

  styles:
    # Has to be here: the base sets overflow:hidden inline with !important,
    # so an extra_styles override never wins.
    img_cell:
      - overflow: visible !important

    card:
      - display: >
          [[[
            const v = variables?.enabled;
            const enabled = (v === undefined || v === null) ? true :
              (typeof v === 'boolean') ? v :
              (typeof v === 'number') ? v !== 0 :
              !['false','0','no','off','disabled'].includes(String(v).trim().toLowerCase());

            const hasEnt = !!entity?.entity_id;
            const stRaw  = String(entity?.state ?? '').trim();
            const st     = stRaw.toLowerCase();
            const hide   = !enabled || !hasEnt || !stRaw || ['unknown','unavailable','none'].includes(st);

            return hide ? 'none' : 'inline-grid';
          ]]]
      - --badge-title-color: >
          [[[
            return entity?.state === 'on'
              ? 'var(--primary-text-color)'
              : 'var(--badge-title-inactive)';
          ]]]
      - --badge-sub-color: >
          [[[
            return entity?.state === 'on'
              ? 'var(--secondary-text-color)'
              : 'color-mix(in oklab, var(--secondary-text-color) 70%, transparent)';
          ]]]
      - --hemma-icon-color: >
          [[[
            if (entity?.state !== 'on') return 'var(--badge-title-inactive)';
            return 'var(--hemma-badge-light-color)';
          ]]]
    icon:
      - color: transparent

  name: >
    [[[
      const friendly = entity?.attributes?.friendly_name || 'Light';
      const isOn     = entity?.state === 'on';
      let sub;
      if (!isOn) {
        sub = 'Off';
      } else {
        const brightness = entity?.attributes?.brightness;
        sub = brightness != null ? `${Math.round((brightness / 255) * 100)}%` : 'On';
      }

      const esc = (t) => String(t || '').replaceAll('"', '&quot;');
      return `
        <div class="badge-wrap">
          <div class="badge-title">${esc(friendly)}</div>
          <div class="badge-sub">${esc(sub)}</div>
        </div>
      `;
    ]]]
