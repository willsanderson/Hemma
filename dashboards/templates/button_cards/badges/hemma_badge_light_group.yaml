hemma_badge_light_group:
  template: [hemma_badge_base, hemma_popup_light]

  icon_tap_action:
    action: none

  variables:
    enabled: true
    entity_1: null
    entity_2: null
    entity_3: null
    entity_4: null
    entity_5: null
    entity_6: null
    entity_7: null
    entity_8: null
    light_group_entity: null
    popup_group: '[[[ return variables.light_group_entity || variables.entity_1 || null ]]]'

  show_state: false
  show_label: false
  show_icon: true
  icon: mdi:lightbulb-group

  hold_action:
    haptic: medium
    action: >
      [[[
        return window.hemmaPopupAction ? window.hemmaPopupAction() : 'more-info';
      ]]]

  tap_action:
    action: fire-dom-event
    hemma_category: lights

  double_tap_action:
    action: none

  extra_styles: >
    [[[
      const _d = (() => {
        const v = variables?.enabled;
        const enabled = (v === undefined || v === null) ? true :
          (typeof v === 'boolean') ? v :
          (typeof v === 'number') ? v !== 0 :
          !['false','0','no','off','disabled'].includes(String(v).trim().toLowerCase());
        if (!enabled) return 'none';
        const eids = [
          variables?.light_group_entity,
          variables?.entity_1, variables?.entity_2, variables?.entity_3, variables?.entity_4,
          variables?.entity_5, variables?.entity_6, variables?.entity_7, variables?.entity_8
        ].filter(Boolean);
        return eids.length > 0 ? 'inline-grid' : 'none';
      })();
      const _hide = String(_d).trim() === 'none';
      return `:host{display:${_hide ? 'none' : 'inline-block'} !important;order:var(--hemma-badge-order-lights,2);}` + `
    /* The overflow clip is removed in styles.img_cell below, not here - see
       the writeup in hemma_badge_light.yaml. */
    #img-cell, .img-cell{ position: relative; }

    #img-cell #icon, .img-cell #icon{
      color: transparent !important;
      opacity: 0 !important;
    }

    #img-cell::before,
    .img-cell::before{
      content: '';
      position: absolute;
      inset: 0px;
      z-index: 5;
      background-color: var(--hemma-icon-color, var(--primary-text-color)) !important;

      -webkit-mask: url('data:image/svg+xml,%3C%3Fxml%20version%3D%221.0%22%20encoding%3D%22UTF-8%22%3F%3E%0A%3C%21--Generator%3A%20Apple%20Native%20CoreSVG%20341--%3E%0A%3C%21DOCTYPE%20svg%0APUBLIC%20%22-%2F%2FW3C%2F%2FDTD%20SVG%201.1%2F%2FEN%22%0A%20%20%20%20%20%20%20%22http%3A%2F%2Fwww.w3.org%2FGraphics%2FSVG%2F1.1%2FDTD%2Fsvg11.dtd%22%3E%0A%3Csvg%20version%3D%221.1%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20xmlns%3Axlink%3D%22http%3A%2F%2Fwww.w3.org%2F1999%2Fxlink%22%20viewBox%3D%22-0.4809%20-0.8399%2016.9931%2029.6759%22%3E%0A%20%3Cg%3E%0A%20%20%3Crect%20height%3D%2229.6759%22%20opacity%3D%220%22%20width%3D%2216.9931%22%20x%3D%22-0.4809%22%20y%3D%22-0.8399%22%2F%3E%0A%20%20%3Cpath%20d%3D%22M4.13672%2023.8711L11.5547%2023.8711C11.9414%2023.8711%2012.2344%2023.5664%2012.2344%2023.1797C12.2344%2022.8047%2011.9414%2022.5%2011.5547%2022.5L4.13672%2022.5C3.75%2022.5%203.44531%2022.8047%203.44531%2023.1797C3.44531%2023.5664%203.75%2023.8711%204.13672%2023.8711ZM7.83984%2027.2695C9.65625%2027.2695%2011.168%2026.3789%2011.2852%2025.0312L4.40625%2025.0312C4.48828%2026.3789%206.01172%2027.2695%207.83984%2027.2695Z%22%20fill%3D%22white%22%20fill-opacity%3D%220.5%22%2F%3E%0A%20%20%3Cpath%20d%3D%22M0%207.21875C0%2011.7188%202.96484%2012.832%203.44531%2020.6484C3.46875%2021.0703%203.72656%2021.3398%204.17188%2021.3398L11.5078%2021.3398C11.9648%2021.3398%2012.2109%2021.0703%2012.2461%2020.6484C12.7266%2012.832%2015.6797%2011.7188%2015.6797%207.21875C15.6797%203.17578%2012.2227%200%207.83984%200C3.45703%200%200%203.17578%200%207.21875Z%22%20fill%3D%22white%22%2F%3E%0A%20%3C%2Fg%3E%0A%3C%2Fsvg%3E%0A') no-repeat center / auto 83%;
      mask: url('data:image/svg+xml,%3C%3Fxml%20version%3D%221.0%22%20encoding%3D%22UTF-8%22%3F%3E%0A%3C%21--Generator%3A%20Apple%20Native%20CoreSVG%20341--%3E%0A%3C%21DOCTYPE%20svg%0APUBLIC%20%22-%2F%2FW3C%2F%2FDTD%20SVG%201.1%2F%2FEN%22%0A%20%20%20%20%20%20%20%22http%3A%2F%2Fwww.w3.org%2FGraphics%2FSVG%2F1.1%2FDTD%2Fsvg11.dtd%22%3E%0A%3Csvg%20version%3D%221.1%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20xmlns%3Axlink%3D%22http%3A%2F%2Fwww.w3.org%2F1999%2Fxlink%22%20viewBox%3D%22-0.4809%20-0.8399%2016.9931%2029.6759%22%3E%0A%20%3Cg%3E%0A%20%20%3Crect%20height%3D%2229.6759%22%20opacity%3D%220%22%20width%3D%2216.9931%22%20x%3D%22-0.4809%22%20y%3D%22-0.8399%22%2F%3E%0A%20%20%3Cpath%20d%3D%22M4.13672%2023.8711L11.5547%2023.8711C11.9414%2023.8711%2012.2344%2023.5664%2012.2344%2023.1797C12.2344%2022.8047%2011.9414%2022.5%2011.5547%2022.5L4.13672%2022.5C3.75%2022.5%203.44531%2022.8047%203.44531%2023.1797C3.44531%2023.5664%203.75%2023.8711%204.13672%2023.8711ZM7.83984%2027.2695C9.65625%2027.2695%2011.168%2026.3789%2011.2852%2025.0312L4.40625%2025.0312C4.48828%2026.3789%206.01172%2027.2695%207.83984%2027.2695Z%22%20fill%3D%22white%22%20fill-opacity%3D%220.5%22%2F%3E%0A%20%20%3Cpath%20d%3D%22M0%207.21875C0%2011.7188%202.96484%2012.832%203.44531%2020.6484C3.46875%2021.0703%203.72656%2021.3398%204.17188%2021.3398L11.5078%2021.3398C11.9648%2021.3398%2012.2109%2021.0703%2012.2461%2020.6484C12.7266%2012.832%2015.6797%2011.7188%2015.6797%207.21875C15.6797%203.17578%2012.2227%200%207.83984%200C3.45703%200%200%203.17578%200%207.21875Z%22%20fill%3D%22white%22%2F%3E%0A%20%3C%2Fg%3E%0A%3C%2Fsvg%3E%0A') no-repeat center / auto 83%;

      /* Load-bearing - see hemma_badge_light.yaml. */
      transform: translateZ(0);
    }
      `;
    ]]]

  styles:
    img_cell:
      - overflow: visible !important


    card:
      - background: >
          [[[
            return entity?.state === 'lights'
              ? 'var(--badge-active-color, rgba(255,255,255,0.85))'
              : 'var(--badge-background, rgba(10,12,14,0.65))';
          ]]]
      - display: >
          [[[
            const v = variables?.enabled;
            const enabled = (v === undefined || v === null) ? true :
              (typeof v === 'boolean') ? v :
              (typeof v === 'number') ? v !== 0 :
              !['false','0','no','off','disabled'].includes(String(v).trim().toLowerCase());
            if (!enabled) return 'none';
            const eids = [
              variables?.light_group_entity,
              variables?.entity_1, variables?.entity_2, variables?.entity_3, variables?.entity_4,
              variables?.entity_5, variables?.entity_6, variables?.entity_7, variables?.entity_8
            ].filter(Boolean);
            return eids.length > 0 ? 'inline-grid' : 'none';
          ]]]
      - --badge-title-color: >
          [[[
            return entity?.state === 'lights' ? 'rgba(0,0,0,0.85)' : 'var(--primary-text-color)';
          ]]]
      - --badge-sub-color: >
          [[[
            return entity?.state === 'lights' ? 'rgba(0,0,0,0.6)' : 'var(--secondary-text-color)';
          ]]]
      - --hemma-badge-light-color: >
          [[[
            return entity?.state === 'lights'
              ? 'var(--hemma-color-yellow-dark, #F4C403)'
              : 'var(--hemma-color-yellow, #FFCC00)';
          ]]]
      - --hemma-icon-color: var(--hemma-badge-light-color)

  name: >
    [[[
      const cfgEids = [
        variables?.entity_1, variables?.entity_2, variables?.entity_3, variables?.entity_4,
        variables?.entity_5, variables?.entity_6, variables?.entity_7, variables?.entity_8
      ].filter(Boolean);
      if (!cfgEids.length && variables?.light_group_entity) cfgEids.push(variables.light_group_entity);

      const memsOf = (eid) => {
        const m = hass.states[eid]?.attributes?.entity_id;
        return Array.isArray(m) ? m.filter(x => typeof x === 'string' && x.startsWith('light.')) : [];
      };
      
      const units = (eid, seen) => {
        if (!eid || seen.has(eid)) return [];
        const mems = memsOf(eid);
        // No members, or no member is itself a group -> one physical light.
        if (!mems.length || !mems.some(m => memsOf(m).length)) return [eid];
        seen.add(eid);
        return mems.flatMap(m => units(m, seen));
      };

      const seen = new Set();
      const eids = [...new Set(cfgEids.flatMap(eid => units(eid, seen)))];

      const onCount = eids.filter(eid => hass.states[eid]?.state === 'on').length;
      const T = window._hemmaT || ((k, en, v) => String(en).replace(/\{(\w+)\}/g,
        (m, p) => (v && Object.prototype.hasOwnProperty.call(v, p) ? String(v[p]) : m)));
      const sub = onCount === 0 ? T('lights.all_off', 'All Off')
                : onCount === eids.length ? T('lights.all_on', 'All On')
                : T('lights.n_on', '{n} On', { n: onCount });

      return `
        <div class="badge-wrap">
          <div class="badge-title">${T('filter.lights', 'Lights')}</div>
          <div class="badge-sub">${sub}</div>
        </div>
      `;
    ]]]
