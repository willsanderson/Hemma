# Camera Group Sub-Badge
# Aggregates every camera into one "Cameras" badge and opens the shared camera
# popup, the way hemma_badge_lock_group aggregates locks.
#
# Variables:
#   enabled  - show/hide (default: true)
#   label    - title override (default: "Cameras")
#   cameras  - list of camera entity_ids (also drives the popup); empty list
#              lets the popup auto-discover every camera in the registry
#
# The sub-line reads like Apple's: "No Alerts" until something actually
# happened, not a count of how many cameras exist.
hemma_badge_camera_group:
  template: [hemma_badge_base, hemma_popup_camera]

  show_state: false
  show_label: false
  show_icon: true
  icon: mdi:cctv

  variables:
    enabled: true
    label: null
    icon_size: null

  styles:
    card:
      - display: >
          [[[
            const v = variables?.enabled;
            const enabled = (v === undefined || v === null) ? true :
              (typeof v === 'boolean') ? v :
              (typeof v === 'number') ? v !== 0 :
              !['false','0','no','off','disabled'].includes(String(v).trim().toLowerCase());
            return enabled ? 'inline-grid' : 'none';
          ]]]
      - --hemma-badge-icon-color: >
          [[[
            const cams = Array.isArray(variables?.cameras) ? variables.cameras.filter(Boolean) : [];
            const dead = cams.filter(id => ['unavailable','unknown',''].includes(String(states[id]?.state ?? '').toLowerCase())).length;
            return dead === 0
              ? 'var(--hemma-badge-security-color, #00c3d0)'
              : 'var(--hemma-badge-alert-color, #FF9230)';
          ]]]
      - --icon-primary-color: var(--hemma-badge-icon-color)
      - --paper-item-icon-color: var(--hemma-badge-icon-color)
      - --state-icon-color: var(--hemma-badge-icon-color)

    icon:
      - color: var(--hemma-badge-icon-color)

  name: >
    [[[
      const esc = (t) => String(t ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      const cams = Array.isArray(variables?.cameras) ? variables.cameras.filter(Boolean) : [];
      const total = cams.length;
      const dead = cams.filter(id => ['unavailable','unknown',''].includes(String(states[id]?.state ?? '').toLowerCase())).length;
      const alert = window.hemmaCameraAlert ? window.hemmaCameraAlert(hass, states, cams, variables?.alert_window_minutes) : '';
      const sub = total === 0 ? ''
                : dead === total ? (total === 1 ? 'Offline' : 'All Offline')
                : dead > 0 ? dead + ' Offline'
                : alert || 'No Alerts';

      return `
        <div class="badge-wrap">
          <div class="badge-title">${esc(variables?.label || 'Cameras')}</div>
          ${sub ? `<div class="badge-sub">${esc(sub)}</div>` : ''}
        </div>
      `;
    ]]]

  extra_styles: >
    [[[
      const v = variables?.enabled;
      const enabled = (v === undefined || v === null) ? true :
        (typeof v === 'boolean') ? v :
        (typeof v === 'number') ? v !== 0 :
        !['false','0','no','off','disabled'].includes(String(v).trim().toLowerCase());
      const URL = window.hemmaIconUrl('doorbell');
      const SIZE = variables?.icon_size || '72%';

      return `:host{display:${enabled ? 'inline-block' : 'none'} !important;}
        #img-cell, .img-cell{ position: relative; }

        #img-cell #icon, .img-cell #icon{
          color: transparent !important;
          opacity: 0 !important;
        }

        #img-cell::before,
        .img-cell::before{
          content: '';
          position: absolute;
          inset: 0;
          background-color: var(--hemma-badge-icon-color, var(--hemma-badge-security-color, #00c3d0)) !important;
          -webkit-mask: url('${URL}') no-repeat center / auto ${SIZE};
          mask: url('${URL}') no-repeat center / auto ${SIZE};
          transform: translateZ(0);
        }`;
    ]]]
