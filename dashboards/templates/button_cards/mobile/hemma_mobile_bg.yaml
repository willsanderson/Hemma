# Mobile Dashboard Background
hemma_mobile_bg:
  template: [hemma_shared]

  show_icon: false
  show_name: false
  show_state: false
  show_label: false
  show_entity_picture: false
  tap_action: {action: none}
  hold_action: {action: none}
  double_tap_action: {action: none}

  variables:
    preload_rooms: []
    # The phone dashboard has ONE hero photo, not one per room - its rooms are
    # sections of a single view. Same naming as a room card: a base name under
    # /hemma_assets/rooms/, with -night alongside it. Left null, the theme's own
    # --hemma-mobile-hero-img-day/-night win, which is how this shipped.
    image: null
    image_night: null
    hemma_style: null
    hemma_hv_color: null
    hemma_hv_rest: null
    hemma_hv_text: null
    hemma_hv_backdrop: null
    hemma_hv_backdrop_phone: null
    hemma_hv_text_phone: null

  custom_fields:
    bg_init: >
      [[[
        const isDark = typeof hass?.themes?.darkMode === 'boolean' ? hass.themes.darkMode : window.matchMedia('(prefers-color-scheme: dark)').matches;
        const bd = variables.hemma_hv_backdrop_phone === 'photo' ? '' : (variables.hemma_hv_backdrop_phone || variables.hemma_hv_backdrop);
        const tx = variables.hemma_hv_text_phone === 'dark' ? '' : (variables.hemma_hv_text_phone || variables.hemma_hv_text);
        if (!window._hemmaHV) window._hemmaHVPending = [variables.hemma_style, isDark, variables.hemma_hv_color, variables.hemma_hv_rest, tx, bd];
        if (variables.hemma_style === 'homeview' && !window._hemmaHV) { document.documentElement.classList.add('hemma-hv'); document.documentElement.classList.toggle('hv-light', !isDark); }
        if (variables.hemma_style === 'homeview' && !window._hemmaHV && !document.getElementById('hemma-hv-cover')) {
          let bg = ''; try { bg = localStorage.getItem('hemma_hv_bg') || ''; } catch (e) {}
          const cov = document.createElement('style');
          cov.id = 'hemma-hv-cover';
          cov.textContent = 'html,body{background:' + (/^[#\w(),.%\s]+$/.test(bg) ? bg : 'var(--primary-background-color)') + ' !important}home-assistant{visibility:hidden !important}';
          document.head.appendChild(cov);
          setTimeout(() => cov.remove(), 6000);
        }
        if (window._hemmaHV) window._hemmaHV.set(variables.hemma_style, isDark, variables.hemma_hv_color, variables.hemma_hv_rest, tx, bd);
        const ID = 'hemma-mobile-hero-src';
        let el = document.getElementById(ID);
        const hvm = variables.hemma_style === 'homeview';
        const base = variables.image;
        if (!base) {
          if (el) el.remove();
          return '';
        }
        const night = variables.image_night || (base + '-night');
        const dir = hvm ? '/hemma_assets/rooms-soft/' : '/hemma_assets/rooms/';
        const v = hvm ? '--hv-m-photo' : '--hemma-mobile-hero-img';
        const q = hvm ? '?v=3' : '';
        const css = ':root{'
          + v + '-day:url("' + dir + base + '.jpg' + q + '") !important;'
          + v + '-night:url("' + dir + night + '.jpg' + q + '") !important;'
          + '}';
        if (!el) {
          el = document.createElement('style');
          el.id = ID;
          document.head.appendChild(el);
        }
        if (el.textContent !== css) el.textContent = css;
        return '';
      ]]]

  styles:
    card:
      - box-shadow: "none !important"
      - border-radius: "0 !important"
      - "--hero-img-scale": "1.0"
      - "--hero-img-scale-mobile": "1.0"
      - "--hero-img-scale-current": "1.0"
      - "--hero-img-blur-current": "0px"
      - "--hemma-safe-top": "env(safe-area-inset-top, 0px)"
      - "--hemma-hero-overscan": "var(--hemma-mobile-hero-overscan, calc(3 * var(--hemma-mobile-hero-blur, 2px)))"
      - background-color: "var(--hemma-mobile-hero-floor, #524f4d) !important"
      - background-image: "none !important"
      - "--hg-m-w0": "[[[ return variables.hemma_style === 'homeview' ? 'transparent' : ((typeof hass?.themes?.darkMode === 'boolean' ? hass.themes.darkMode : window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'rgba(0,0,0,0.34)' : 'rgba(18,16,14,0.22)'); ]]]"
      - "--hg-m-w1": "[[[ return variables.hemma_style === 'homeview' ? 'transparent' : ((typeof hass?.themes?.darkMode === 'boolean' ? hass.themes.darkMode : window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'rgba(0,0,0,0.22)' : 'rgba(18,16,14,0.10)'); ]]]"
      - "--hg-m-w2": "[[[ return variables.hemma_style === 'homeview' ? 'transparent' : ((typeof hass?.themes?.darkMode === 'boolean' ? hass.themes.darkMode : window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'color-mix(in oklab, var(--hemma-mobile-hero-c-mid, #42444a) 48%, transparent)' : 'color-mix(in oklab, var(--hemma-mobile-hero-c-mid, #706a64) 34%, transparent)'); ]]]"
      - "--hg-m-w3": "[[[ return variables.hemma_style === 'homeview' ? 'transparent' : ((typeof hass?.themes?.darkMode === 'boolean' ? hass.themes.darkMode : window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'color-mix(in oklab, var(--hemma-mobile-hero-c-base, #2b2c2e) 74%, transparent)' : 'color-mix(in oklab, var(--hemma-mobile-hero-c-base, #524f4d) 62%, transparent)'); ]]]"
      - "--hg-m-bright": "[[[ return (typeof hass?.themes?.darkMode === 'boolean' ? hass.themes.darkMode : window.matchMedia('(prefers-color-scheme: dark)').matches) ? '0.9' : '0.96'; ]]]"

  extra_styles: |
    /* LAYER 2 - the photo, full screen and blurred */
    :host ha-card::after {
      content: "" !important;
      inset: -40px !important;
      z-index: -10 !important;
      pointer-events: none !important;
      background-color: transparent !important;
      background-image: var(--hemma-mobile-hero-img) !important;
      background-size: cover !important;
      background-position: center center !important;
      background-repeat: no-repeat !important;
      filter: blur(14px) saturate(1.05) brightness(var(--hg-m-bright, 0.96)) !important;
      transform: none !important;
      animation: none !important;
      -webkit-mask-image: none !important;
      mask-image: none !important;
    }

    /* LANDSCAPE */
    @media (orientation: landscape) and (max-height: 500px) {
      :host ha-card {
        --hemma-mobile-hero-fade-start:
          var(--hemma-mobile-hero-fade-start-landscape, 76%);
        --hemma-mobile-hero-p-handoff:
          var(--hemma-mobile-hero-p-handoff-landscape, 96%);
        --hemma-mobile-hero-p-upper:
          var(--hemma-mobile-hero-p-upper-landscape, 97%);
        --hemma-mobile-hero-p-mid:
          var(--hemma-mobile-hero-p-mid-landscape, 98%);
        --hemma-mobile-hero-p-lower:
          var(--hemma-mobile-hero-p-lower-landscape, 99%);
        --hemma-mobile-hero-wash-mid:
          var(--hemma-mobile-hero-wash-mid-landscape, 30%);
        --hemma-mobile-hero-wash-end:
          var(--hemma-mobile-hero-wash-end-landscape, 58%);
        --hemma-mobile-hero-mesh-a:
          var(--hemma-mobile-hero-mesh-a-landscape, transparent);
        --hemma-mobile-hero-mesh-b:
          var(--hemma-mobile-hero-mesh-b-landscape, transparent);
      }
    }

    /* LAYER 3 - the wash that keeps text readable */
    :host ha-card::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -9;
      pointer-events: none;
      /* hemma_shared's grain layer is this same pseudo-element; without these
         resets its overlay blend and 0.16 opacity erase the whole gradient. */
      mix-blend-mode: normal !important;
      opacity: 1 !important;
      border-radius: 0 !important;
      background-image: linear-gradient(to bottom, var(--hg-m-w0, transparent) 0%, var(--hg-m-w1, transparent) 28%, var(--hg-m-w2, transparent) 62%, var(--hg-m-w3, transparent) 100%);
      background-size: 100% 100%;
      background-position: 0 0;
      background-repeat: no-repeat;
    }
