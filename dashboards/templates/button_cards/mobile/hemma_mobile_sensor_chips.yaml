            name: >
              [[[
                const T = window._hemmaT || ((k, en, v) => { let s = String(en); if (v) for (const p in v) s = s.split('{' + p + '}').join(String(v[p])); return s; });
                const f = states['input_select.hemma_mobile_filter']?.state;
                const R = window.hemmaRoomSensors ? window.hemmaRoomSensors(hass, f, variables.room_chips) : { motion: [], occupancy: [variables.room_chips?.[f]?.motion_entity].filter(Boolean) };
                const on = window.hemmaSensorsOn ? window.hemmaSensorsOn(states, R.motion) : (R.motion.some((id) => states[id]?.state === 'on') ? true : R.motion.length ? false : null);
                const L = (k, en) => { const v = hass?.localize?.(k); return (v && v !== k) ? v : en; };
                const seen = on === false && window.hemmaLastSeen ? window.hemmaLastSeen(hass, R.motion, this) : null;
                const sub = on === true ? T('motion.detected', 'Detected')
                  : on === false ? (Number.isFinite(seen) && window.hemmaAgo ? window.hemmaAgo(seen) : T('motion.not_detected', 'Not Detected'))
                  : L('state.default.unavailable', 'Unavailable');
                return `<div class="badge-wrap"><div class="badge-title">${T('motion.title', 'Motion')}</div><div class="badge-sub">${sub}</div></div>`;
              ]]]
