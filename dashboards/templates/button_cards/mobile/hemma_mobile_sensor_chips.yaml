            tap_action:
              haptic: light
              action: more-info
              entity: '[[[ const f = states["input_select.hemma_mobile_filter"]?.state; return variables.room_chips?.[f]?.motion_entity ]]]'
            styles:
              card:
                - display: '[[[ const f = states["input_select.hemma_mobile_filter"]?.state; return variables.room_chips?.[f]?.motion_entity ? "flex" : "none" ]]]'
            name: >
              [[[
                const f = states['input_select.hemma_mobile_filter']?.state;
                const eid = variables.room_chips?.[f]?.motion_entity;
                const st  = eid ? (states[eid]?.state || 'unavailable') : 'unavailable';
                const sub = st === 'on' ? 'Detected' : st === 'off' ? 'Not Detected' : 'Unavailable';
                return `<div class="badge-wrap"><div class="badge-title">Motion</div><div class="badge-sub">${sub}</div></div>`;
              ]]]

