# Mobile Badge Rows (climate + per-room sensor chips)
hemma_mobile_sensor_chips:
  show_icon: false
  show_name: false
  show_state: false
  show_label: false
  show_entity_picture: false
  entity: input_select.hemma_mobile_filter

  tap_action: {action: none}
  hold_action: {action: none}
  double_tap_action: {action: none}

  variables:
    temp_entity: null
    temp_unit: F
    humidity_entity: null
    aqi_room_name: null
    entity_quality: null
    entity_temp: null
    entity_humidity: null
    aqi_sensors: null
    room_chips: null

  # Static (no template) — avoids per-render JS eval and first-paint flash.
  extra_styles: |
    :host(.hemma-navbar-card.hemma-navbar-card):active{filter:none!important;-webkit-filter:none!important}
    :host{position:sticky!important;top:-9999px!important;filter:none!important;-webkit-filter:none!important}
    #aspect-ratio{display:block!important;min-width:0!important;min-height:0!important}
    ha-card.button-card-main{background:transparent!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;box-shadow:none!important;border:none!important;overflow:visible!important;padding:0!important;contain:none!important;isolation:auto!important;will-change:auto!important;transition:none!important}
    .button-card-main,.button-card-content,#customfields{overflow:visible!important;contain:none!important;isolation:auto!important}
    #climate_row > *,#rooms_row > *{width:max-content!important;min-width:100%!important;display:block!important}
    #climate_row::-webkit-scrollbar,#rooms_row::-webkit-scrollbar{display:none!important}

  styles:
    card:
      - background: transparent !important
      - backdrop-filter: none !important
      - -webkit-backdrop-filter: none !important
      - box-shadow: none !important
      - border: none
      - border-radius: 0
      - padding: 0
      - margin: 0
      - height: auto
      - min-height: 0
      - overflow: visible
    grid:
      - display: block
    custom_fields:
      climate_row:
        - display: >
            [[[
              // hemma_expanded_row is desktop/tablet-only; ignoring it here stops
              // desktop badge taps from toggling rows on mobile.
              const filter = states['input_select.hemma_mobile_filter']?.state ?? 'all';
              return filter === 'climate' ? 'block' : 'none';
            ]]]
        - --hemma-badge-icon-scale: 54%
        - --hemma-badge-icon-override: var(--hemma-gauge-size, 34px)
        - --hemma-badge-icon-fg: "#ffffff"
        - --hemma-badge-title-color: "#ffffff"
        - --hemma-badge-sub-color: "#ffffff"
        - --hemma-badge-sub-opacity: 0.9
        - overflow-x: auto
        - overflow-y: hidden
        - overscroll-behavior-x: contain
        - scrollbar-width: none
        - "-ms-overflow-style": none
        - padding-left: "max(var(--hemma-measured-safe-left, 0px), var(--hemma-rail-left, 16px)) !important"
        - padding-right: "var(--hemma-rail-left, 16px) !important"
        - margin: "0 !important"
        - width: "100%"
        - box-sizing: border-box
        - height: auto
      rooms_row:
        - display: >
            [[[
              const f = states['input_select.hemma_mobile_filter']?.state ?? 'all';
              return (variables.room_chips && variables.room_chips[f]) ? 'block' : 'none';
            ]]]
        - --hemma-badge-icon-scale: 54%
        - --hemma-badge-icon-override: var(--hemma-gauge-size, 34px)
        - --hemma-badge-icon-fg: "#ffffff"
        - --hemma-badge-title-color: "#ffffff"
        - --hemma-badge-sub-color: "#ffffff"
        - --hemma-badge-sub-opacity: 0.9
        - overflow-x: auto
        - overflow-y: hidden
        - overscroll-behavior-x: contain
        - scrollbar-width: none
        - "-ms-overflow-style": none
        - padding-left: "max(var(--hemma-measured-safe-left, 0px), var(--hemma-rail-left, 16px)) !important"
        - padding-right: "var(--hemma-rail-left, 16px) !important"
        - margin: "0 0 24px 0 !important"
        - width: "100%"
        - box-sizing: border-box
        - height: auto

  custom_fields:

    climate_row:
      card:
        type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          grid-auto-flow: column
          grid-auto-columns: max-content
          grid-template-columns: none
          justify-content: start
          align-items: center
          grid-column-gap: 16px
          margin: 0
          padding: 0
        card_mod:
          style: |
            ha-card { background: transparent !important; box-shadow: none !important; overflow: visible !important; padding: 0 !important; contain: none !important; isolation: auto !important; will-change: auto !important; width: max-content !important; min-width: 100% !important; }
        cards:
          - type: custom:button-card
            template: hemma_badge_temp
            entity: '[[[ return variables.temp_entity ]]]'
            variables:
              enabled: '[[[ return !!variables.temp_entity ]]]'
              gauge: true
              temp_unit: '[[[ return variables.temp_unit || "F" ]]]'
              room_name: '[[[ return variables.aqi_room_name ]]]'
              entity_quality: '[[[ return variables.entity_quality ]]]'
              entity_temp: '[[[ return variables.entity_temp || variables.temp_entity ]]]'
              entity_humidity: '[[[ return variables.entity_humidity || variables.humidity_entity ]]]'
              sensors: '[[[ return variables.aqi_sensors ]]]'
          - type: custom:button-card
            template: hemma_badge_humidity
            entity: '[[[ return variables.humidity_entity ]]]'
            variables:
              enabled: '[[[ return !!variables.humidity_entity ]]]'
              gauge: true
              room_name: '[[[ return variables.aqi_room_name ]]]'
              entity_quality: '[[[ return variables.entity_quality ]]]'
              entity_temp: '[[[ return variables.entity_temp || variables.temp_entity ]]]'
              entity_humidity: '[[[ return variables.entity_humidity || variables.humidity_entity ]]]'
              sensors: '[[[ return variables.aqi_sensors ]]]'
          - type: custom:button-card
            template: hemma_badge_air_quality
            entity: '[[[ return variables.entity_quality ]]]'
            variables:
              enabled: '[[[ return !!variables.entity_quality ]]]'
              gauge: true
              room_name: '[[[ return variables.aqi_room_name ]]]'
              entity_quality: '[[[ return variables.entity_quality ]]]'
              entity_temp: '[[[ return variables.entity_temp || variables.temp_entity ]]]'
              entity_humidity: '[[[ return variables.entity_humidity || variables.humidity_entity ]]]'
              sensors: '[[[ return variables.aqi_sensors ]]]'

    # Rooms row
    rooms_row:
      card:
        type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          grid-auto-flow: column
          grid-auto-columns: max-content
          grid-template-columns: none
          justify-content: start
          align-items: center
          grid-column-gap: 16px
          margin: 0
          padding: 0
        card_mod:
          style: |
            ha-card { background: transparent !important; box-shadow: none !important; overflow: visible !important; padding: 0 !important; contain: none !important; isolation: auto !important; will-change: auto !important; width: max-content !important; min-width: 100% !important; }
        cards:
          - type: custom:button-card
            template: hemma_badge_temp
            entity: >
              [[[
                const f = states['input_select.hemma_mobile_filter']?.state;
                return variables.room_chips?.[f]?.temp_entity || null;
              ]]]
            variables:
              enabled: '[[[ const f = states["input_select.hemma_mobile_filter"]?.state; return !!variables.room_chips?.[f]?.temp_entity ]]]'
              gauge: true
              temp_unit: '[[[ return variables.temp_unit || "F" ]]]'
              room_name: '[[[ const f = states["input_select.hemma_mobile_filter"]?.state; return variables.room_chips?.[f]?.aqi_room_name ]]]'
              entity_quality: '[[[ const f = states["input_select.hemma_mobile_filter"]?.state; return variables.room_chips?.[f]?.entity_quality ]]]'
              entity_temp: '[[[ const f = states["input_select.hemma_mobile_filter"]?.state; return variables.room_chips?.[f]?.temp_entity ]]]'
              entity_humidity: '[[[ const f = states["input_select.hemma_mobile_filter"]?.state; return variables.room_chips?.[f]?.humidity_entity ]]]'
              sensors: '[[[ const f = states["input_select.hemma_mobile_filter"]?.state; return variables.room_chips?.[f]?.aqi_sensors ]]]'
          - type: custom:button-card
            template: hemma_badge_humidity
            entity: >
              [[[
                const f = states['input_select.hemma_mobile_filter']?.state;
                return variables.room_chips?.[f]?.humidity_entity || null;
              ]]]
            variables:
              enabled: '[[[ const f = states["input_select.hemma_mobile_filter"]?.state; return !!variables.room_chips?.[f]?.humidity_entity ]]]'
              gauge: true
              room_name: '[[[ const f = states["input_select.hemma_mobile_filter"]?.state; return variables.room_chips?.[f]?.aqi_room_name ]]]'
              entity_quality: '[[[ const f = states["input_select.hemma_mobile_filter"]?.state; return variables.room_chips?.[f]?.entity_quality ]]]'
              entity_temp: '[[[ const f = states["input_select.hemma_mobile_filter"]?.state; return variables.room_chips?.[f]?.temp_entity ]]]'
              entity_humidity: '[[[ const f = states["input_select.hemma_mobile_filter"]?.state; return variables.room_chips?.[f]?.humidity_entity ]]]'
              sensors: '[[[ const f = states["input_select.hemma_mobile_filter"]?.state; return variables.room_chips?.[f]?.aqi_sensors ]]]'
          - type: custom:button-card
            template: hemma_badge_air_quality
            entity: >
              [[[
                const f = states['input_select.hemma_mobile_filter']?.state;
                return variables.room_chips?.[f]?.entity_quality || null;
              ]]]
            variables:
              enabled: '[[[ const f = states["input_select.hemma_mobile_filter"]?.state; return !!variables.room_chips?.[f]?.entity_quality ]]]'
              gauge: true
              room_name: '[[[ const f = states["input_select.hemma_mobile_filter"]?.state; return variables.room_chips?.[f]?.aqi_room_name ]]]'
              entity_quality: '[[[ const f = states["input_select.hemma_mobile_filter"]?.state; return variables.room_chips?.[f]?.entity_quality ]]]'
              entity_temp: '[[[ const f = states["input_select.hemma_mobile_filter"]?.state; return variables.room_chips?.[f]?.temp_entity ]]]'
              entity_humidity: '[[[ const f = states["input_select.hemma_mobile_filter"]?.state; return variables.room_chips?.[f]?.humidity_entity ]]]'
              sensors: '[[[ const f = states["input_select.hemma_mobile_filter"]?.state; return variables.room_chips?.[f]?.aqi_sensors ]]]'
          - type: custom:button-card
            template: hemma_badge_light
            entity: >
              [[[
                const f = states['input_select.hemma_mobile_filter']?.state;
                return variables.room_chips?.[f]?.lights_entity || null;
              ]]]
            styles:
              card:
                - display: '[[[ const f = states["input_select.hemma_mobile_filter"]?.state; return variables.room_chips?.[f]?.lights_entity ? "flex" : "none" ]]]'
            name: >
              [[[
                const f = states['input_select.hemma_mobile_filter']?.state;
                const eid  = variables.room_chips?.[f]?.lights_entity;
                const mems = eid ? states[eid]?.attributes?.entity_id : null;
                const eids = (Array.isArray(mems) && mems.length) ? mems : (eid ? [eid] : []);
                const onCount = eids.filter(e => states[e]?.state === 'on').length;
                const sub = eids.length === 0 ? 'Off'
                          : onCount === 0 ? 'All Off'
                          : onCount === eids.length ? 'All On'
                          : `${onCount} On`;
                return `<div class="badge-wrap"><div class="badge-title">Lights</div><div class="badge-sub">${sub}</div></div>`;
              ]]]
          - type: custom:button-card
            template: hemma_badge_base
            entity: >
              [[[
                const f = states['input_select.hemma_mobile_filter']?.state;
                return variables.room_chips?.[f]?.motion_entity || null;
              ]]]
            show_icon: true
            show_name: true
            icon: mdi:motion-sensor
            extra_styles: |
              #img-cell, .img-cell{ position: relative; }

              #img-cell #icon, .img-cell #icon{
                color: transparent !important;
                opacity: 0 !important;
              }

              #img-cell::before,
              .img-cell::before{
                content: '';
                position: absolute;
                inset: 0;
                background-color: var(--hemma-badge-icon-fg, var(--primary-text-color)) !important;

