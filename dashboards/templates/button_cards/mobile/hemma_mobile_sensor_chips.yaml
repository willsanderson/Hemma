# Mobile Badge Rows (climate + per-room sensor chips)
hemma_mobile_sensor_chips:
  show_icon: false
  show_name: false
  show_state: false
  show_label: false
  show_entity_picture: false
  entity: input_select.hemma_mobile_filter

  tap_action: {action: none}
  hold_action: {action: none}
  double_tap_action: {action: none}

  variables:
    temp_entity: null
    temp_unit: F
    humidity_entity: null
    aqi_room_name: null
    entity_quality: null
    entity_temp: null
    entity_humidity: null
    aqi_sensors: null
    room_chips: null

  # Static (no template) - avoids per-render JS eval and first-paint flash.
  extra_styles: |
    :host(.hemma-navbar-card.hemma-navbar-card):active{filter:none!important;-webkit-filter:none!important}
    :host{position:sticky!important;top:-9999px!important;filter:none!important;-webkit-filter:none!important}
    #aspect-ratio{display:block!important;min-width:0!important;min-height:0!important}
    ha-card.button-card-main{background:transparent!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;box-shadow:none!important;border:none!important;overflow:visible!important;padding:0!important;contain:none!important;isolation:auto!important;will-change:auto!important;transition:none!important}
    .button-card-main,.button-card-content,#customfields{overflow:visible!important;contain:none!important;isolation:auto!important}
    #climate_row > *,#rooms_row > *{width:max-content!important;min-width:100%!important;display:block!important}
    #climate_row::-webkit-scrollbar,#rooms_row::-webkit-scrollbar{display:none!important}

  styles:
    card:
      - background: transparent !important
      - backdrop-filter: none !important
      - -webkit-backdrop-filter: none !important
      - box-shadow: none !important
      - border: none
      - border-radius: 0
      - padding: 0
      - margin: 0
      - height: auto
      - min-height: 0
      - overflow: visible
    grid:
      - display: block
    custom_fields:
      climate_row:
        - display: >
            [[[
              const filter = states['input_select.hemma_mobile_filter']?.state ?? 'all';
              return filter === 'climate' ? 'block' : 'none';
            ]]]
        - --badge-background: transparent
        - --badge-blur: 0px
        - --hemma-badge-icon-scale: 54%
        - --hemma-badge-icon-override: var(--hemma-gauge-size, 34px)
        - --hemma-badge-icon-fg: "#ffffff"
        - --hemma-badge-title-color: "#ffffff"
        - --hemma-badge-sub-color: "#ffffff"
        - --hemma-badge-sub-opacity: 0.9
        - overflow-x: auto
        - overflow-y: hidden
        - overscroll-behavior-x: contain
        - scrollbar-width: none
        - "-ms-overflow-style": none
        - padding-left: "max(var(--hemma-measured-safe-left, 0px), var(--hemma-rail-left, 16px)) !important"
        - padding-right: "var(--hemma-rail-left, 16px) !important"
        - margin: "0 !important"
        - width: "100%"
        - box-sizing: border-box
        - height: auto
      rooms_row:
        - display: >
            [[[
              const f = states['input_select.hemma_mobile_filter']?.state ?? 'all';
              return (variables.room_chips && variables.room_chips[f]) ? 'block' : 'none';
            ]]]
        # Every chip bare, like the gauges: Lights and Motion are plain badges and would keep their pill.
        - --badge-background: transparent
        - --badge-blur: 0px
        - --ha-ripple-hover-opacity: 0
        - --ha-ripple-pressed-opacity: 0
        - --hemma-badge-icon-scale: 54%
        - --hemma-badge-icon-override: var(--hemma-gauge-size, 34px)
        - --hemma-badge-icon-fg: "#ffffff"
        - --hemma-badge-title-color: "#ffffff"
        - --hemma-badge-sub-color: "#ffffff"
        - --hemma-badge-sub-opacity: 0.9
        - overflow-x: auto
        - overflow-y: hidden
        - overscroll-behavior-x: contain
        - scrollbar-width: none
        - "-ms-overflow-style": none
        - padding-left: "max(var(--hemma-measured-safe-left, 0px), var(--hemma-rail-left, 16px)) !important"
        - padding-right: "var(--hemma-rail-left, 16px) !important"
        - margin: "0 !important"
        - width: "100%"
        - box-sizing: border-box
        - height: auto
        # The climate badges read order from this (default 1); lights and motion set none.
        - --hemma-badge-order-climate: "0"

  custom_fields:

    climate_row:
      card:
        type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          grid-auto-flow: column
          grid-auto-columns: max-content
          grid-template-columns: none
          justify-content: start
          align-items: center
          grid-column-gap: 16px
          margin: 0
          padding: 0
        card_mod:
          style: |
            ha-card { background: transparent !important; box-shadow: none !important; overflow: visible !important; padding: 0 !important; contain: none !important; isolation: auto !important; will-change: auto !important; width: max-content !important; min-width: 100% !important; }
        cards:
          - type: custom:button-card
            template: hemma_badge_temp
            entity: '[[[ return variables.temp_entity ]]]'
            variables:
              enabled: '[[[ return !!variables.temp_entity ]]]'
              gauge: true
              temp_unit: '[[[ return variables.temp_unit || "F" ]]]'
              room_name: '[[[ return variables.aqi_room_name || hass?.config?.location_name || "" ]]]'
              entity_quality: '[[[ return variables.entity_quality ]]]'
              entity_temp: '[[[ return variables.entity_temp || variables.temp_entity ]]]'
              entity_humidity: '[[[ return variables.entity_humidity || variables.humidity_entity ]]]'
              sensors: '[[[ return variables.aqi_sensors ]]]'
          - type: custom:button-card
            template: hemma_badge_humidity
            entity: '[[[ return variables.humidity_entity ]]]'
            variables:
              enabled: '[[[ return !!variables.humidity_entity ]]]'
              gauge: true
              room_name: '[[[ return variables.aqi_room_name || hass?.config?.location_name || "" ]]]'
              entity_quality: '[[[ return variables.entity_quality ]]]'
              entity_temp: '[[[ return variables.entity_temp || variables.temp_entity ]]]'
              entity_humidity: '[[[ return variables.entity_humidity || variables.humidity_entity ]]]'
              sensors: '[[[ return variables.aqi_sensors ]]]'
          - type: custom:button-card
            template: hemma_badge_air_quality
            entity: '[[[ return variables.entity_quality ]]]'
            variables:
              enabled: '[[[ return !!variables.entity_quality ]]]'
              gauge: true
              room_name: '[[[ return variables.aqi_room_name || hass?.config?.location_name || "" ]]]'
              entity_quality: '[[[ return variables.entity_quality ]]]'
              entity_temp: '[[[ return variables.entity_temp || variables.temp_entity ]]]'
              entity_humidity: '[[[ return variables.entity_humidity || variables.humidity_entity ]]]'
              sensors: '[[[ return variables.aqi_sensors ]]]'

    # Rooms row
    rooms_row:
      card:
        type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          grid-auto-flow: column
          grid-auto-columns: max-content
          grid-template-columns: none
          justify-content: start
          align-items: center
          grid-column-gap: 16px
          margin: 0
          padding: 0
        card_mod:
          style: |
            ha-card { background: transparent !important; box-shadow: none !important; overflow: visible !important; padding: 0 !important; contain: none !important; isolation: auto !important; will-change: auto !important; width: max-content !important; min-width: 100% !important; }
        cards:
          - type: custom:button-card
            template: hemma_badge_temp
            entity: >
              [[[
                const f = states['input_select.hemma_mobile_filter']?.state;
                return variables.room_chips?.[f]?.temp_entity || null;
              ]]]
            variables:
              enabled: '[[[ const f = states["input_select.hemma_mobile_filter"]?.state; return !!variables.room_chips?.[f]?.temp_entity ]]]'
              gauge: true
              temp_unit: '[[[ return variables.temp_unit || "F" ]]]'
              room_name: '[[[ const f = states["input_select.hemma_mobile_filter"]?.state; return variables.room_chips?.[f]?.aqi_room_name || variables.aqi_room_name || hass?.config?.location_name || "" ]]]'
              entity_quality: '[[[ const f = states["input_select.hemma_mobile_filter"]?.state; return variables.room_chips?.[f]?.entity_quality ]]]'
              entity_temp: '[[[ const f = states["input_select.hemma_mobile_filter"]?.state; return variables.room_chips?.[f]?.temp_entity ]]]'
              entity_humidity: '[[[ const f = states["input_select.hemma_mobile_filter"]?.state; return variables.room_chips?.[f]?.humidity_entity ]]]'
              sensors: '[[[ const f = states["input_select.hemma_mobile_filter"]?.state; return variables.room_chips?.[f]?.aqi_sensors ]]]'
          - type: custom:button-card
            template: hemma_badge_humidity
            entity: >
              [[[
                const f = states['input_select.hemma_mobile_filter']?.state;
                return variables.room_chips?.[f]?.humidity_entity || null;
              ]]]
            variables:
              enabled: '[[[ const f = states["input_select.hemma_mobile_filter"]?.state; return !!variables.room_chips?.[f]?.humidity_entity ]]]'
              gauge: true
              room_name: '[[[ const f = states["input_select.hemma_mobile_filter"]?.state; return variables.room_chips?.[f]?.aqi_room_name || variables.aqi_room_name || hass?.config?.location_name || "" ]]]'
              entity_quality: '[[[ const f = states["input_select.hemma_mobile_filter"]?.state; return variables.room_chips?.[f]?.entity_quality ]]]'
              entity_temp: '[[[ const f = states["input_select.hemma_mobile_filter"]?.state; return variables.room_chips?.[f]?.temp_entity ]]]'
              entity_humidity: '[[[ const f = states["input_select.hemma_mobile_filter"]?.state; return variables.room_chips?.[f]?.humidity_entity ]]]'
              sensors: '[[[ const f = states["input_select.hemma_mobile_filter"]?.state; return variables.room_chips?.[f]?.aqi_sensors ]]]'
          - type: custom:button-card
            template: hemma_badge_air_quality
            entity: >
              [[[
                const f = states['input_select.hemma_mobile_filter']?.state;
                return variables.room_chips?.[f]?.entity_quality || null;
              ]]]
            variables:
              enabled: '[[[ const f = states["input_select.hemma_mobile_filter"]?.state; return !!variables.room_chips?.[f]?.entity_quality ]]]'
              gauge: true
              room_name: '[[[ const f = states["input_select.hemma_mobile_filter"]?.state; return variables.room_chips?.[f]?.aqi_room_name || variables.aqi_room_name || hass?.config?.location_name || "" ]]]'
              entity_quality: '[[[ const f = states["input_select.hemma_mobile_filter"]?.state; return variables.room_chips?.[f]?.entity_quality ]]]'
              entity_temp: '[[[ const f = states["input_select.hemma_mobile_filter"]?.state; return variables.room_chips?.[f]?.temp_entity ]]]'
              entity_humidity: '[[[ const f = states["input_select.hemma_mobile_filter"]?.state; return variables.room_chips?.[f]?.humidity_entity ]]]'
              sensors: '[[[ const f = states["input_select.hemma_mobile_filter"]?.state; return variables.room_chips?.[f]?.aqi_sensors ]]]'
          - type: custom:button-card
            template: hemma_badge_light
            variables:
              bare: true
              hide_host: '[[[ const f = states["input_select.hemma_mobile_filter"]?.state; return !variables.room_chips?.[f]?.lights_entity; ]]]'
            entity: >
              [[[
                const f = states['input_select.hemma_mobile_filter']?.state;
                return variables.room_chips?.[f]?.lights_entity || null;
              ]]]
            styles:
              card:
                - display: '[[[ const f = states["input_select.hemma_mobile_filter"]?.state; return variables.room_chips?.[f]?.lights_entity ? "flex" : "none" ]]]'
            name: >
              [[[
                const f = states['input_select.hemma_mobile_filter']?.state;
                const eid  = variables.room_chips?.[f]?.lights_entity;
                const mems = eid ? states[eid]?.attributes?.entity_id : null;
                const eids = (Array.isArray(mems) && mems.length) ? mems : (eid ? [eid] : []);
                const onCount = eids.filter(e => states[e]?.state === 'on').length;
                const T = window._hemmaT || ((k, en, v) => String(en).replace(/\{(\w+)\}/g,
                  (m, p) => (v && Object.prototype.hasOwnProperty.call(v, p) ? String(v[p]) : m)));
                const sub = eids.length === 0 ? T('lights.off', 'Off')
                          : onCount === 0 ? T('lights.all_off', 'All Off')
                          : onCount === eids.length ? T('lights.all_on', 'All On')
                          : T('lights.n_on', '{n} On', { n: onCount });
                return `<div class="badge-wrap"><div class="badge-title">${T('filter.lights', 'Lights')}</div><div class="badge-sub">${sub}</div></div>`;
              ]]]
          - type: custom:button-card
            template: hemma_badge_base
            entity: >
              [[[
                const f = states['input_select.hemma_mobile_filter']?.state;
                const R = window.hemmaRoomSensors ? window.hemmaRoomSensors(hass, f, variables.room_chips) : { motion: [], occupancy: [variables.room_chips?.[f]?.motion_entity].filter(Boolean) };
                return R.motion[0] || null;
              ]]]
            show_icon: true
            show_name: true
            icon: mdi:motion-sensor
            extra_styles: |
              [[[
                const f = states['input_select.hemma_mobile_filter']?.state;
                const R = window.hemmaRoomSensors ? window.hemmaRoomSensors(hass, f, variables.room_chips) : { motion: [], occupancy: [variables.room_chips?.[f]?.motion_entity].filter(Boolean) };
                // Hidden as a whole host, as the gauge chips are: a hidden card alone leaves its grid column and gaps.
                return (R.motion.length ? '' : ':host{display:none !important}') + `
              #img-cell, .img-cell{ position: relative; }
              #img-cell #icon, .img-cell #icon{ color: transparent !important; opacity: 0 !important; }
              #img-cell::before, .img-cell::before{
                content: '';
                position: absolute;
                inset: 0;
                background-color: var(--hemma-badge-icon-fg, var(--primary-text-color)) !important;
                -webkit-mask: url('data:image/svg+xml,%3C%3Fxml%20version%3D%221.0%22%20encoding%3D%22UTF-8%22%3F%3E%0A%3C%21--Generator%3A%20Apple%20Native%20CoreSVG%20362--%3E%0A%3C%21DOCTYPE%20svg%0APUBLIC%20%22-%2F%2FW3C%2F%2FDTD%20SVG%201.1%2F%2FEN%22%0A%20%20%20%20%20%20%20%22http%3A%2F%2Fwww.w3.org%2FGraphics%2FSVG%2F1.1%2FDTD%2Fsvg11.dtd%22%3E%0A%3Csvg%20version%3D%221.1%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20xmlns%3Axlink%3D%22http%3A%2F%2Fwww.w3.org%2F1999%2Fxlink%22%20viewBox%3D%220%200%2026.847%2025.0909%22%3E%0A%20%3Cg%3E%0A%20%20%3Crect%20height%3D%2225.0909%22%20opacity%3D%220%22%20width%3D%2226.847%22%20x%3D%220%22%20y%3D%220%22%2F%3E%0A%20%20%3Cpath%20d%3D%22M9.04362%2021.5943C9.04362%2021.9823%208.72617%2022.2894%208.34852%2022.2894C7.96052%2022.2894%207.65342%2021.9823%207.65342%2021.5943C7.65342%2021.2166%207.96052%2020.9013%208.34852%2020.9013C8.72617%2020.9013%209.04362%2021.2166%209.04362%2021.5943ZM8.03238%2019.7854C8.03238%2020.1733%207.71492%2020.4805%207.33727%2020.4805C6.94928%2020.4805%206.64428%2020.1733%206.64428%2019.7854C6.64428%2019.4077%206.94928%2019.0902%207.33727%2019.0902C7.71492%2019.0902%208.03238%2019.4077%208.03238%2019.7854ZM7.01078%2017.9661C7.01078%2018.3541%206.70368%2018.6612%206.31568%2018.6612C5.94014%2018.6612%205.62269%2018.3541%205.62269%2017.9661C5.62269%2017.5884%205.94014%2017.271%206.31568%2017.271C6.70368%2017.271%207.01078%2017.5884%207.01078%2017.9661ZM5.99129%2016.1675C5.99129%2016.5451%205.67384%2016.8626%205.29619%2016.8626C4.9103%2016.8626%204.6032%2016.5451%204.6032%2016.1675C4.6032%2015.7898%204.9103%2015.4724%205.29619%2015.4724C5.67384%2015.4724%205.99129%2015.7898%205.99129%2016.1675ZM4.98005%2014.3482C4.98005%2014.7258%204.66259%2015.0433%204.28706%2015.0433C3.89906%2015.0433%203.59195%2014.7258%203.59195%2014.3482C3.59195%2013.9705%203.89906%2013.6531%204.28706%2013.6531C4.66259%2013.6531%204.98005%2013.9705%204.98005%2014.3482ZM3.95845%2012.5392C3.95845%2012.9169%203.65135%201