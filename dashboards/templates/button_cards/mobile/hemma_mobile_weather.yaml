# Mobile Dashboard Header
hemma_mobile_weather:
  show_icon: false
  show_name: true
  show_state: false
  show_label: false
  show_entity_picture: false
  full_width: true
  triggers_update: all
  tap_action: {action: none}

  hold_action: {action: none}
  double_tap_action: {action: none}

  variables:
    weather_entity: null
    weather_temp_sensor: null
    show_notifications: true
    # Written by Hemma when it saves this layout, exactly as the wide one
    # gates its settings dots. A YAML phone dashboard never gets one.
    hemma_ui_managed: false

    # Declared so Hemma's Notifications section reaches this layout too: the
    # panel writes a dashboard-scoped key to every mobile template that
    # DECLARES it, so a key missing here silently keeps its default on the
    # phone while the wide layout obeys the switch.
    notify_safety: true
    notify_air: true
    notify_locks: true
    notify_alarm: true
    notify_doorbell: true
    notify_doors: true
    notify_people: true
    notify_vacuum: true
    notify_appliances: true
    notify_plants: true
    notify_battery: true
    notify_updates: true
    notify_restart: true
    notification_appliances: null
    notification_appliance_timers: null
    notification_co2_ppm: null
    notification_open_minutes: null
    notification_battery_threshold: null
    # A glitched reading (100 -> 3 -> 100) must not raise a notice: a battery
    # counts as low only once it has read low for this long.
    notification_battery_hold_minutes: null
    # A helper (input_datetime, input_text or input_number) holding when
    # notifications were last marked read. Set it and every surface shares
    # one read state; leave it null and each browser keeps its own.
    notification_read_entity: null

    # One composer for both layouts - see hemma-core. force_eval so a change
    # in Hemma lands on the next render instead of waiting for a reload.
    hemma_notify_config:
      force_eval: true
      value: |
        [[[
          // Stash regardless: on a cold load this runs before hemma-core.js,
          // and the module picks the stash up when it initializes. Without it
          // a layout that renders once - the phone - never applied its
          // switches at all.
          window._hemmaNotifyCfg = variables;
          if (window._hemmaNotify) window._hemmaNotify.configureFrom(variables);
          return true;
        ]]]

  name: >
    [[[
      const T = window._hemmaT || ((k, en, v) => String(en).replace(/\{(\w+)\}/g,
        (m, p) => (v && Object.prototype.hasOwnProperty.call(v, p) ? String(v[p]) : m)));
      const f = states['input_select.hemma_mobile_filter']?.state ?? 'all';
      const labels = {
        all: T('filter.all', 'Home'),
        climate: T('filter.climate', 'Climate'),
        lights: T('filter.lights', 'Lights'),
        presence: T('filter.presence', 'People'),
        media: T('filter.media', 'Media'),
        security: T('filter.security', 'Security'),
        energy: T('filter.energy', 'Energy')
      };
      return labels[f] || labels.all;
    ]]]

  extra_styles: |
    @keyframes titleFadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    #name { animation: titleFadeIn 0.3s ease-out both; }
    #hvdate { animation: titleFadeIn 0.3s ease-out backwards; }
    ha-card.button-card-main {
      align-items: stretch !important;
      justify-content: flex-start !important;
      text-align: left !important;
    }
    #container, .button-card-content { width: 100% !important; }
    #name { justify-self: start !important; }


  custom_fields:
    notifications:
      card:
        type: custom:button-card
        template: hemma_mobile_chrome
        variables:
          show_notifications: '[[[ return variables.show_notifications !== false ]]]'
          show_edit: '[[[ return !!variables.hemma_ui_managed ]]]'
          show_assist: '[[[ return variables.show_assist !== false ]]]'

    hvdate: |
      [[[
        if (!document.documentElement.classList.contains('hemma-hv') || !window.hemmaDate) return '';
        const esc = (t) => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;');
        const x = window.hemmaWxLine && window.hemmaWxLine(hass, variables.weather_entity || (window.hemmaWx && window.hemmaWx(variables, 'entity')), variables.weather_temp_sensor);
        const ic = x && x.file ? `<img alt="" src="/hemma_assets/weather/${x.file}-fill.svg?v=2" onload="window.hemmaWxFit&&window.hemmaWxFit(this,this.nextElementSibling)" style="width:26px;height:22px;flex:none;object-fit:contain;opacity:.6;filter:var(--hv-wx-filter, brightness(0) invert(1))">` : '';
        const wid = String(variables.weather_entity || (window.hemmaWx && window.hemmaWx(variables, 'entity')) || '').replace(/[^\w.]/g, '');
        const go = `event.stopPropagation();if(Date.now()-(this._wxAt||0)>700){this._wxAt=Date.now();this.dispatchEvent(new CustomEvent('hass-more-info',{detail:{entityId:'${wid}'},bubbles:true,composed:true}))}`;
        const tap = wid ? ` role="button" ontouchend="event.preventDefault();${go}" onclick="${go}"` : '';
        const wx = x ? `<span class="hvw"${tap} style="display:inline-flex;align-items:center;gap:7px;height:40px;cursor:pointer;-webkit-tap-highlight-color:transparent">${ic}<b style="font-weight:600;color:var(--hv-ink, #fff)">${x.t}°</b></span>` : '';
        return wx;
      ]]]
    hvwx: "[[[ return ''; ]]]"

    weather:
      card:
        type: custom:button-card
        template: hemma_weather
        entity: '[[[ return variables.weather_entity ]]]'
        variables:
          weather_temp_sensor: '[[[ return variables.weather_temp_sensor ]]]'
          hero_mode: false

  styles:
    card:
      - background: transparent
      - backdrop-filter: "none !important"
      - -webkit-backdrop-filter: "none !important"
      - box-shadow: none
      - border: none
      - border-radius: 0
      - padding: "calc(52px + var(--hemma-mobile-chrome-drop, 4px)) var(--hemma-rail-left, 16px) 12px max(var(--hemma-measured-safe-left, 0px), var(--hemma-rail-left, 16px))"
      - margin: 0
      - "--button-card-ripple-color": transparent
      - "-webkit-tap-highlight-color": transparent
      - overflow: visible
      - position: relative
    grid:
      - display: block
      - text-align: left
      - justify-items: start
    name:
      - font-size: |
          [[[
            if (!document.documentElement.classList.contains("hemma-hv")) return "var(--hero-room-name-size-current, clamp(38px, 4vw + 2px, 64px))";
            const f = states['input_select.hemma_mobile_filter']?.state ?? 'all';
            const t = f === 'all' && window.hemmaGreeting ? String(window.hemmaGreeting(hass, states, variables)).replace(/&amp;/g, '&').replace(/&lt;/g, '<') : '';
            if (!t) return "34px";
            // Longer names step down to fit one line rather than wrapping under the weather.
            const c = (window._hemmaGreetCtx = window._hemmaGreetCtx || document.createElement('canvas').getContext('2d'));
            c.font = '700 34px ' + (getComputedStyle(document.body).fontFamily || '-apple-system, system-ui');
            const w = c.measureText(t).width * 1.02, room = Math.max(200, window.innerWidth - 32);
            return Math.max(24, Math.min(34, Math.floor(34 * room / w))) + "px";
          ]]]
      - font-weight: "700"
      - color: '[[[ return document.documentElement.classList.contains("hemma-hv") ? "var(--hv-ink, #fff)" : "#ffffff"; ]]]'
      - opacity: '[[[ return document.documentElement.classList.contains("hemma-hv") ? "1" : "0.9"; ]]]'
      - letter-spacing: '[[[ return document.documentElement.classList.contains("hemma-hv") ? "-0.5px" : "-2px"; ]]]'
      - line-height: '[[[ return document.documentElement.classList.contains("hemma-hv") ? "40px" : "1.2"; ]]]'
      - text-align: left
      - overflow: '[[[ return document.documentElement.classList.contains("hemma-hv") ? "hidden" : "visible"; ]]]'
      - text-overflow: ellipsis
      - padding: 0
      - margin: 0
      - max-width: calc(100% - 145px)
      - white-space: '[[[ return document.documentElement.classList.contains("hemma-hv") ? "nowrap" : "normal"; ]]]'
    custom_fields:
      notifications:
        - display: >
            [[[
              const bell = variables.show_notifications !== false;
              return (bell || variables.hemma_ui_managed) ? 'block' : 'none';
            ]]]
        - position: absolute
        - top: var(--hemma-mobile-chrome-top, 0px)
        - right: "var(--hemma-rail-left, 16px)"
        # The capsule sizes to what it holds, so no width is set here.
        - z-index: 2
        - overflow: visible
        - pointer-events: auto

      hvdate:
        - display: none
        - position: absolute
        - top: "calc(var(--hemma-mobile-chrome-top, 0px) + 4px)"
        - left: "max(var(--hemma-measured-safe-left, 0px), var(--hemma-rail-left, 16px))"
        - height: 40px
        - line-height: 40px
        - font-size: 22px
        - font-weight: 600
        - white-space: nowrap
        - color: var(--hv-ink, #fff)
      hvwx:
        - display: '[[[ return document.documentElement.classList.contains("hemma-hv") ? "block" : "none"; ]]]'
        - position: absolute
        - top: "calc(52px + var(--hemma-mobile-chrome-drop, 4px) + 52px)"
        - left: "max(var(--hemma-measured-safe-left, 0px), var(--hemma-rail-left, 16px))"
        - right: "var(--hemma-rail-left, 16px)"
        - color: var(--hv-ink, #fff)
      weather:
        - display: >
            [[[
              const f = states['input_select.hemma_mobile_filter']?.state ?? 'all';
              return f === 'all' ? 'block' : 'none';
            ]]]
        - position: absolute
        - top: '[[[ return document.documentElement.classList.contains("hemma-hv") ? "calc(52px + var(--hemma-mobile-chrome-drop, 4px) + 20px)" : "calc(52px + var(--hemma-mobile-chrome-drop, 4px) + var(--hero-room-name-size-current, 38px) * 0.6)"; ]]]'
        - transform: translateY(-50%)
        - right: "var(--hemma-rail-left, 16px)"
        - z-index: 1
        - color: var(--hv-ink, #ffffff)
