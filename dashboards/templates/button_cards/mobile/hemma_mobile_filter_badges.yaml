hemma_mobile_filter_badges:
  show_icon: false
  show_name: false
  show_state: false
  show_label: false
  show_entity_picture: false
  tap_action: {action: none}
  hold_action: {action: none}
  double_tap_action: {action: none}

  variables:
    # The panel's own badge switches. Declared here so mobileTargetsFor finds
    # them and the pair sync writes them across - without the declaration the
    # keys never reach this card and every filter pill stays on regardless.
    # A pill turned off is one filter fewer, not content made unreachable: the
    # tiles it filtered to are all still on the Home screen.
    # Declared so the pair sync carries it across: badge order is one setting
    # for both surfaces, like every other shared key.
    badge_order: null
    show_climate: true
    show_lights: true
    show_people: true
    show_media: true
    show_security: true
    show_energy: true
    temp_sensor_1: null
    temp_sensor_2: null
    temp_sensor_3: null
    temp_sensor_4: null
    temp_sensor_5: null
    humidity_sensor: null
    quality_sensor: null
    climate_entity_1: null
    climate_entity_2: null
    light_group_entity: null
    light_entity_1: null
    light_entity_2: null
    light_entity_3: null
    presence_entity_1: null
    presence_entity_2: null
    media_player_1: null
    media_player_2: null
    media_player_3: null
    media_player_4: null
    media_player_5: null
    plex_stream_1: null
    psn_1: null
    psn_2: null
    plex_stream_2: null
    discord_online: null
    discord_game: null
    steam_online: null
    steam_game: null
    duplicate_game: discord
    security_lock_entity: null
    security_lock_entity_2: null
    energy_power_entity: null

    # Superseded names, still read. Every one of these must stay null: a
    # non-null default here would win the fallback and pin the badge to it.
    temp_sensor: null
    climate_entity: null
    media_entity_1: null
    media_entity_2: null
    media_entity_3: null
    media_entity_4: null
    media_entity_5: null
    psn_entity_1: null
    psn_entity_2: null
    discord_online_entity: null
    discord_game_entity: null
    steam_online_entity: null
    steam_game_entity: null
    lock_entity: null
    lock_entity_2: null
    power_entity: null

  extra_styles: |
    :host {
      position: sticky !important;
      top: -200px !important;
      z-index: 100 !important;
      display: block !important;
    }
    :host(.hemma-navbar-card.hemma-navbar-card):active {
      filter: none !important;
      -webkit-filter: none !important;
    }
    :host { filter: none !important; -webkit-filter: none !important; }
    ha-card.button-card-main {
      background: transparent !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      box-shadow: none !important;
      border: none !important;
      overflow: visible !important;
      padding: 0 !important;
      contain: none !important;
      isolation: auto !important;
      will-change: auto !important;
      transition: none !important;
      filter: none !important;
      -webkit-filter: none !important;
    }
    .button-card-main, .button-card-content, #customfields {
      overflow: visible !important;
      contain: none !important;
      isolation: auto !important;
    }

  styles:
    card:
      - "--hemma-badge-order-climate": >
          [[[
            if (window.hemmaBadges) return window.hemmaBadges.order('climate', variables);
            const o = variables.badge_order;
            if (!Array.isArray(o)) return 1;
            const i = o.indexOf('climate');
            return i < 0 ? o.length + 1 : i + 1;
          ]]]
      - "--hemma-badge-order-lights": >
          [[[
            if (window.hemmaBadges) return window.hemmaBadges.order('lights', variables);
            const o = variables.badge_order;
            if (!Array.isArray(o)) return 2;
            const i = o.indexOf('lights');
            return i < 0 ? o.length + 2 : i + 1;
          ]]]
      - "--hemma-badge-order-people": >
          [[[
            if (window.hemmaBadges) return window.hemmaBadges.order('people', variables);
            const o = variables.badge_order;
            if (!Array.isArray(o)) return 3;
            const i = o.indexOf('people');
            return i < 0 ? o.length + 3 : i + 1;
          ]]]
      - "--hemma-badge-order-media": >
          [[[
            if (window.hemmaBadges) return window.hemmaBadges.order('media', variables);
            const o = variables.badge_order;
            if (!Array.isArray(o)) return 4;
            const i = o.indexOf('media');
            return i < 0 ? o.length + 4 : i + 1;
          ]]]
      - "--hemma-badge-order-security": >
          [[[
            if (window.hemmaBadges) return window.hemmaBadges.order('security', variables);
            const o = variables.badge_order;
            if (!Array.isArray(o)) return 5;
            const i = o.indexOf('security');
            return i < 0 ? o.length + 5 : i + 1;
          ]]]
      - "--hemma-badge-order-energy": >
          [[[
            if (window.hemmaBadges) return window.hemmaBadges.order('energy', variables);
            const o = variables.badge_order;
            if (!Array.isArray(o)) return 6;
            const i = o.indexOf('energy');
            return i < 0 ? o.length + 6 : i + 1;
          ]]]
      - "--hemma-badge-order-status": >
          [[[
            if (window.hemmaBadges) return window.hemmaBadges.order('status', variables);
            const o = variables.badge_order;
            if (!Array.isArray(o)) return 7;
            const i = o.indexOf('status');
            return i < 0 ? o.length + 7 : i + 1;
          ]]]
      - background: transparent !important
      - backdrop-filter: none !important
      - -webkit-backdrop-filter: none !important
      - box-shadow: none !important
      - border: none !important
      - border-radius: 0 !important
      - padding: "0 0 6px 0 !important"
      - margin: "0 !important"
    grid:
      - display: block !important
      - padding: "0 !important"
      - margin: "0 !important"
    custom_fields:
      badges:
        - overflow-x: auto
        - overflow-y: hidden
        - overscroll-behavior-x: contain
        - scrollbar-width: none
        - "-ms-overflow-style": none
        - padding-left: "max(var(--hemma-measured-safe-left, 0px), var(--hemma-rail-left, 16px)) !important"
        - padding-right: "var(--hemma-rail-left, 16px) !important"
        - margin: "0 !important"
        - width: "100%"
        - box-sizing: border-box
        - display: block

  custom_fields:
    badges:
      card:
        type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          grid-auto-flow: column
          grid-auto-columns: max-content
          grid-template-columns: none
          justify-content: start
          justify-items: start
          align-items: center
          grid-column-gap: "var(--badge-gap-current, var(--badge-gap, 10px))"
          margin: 0
          padding: 0
        card_mod:
          style: |
            ha-card {
              background: transparent !important;
              box-shadow: none !important;
              overflow: visible !important;
              padding: 0 !important;
              contain: none !important;
              isolation: auto !important;
              will-change: auto !important;
              width: max-content !important;
              min-width: 100% !important;
            }
        cards:
          # Climate
          - type: custom:button-card
            template: hemma_badge_climate_group
            entity: input_select.hemma_mobile_filter
            tap_action:
              action: fire-dom-event
              hemma_filter: >
                [[[
                  const cur = states['input_select.hemma_mobile_filter']?.state ?? 'all';
                  return cur === 'climate' ? 'all' : 'climate';
                ]]]
            variables:
              enabled: '[[[ return window.hemmaBadges ? window.hemmaBadges.on("climate", variables, "row") : (variables.show_climate !== false) ]]]'
              temp_sensor: '[[[ return variables.temp_sensor_1 || variables.temp_sensor ]]]'
              temp_sensor_2: '[[[ return variables.temp_sensor_2 ]]]'
              temp_sensor_3: '[[[ return variables.temp_sensor_3 ]]]'
              temp_sensor_4: '[[[ return variables.temp_sensor_4 ]]]'
              temp_sensor_5: '[[[ return variables.temp_sensor_5 ]]]'
              humidity_sensor: '[[[ return variables.humidity_sensor ]]]'
              quality_sensor: '[[[ return variables.quality_sensor ]]]'
              climate_entity: '[[[ return variables.climate_entity_1 || variables.climate_entity ]]]'
              climate_entity_2: '[[[ return variables.climate_entity_2 ]]]'

          # Lights
          - type: custom:button-card
            template: hemma_badge_light_group
            entity: input_select.hemma_mobile_filter
            tap_action:
              action: fire-dom-event
              hemma_filter: >
                [[[
                  const cur = states['input_select.hemma_mobile_filter']?.state ?? 'all';
                  return cur === 'lights' ? 'all' : 'lights';
                ]]]
            variables:
              enabled: '[[[ return window.hemmaBadges ? window.hemmaBadges.on("lights", variables, "row") : (variables.show_lights !== false) ]]]'
              light_group_entity: '[[[ return variables.light_group_entity ]]]'
              entity_1: '[[[ return variables.light_entity_1 ]]]'
              entity_2: '[[[ return variables.light_entity_2 ]]]'
              entity_3: '[[[ return variables.light_entity_3 ]]]'

          # Presence
          - type: custom:button-card
            template: hemma_badge_presence_group
            entity: input_select.hemma_mobile_filter
            tap_action:
              action: fire-dom-event
              hemma_filter: >
                [[[
                  const cur = states['input_select.hemma_mobile_filter']?.state ?? 'all';
                  return cur === 'presence' ? 'all' : 'presence';
                ]]]
            variables:
              enabled: '[[[ return window.hemmaBadges ? window.hemmaBadges.on("people", variables, "row") : (variables.show_people !== false) ]]]'
              entity_1: '[[[ return variables.presence_entity_1 ]]]'
              entity_2: '[[[ return variables.presence_entity_2 ]]]'

          - type: custom:button-card
            template: hemma_badge_media_group
            entity: input_select.hemma_mobile_filter
            tap_action:
              action: fire-dom-event
              hemma_filter: >
                [[[
                  const cur = states['input_select.hemma_mobile_filter']?.state ?? 'all';
                  return cur === 'media' ? 'all' : 'media';
                ]]]
            variables:
              enabled: '[[[ return window.hemmaBadges ? window.hemmaBadges.on("media", variables, "row") : (variables.show_media !== false) ]]]'
              always_visible: true
              entity_1: '[[[ return variables.media_player_1 || variables.media_entity_1 ]]]'
              entity_2: '[[[ return variables.media_player_2 || variables.media_entity_2 ]]]'
              entity_3: '[[[ return variables.media_player_3 || variables.media_entity_3 ]]]'
              entity_4: '[[[ return variables.media_player_4 || variables.media_entity_4 ]]]'
              entity_5: '[[[ return variables.plex_stream_1 ]]]'
              entity_6: '[[[ return variables.psn_1 || variables.psn_entity_1 ]]]'
              entity_7: '[[[ return variables.psn_2 || variables.psn_entity_2 ]]]'
              entity_8: '[[[ return variables.media_player_5 || variables.media_entity_5 ]]]'
              entity_14: '[[[ return variables.plex_stream_2 ]]]'
              pc_count: >
                [[[
                  const V = {
                    discord_online: variables.discord_online || variables.discord_online_entity,
                    discord_game: variables.discord_game || variables.discord_game_entity,
                    steam_online: variables.steam_online || variables.steam_online_entity,
                    steam_game: variables.steam_game || variables.steam_game_entity,
                    duplicate_game: variables.duplicate_game,
                  };
                  const P = window._hemmaPCSources?.(states, V) || {};
                  return (P.discord ? 1 : 0) + (P.steam ? 1 : 0);
                ]]]

          # Security
          - type: custom:button-card
            template: hemma_badge_security_group
            entity: input_select.hemma_mobile_filter
            tap_action:
              action: fire-dom-event
              hemma_filter: >
                [[[
                  const cur = states['input_select.hemma_mobile_filter']?.state ?? 'all';
                  return cur === 'security' ? 'all' : 'security';
                ]]]
            variables:
              enabled: '[[[ return window.hemmaBadges ? window.hemmaBadges.on("security", variables, "row") : (variables.show_security !== false) ]]]'
              lock_entity: '[[[ return variables.security_lock_entity || variables.lock_entity ]]]'
              lock_entity_2: '[[[ return variables.security_lock_entity_2 || variables.lock_entity_2 ]]]'

          # Energy
          - type: custom:button-card
            template: hemma_badge_energy_group
            entity: input_select.hemma_mobile_filter
            tap_action:
              action: fire-dom-event
              hemma_filter: >
                [[[
                  const cur = states['input_select.hemma_mobile_filter']?.state ?? 'all';
                  return cur === 'energy' ? 'all' : 'energy';
                ]]]
            variables:
              enabled: '[[[ return window.hemmaBadges ? window.hemmaBadges.on("energy", variables, "row") : (variables.show_energy !== false) ]]]'
              row_entity: input_select.hemma_mobile_filter
              power_entity: '[[[ return variables.energy_power_entity || variables.power_entity ]]]'
          - type: custom:hemma-status-badges
            room: home
