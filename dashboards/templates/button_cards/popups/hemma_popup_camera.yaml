                 popup, so a label under it lands outside the card and gets clipped. */
              @media (hover: hover) {
                .hemma-cam-tile:hover img { transform: scale(1.03); filter: brightness(1.06); }
                .hemma-back-glass:hover { background-color: rgba(255,255,255,0.18); }
