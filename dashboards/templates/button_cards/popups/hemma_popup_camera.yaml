                     button lit forever. */
                  self._probeT = setTimeout(fail, 8000);
                },

                goLive: function (camId, el) {
                  const scope = el.closest('.cam-detail');
                  const mount = scope && scope.querySelector('.cam-stream-mount');
                  if (this._recT) { clearTimeout(this._recT); this._recT = null; }
                  this.mount(camId, mount);
                  this._modeText = 'Live';
                  this.setMode(scope, 'Live');
                  this.paintRec(scope, false);
                },

                setMode: function (scope, txt) {
                  const el = scope && scope.querySelector('.cam-mode');
                  if (el) el.textContent = txt;
                },

              };
            }

            /* Bump TPL on any edit to the markup or to _hemmaCAM. The cached render is
               keyed on entity state alone, so without it a soft reload keeps serving the
               previous version of this popup until someone hard-refreshes. */
            const _ck = 'hemma_cams_' + TPL + '_' + (entity?.entity_id || 'x');
            const _ch = cams.map(c => [c.id, c.s.state, c.s.attributes?.entity_picture, c.s.last_changed].join(':')).join('|')
              + '|' + Object.keys(reg).length + '|' + window.innerWidth;
            window._hc = window._hc || {};
            if (window._hc[_ck]?.h === _ch) return window._hc[_ck].r;

            const esc = s => String(s ?? '')
              .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
              .replace(/"/g,'&quot;').replace(/'/g,'&#39;');

            const resolveUrl = raw => {
              if (!raw) return '';
              const s = String(raw);
              return s.startsWith('/') ? location.origin + s : s;
            };

            const siblingsOf = {};
            Object.keys(reg).forEach(id => {
              const dev = reg[id] && reg[id].device_id;
              if (!dev) return;
              (siblingsOf[dev] = siblingsOf[dev] || []).push(id);
            });
            const sibs = camId => siblingsOf[(reg[camId] || {}).device_id] || [];

            const activityOf = camId => {
              if (actOv[camId]) return actOv[camId];
              return sibs(camId).find(id =>
                id.startsWith('sensor.') &&
                /last_activity|last_motion|last_seen|last_event/.test(id) &&
                isFinite(Date.parse(states[id]?.state))
              ) || null;
            };

            /* Apple's tile stamp: bare "11s" / "2m" / "3h", no "ago". */
            const stamp = ms => {
              if (!isFinite(ms) || ms < 0) return '';
              const s = ms / 1000;
              if (s < 60)    return Math.max(1, Math.floor(s)) + 's';
              if (s < 3600)  return Math.floor(s / 60) + 'm';
              if (s < 86400) return Math.floor(s / 3600) + 'h';
              return Math.floor(s / 86400) + 'd';
            };

            const ageMsOf = cam => {
              const act = activityOf(cam.id);
              const raw = act ? states[act]?.state : null;
              const t = raw ? Date.parse(raw) : Date.parse(cam.s.last_changed);
              return isFinite(t) ? Date.now() - t : NaN;
            };
            const ageOf = cam => stamp(ageMsOf(cam));

            /* Ring's live view 500s when no snapshot is cached; the device's
               last_recording camera usually still has one. */
            const fallbackOf = camId => {
              const alt = camId.replace(/_live_view$/, '_last_recording');
              const pick = (id) => (id && id !== camId && states[id]?.attributes?.entity_picture)
                ? resolveUrl(states[id].attributes.entity_picture) : '';
              return pick(alt)
                || pick(sibs(camId).find(id => id.startsWith('camera.') && /_last_recording$/.test(id)));
            };

            const accState = id => {
              const st = states[id];
              if (!st) return null;
              const v = String(st.state).toLowerCase();
              if (id.startsWith('lock.'))  return v === 'unlocked' ? 'open' : 'shut';
              if (id.startsWith('cover.')) return (v === 'open' || v === 'opening') ? 'open' : 'shut';
              if (id.startsWith('alarm_control_panel.')) return v === 'disarmed' ? 'shut' : 'open';
              return v === 'on' ? 'open' : 'shut';
            };

            const labelOf = cam => {
              if (nameOv[cam.id]) return nameOv[cam.id];
              const fn = cam.s.attributes?.friendly_name;
              if (fn) return fn.replace(/\s*Live view$/i, '').trim() || fn;
              return cam.id.split('.').pop().replace(/_/g, ' ');
            };

            const isMobile = window.innerWidth < 600;
            const cols = variables.columns || (isMobile ? 1 : 2);
            const pad  = isMobile ? 20 : 28;
            const GAP  = 12;

            const font = 'font-family:var(--primary-font-family,system-ui);';
            const tileW = cols === 1
              ? '100%'
              : 'calc((100% - ' + (GAP * (cols - 1)) + 'px) / ' + cols + ')';

            const wrapperStyle = `
              :host { --ha-card-box-shadow: none !important; --button-card-box-shadow: none !important; --button-card-box-shadow-hover: none !important; }
              ha-card { background: transparent !important; border: none !important; border-radius: 0 !important; box-shadow: none !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; cursor: default !important; width: 100% !important; box-sizing: border-box !important; }
              ha-card:hover { box-shadow: none !important; }
              ha-ripple { display: none !important; }
            `;

            const gridStyle = wrapperStyle + `
              ha-card #container { display: block !important; padding: 0 !important; width: 100% !important; }
              .hemma-cam-tile img { transition: transform 0.35s ease, filter 0.2s ease; }
              .hemma-back-glass { position: relative; width: 34px; height: 34px; border-radius: 50%;
                display: flex; align-items: center; justify-content: center; flex: 0 0 auto;
                cursor: pointer; pointer-events: auto;
                transition: transform 0.15s ease, background-color 0.18s ease;
                background-color: rgba(255,255,255,0.07);
                background-image: radial-gradient(140% 90% at 50% -20%, rgba(255,255,255,0.14), rgba(255,255,255,0.04) 45%, transparent 62%);
                backdrop-filter: blur(10px) saturate(1.2); -webkit-backdrop-filter: blur(10px) saturate(1.2); }
              .hemma-back-glass::before { content: ""; position: absolute; inset: 0; border-radius: 50%; padding: 1.4px;
                background: conic-gradient(from 0deg, rgba(255,255,255,0.55) 0deg, rgba(255,255,255,0.12) 55deg,
                  rgba(255,255,255,0.02) 90deg, rgba(255,255,255,0.12) 130deg, rgba(255,255,255,0.30) 175deg 185deg,
                  rgba(255,255,255,0.12) 230deg, rgba(255,255,255,0.02) 270deg, rgba(255,255,255,0.12) 305deg,
                  rgba(255,255,255,0.55) 360deg);
                -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
                -webkit-mask-composite: xor; mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
                mask-composite: exclude; pointer-events: none; }
              .hemma-back-glass::after { content: ""; position: absolute; inset: -1px; border-radius: 50%; padding: 1px;
                background: conic-gradient(from 0deg, transparent 0deg 50deg, rgba(0,0,0,0.32) 80deg 100deg,
                  transparent 130deg 230deg, rgba(0,0,0,0.32) 260deg 280deg, transparent 310deg 360deg);
                -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
                -webkit-mask-composite: xor; mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
                mask-composite: exclude; pointer-events: none; }
              .hemma-back-glass:active { transform: scale(0.94); }
              /* Top-left, matching where HA puts it on its own camera views. backdrop-filter is
                 inert inside a popup, so the glass is a fill plus a rim. Hidden until the
                 feed is hovered; pointer-events go with the opacity, or the invisible
                 button still swallows taps on touch. */
              /* 16:9 of a 984px-wide frame is 553px tall, which clears the viewport on a
                 shorter laptop once the header and control row are added. The cap keeps
                 the whole detail view on screen; the mount is inset:0 so the picture
                 follows it down. */
              /* ha-icon does not center its own glyph here — the parent's align-items
                 centres the icon's box, not the artwork inside it, so every icon lands a
                 couple of px low. Same forcing hemma_popup_lock_group already does. */
              .hemma-cam-root ha-icon {
                display: flex !important;
                align-items: center !important;
                justify-content: center !important;
                width: var(--mdc-icon-size, 24px);
                height: var(--mdc-icon-size, 24px);
                flex: 0 0 auto;
                line-height: 0;
              }

              /* An inset shadow layers over whatever background the JS wrote inline, so
                 the highlight lands without fighting it for specificity. Lit buttons
                 darken instead of lightening — white cannot get any brighter. */
              .cam-mute, .cam-rec, .cam-fit { transition: box-shadow 180ms ease; }
              @media (hover: hover) {
                .cam-mute:hover, .cam-rec:hover, .cam-fit:hover, [data-acc]:hover {
                  box-shadow: inset 0 0 0 999px rgba(255,255,255,0.07);
                }
                .cam-mute[data-on]:hover, .cam-rec[data-on]:hover,
                .cam-fit[data-on]:hover, [data-acc][data-on]:hover {
                  box-shadow: inset 0 0 0 999px rgba(0,0,0,0.055);
                }
              }

              .cam-frame { max-height: 52vh; }
              .cam-frame:fullscreen, .cam-frame:-webkit-full-screen { max-height: none; }

              .cam-fs {
                position: absolute; left: 12px; top: 12px; z-index: 4;
                display: inline-flex; align-items: center; justify-content: center;
                width: 32px; height: 32px; border-radius: 50%;
                cursor: pointer;
                opacity: 0; pointer-events: none;
                touch-action: manipulation; -webkit-tap-highlight-color: transparent;
                background: rgba(0,0,0,0.30);
                box-shadow: inset 0 0 0 1px rgba(255,255,255,0.10);
                transition: opacity 0.2s ease,
                            transform 0.22s cubic-bezier(0.34,1.25,0.55,1),
                            background 0.2s ease, box-shadow 0.2s ease;
              }
              .cam-fs:active { transform: scale(0.96); }
              /* No hover to reveal it on a phone, so it just stays. */
              @media (hover: none) { .cam-fs { opacity: 1; pointer-events: auto; } }

              [data-tip]::after {
                content: attr(data-tip);
                position: absolute; left: 50%; bottom: calc(100% + 8px);
                transform: translateX(-50%);
                padding: 4px 9px; border-radius: 7px;
                background: var(--hemma-tooltip-bg, rgba(233,233,236,0.96));
                color: var(--hemma-tooltip-fg, #1c1c1e);
                font-family: var(--primary-font-family, system-ui);
                font-size: 12px; font-weight: 500; line-height: 1.35;
                white-space: nowrap; pointer-events: none; z-index: 20;
                opacity: 0; transition: opacity 110ms ease;
              }
