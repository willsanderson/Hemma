# Plant Popup
hemma_popup_plant:
  template:
    - hemma_popup_base

  tap_action:
    browser_mod:
      data:
        content: |
          [[[
            const plant      = entity?.entity_id;
            const _plantName = plant ? plant.replace(/^[^.]+\./, '') : '';
            const plantAttrs = states[plant]?.attributes || {};
            const sensors    = Array.isArray(variables.sensors) ? variables.sensors.filter(Boolean) : [];

            const _ck = 'hemma_plant_' + (plant || 'x');
            const _ch = [states[plant]?.state, JSON.stringify(states[plant]?.attributes), ...sensors.map(s => states[s]?.state)].join('|');
            window._hc = window._hc || {};
            if (window._hc[_ck]?.h === _ch) return window._hc[_ck].r;

            const safeNum = (id) => {
              if (!id) return null;
              const s = states[id]?.state;
              if (!s || s === 'unavailable' || s === 'unknown') return null;
              const n = parseFloat(s);
              return isNaN(n) ? null : n;
            };

            const getSensorType = (eid) => {
              const id = eid.toLowerCase();
              if (id.includes('moisture'))                       return 'moisture';
              if (id.includes('illumin') || id.includes('lux')) return 'illuminance';
              if (id.includes('temp'))                           return 'temperature';
              if (id.includes('conductiv'))                      return 'conductivity';
              if (id.includes('humid'))                          return 'humidity';
              if (id.includes('battery'))                        return 'battery';
              return null;
            };

            const getThreshold = (type, dir) => {
              if (!type || type === 'battery' || !_plantName) return null;
              // Plant Monitor entities use "soil_moisture"/"air_humidity" on newer
              // installs, bare type name on older ones - try both.
              const slug = type === 'moisture' ? 'soil_moisture'
                : type === 'humidity' ? 'air_humidity'
                : type;
              const v = safeNum(`number.${_plantName}_${dir}_${slug}`);
              return v !== null ? v : safeNum(`number.${_plantName}_${dir}_${type}`);
            };

            const plantState = states[plant]?.state;
            const plantIsOk  = plantState === 'ok';
            const plantIsBad = plantState === 'problem';

            const gradable = sensors.filter(s => {
              const t = getSensorType(s);
              return t && t !== 'battery';
            });
            const readable = gradable.filter(s => safeNum(s) != null);

            /* `problems` and *_status are both absent until the integration is
             * fully set up, so the plant's own state is the authoritative gate. */
            const badTypes = {};
            if (plantIsBad) {
              (Array.isArray(plantAttrs.problems) ? plantAttrs.problems : []).forEach(p => {
                if (p && p.sensor_type) badTypes[p.sensor_type] = String(p.status || '').toLowerCase();
              });
              gradable.forEach(s => {
                const t = getSensorType(s);
                const v = plantAttrs[t + '_status'];
                if (!badTypes[t] && v && v !== 'ok' && v !== 'null') badTypes[t] = String(v).toLowerCase();
              });
            }

            const C_HEALTHY    = 'var(--hemma-badge-plant-healthy-color, #44e371)';
            const C_STRUGGLING = 'var(--hemma-badge-plant-struggling-color, #ff9230)';

            let advice;
            if (plantIsOk) {
              advice = 'Plant is healthy';
            } else if (plantIsBad) {
              const maxScore = readable.length || gradable.length || 1;
              const badCount = Math.min(Object.keys(badTypes).length || 1, maxScore);
              const ratio    = (maxScore - badCount) / maxScore;

              if (ratio >= 0.8)      advice = 'Needs some attention';
              else if (ratio >= 0.6) advice = 'Plant is struggling';
              else if (ratio >= 0.4) advice = 'Needs immediate care';
              else                   advice = 'Needs urgent attention';

              const dir = (t) => badTypes[t];
              if (dir('temperature'))  advice = dir('temperature')  === 'low' ? 'Too cold' : 'Too warm';
              if (dir('humidity'))     advice = dir('humidity')     === 'low' ? 'Air is too dry' : 'Air is too humid';
              if (dir('conductivity')) advice = dir('conductivity') === 'low' ? 'Needs fertilizing' : 'Too much fertilizer';
              if (dir('illuminance'))  advice = dir('illuminance')  === 'low' ? 'Needs more light' : 'Getting too much light';
              if (dir('moisture'))     advice = dir('moisture')     === 'low' ? 'Needs watering' : 'Soil is too wet';
            } else {
              advice = readable.length ? 'Waiting for plant data' : 'Sensor data unavailable';
            }

            const cleanName = (eid) => {
              const fallback = states[eid]?.attributes?.friendly_name || eid.split('.').pop() || '';
              const pName    = (entity?.attributes?.friendly_name || '').trim();
              let name       = fallback;
              if (pName) {
                const esc = pName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                name = name.replace(new RegExp('^' + esc + '\\s*', 'i'), '');
              }
              return name.replace(/_/g, ' ').trim().replace(/\w\S*/g, t => t.charAt(0).toUpperCase() + t.slice(1).toLowerCase());
            };

            /* Styles */
            const wrapperStyle = `
              :host { --ha-card-box-shadow: none !important; --button-card-box-shadow: none !important; --button-card-box-shadow-hover: none !important; }
              ha-card { background: transparent !important; border: none !important; border-radius: 0 !important; box-shadow: none !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; cursor: default !important; }
              ha-card:hover { box-shadow: none !important; }
              ha-ripple { display: none !important; }
            `;

            const contentCardStyle = wrapperStyle + `@media (max-width: 600px) { ha-card { padding-left: 14px !important; padding-right: 14px !important; } }`;

            const tapStyle = `
              :host { --ha-card-box-shadow: none !important; --button-card-box-shadow: none !important; --button-card-box-shadow-hover: none !important; pointer-events: auto !important; }
              ha-card { background: transparent !important; border: none !important; border-radius: 0 !important; box-shadow: none !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; overflow: visible !important; }
              ha-card #container { transition: opacity 0.18s ease, filter 0.18s ease !important; }
              ha-card:hover #container { filter: brightness(1.12) saturate(1.08) drop-shadow(0 0 10px rgba(255,255,255,0.05)); }
              ha-ripple { display: none !important; }
            `;

            const tileTapStyle = `
              :host { --ha-card-box-shadow: none !important; --button-card-box-shadow: none !important; --button-card-box-shadow-hover: inset 0 1px 0.5px -0.5px rgba(255,255,255,calc(var(--hemma-popup-tiles-glow-top-tight,0.20) * 1.5)), inset 0 -1px 0.5px -0.5px rgba(255,255,255,calc(var(--hemma-popup-tiles-glow-bottom-tight,0.15) * 1.5)), inset 0 3px 6px -3px rgba(255,255,255,calc(var(--hemma-popup-tiles-glow-top-soft,0.08) * 1.5)), inset 0 -3px 6px -3px rgba(255,255,255,calc(var(--hemma-popup-tiles-glow-bottom-soft,0.05) * 1.5)) !important; }
              ha-card { background: var(--hemma-popup-tiles-fill, rgba(255,255,255,0.07)) !important; border: none !important; border-radius: 24px !important; box-shadow: inset 0 1px 0.5px -0.5px rgba(255,255,255,var(--hemma-popup-tiles-glow-top-tight,0.20)), inset 0 -1px 0.5px -0.5px rgba(255,255,255,var(--hemma-popup-tiles-glow-bottom-tight,0.15)), inset 0 3px 6px -3px rgba(255,255,255,var(--hemma-popup-tiles-glow-top-soft,0.08)), inset 0 -3px 6px -3px rgba(255,255,255,var(--hemma-popup-tiles-glow-bottom-soft,0.05)) !important; backdrop-filter: var(--hemma-popup-tiles-backdrop, blur(10px) saturate(1.1)) !important; -webkit-backdrop-filter: var(--hemma-popup-tiles-backdrop, blur(10px) saturate(1.1)) !important; cursor: pointer !important; transform: scale(1) !important; transition: background-color var(--hemma-popup-tile-hover-duration, 0.2s) ease, transform var(--hemma-popup-tile-hover-duration, 0.2s) ease, box-shadow 0.2s ease !important; }
              ha-card:hover { background: var(--hemma-popup-tile-hover, rgba(255,255,255,0.09)) !important; transform: scale(var(--hemma-popup-tile-hover-scale, 1.01)) !important; }
              ha-ripple { display: none !important; }
            `;

            const cards = [];

            /* Header Card */
            const nameHtml = '<div style="font-family:var(--primary-font-family,system-ui);color:var(--hemma-popup-tiles-text-primary);text-align:left;">'
              + '<div style="font-size:16px;font-weight:500;letter-spacing:-0.01em;">' + (entity?.attributes?.friendly_name || 'Plant') + '</div>'
              + '<div style="font-size:14px;color:var(--hemma-popup-tiles-text-secondary);margin-top:2px;">Plant · Health</div>'
            + '</div>';

            const adviceHtml = '<div style="font-family:var(--primary-font-family,system-ui);font-size:22px;font-weight:400;letter-spacing:-.5px;color:var(--hemma-popup-tiles-text-primary);">' + advice + '</div>';

            const headerCustomFields = {
              name:   nameHtml,
              advice: adviceHtml,
            };
            const headerFieldStyles = {
              name:   [{ 'justify-self': 'start' }, { 'align-self': 'center' }],
              advice: [{ 'justify-self': 'start' }],
            };

            cards.push({
              type: 'custom:button-card',
              entity: plant,
              tap_action: { action: 'none' },
              show_icon: false, show_name: false, show_label: false, show_state: false,
              card_mod: { style: contentCardStyle },
              styles: {
                card: [
                  { background: 'transparent' }, { border: 'none' }, { 'box-shadow': 'none' },
                  { padding: '28px 28px 20px 28px' },
                ],
                grid: [
                  { 'grid-template-areas': '"name" "advice"' },
                  { 'grid-template-columns': '1fr auto' },
                  { 'align-items': 'flex-start' },
                  { gap: '16px' },
                ],
                custom_fields: headerFieldStyles,
              },
              custom_fields: headerCustomFields,
            });

            /* Sensor Tiles Grid */
            const buildTileCard = (eid) => {
              if (!eid) return null;
              const val   = safeNum(eid);
              const type  = getSensorType(eid);
              const unit  = val != null ? (states[eid]?.attributes?.unit_of_measurement || '') : '';
              const name  = cleanName(eid);
              const isOk  = !type || !badTypes[type];

              /* One semantic ladder for every metric — moisture and humidity
               * used to read blue, which looked like a different kind of
               * measurement rather than the same ok/problem signal. */
              const labelColor = val == null ? 'rgba(255,255,255,0.3)'
                : !isOk ? C_STRUGGLING
                : C_HEALTHY;

              const minOpt = type ? getThreshold(type, 'min') : null;
              const maxOpt = type ? getThreshold(type, 'max') : null;

              let pct = 0, rangeMinPct = null, rangeMaxPct = null;
              if (val != null) {
                if (type === 'moisture' || type === 'humidity' || type === 'battery') {
                  pct = Math.min(100, Math.max(0, val));
                  if (minOpt != null) rangeMinPct = minOpt;
                  if (maxOpt != null) rangeMaxPct = maxOpt;
                } else if (type === 'temperature') {
                  const isFahr = unit === '°F';
                  const sMin = isFahr ? 32 : 0, sMax = isFahr ? 104 : 40;
                  pct = Math.min(100, Math.max(0, ((val - sMin) / (sMax - sMin)) * 100));
                  if (minOpt != null) rangeMinPct = Math.max(0,   ((minOpt - sMin) / (sMax - sMin)) * 100);
                  if (maxOpt != null) rangeMaxPct = Math.min(100, ((maxOpt - sMin) / (sMax - sMin)) * 100);
                } else if (maxOpt != null) {
                  pct = Math.min(100, (val / maxOpt) * 100);
                }
              }

              const fmtT = (v) => {
                if (v == null) return '';
                if (type === 'moisture' || type === 'humidity' || type === 'battery') return Math.round(v) + '%';
                if (type === 'temperature') return Math.round(v) + (unit || '°');
                if (v >= 10000) return (v / 1000).toFixed(0) + 'k';
                if (v >= 1000) return (v / 1000).toFixed(1) + 'k';
                return Math.round(v).toString();
              };

              const valStr = val == null ? '—'
                : type === 'temperature' ? (unit === '°F' ? Math.round(val).toString() : val.toFixed(1))
                : val % 1 === 0 ? val.toFixed(0) : val.toFixed(1);

              const barGradient = val == null
                ? 'var(--hemma-popup-progress-track, rgba(255,255,255,0.09))'
                : labelColor;

              const _showMinMax = typeof window !== 'undefined' && window.innerWidth >= 900;
              const rangeLabels = _showMinMax
                ? '<div style="height:16px;margin-top:5px;display:flex;justify-content:space-between;align-items:center;">'
                  + (minOpt != null ? '<span style="font-size:12px;color:rgba(255,255,255,0.35);">' + fmtT(minOpt) + '</span>' : '')
                  + (maxOpt != null ? '<span style="font-size:12px;color:rgba(255,255,255,0.35);">' + fmtT(maxOpt) + '</span>' : '')
                  + '</div>'
                : '';

              return {
                type: 'custom:button-card',
                entity: eid,
                tap_action: { action: 'more-info' },
                show_icon: false, show_name: false, show_label: false, show_state: false,
                card_mod: { style: tileTapStyle },
                styles: {
                  card: [{ background: 'var(--hemma-popup-tiles-fill, rgba(255,255,255,0.07))' }, { border: 'none' }, { 'border-radius': '24px' }, { 'box-shadow': 'none' }, { padding: '18px 18px 14px 18px' }],
                  grid: [{ 'grid-template-areas': '"c"' }, { 'grid-template-columns': '1fr' }],
                  custom_fields: { c: [{ 'justify-self': 'stretch' }] },
                },
                custom_fields: {
                  c: '<div style="padding:0 4px;">'
                    + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">'
                      + '<span style="font-size:13px;color:var(--hemma-popup-tiles-text-primary);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + name + '</span>'
                      + '<span style="font-size:13px;color:' + labelColor + ';white-space:nowrap;font-weight:600;flex-shrink:0;">' + (isOk ? 'OK' : 'Problem') + '</span>'
                    + '</div>'
                    + '<div style="display:flex;align-items:baseline;gap:3px;margin-bottom:10px;">'
                      + '<span style="font-size:22px;font-weight:400;color:#fff;line-height:1;">' + valStr + '</span>'
                      + '<span style="font-size:12px;color:var(--hemma-popup-tiles-text-muted);">' + unit + '</span>'
                    + '</div>'
                    + '<div style="height:6px;background:rgba(255,255,255,0.09);border-radius:999px;overflow:hidden;position:relative;">'
                      + (pct > 0 ? '<div style="height:100%;width:' + pct.toFixed(1) + '%;background:' + barGradient + ';border-radius:999px;"></div>' : '')
                    + '</div>'
                    + rangeLabels
                  + '</div>',
                },
              };
            };

            const availableTiles = sensors.filter(Boolean);
            if (availableTiles.length > 0) {
              const cnt  = availableTiles.length;
              const isDesk = typeof window !== 'undefined' && window.innerWidth >= 900;
              const cols = (isDesk && cnt >= 3) ? 3 : 2;

              const sKeys = availableTiles.map((_, i) => 's' + i);
              const gcd   = (a, b) => b === 0 ? a : gcd(b, a % b);
              const rem   = cnt % cols;
              let tileAreas, tileCols;
              if (rem === 0) {
                tileCols = 'repeat(' + cols + ', 1fr)';
                const rows = [];
                for (let i = 0; i < cnt; i += cols) rows.push('"' + sKeys.slice(i, i + cols).join(' ') + '"');
                tileAreas = rows.join(' ');
              } else {
                const lcm      = cols * rem / gcd(cols, rem);
                const fullSpan = lcm / cols;
                const lastSpan = lcm / rem;
                tileCols = 'repeat(' + lcm + ', 1fr)';
                const rows = [];
                const fullRows = Math.floor(cnt / cols);
                for (let r = 0; r < fullRows; r++) {
                  const row = sKeys.slice(r * cols, (r + 1) * cols).map(k => Array(fullSpan).fill(k).join(' ')).join(' ');
                  rows.push('"' + row + '"');
                }
                const lastRow = sKeys.slice(fullRows * cols).map(k => Array(lastSpan).fill(k).join(' ')).join(' ');
                rows.push('"' + lastRow + '"');
                tileAreas = rows.join(' ');
              }

              const tileCustomFields = {}, tileFieldStyles = {};
              availableTiles.forEach((eid, i) => {
                tileCustomFields['s' + i] = { card: buildTileCard(eid) };
                tileFieldStyles['s' + i]  = [{ 'justify-self': 'stretch' }];
              });

              cards.push({
                type: 'custom:button-card',
                entity: plant,
                tap_action: { action: 'none' },
                show_icon: false, show_name: false, show_label: false, show_state: false,
                card_mod: { style: contentCardStyle },
                styles: {
                  card: [
                    { background: 'transparent' }, { border: 'none' }, { 'box-shadow': 'none' },
                    { padding: '4px 28px 8px 28px' },
                  ],
                  grid: [
                    { 'grid-template-areas': tileAreas },
                    { 'grid-template-columns': tileCols },
                    { gap: '8px' },
                    { 'align-items': 'start' },
                  ],
                  custom_fields: tileFieldStyles,
                },
                custom_fields: tileCustomFields,
              });
            }

            /* Care Tips Slider */
            const careKeys = [
              { key: 'care_watering',      label: 'Watering',    color: '#4FC3F7' },
              { key: 'care_sunlight',      label: 'Sunlight',    color: '#FFD60A' },
              { key: 'care_soil',          label: 'Soil',        color: '#c8a27d' },
              { key: 'care_pruning',       label: 'Pruning',     color: '#30D158' },
              { key: 'care_fertilization', label: 'Fertilizing', color: '#FF9F0A' },
            ];

            const availableCare = careKeys.filter(c => {
              const v = plantAttrs[c.key];
              return v && v !== 'unknown' && v !== 'unavailable';
            });

            for (let _i = availableCare.length - 1; _i > 0; _i--) {
              const _j = Math.floor(Math.random() * (_i + 1));
              const _t = availableCare[_i]; availableCare[_i] = availableCare[_j]; availableCare[_j] = _t;
            }

            if (!plantIsOk && availableCare.length > 0) {
              const tipSlideTransparent = 'ha-card{background:transparent!important;border:none!important;box-shadow:none!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;padding:0!important;border-radius:0!important;overflow:hidden!important;cursor:default!important;}#container{padding:0!important;height:auto!important;}ha-ripple{display:none!important;}';

              const _tipTextW = Math.max(160, Math.min((typeof window !== 'undefined' ? window.innerWidth : 400) - 32, 520) - 96);

              const tipSlides = availableCare.map(c => {
                const text = String(plantAttrs[c.key] || '');
                const fs = text.length > 0 ? Math.max(13, Math.min(15, Math.floor(_tipTextW / (text.length * 0.57)))) : 15;
                const slideHtml = '<div style="padding:18px 20px 30px 20px;text-align:left;font-family:var(--primary-font-family,system-ui);">'
                  + '<div style="font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,0.5);margin-bottom:8px;">' + c.label + '</div>'
                  + '<div style="font-size:13px;color:rgba(255,255,255,0.82);line-height:1.5;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;">' + text + '</div>'
                  + '</div>';

                return {
                  type: 'custom:button-card',
                  tap_action: { action: 'none' },
                  show_icon: false, show_name: false, show_label: false, show_state: false,
                  extra_styles: tipSlideTransparent,
                  styles: {
                    card: [{ background: 'transparent' }, { border: 'none' }, { 'box-shadow': 'none' }, { padding: '0' }, { 'border-radius': '0' }],
                    grid: [{ 'grid-template-areas': '"c"' }, { 'grid-template-columns': '1fr' }],
                    custom_fields: { c: [{ 'justify-self': 'stretch' }, { 'white-space': 'normal' }] },
                  },
                  custom_fields: { c: slideHtml },
                };
              });

              const tipSwipeCard = {
                type: 'custom:swipe-card',
                card_mod: {
                  style: 'ha-card,:host{background:transparent!important;box-shadow:none!important;border:none!important;width:100%!important;display:block!important;}'
                    + ':host{margin-bottom:20px!important;}'
                    + '.swiper,.swiper-container{background:rgba(255,255,255,0.07)!important;border-radius:24px!important;overflow:hidden!important;margin:0 28px!important;}'
                    + '@media(max-width:600px){.swiper,.swiper-container{margin:0 14px!important;}}'
                    + '.swiper-slide{width:100%!important;max-width:none!important;flex-shrink:0!important;}'
                    + '.swiper-wrapper{padding-bottom:6px!important;}'
                    + '.swiper-pagination-bullets{display:flex!important;flex-direction:row!important;gap:5px!important;align-items:center!important;justify-content:center!important;padding-bottom:8px!important;}'
                    + '.swiper-pagination-bullet{width:12px!important;height:4px!important;border-radius:999px!important;background:rgba(255,255,255,0.15)!important;opacity:1!important;margin:0!important;flex-shrink:0!important;transition:width 0.3s ease,background 0.3s ease!important;}'
                    + '.swiper-pagination-bullet-active{width:18px!important;background:rgba(255,255,255,0.7)!important;}',
                },
                cards: tipSlides,
                parameters: {
                  autoHeight: false,
                  autoplay: { delay: 10000, disableOnInteraction: false, pauseOnMouseEnter: true },
                  pagination: { clickable: true },
                  loop: false,
                  rewind: true,
                  speed: 600,
                  slidesPerView: 1,
                  spaceBetween: 0,
                  observer: true,
                  observeParents: true,
                  resizeObserver: true,
                },
              };

              cards.push(tipSwipeCard);
            }

            const _r = { type: 'vertical-stack', cards };
            window._hc[_ck] = { h: _ch, r: _r };
            return _r;
          ]]]

  icon_tap_action:
    haptic: light
    action: more-info
