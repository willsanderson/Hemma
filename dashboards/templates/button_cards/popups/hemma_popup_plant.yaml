hemma_popup_plant:
  template:
  - hemma_popup_base
  variables:
    room_name: null
    sensors: []
  tap_action:
    haptic: light
    action: |
      [[[
        return window.hemmaPopupAction ? window.hemmaPopupAction() : 'more-info';
      ]]]
    entity: '[[[ return entity?.entity_id; ]]]'
    hemma_popup:
      title: ''
      dismissable: true
      close: false
      style: '--popup-min-width: 340px; --popup-max-width: 340px; --popup-min-width-narrow: 340px; --hemma-popup-radius: 34px; --hemma-popup-tint: rgba(0, 0, 5, 0.16);'
      content:
        type: custom:hemma-plant-panel
        entity: '[[[ return entity?.entity_id || null; ]]]'
        name: |
          [[[
            const n = String(this._config?.name || '').trim();
            return (variables.room_name || (n.startsWith('[' + '[[') || n.indexOf('<') >= 0 ? '' : n)).trim();
          ]]]
        sensors: '[[[ return Array.isArray(variables.sensors) ? variables.sensors.filter(Boolean) : []; ]]]'
  icon_tap_action:
    haptic: light
    action: more-info
