            add('toggle', { card: toggleCard });

            add('locks', `[[[
              const L = (k, en) => { const v = hass?.localize?.(k); return (v && v !== k) ? v : en; };
              const T = window._hemmaT || ((k, en, v) => { let s = String(en); if (v) for (const p in v) s = s.split(String.fromCharCode(123) + p + String.fromCharCode(125)).join(String(v[p])); return s; });
              const ids = ${_ids};
              const batt = ${_batt};
              const door = ${_door};
              const cap = (t) => t ? t.charAt(0).toUpperCase() + t.slice(1) : L('state.default.unknown', 'Unknown');
              const rows = ids.map((id) => {
                const st = (states[id]?.state || '').toLowerCase();
                const locked = st === 'locked';
                const b = batt[id] ? parseFloat(states[batt[id]]?.state) : NaN;
                const d = door[id] ? states[door[id]]?.state === 'on' : null;
                const bits = [];
                // Only the exception is worth a line - a closed door is the norm.
                if (d) bits.push(T('locks.popup.door_open_row', 'Door open'));
                if (!isNaN(b)) bits.push(T('locks.popup.pct_battery', '{n}% battery', { n: Math.round(b) }));
                return {
                  entity: id,
                  icon: locked ? 'lock' : 'lock-open',
                  iconTone: 'accent',
                  label: states[id]?.attributes?.friendly_name || id,
                  sub: bits.length ? bits : null,
                  value: L('component.lock.entity_component._.state.' + st, cap(st)),
                  valueTone: locked ? null : 'accent',
                };
              });
              return window._hemmaUI.group(rows, null);
            ]]]`);

            const uiCard = {
              type: 'custom:button-card',
              /* Three things the nested card has to give back, all found the
                 hard way and all still load-bearing:
                 - --ha-card-backdrop-filter is set globally by the theme and
                   inherits, so the card resolves a second frost over .glass.
                   Nulling the variable beats overriding the property.
                 - hemma_shared paints a grain on ha-card::before and a photo on
                   ::after for room cards; on a popup card they scroll their own
                   texture over the popup's.
                 - the theme puts will-change on every ha-card, promoting it.
                 And on a phone the sheet is full height, so the height has to
                 reach the grid for `1fr` to have any slack to give: without it
                 the card is content-height and the rows bunch under the toggle
                 instead of sitting at the bottom. */
              card_mod: { style: contentCardStyle
                + '\n:host { --ha-card-backdrop-filter: none !important; --ha-card-background: transparent !important; --card-background-color: transparent !important; --ha-card-box-shadow: none !important; --ha-card-border-width: 0px !important; }'
                + '\nha-card::before, ha-card::after, #card::before, #card::after, #container::before, #container::after { display: none !important; }'
                + '\nha-card { will-change: auto !important; }'
                + '\n@media (max-width: 768px) {'
                + ' :host { flex: 1 1 auto !important; min-height: 0 !important;'
                + '   display: flex !important; flex-direction: column !important; }'
                + ' ha-card { flex: 1 1 auto !important; min-height: 0 !important;'
                + '   display: flex !important; flex-direction: column !important;'
                + '   box-sizing: border-box !important; }'
                /* min-height: 0 here was overriding the grid's own inline
                   min-height: 100% and leaving `1fr` no slack to give. A
                   viewport figure resolves against nothing above it:
                   112 the surface top, 58 the header, 28 the card's own
                   padding, 8 the bottom gap. */
                + ' #container { flex: 1 1 auto !important;'
                + '   min-height: calc(100svh - var(--hemma-popup-top, 112px)'
                + '     - 58px - 28px - 8px'
                + '     - var(--safe-area-inset-bottom, 0px)) !important;'
                + '   box-sizing: border-box !important; } }'
                + '\n#container { background: transparent !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }' },
              entity: groupId || undefined,
              tap_action: { action: 'none' },
              show_icon: false, show_name: false, show_label: false, show_state: false,
              styles: {
                card: [
                  { background: 'transparent' }, { border: 'none' }, { 'box-shadow': 'none' },
                  { padding: '6px 26px 22px 26px' },
                ],
                grid: [
                  { 'grid-template-areas': areas.join(' ') },
                  { 'grid-template-columns': '1fr' },
                  // the toggle row takes the slack, so the rows sit at the bottom
                  { 'grid-template-rows': 'auto 1fr auto' },
                  { 'align-content': 'stretch' },
                  { 'align-items': 'center' },
                  { 'row-gap': '18px' },
                  { 'min-height': '100%' },
                ],
                custom_fields: fstyle,
              },
              custom_fields: fields,
            };
            /* Returned bare, not wrapped in a one-card vertical-stack. The
               sheet's `height: 100%` is handed to `.content .container > *`,
               and a stack in between has none of its own to pass on - so the
               grid never got the slack its `1fr` row was there to absorb, and
               the tiles sat under the toggle instead of at the bottom. */
            return uiCard;
          }

          return { type: 'vertical-stack', cards: [headerCard, adviceCard, tilesCard] };
        ]]]
  icon_tap_action:
    haptic: light
    action: |
      [[[ return variables.show_toggle ? 'call-service' : 'more-info'; ]]]
    service: |
      [[[
        const s = (entity?.state || '').toLowerCase();
        return ['unlocked', 'unlocking', 'open', 'opening'].includes(s)
          ? 'lock.lock'
          : 'lock.unlock';
      ]]]
    service_data:
      entity_id: '[[[ return entity?.entity_id ]]]'
