hemma_popup_lock:
  template:
  - hemma_popup_base
  variables:
    room_name: null
    locks: []
    battery_entities: {}
    door_sensors: {}
  tap_action:
    haptic: light
    action: |
      [[[
        return window.hemmaPopupAction ? window.hemmaPopupAction() : 'more-info';
      ]]]
    hemma_popup:
      title: |
        [[[
          const T = window._hemmaT || ((k, en, v) => { let s = String(en); if (v) for (const p in v) s = s.split(String.fromCharCode(123) + p + String.fromCharCode(125)).join(String(v[p])); return s; });
          /* The lock badge's own `name:` is a template, and _config.name holds
             its raw source, so only a plain name may fall through to here. */
          const n = String(this._config?.name || '').trim();
          return (variables.room_name || (n.startsWith('[' + '[[') ? '' : n)).trim() || T('locks.popup.title', 'Locks');
        ]]]
      dismissable: true
      popup_styles:
      - style: all
        styles: |
          /* The pane stays - these are control sheets. Only the close control
             keeps what it gained: a surface of its own, and room above it so
             the fill is not against the top edge of the sheet. */
          .header { padding-top: var(--hemma-popup-header-gap, 10px); }
          /* Equal inset on both axes: the bar's own padding plus the
             close control's 2px optical nudge has to come to the same
             number as the padding above it, or the circle sits further
             from the left edge than it does from the top. */
          --hemma-popup-header-gap: 14px;
            --hemma-popup-gutter-wide: 20px;
          /* The chrome arrives with the first plate instead of being there
             on frame one while everything under it fades in. */
          --hemma-popup-chrome-enter:
            hemma-popup-chrome-in 320ms cubic-bezier(0.2, 0.8, 0.3, 1) both;
          .header-title { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
          .header-close {
            border-radius: 50%;
            background: var(--hemma-popup-row-fill, rgba(255, 255, 255, 0.10));
            backdrop-filter: var(--hemma-popup-plate-backdrop, blur(24px) saturate(180%));
            -webkit-backdrop-filter: var(--hemma-popup-plate-backdrop, blur(24px) saturate(180%));
            box-shadow: var(--hemma-popup-plate-shadow, none);
          }
          /* The sheet is full height, so short content floats mid-screen. On
             a phone the card has to fill it for the grid's `1fr` row to have
             any slack to hand the toggle - otherwise the rows bunch under it
             instead of sitting at the bottom.
             Flex, not percentages: .content is `flex: 1 1 auto` inside a
             surface with only a max-height, so `min-height: 100%` here had no
             definite height to resolve against and computed to nothing. A
             flex chain gives every link a real height without one. */
          @media (max-width: 768px) {
            /* The root cause, and why two attempts at the chain below did
               nothing: .surface is capped with max-height, never given one.
               A flex item in a content-sized container is itself
               content-sized, so every percentage under it resolved to
               nothing and the grid's `1fr` row had no slack to hand out.
               Same expression as its own max-height, as a height. */
            .surface {
              height: calc(100svh - var(--hemma-popup-top, 112px) - 8px
                           - var(--safe-area-inset-bottom, 0px));
            }
            .content { display: flex; flex-direction: column; }
            /* A viewport unit, not a percentage. Every attempt to make this
               work by giving each link a definite height failed in the real
               DOM even though the chain measures correct in isolation - so
               the height is taken from the viewport directly and nothing has
               to resolve against a parent at all. 112 is the surface's top
               offset, 58 the header row, 8 the bottom gap. */
            .content .container {
              flex: 1 1 auto;
              min-height: calc(100svh - var(--hemma-popup-top, 112px)
                               - 58px - 8px
                               - var(--safe-area-inset-bottom, 0px));
              display: flex; flex-direction: column; box-sizing: border-box;
            }
            /* The direct child AND anything HA wraps the card in: measured in
               isolation this chain resolves and the tiles land 8px off the
               bottom, so the only way it can still fail is a link in the real
               DOM that this does not name. */
            .content .container > *,
            .content .container hui-card,
            .content .container > * > * {
              flex: 1 1 auto; min-height: 0;
              display: flex; flex-direction: column;
            }
          }
          /* The light panel's width, as Apple Home's panels share one. */
          --popup-min-width: 340px;
          --popup-max-width: 340px;
          --popup-min-width-narrow: 340px;
      content: |
        [[[
          const T = window._hemmaT || ((k, en, v) => { let s = String(en); if (v) for (const p in v) s = s.split(String.fromCharCode(123) + p + String.fromCharCode(125)).join(String(v[p])); return s; });
          /* Variables */
          const groupId  = entity?.entity_id || null;
          /* Filtered, not trusted: a blank entry in this list renders as an
             "Unknown" row with no state behind it. */
          const _validId = (id) => typeof id === 'string' && /^[a-z_]+\.[a-z0-9_]+$/i.test(id.trim());
          const _declared = (Array.isArray(variables.locks) ? variables.locks : [])
                              .map(id => (typeof id === 'string' ? id.trim() : id))
                              .filter(_validId);
          const lockIds  = _declared.length ? _declared : (groupId && _validId(groupId) ? [groupId] : []);

          const _gid     = JSON.stringify(groupId);
          const _lockIds = JSON.stringify(lockIds);

          const _countSnip = `
            const lockIds = ${_lockIds};
            const lc  = lockIds.filter(id => states[id]?.state === 'locked').length;
            const uc  = lockIds.length - lc;
            const tot = lockIds.length;
            const allLkd  = lc === tot && tot > 0;
            const allUlkd = lc === 0   && tot > 0;
            const badgeColor = allLkd ? 'var(--hemma-popup-green-color,#30D158)' : 'var(--hemma-popup-orange-color,#ff9230)';
          `;

          /* Styles (static) */
          const wrapperStyle = [
            ':host { --ha-card-box-shadow: none !important; --button-card-box-shadow: none !important; --button-card-box-shadow-hover: none !important; overflow: visible !important; }',
            'ha-card { background: transparent !important; border: none !important; border-radius: 0 !important; box-shadow: none !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; cursor: default !important; overflow: visible !important; }',
            'ha-card:hover { box-shadow: none !important; }',
            'ha-ripple { display: none !important; }',
          ].join('\n');

          const contentCardStyle = wrapperStyle + '\n@media (max-width: 600px) { ha-card { padding-left: 14px !important; padding-right: 14px !important; } }';

          const tileTapStyle = [
            ':host { --ha-card-box-shadow: none !important; --button-card-box-shadow: none !important; --button-card-box-shadow-hover: inset 0 1px 0.5px -0.5px rgba(255,255,255,calc(var(--hemma-popup-tiles-glow-top-tight,0.20) * 1.5)), inset 0 -1px 0.5px -0.5px rgba(255,255,255,calc(var(--hemma-popup-tiles-glow-bottom-tight,0.15) * 1.5)), inset 0 3px 6px -3px rgba(255,255,255,calc(var(--hemma-popup-tiles-glow-top-soft,0.08) * 1.5)), inset 0 -3px 6px -3px rgba(255,255,255,calc(var(--hemma-popup-tiles-glow-bottom-soft,0.05) * 1.5)) !important; overflow: visible !important; }',
            'ha-card { background: var(--hemma-popup-tiles-fill, rgba(255,255,255,0.08)) !important; border: none !important; border-radius: 24px !important; box-shadow: inset 0 1px 0.5px -0.5px rgba(255,255,255,var(--hemma-popup-tiles-glow-top-tight,0.20)), inset 0 -1px 0.5px -0.5px rgba(255,255,255,var(--hemma-popup-tiles-glow-bottom-tight,0.15)), inset 0 3px 6px -3px rgba(255,255,255,var(--hemma-popup-tiles-glow-top-soft,0.08)), inset 0 -3px 6px -3px rgba(255,255,255,var(--hemma-popup-tiles-glow-bottom-soft,0.05)) !important; backdrop-filter: var(--hemma-popup-tiles-backdrop, blur(10px) saturate(1.1)) !important; -webkit-backdrop-filter: var(--hemma-popup-tiles-backdrop, blur(10px) saturate(1.1)) !important; cursor: default !important; overflow: visible !important; transition: background var(--hemma-popup-tile-hover-duration, 0.2s) ease, box-shadow 0.2s ease !important; }',
            '@media (hover: hover) { ha-card:hover { background: var(--hemma-popup-tile-background-hover, rgba(255,255,255,0.10)) !important; } }',
            'ha-ripple { display: none !important; }',
          ].join('\n');

          const lockTileStaticStyle = [
            ':host { --ha-card-box-shadow: none !important; --button-card-box-shadow: none !important; --button-card-box-shadow-hover: none !important; overflow: visible !important; }',
            'ha-card { border: none !important; border-radius: 24px !important; box-shadow: none !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; cursor: default !important; overflow: visible !important; }',
            '@media (hover: hover) { ha-card:hover { filter: brightness(1.04) !important; } }',
            'ha-ripple { display: none !important; }',
          ].join('\n');

          const lockIconBtnStyle = [
            ':host { --ha-card-box-shadow: none !important; --button-card-box-shadow: none !important; --button-card-box-shadow-hover: none !important; overflow: visible !important; display: block !important; }',
            'ha-card { border: none !important; border-radius: 999px !important; box-shadow: none !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; cursor: pointer !important; overflow: visible !important; aspect-ratio: 1 !important; display: flex !important; align-items: center !important; justify-content: center !important; transition: background 0.15s ease, filter 0.15s ease, transform 0.15s ease !important; }',
            'ha-card:hover { filter: brightness(1.25) !important; transform: scale(1.08) !important; }',
            '#container { display: flex !important; align-items: center !important; justify-content: center !important; }',
            'ha-ripple { display: none !important; }',
          ].join('\n');

          const DR_FRAME = 'M0 23.9297C0 24.4453 0.421875 24.8672 0.9375 24.8672C1.46484 24.8672 1.88672 24.4453 1.88672 23.9297L1.88672 2.50781C1.88672 2.13281 2.13281 1.88672 2.48438 1.88672L15.375 1.88672C15.7266 1.88672 15.9727 2.13281 15.9727 2.50781L15.9727 23.9297C15.9727 24.4453 16.3945 24.8672 16.9219 24.8672C17.4375 24.8672 17.8594 24.4453 17.8594 23.9297L17.8594 2.39062C17.8594 0.960938 16.8867 0 15.4102 0L2.44922 0C0.984375 0 0 0.960938 0 2.39062Z';
          const DR_LEAF = 'M3.25781 24.1992C3.25781 24.4219 3.44531 24.5391 3.66797 24.4453L7.34766 22.8164C7.64062 22.6875 7.75781 22.5938 7.75781 22.2891L7.75781 5.40234C7.75781 5.10938 7.64062 5.00391 7.35938 4.88672L3.66797 3.24609C3.44531 3.15234 3.25781 3.26953 3.25781 3.50391Z';
          const drSvg = (h, fill) => '<svg width="' + (h * 18.2109 / 24.8789).toFixed(2) + '" height="' + h + '" viewBox="0 0 18.2109 24.8789" style="display:block;">'
            + '<path d="' + DR_FRAME + '" fill="' + fill + '" fill-opacity="0.425"/>'
            + '<path d="' + DR_LEAF + '" fill="' + fill + '" fill-opacity="0.9"/></svg>';
          const _drTileD = JSON.stringify(drSvg(21, '#FFCC00'));
          const _drTileM = JSON.stringify(drSvg(20, '#FFCC00'));

          const openBtnStyle = [
            ':host { --ha-card-box-shadow: none !important; --button-card-box-shadow: none !important; --button-card-box-shadow-hover: none !important; }',
            'ha-card { border: none !important; border-radius: 999px !important; box-shadow: none !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; cursor: pointer !important; transition: background 0.15s ease, filter 0.15s ease !important; }',
            'ha-card:hover { filter: brightness(1.25) !important; }',
            '#container { display: flex !important; align-items: center !important; justify-content: center !important; }',
            'ha-ripple { display: none !important; }',
          ].join('\n');

          /* Header card */
          const headerCard = {
            type: 'custom:button-card',
            entity: groupId,
            tap_action: { action: 'none' },
            show_icon: false, show_name: false, show_label: false, show_state: false,
            card_mod: { style: contentCardStyle },
            styles: {
              card: [
                { background: 'transparent' }, { border: 'none' }, { 'box-shadow': 'none' },
                { padding: '28px 28px 0 28px' },
              ],
              grid: [
                { 'grid-template-areas': '"title"' },
                { 'grid-template-columns': '1fr auto' },
                { 'align-items': 'flex-start' },
                { 'row-gap': '16px' },
              ],
              custom_fields: {
                title: [{ 'justify-self': 'start' }, { 'text-align': 'left' }],
                right: [{ 'justify-self': 'end' }, { 'align-self': 'flex-start' }],
              },
            },
            custom_fields: {
              title: `[[[
                return '<div style="font-family:var(--primary-font-family,system-ui);color:var(--hemma-popup-tiles-text-primary,#ffffff);text-align:left;">'
                + '</div>';
              ]]]`,
            },
          };

          /* Advice card */
          const adviceCard = {
            type: 'custom:button-card',
            entity: groupId,
            tap_action: { action: 'none' },
            show_icon: false, show_name: false, show_label: false, show_state: false,
            card_mod: { style: contentCardStyle },
            styles: {
              card: [
                { background: 'transparent' }, { border: 'none' }, { 'box-shadow': 'none' },
                { padding: '20px 28px 18px 28px' },
              ],
              grid: [{ 'grid-template-areas': '"body"' }, { 'grid-template-columns': '1fr' }],
              custom_fields: { body: [{ 'justify-self': 'stretch' }, { width: '100%' }, { 'text-align': 'left' }] },
            },
            custom_fields: {
              body: `[[[
                const T = window._hemmaT || ((k, en, v) => { let s = String(en); if (v) for (const p in v) s = s.split(String.fromCharCode(123) + p + String.fromCharCode(125)).join(String(v[p])); return s; });
                ${_countSnip}
                const advice = allLkd  ? (tot === 1 ? T('locks.popup.door_locked', 'Door locked') : T('locks.popup.all_doors_locked', 'All doors locked'))
                             : allUlkd ? (tot === 1 ? T('locks.popup.door_unlocked', 'Door unlocked') : T('locks.popup.all_doors_unlocked', 'All doors unlocked'))
                             : uc === 1 ? T('locks.popup.one_door_unlocked', '1 door unlocked') : T('locks.popup.n_doors_unlocked', '{n} doors unlocked', { n: uc });
                return '<div style="font-family:var(--primary-font-family,system-ui);">'
                  + '<div style="font-size:22px;color:var(--primary-text-color,#ffffff);font-weight:400;letter-spacing:-.5px;">' + advice + '</div>'
                + '</div>';
              ]]]`,
            },
          };

          /* Lock tiles */
          const makeLockTile = (lockId) => {
            const _lid = JSON.stringify(lockId);

            const rawName = states[lockId]?.attributes?.friendly_name || lockId.split('.').pop() || lockId;
            let tileName = rawName;
            if (tileName.includes(')')) tileName = tileName.substring(tileName.lastIndexOf(')') + 1);
            tileName = tileName.replace(/^[-\s]+/, '').replace(/_/g, ' ').trim() || rawName;
            const _name = JSON.stringify(tileName);

            const battId = (variables.battery_entities && variables.battery_entities[lockId]) || null;
            const _battId = JSON.stringify(battId);
            const doorId = (variables.door_sensors && variables.door_sensors[lockId]) || null;
            const _doorId = JSON.stringify(doorId);

            const togglePillCard = {
              type: 'custom:button-card',
              entity: lockId,
              show_icon: false,
              show_name: false,
              show_state: false,
              show_label: false,
              show_entity_picture: false,
              tap_action: `[[[
                const lockId = ${_lid};
                const s = states[lockId]?.state;
                if (s === 'locked') return { action: 'call-service', service: 'lock.unlock', service_data: { entity_id: lockId } };
                if (s === 'unlocked') return { action: 'call-service', service: 'lock.lock', service_data: { entity_id: lockId } };
                return { action: 'none' };
              ]]]`,
              haptic: 'medium',
              extra_styles: `
                @keyframes hemma-thumb-on-d{from{transform:translateX(0)}to{transform:translateX(20px)}}
                @keyframes hemma-thumb-off-d{from{transform:translateX(20px)}to{transform:translateX(0)}}
                @keyframes hemma-thumb-on-m{from{transform:translateX(0)}to{transform:translateX(20px)}}
                @keyframes hemma-thumb-off-m{from{transform:translateX(20px)}to{transform:translateX(0)}}
                :host { display: block !important; overflow: visible !important; }
                ha-card { background: transparent !important; border: none !important; box-shadow: none !important; backdrop-filter: none !important; padding: 0 !important; overflow: visible !important; cursor: pointer !important; }
                #container { padding: 0 !important; overflow: visible !important; }
                ha-ripple { display: none !important; }
                svg .lk-hover-track { opacity: 0; transition: opacity 0.2s ease; pointer-events: none; }
                svg .lk-overlay { fill: transparent; transition: fill 0.2s ease; pointer-events: none; }
                @media (hover: hover) {
                  :host(:hover) svg .lk-hover-track { opacity: 0.65; }
                  :host(:hover) svg .lk-overlay { fill: rgba(255,255,255,0.06); }
                }
              `,
              styles: {
                card: [{ background: 'transparent' }, { border: 'none' }, { 'box-shadow': 'none' }, { padding: '0' }, { overflow: 'visible' }],
                grid: [{ 'grid-template-areas': '"svg"' }, { 'grid-template-columns': 'auto' }, { 'align-items': 'center' }, { 'justify-items': 'center' }],
                custom_fields: { svg: [{ 'line-height': '0' }] },
              },
              custom_fields: {
                svg: `[[[
                  const KF_ID = 'hemma-toggle-kf-v14';
                  if (!document.getElementById(KF_ID)) {
                    const kf = document.createElement('style');
                    kf.id = KF_ID;
                    kf.textContent = '@keyframes hemma-thumb-on-d{from{transform:translateX(0)}to{transform:translateX(20px)}}@keyframes hemma-thumb-off-d{from{transform:translateX(20px)}to{transform:translateX(0)}}@keyframes hemma-thumb-on-m{from{transform:translateX(0)}to{transform:translateX(20px)}}@keyframes hemma-thumb-off-m{from{transform:translateX(20px)}to{transform:translateX(0)}}@keyframes hemma-lk-svg-fade{from{opacity:0.15}to{opacity:1}}';
                    document.head.appendChild(kf);
                  }
                  const mob = window.matchMedia('(max-width:767px),(max-height:600px)').matches;
                  const W = mob ? 60 : 62, H = mob ? 40 : 42, r = mob ? 15 : 16, cx0 = mob ? 21 : 22;
                  const travel = 20;
                  const SW = W + 2;
                  const lockId = ${_lid};
                  const s = states[lockId]?.state;
                  const isTransitioning = s === 'locking' || s === 'unlocking';
                  const thumbRight = s === 'locked' || s === 'locking';
                  const stateKey = '_hemma_lk_' + lockId.replace(/[^a-zA-Z0-9]/g, '_');
                  const prevState = window[stateKey];
                  const prevThumbRight = prevState === 'locked' || prevState === 'locking';
                  const shouldAnimate = prevState !== undefined && prevThumbRight !== thumbRight;
                  window[stateKey] = s;
                  const gClass = shouldAnimate ? (thumbRight ? 'lk-on' : 'lk-off') : '';
                  const gCx = (!shouldAnimate && thumbRight) ? cx0 + travel : cx0;
                  const trackFill = s === 'locked' ? 'rgba(52,199,89,0.25)' : s === 'unlocked' ? 'rgba(255,59,48,0.25)' : 'rgba(255,204,0,0.25)';
                  const trackStroke = s === 'locked' ? '' : s === 'unlocked' ? ' stroke="rgba(255,59,48,0.4)" stroke-width="1.5"' : ' stroke="rgba(255,204,0,0.40)" stroke-width="1.5"';
                  const thumbFill = s === 'locked' ? '#34C759' : s === 'unlocked' ? '#FF3B30' : '#FFCC00';
                  const prevThumbFill = prevState === 'locked' ? '#34C759' : prevState === 'unlocked' ? '#FF3B30' : prevState ? '#FFCC00' : null;
                  const prevTrackFill = prevState === 'locked' ? 'rgba(52,199,89,0.25)' : prevState === 'unlocked' ? 'rgba(255,59,48,0.25)' : prevState ? 'rgba(255,204,0,0.25)' : null;
                  const shouldColorFade = prevThumbFill !== null && prevThumbFill !== thumbFill;
                  const trkCls = shouldColorFade ? ' class="lk-tc"' : '';
                  const cirCls = shouldColorFade ? ' class="lk-cc"' : '';
                  const imgCls = isTransitioning ? ' class="lk-pls"' : '';
                  const imgSt = isTransitioning ? 'filter:drop-shadow(0px 0.5px 1.5px rgba(0,0,0,0.4));' : 'opacity:0.95;filter:drop-shadow(0px 0.5px 1.5px rgba(0,0,0,0.4));';
                  const LK_PATH = 'M2.63672 22.9922L13.3594 22.9922C15.082 22.9922 15.9961 22.0547 15.9961 20.2031L15.9961 12.1289C15.9961 10.2773 15.082 9.35156 13.3594 9.35156L2.63672 9.35156C0.914062 9.35156 0 10.2773 0 12.1289L0 20.2031C0 22.0547 0.914062 22.9922 2.63672 22.9922ZM2.05078 10.2539L3.91406 10.2539L3.91406 6.29297C3.91406 3.33984 5.80078 1.76953 7.99219 1.76953C10.1836 1.76953 12.0938 3.33984 12.0938 6.29297L12.0938 10.2539L13.9453 10.2539L13.9453 6.55078C13.9453 2.14453 11.0625 0 7.99219 0C4.93359 0 2.05078 2.14453 2.05078 6.55078Z';
                  return '<svg width="' + SW + '" height="' + H + '" viewBox="0 0 ' + SW + ' ' + H + '" style="display:block;overflow:visible;">'
                    + '<defs><style>'
                    + '.lk-on{animation:lk-slide-on 0.2s ease forwards}'
                    + '.lk-off{animation:lk-slide-off 0.2s ease forwards}'
                    + '@keyframes lk-slide-on{from{transform:translateX(0)}to{transform:translateX(' + travel + 'px)}}'
                    + '@keyframes lk-slide-off{from{transform:translateX(' + travel + 'px)}to{transform:translateX(0)}}'
                    + '.lk-pls{animation:lk-pulse 1.2s ease-in-out infinite}'
                    + '@keyframes lk-pulse{0%,100%{opacity:0.85}50%{opacity:0.15}}'
                    + (shouldColorFade ? '.lk-tc{animation:lk-track-clr 0.3s ease forwards}.lk-cc{animation:lk-thumb-clr 0.3s ease forwards}@keyframes lk-track-clr{from{fill:' + prevTrackFill + '}to{fill:' + trackFill + '}}@keyframes lk-thumb-clr{from{fill:' + prevThumbFill + '}to{fill:' + thumbFill + '}}' : '')
                    + '</style></defs>'
                    + '<rect x="2" y="1" width="' + (W-2) + '" height="' + (H-2) + '" rx="' + ((H-2)/2) + '"' + trkCls + ' fill="' + trackFill + '"' + trackStroke + '/>'
                    + '<rect class="lk-hover-track" x="2" y="1" width="' + (W-2) + '" height="' + (H-2) + '" rx="' + ((H-2)/2) + '" fill="' + trackFill + '"' + trackStroke + '/>'
                    + '<rect class="lk-overlay" x="2" y="1" width="' + (W-2) + '" height="' + (H-2) + '" rx="' + ((H-2)/2) + '" fill="transparent"/>'
                    + '<g class="' + gClass + '">'
                      + '<circle cx="' + gCx + '" cy="' + (H/2) + '" r="' + r + '"' + cirCls + ' fill="' + thumbFill + '"/>'
                      + '<svg x="' + (gCx - r + 7) + '" y="' + ((H/2) - r + 7) + '" width="' + (r*2 - 14) + '" height="' + (r*2 - 14) + '" viewBox="0 0 16.3477 23.6133"' + imgCls + ' style="' + imgSt + '"><path d="' + LK_PATH + '" fill="white"/></svg>'
                    + '</g>'
                    + '</svg>';
                ]]]`,
              },
            };

            /* "Open door" button */
            const supportsOpen = !!((states[lockId]?.attributes?.supported_features || 0) & 1);

