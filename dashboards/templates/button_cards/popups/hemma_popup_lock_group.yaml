hemma_popup_lock:
  template:
  - hemma_popup_base
  variables:
    room_name: null
    locks: []
    battery_entities: {}
    show_battery: false
    door_sensors: {}
  tap_action:
    haptic: light
    action: |
      [[[
        return window.hemmaPopupAction ? window.hemmaPopupAction() : 'more-info';
      ]]]
    hemma_popup:
      title: ''
      dismissable: true
      close: false
      style: '--popup-min-width: 300px; --popup-max-width: 300px; --popup-min-width-narrow: 300px; --hemma-popup-radius: 34px; --hemma-popup-tint: rgba(0, 0, 5, 0.16);'
      content:
        type: custom:hemma-lock-panel
        entity: '[[[ return entity?.entity_id || null; ]]]'
        name: |
          [[[
            const n = String(this._config?.name || '').trim();
            return (variables.room_name || (n.startsWith('[' + '[[') || n.indexOf('<') >= 0 ? '' : n)).trim();
          ]]]
        locks: '[[[ return Array.isArray(variables.locks) ? variables.locks : []; ]]]'
        battery: '[[[ return variables.battery_entities || {}; ]]]'
        show_battery: '[[[ return variables.show_battery === true; ]]]'
        doors: '[[[ return variables.door_sensors || {}; ]]]'
  icon_tap_action:
    haptic: light
    action: call-service
    service: |
      [[[
        const s = (entity?.state || '').toLowerCase();
        return ['unlocked', 'unlocking', 'open', 'opening'].includes(s)
          ? 'lock.lock'
          : 'lock.unlock';
      ]]]
    service_data:
      entity_id: '[[[ return entity?.entity_id ]]]'
