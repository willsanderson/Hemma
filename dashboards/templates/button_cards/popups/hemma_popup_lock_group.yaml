                    const lockId = ${_lid};
                    const name   = ${_name};
                    const battId = ${_battId};
                    const doorId = ${_doorId};
                    const s = states[lockId]?.state || 'unavailable';
                    const locked = s === 'locked';
                    const unlkd  = s === 'unlocked';
                    const trans  = !locked && !unlkd;
                    const doorOpen = doorId ? states[doorId]?.state === 'on' : false;
                    const nmCol  = trans && !doorOpen ? 'rgba(255,255,255,0.4)' : unlkd ? 'rgba(0,0,0,0.85)' : 'var(--hemma-popup-tiles-text-primary,#ffffff)';
                    const battPct = battId && states[battId] ? Math.round(Number(states[battId].state)) : null;
                    const stateLabel = doorOpen ? 'Door Open'
                                    : s === 'locked' ? 'Locked' : s === 'unlocked' ? 'Unlocked' : s === 'locking' ? 'Locking…' : s === 'unlocking' ? 'Unlocking…' : 'Unavailable';
                    const stateCol = doorOpen ? (unlkd ? 'rgba(160,110,0,0.90)' : 'var(--hemma-color-yellow,#FFCC00)') : unlkd ? 'rgba(0,0,0,0.50)' : 'rgba(255,255,255,0.45)';
                    const safeId = lockId.replace(/[^a-zA-Z0-9]/g,'_');
                    const showBatt = !!window['_hemma_lk_batt_' + safeId] && battPct !== null && !doorOpen;
                    const battLow = battPct !== null && battPct < 20;
                    const battCol = battLow ? 'rgba(255,59,48,0.85)' : unlkd ? 'rgba(0,0,0,0.50)' : 'rgba(255,255,255,0.60)';
                    const stOp = showBatt ? '0' : '1';
                    const btOp = (showBatt && battPct !== null) ? '1' : '0';
                    const oc = "(function(ev){ev.stopPropagation();var k='_hemma_lk_batt_" + safeId + "';window[k]=!window[k];var b=ev.currentTarget.querySelector('.lk-bt'),s=ev.currentTarget.querySelector('.lk-st'),h=b&&b.dataset.has==='1';if(s)s.style.opacity=(!window[k]||!h)?'1':'0';if(b)b.style.opacity=(window[k]&&h)?'1':'0';})(event)";
                    return '<div onpointerdown="' + oc + '" style="cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;overflow:hidden;">'
                      + '<div style="font-size:15px;color:' + nmCol + ';font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + name + '</div>'
                      + '<div style="position:relative;height:16px;margin-top:3px;">'
                        + '<div class="lk-st" style="position:absolute;top:0;left:0;right:0;opacity:' + stOp + ';transition:opacity 0.18s ease;font-size:12px;color:' + stateCol + ';white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + stateLabel + '</div>'
                        + '<div class="lk-bt" data-has="' + (battPct !== null ? '1' : '0') + '" style="position:absolute;top:0;left:0;right:0;opacity:' + btOp + ';transition:opacity 0.18s ease;font-size:12px;color:' + battCol + ';white-space:nowrap;">' + (battPct !== null ? battPct + '% battery' : '') + '</div>'
                      + '</div>'
                    + '</div>';
                  ]]]`,
                  action: { card: actionGroup },
                },
              };
            };

            const _tileMob = window.matchMedia('(max-width:767px),(max-height:600px)').matches;
            const _twoCols = !_tileMob && lockIds.length > 1;
            const tileAreas = _twoCols
              ? lockIds.reduce((acc, _, i) => {
                  if (i % 2 === 0) {
                    const hasNext = lockIds[i + 1] !== undefined;
                    acc.push(hasNext ? '"l' + i + ' l' + (i + 1) + '"' : '"l' + i + ' ."');
                  }
                  return acc;
                }, []).join(' ')
              : lockIds.map((_, i) => '"l' + i + '"').join(' ');
            const tileCF = {}, tileFS = {};
            lockIds.forEach((id, i) => {
              tileCF['l' + i] = { card: makeLockTile(id) };
              tileFS['l' + i] = [{ 'justify-self': 'stretch' }];
            });

            const tilesCard = {
              type: 'custom:button-card',
              entity: groupId,
              tap_action: { action: 'none' },
              show_icon: false, show_name: false, show_label: false, show_state: false,
              card_mod: { style: contentCardStyle },
              styles: {
                card: [
                  { background: 'transparent' }, { border: 'none' }, { 'box-shadow': 'none' },
                  { padding: '4px 28px 20px 28px' },
                ],
                grid: [
                  { 'grid-template-areas': tileAreas },
                  { 'grid-template-columns': _twoCols ? '1fr 1fr' : '1fr' },
                  { gap: '8px' },
                  { 'align-items': 'start' },
                ],
                custom_fields: tileFS,
              },
              custom_fields: tileCF,
            };

            return { type: 'vertical-stack', cards: [headerCard, adviceCard, tilesCard] };
          ]]]

