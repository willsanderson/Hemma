hemma_popup_light_panel:
  template:
  - hemma_popup_base
  tap_action:
    haptic: light
    action: |
      [[[
        return window.hemmaPopupAction ? window.hemmaPopupAction() : 'more-info';
      ]]]
    entity: '[[[ return entity?.entity_id; ]]]'
    hemma_popup:
      title: ''
      dismissable: true
      style: '--popup-min-width: 340px; --popup-max-width: 340px; --popup-min-width-narrow: 340px; --hemma-popup-radius: 34px;'
      content:
        type: custom:hemma-light-panel
        entity: '[[[ const g = variables.popup_group; return g && g !== "none" ? g : entity?.entity_id; ]]]'
        name: |
          [[[
            const n = String(this._config?.name || '').trim();
            const g = variables.popup_group && variables.popup_group !== 'none' ? states[variables.popup_group] : null;
            return n && !n.startsWith('[' + '[[') && n.indexOf('<') < 0 ? n : ((g || entity)?.attributes?.friendly_name || '');
          ]]]
        lights: '[[[ return Array.isArray(variables.lights) && variables.lights.length ? variables.lights : null; ]]]'
  hold_action:
    haptic: light
    action: |
      [[[
        return window.hemmaPopupAction ? window.hemmaPopupAction() : 'more-info';
      ]]]
    entity: '[[[ return entity?.entity_id; ]]]'
    hemma_popup:
      title: ''
      dismissable: true
      style: '--popup-min-width: 340px; --popup-max-width: 340px; --popup-min-width-narrow: 340px; --hemma-popup-radius: 34px;'
      content:
        type: custom:hemma-light-panel
        entity: '[[[ const g = variables.popup_group; return g && g !== "none" ? g : entity?.entity_id; ]]]'
        name: |
          [[[
            const n = String(this._config?.name || '').trim();
            const g = variables.popup_group && variables.popup_group !== 'none' ? states[variables.popup_group] : null;
            return n && !n.startsWith('[' + '[[') && n.indexOf('<') < 0 ? n : ((g || entity)?.attributes?.friendly_name || '');
          ]]]
        lights: '[[[ return Array.isArray(variables.lights) && variables.lights.length ? variables.lights : null; ]]]'
