hemma_popup_battery:
  template:
  - hemma_popup_base
  variables:
    room_name: null
    batteries: null
    battery_entities: {}
    device_icons: {}
    device_names: {}
    entity_filter: null
  tap_action:
    haptic: light
    action: |
      [[[
        return window.hemmaPopupAction ? window.hemmaPopupAction() : 'more-info';
      ]]]
    entity: '[[[ return entity?.entity_id; ]]]'
    hemma_popup:
      title: ''
      dismissable: true
      close: false
      style: '--popup-min-width: 340px; --popup-max-width: 340px; --popup-min-width-narrow: 340px; --hemma-popup-radius: 34px; --hemma-popup-tint: rgba(0, 0, 5, 0.16);'
      content:
        type: custom:hemma-battery-panel
        entity: '[[[ return entity?.entity_id || null; ]]]'
        batteries: '[[[ return Array.isArray(variables.batteries) ? variables.batteries : null; ]]]'
        entity_filter: '[[[ return Array.isArray(variables.entity_filter) ? variables.entity_filter : null; ]]]'
        pairs: '[[[ return variables.battery_entities || {}; ]]]'
        icons: '[[[ return variables.device_icons || {}; ]]]'
        names: '[[[ return variables.device_names || {}; ]]]'
  icon_tap_action:
    haptic: light
    action: |
      [[[
        return window.hemmaPopupAction ? window.hemmaPopupAction() : 'more-info';
      ]]]
    entity: '[[[ return entity?.entity_id; ]]]'
    hemma_popup:
      title: ''
      dismissable: true
      close: false
      style: '--popup-min-width: 340px; --popup-max-width: 340px; --popup-min-width-narrow: 340px; --hemma-popup-radius: 34px; --hemma-popup-tint: rgba(0, 0, 5, 0.16);'
      content:
        type: custom:hemma-battery-panel
        entity: '[[[ return entity?.entity_id || null; ]]]'
        batteries: '[[[ return Array.isArray(variables.batteries) ? variables.batteries : null; ]]]'
        entity_filter: '[[[ return Array.isArray(variables.entity_filter) ? variables.entity_filter : null; ]]]'
        pairs: '[[[ return variables.battery_entities || {}; ]]]'
        icons: '[[[ return variables.device_icons || {}; ]]]'
        names: '[[[ return variables.device_names || {}; ]]]'
