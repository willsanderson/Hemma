hemma_popup_recent_panel:
  variables:
    hide_spoilers: false
  tap_action:
    haptic: light
    action: |
      [[[
        return window.hemmaPopupAction ? window.hemmaPopupAction() : 'more-info';
      ]]]
    entity: '[[[ return entity?.entity_id; ]]]'
    hemma_popup:
      title: ''
      dismissable: true
      style: '--popup-min-width: 600px; --popup-max-width: 600px; --popup-min-width-narrow: 600px; --hemma-popup-radius: 34px;'
      content:
        type: custom:hemma-recent-panel
        hide_spoilers: '[[[ return variables.hide_spoilers === true; ]]]'
