# Network Popup
hemma_popup_network:
  template:
    - hemma_popup_base

  variables:
    room_name: null

    entity_download: null
    entity_upload: null
    entity_ping: null
    entity_status: null

    entity_stat_1: null
    entity_stat_2: null
    entity_stat_3: null
    entity_stat_4: null

    action_1_entity: null
    action_1_label: null
    action_2_entity: null
    action_2_label: null

    action_1_status: null
    action_2_status: null

    action_1_confirm_helper: null
    action_2_confirm_helper: null

    action_1_done_helper: null
    action_2_done_helper: null

    idle_threshold: 1
    light_threshold: 10
    heavy_threshold: 50

  tap_action:
    browser_mod:
      data:
        popup_styles:
          - style: all
            styles: |
              ha-adaptive-dialog, ha-dialog, wa-drawer {
                --dialog-surface-margin-top: 90px;
                --ha-card-backdrop-filter: none;
                --ha-card-background: transparent;
                --card-background-color: transparent;
                --ha-card-box-shadow: none;
                --ha-card-border-width: 0px;
              }
        content: |
          [[[
            /* Helpers */

            const safeNum = (id) => {
              if (!id) return null;
              const s = states[id]?.state;
              if (!s || s === 'unavailable' || s === 'unknown') return null;
              const n = parseFloat(s);
              return isNaN(n) ? null : n;
            };

            const displayPrecision = (id) => {
              if (!id) return null;
              const reg = hass?.entities?.[id];
              if (reg?.display_precision != null) return reg.display_precision;
              const suggested = states[id]?.attributes?.suggested_display_precision;
              if (suggested != null) return suggested;
              return null;
            };

            const fmt = (v, id) => {
              if (v == null) return '—';
              const prec = displayPrecision(id);
              if (prec != null) return v.toFixed(prec);
              return v >= 100 ? Math.round(v).toString() : v.toFixed(1);
            };

            const friendlyName = (id, fallback = 'Sensor') => {
              if (!id) return fallback;
              const raw = states[id]?.attributes?.friendly_name;
              if (raw) return raw;

              const slug = String(id).split('.')[1] || id;
              return slug
                .replace(/_/g, ' ')
                .replace(/\b\w/g, c => c.toUpperCase());
            };

            const baseCard = {
              type: 'custom:button-card',
              show_icon: false,
              show_name: false,
              show_label: false,
              show_state: false,
            };

            // Tooltip time format
            const _tf = hass?.locale?.time_format;
            const _use12hr = _tf === '12' || (_tf !== '24' && new Intl.DateTimeFormat(hass?.locale?.language || 'en', { hour: 'numeric' }).resolvedOptions().hour12);
            const tooltipTimeFormat = _use12hr ? 'h:mm tt' : 'HH:mm';

            /* Shared Local Styles */

            const noHoverStyle = `
              :host {
                --ha-card-box-shadow: none !important;
                --button-card-box-shadow: none !important;
                --button-card-box-shadow-hover: none !important;
              }

              ha-card {
                background: transparent !important;
                border: none !important;
                border-radius: 0 !important;
                box-shadow: none !important;
                backdrop-filter: none !important;
                -webkit-backdrop-filter: none !important;
                overflow: visible !important;
                cursor: default !important;
              }

              ha-card:hover {
                box-shadow: none !important;
                border-color: transparent !important;
              }

              ha-ripple {
                display: none !important;
              }
            `;

            const wrapperStyle = noHoverStyle;
            const contentCardStyle = noHoverStyle + `@media (max-width: 600px) { ha-card { padding-left: 14px !important; padding-right: 14px !important; } }`;

            const tileTapStyle = `
              :host { --ha-card-box-shadow: none !important; --button-card-box-shadow: none !important; --button-card-box-shadow-hover: inset 0 1px 0.5px -0.5px rgba(255,255,255,calc(var(--hemma-popup-tiles-glow-top-tight,0.20) * 1.5)), inset 0 -1px 0.5px -0.5px rgba(255,255,255,calc(var(--hemma-popup-tiles-glow-bottom-tight,0.15) * 1.5)), inset 0 3px 6px -3px rgba(255,255,255,calc(var(--hemma-popup-tiles-glow-top-soft,0.08) * 1.5)), inset 0 -3px 6px -3px rgba(255,255,255,calc(var(--hemma-popup-tiles-glow-bottom-soft,0.05) * 1.5)) !important; }
              ha-card { background: var(--hemma-popup-tiles-fill, rgba(255,255,255,0.07)) !important; border: none !important; border-radius: 24px !important; box-shadow: inset 0 1px 0.5px -0.5px rgba(255,255,255,var(--hemma-popup-tiles-glow-top-tight,0.20)), inset 0 -1px 0.5px -0.5px rgba(255,255,255,var(--hemma-popup-tiles-glow-bottom-tight,0.15)), inset 0 3px 6px -3px rgba(255,255,255,var(--hemma-popup-tiles-glow-top-soft,0.08)), inset 0 -3px 6px -3px rgba(255,255,255,var(--hemma-popup-tiles-glow-bottom-soft,0.05)) !important; backdrop-filter: var(--hemma-popup-tiles-backdrop, blur(10px) saturate(1.1)) !important; -webkit-backdrop-filter: var(--hemma-popup-tiles-backdrop, blur(10px) saturate(1.1)) !important; cursor: pointer !important; transform: scale(1) !important; transition: background-color var(--hemma-popup-tile-hover-duration, 0.2s) ease, transform var(--hemma-popup-tile-hover-duration, 0.2s) ease, box-shadow 0.2s ease !important; }
              ha-card:hover { background: var(--hemma-popup-tile-hover, rgba(255,255,255,0.09)) !important; transform: scale(var(--hemma-popup-tile-hover-scale, 1.01)) !important; }
              ha-ripple { display: none !important; }
              @keyframes hemma-action-swap { from { opacity:0; } to { opacity:1; } }
              @keyframes hemma-ca-in { from { opacity:0; } to { opacity:1; } }
            `;

            const tapStyle = `
              :host {
                --ha-card-box-shadow: none !important;
                --button-card-box-shadow: none !important;
                --button-card-box-shadow-hover: none !important;
              }

              ha-card {
                background: transparent !important;
                border: none !important;
                border-radius: 0 !important;

                box-shadow: none !important;

                backdrop-filter: none !important;
                -webkit-backdrop-filter: none !important;

                overflow: visible !important;
              }

              ha-card #container {
                transition:
                  opacity 0.18s ease,
                  filter 0.18s ease !important;
              }

              ha-card:hover #container {

                opacity: 1;

                filter:
                  brightness(1.12)
                  saturate(1.08)
                  drop-shadow(0 0 10px rgba(255,255,255,0.05));
              }

              ha-ripple {
                display: none !important;
              }
            `;

            /* card_mod lands too late to hide the empty chart shell, so the
               entrance animation runs from apex_config instead. EVAL: is
               apexcharts-card's hook for a function in a serialised config. */
            const chartEnter = 'EVAL:' + [
              'function (ctx) {',
              '  try {',
              '    var graph = ctx && ctx.el;',
              '    if (!graph || (ctx.w && ctx.w.globals && ctx.w.globals.noData)) return;',
              '    var wrap = graph.closest("#graph-wrapper") || graph.parentElement;',
              '    if (!wrap || !graph.animate || wrap.dataset.hemmaChartEntered) return;',
              '    wrap.dataset.hemmaChartEntered = "1";',
              '    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) {',
              '      graph.animate([{ opacity: 0 }, { opacity: 1 }],',
              '        { duration: 200, easing: "ease-out", fill: "backwards" });',
              '      return;',
              '    }',
              '    /* squash, not lift, drives the apparent rise; raise it for less. */',
              '    var D = { persp: 640, z: -130, lift: 8, squash: 0.34, blur: 9, floor: 10 };',
              '    /* Clip goes on the stationary wrapper; on #graph it would travel along. */',
              '    var n = graph.getRootNode().host, guard = 0, edge = null;',
              '    while (n && guard++ < 6 && edge === null) {',
              '      var sib = n.nextElementSibling;',
              '      if (sib) { var sr = sib.getBoundingClientRect(); if (sr.height) edge = sr.top; }',
              '      n = n.parentElement || (n.getRootNode() && n.getRootNode().host);',
              '    }',
              '    if (edge !== null) {',
              '      var gap = Math.round(edge - wrap.getBoundingClientRect().bottom);',
              '      if (gap > -40 && gap < 80) D.floor = gap;',
              '    }',
              '    var fy = D.floor < 0 ? "calc(100% - " + Math.abs(D.floor) + "px)"',
              '                         : "calc(100% + " + D.floor + "px)";',
              '    wrap.style.clipPath =',
              '      "polygon(-100% -200%, 200% -200%, 200% " + fy + ", -100% " + fy + ")";',
              '    graph.style.transformOrigin = "50% 90%";',
              '    var from = "perspective(" + D.persp + "px) translateZ(" + D.z + "px)"',
              '             + " translateY(" + D.lift + "px) scaleY(" + D.squash + ")";',
              '    var to = "perspective(" + D.persp + "px) translateZ(0px)"',
              '           + " translateY(0px) scaleY(1)";',
              '    graph.animate([{ opacity: 0 }, { opacity: 1 }],',
              '      { duration: 600, easing: "ease-out", fill: "backwards" });',
              '    graph.animate([{ filter: "blur(" + D.blur + "px)" }, { filter: "blur(0px)" }],',
              '      { duration: 600, easing: "ease-out", fill: "backwards" });',
              '    var rise = graph.animate([{ transform: from }, { transform: to }],',
              '      { duration: 700, easing: "cubic-bezier(0.22, 1, 0.36, 1)", fill: "backwards" });',
              '    /* Clear the clip or it can trap a tooltip later. */',
              '    var unclip = function () { wrap.style.clipPath = ""; };',
              '    if (rise.finished) rise.finished.then(unclip).catch(unclip);',
              '    else rise.onfinish = unclip;',
              '  } catch (e) {}',
              '}',
            ].join('\n');

            const graphStyle = `
              :host {
                position: relative !important;
                z-index: 1 !important;
                --ha-card-box-shadow: none !important;
                --button-card-box-shadow: none !important;
                --button-card-box-shadow-hover: none !important;
              }

              ha-card {
                background: transparent !important;
                border: none !important;
                border-radius: 0 !important;
                box-shadow: none !important;
                backdrop-filter: none !important;
                -webkit-backdrop-filter: none !important;
                overflow: visible !important;
                --primary-color: transparent !important;
              }

              ha-card:hover { box-shadow: none !important; border-color: transparent !important; }
              #spinner-wrapper { display: none !important; }

              #graph {
                margin: 0 !important;
                padding: 8px 0 !important;
                overflow: visible !important;
                background: transparent !important;
              }

              .apexcharts-canvas { overflow: visible !important; background: transparent !important; }

              .apexcharts-canvas > svg {
                -webkit-mask-image:
                  linear-gradient(to right, rgba(0,0,0,0) 0%, rgba(0,0,0,0) 4%, rgba(0,0,0,0.4) 12%, black 22%, black 78%, rgba(0,0,0,0.4) 88%, rgba(0,0,0,0) 96%, rgba(0,0,0,0) 100%),
                  linear-gradient(to bottom, transparent 0%, black 10%, black 82%, transparent 100%);
                mask-image:
                  linear-gradient(to right, rgba(0,0,0,0) 0%, rgba(0,0,0,0) 4%, rgba(0,0,0,0.4) 12%, black 22%, black 78%, rgba(0,0,0,0.4) 88%, rgba(0,0,0,0) 96%, rgba(0,0,0,0) 100%),
                  linear-gradient(to bottom, transparent 0%, black 10%, black 82%, transparent 100%);
                -webkit-mask-composite: destination-in;
                mask-composite: intersect;
                -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
                -webkit-mask-size: 100% 100%; mask-size: 100% 100%;
              }

              .apexcharts-tooltip {
                transition: opacity 0.12s ease !important;
                display: inline-block !important;
                width: max-content !important;
                max-width: 200px !important;
                min-width: 80px !important;
                white-space: nowrap !important;
                --hemma-chart-tooltip-fill: rgba(22,22,24,0.78);
                background:
                  linear-gradient(var(--hemma-glass-background, rgba(255,255,255,0.10)),
                                  var(--hemma-glass-background, rgba(255,255,255,0.10))),
                  var(--hemma-chart-tooltip-fill) !important;
                border: none !important;
                border-radius: 14px !important;
                box-shadow: var(--hemma-glass-rim,
                  inset 0 1px .5px -0.5px rgba(255,255,255,0.55),
                  inset 0 -1px .5px -0.5px rgba(255,255,255,0.48),
                  inset 0 3px 6px -3px rgba(255,255,255,0.20),
                  inset 0 -3px 6px -3px rgba(255,255,255,0.12),
                  2px 0 3px -2px rgba(0,0,0,0.45),
                  -2px 0 3px -2px rgba(0,0,0,0.45),
                  0 2px 8px rgba(0,0,0,0.18)) !important;
                overflow: hidden !important;
              }

              .apexcharts-tooltip-title,
              .apexcharts-tooltip-series-group { width: auto !important; max-width: 200px !important; }

              .apexcharts-tooltip-title {
                background: transparent !important;
                border-bottom: none !important;
                font-size: 10px !important;
                color: rgba(255,255,255,0.58) !important;
                font-weight: 600 !important;
                padding: 9px 12px 2px !important;
                margin: 0 !important;
                letter-spacing: 0.07em !important;
                text-transform: uppercase !important;
              }

              .apexcharts-tooltip-series-group {
                background: transparent !important;
                padding: 0 12px 6px !important;
                align-items: center !important;
              }

              .apexcharts-tooltip-series-group:last-child { padding-bottom: 9px !important; }
              .apexcharts-tooltip-series-group.apexcharts-active { background: transparent !important; }
              .apexcharts-tooltip-marker { display: none !important; }

              .apexcharts-tooltip-text-y-label {
                color: rgba(255,255,255,0.64) !important;
                font-size: 12px !important;
                font-weight: 500 !important;
                margin-right: 6px !important;
              }

              .apexcharts-tooltip-text-y-value {
                color: rgba(255,255,255,0.98) !important;
                font-weight: 700 !important;
                font-size: 14px !important;
                margin-left: 0 !important;
              }

              .apexcharts-xcrosshairs {
                stroke: rgba(255,255,255,0.14) !important;
                stroke-dasharray: 3 3 !important;
                stroke-width: 1 !important;
              }

              .apexcharts-xaxistooltip { display: none !important; }
              .apexcharts-ycrosshairs { display: none !important; }
            `;

            /* Entity Resolution */

            const dlId =
              variables.entity_download ||
              entity?.entity_id;

            const ulId =
              variables.entity_upload ||
              variables.entity_stat_2;

            const statusId =
              variables.entity_status;

            const wiredDlId =
              variables.entity_stat_1 || variables.entity_wired_dl;

            const wiredUlId =
              variables.entity_stat_2 || variables.entity_wired_ul;

            const wifiDlId =
              variables.entity_stat_3 || variables.entity_wifi_dl;

            const wifiUlId =
              variables.entity_stat_4 || variables.entity_wifi_ul;

            const pingId = variables.entity_ping;

            const action1Id            = variables.action_1_entity         || null;
            const action1Label         = variables.action_1_label          || null;
            const action1Stat          = variables.action_1_status         || null;
            const action1ConfirmHelper = variables.action_1_confirm_helper
              || (action1Id ? 'input_boolean.hemma_restart_confirm_1' : null);
            const action1DoneHelper    = variables.action_1_done_helper
              || (action1Id ? 'input_boolean.hemma_restart_done_1'    : null);
            const action2Id            = variables.action_2_entity         || null;
            const action2Label         = variables.action_2_label          || null;
            const action2Stat          = variables.action_2_status         || null;
            const action2ConfirmHelper = variables.action_2_confirm_helper
              || (action2Id ? 'input_boolean.hemma_restart_confirm_2' : null);
            const action2DoneHelper    = variables.action_2_done_helper
              || (action2Id ? 'input_boolean.hemma_restart_done_2'    : null);
            const hasActions           = !!(action1Id || action2Id);

            /* Values */

            const dl = safeNum(dlId);
            const ul = safeNum(ulId);

            const _ck = 'hemma_network_' + (dlId || 'x');
            const _ch = [states[dlId]?.state, states[ulId]?.state, states[statusId]?.state, states[wiredDlId]?.state, states[wiredUlId]?.state, states[wifiDlId]?.state, states[wifiUlId]?.state, states[pingId]?.state, states[action1Stat]?.state, states[action2Stat]?.state, states[action1ConfirmHelper]?.state, states[action2ConfirmHelper]?.state, states[action1DoneHelper]?.state, states[action2DoneHelper]?.state, hass?.entities?.[action1Stat]?.name, hass?.entities?.[action2Stat]?.name, hass?.entities?.[action1Id]?.name, hass?.entities?.[action2Id]?.name].join('|');
            window._hc = window._hc || {};
            if (window._hc[_ck]?.h === _ch) return window._hc[_ck].r;

            const _memoSub = (subKey, dep, factory) => {
              const key = _ck + '_' + subKey;
              if (window._hc[key]?.h === dep) return window._hc[key].r;
              const r = factory();
              window._hc[key] = { h: dep, r };
              return r;
            };

            const dlOk = Number.isFinite(dl);
            const ulOk = Number.isFinite(ul);

            /* Status */

            const statusRaw = statusId ? states[statusId]?.state : null;
            const online = statusRaw === 'on';

            const statusLabel = statusRaw
              ? (online ? 'Online' : 'Offline')
              : '—';

            const statusColor = online
              ? 'var(--hemma-badge-network-online-color, #44e371)'
              : (
                  statusRaw
                    ? 'var(--hemma-badge-network-offline-color, #ff453a)'
                    : 'rgba(255,255,255,0.4)'
                );

            /* Advice */

            const roomName = variables.room_name || 'Network';

            const idle = Number(variables.idle_threshold ?? 1);
            const light = Number(variables.light_threshold ?? 10);
            const heavy = Number(variables.heavy_threshold ?? 50);

            const _allVals = [dl, ul,
              safeNum(wiredDlId), safeNum(wiredUlId),
              safeNum(wifiDlId),  safeNum(wifiUlId),
            ].filter(v => v != null);
            const max = _allVals.length > 0 ? Math.max(..._allVals) : 0;

            const tier = max < idle
              ? 'Idle'
              : max < light
                ? 'Light'
                : max < heavy
                  ? 'Active'
                  : 'Heavy';

            // Judged from WAN dl/ul, not the wired/wifi tiles below.
            const dir = (!dlOk || (ulOk && ul > dl)) ? 'Upload' : 'Download';

            let advice;

            if (dlOk || ulOk) {
              advice = max < idle
                ? 'Connection idle'
                : `${tier} ${dir}`;
            } else if (statusRaw) {
              advice = online
                ? 'Connection stable'
                : 'No connection';
            } else {
              advice = 'No status data';
            }

            /* Ping Gauge */

            const ping = safeNum(pingId);
            const pingMax = 200;
            const pingRadius = 42;
            const pingCircumference = 2 * Math.PI * pingRadius;
            const pingProgress = ping != null ? 1 - Math.min(ping / pingMax, 1) : 0;
            const pingDashOffset = pingCircumference - (pingProgress * pingCircumference);

            let pingColor = 'var(--hemma-popup-green-color, #67f5a0)';
            if (ping == null) {
              pingColor = 'rgba(255,255,255,0.15)';
            } else if (ping >= 150) {
              pingColor = 'var(--hemma-popup-red-color, #ff453a)';
            } else if (ping >= 60) {
              pingColor = 'var(--hemma-popup-orange-color, #ff9230)';
            } else if (ping >= 20) {
              pingColor = 'var(--hemma-popup-yellow-color, #ffd600)';
            }

            const fmtPing = (v) => v == null ? '—' : String(Math.round(v));

            /* Stat Cards */

            const dlStatCard = {
              ...baseCard,
              entity: dlId,
              tap_action: { action: 'more-info' },
              card_mod: { style: tapStyle },
              styles: {
                card: [
                  { background: 'transparent' },
                  { border: 'none' },
                  { 'box-shadow': 'none' },
                  { padding: '0' },
                ],
                grid: [
                  { 'grid-template-areas': '"c"' },
                  { 'grid-template-columns': '1fr' },
                ],
                custom_fields: {
                  c: [{ 'justify-self': 'start' }],
                },
              },
              custom_fields: {
                c: `[[[
                  const s = states['${dlId}'];
                  const v = parseFloat(s?.state);
                  const prec = hass?.entities?.['${dlId}']?.display_precision ?? s?.attributes?.suggested_display_precision ?? null;
                  const d = isNaN(v) ? '—' : (prec != null ? v.toFixed(prec) : (v >= 100 ? Math.round(v).toString() : v.toFixed(1)));
                  return '<div>'
                    + '<div style="display:flex;align-items:baseline;gap:4px;padding-right:6px;">'
                    + '<span style="font-size:26px;font-weight:400;color:var(--hemma-popup-tiles-text-primary);line-height:1.15;">' + d + '</span>'
                    + '<span style="font-size:14px;color:var(--hemma-popup-tiles-text-secondary);">Mbit/s</span>'
                    + '</div>'
                    + '<div style="display:flex;align-items:center;gap:6px;margin-top:7px;">'
                    + '<span style="width:8px;height:8px;background:var(--hemma-badge-network-low-color, #44e371);border-radius:50%;display:inline-block;flex-shrink:0;"></span>'
                    + '<span style="font-size:14px;color:var(--hemma-popup-tiles-text-secondary);">Download</span>'
                    + '</div>'
                    + '</div>';
                ]]]`,
              },
            };

            const ulStatCard = {
              ...baseCard,
              entity: ulId || dlId,
              tap_action: ulId ? { action: 'more-info' } : { action: 'none' },
              card_mod: { style: ulId ? tapStyle : noHoverStyle },
              styles: {
                card: [
                  { background: 'transparent' },
                  { border: 'none' },
                  { 'box-shadow': 'none' },
                  { padding: '0' },
                ],
                grid: [
                  { 'grid-template-areas': '"c"' },
                  { 'grid-template-columns': '1fr' },
                ],
                custom_fields: {
                  c: [{ 'justify-self': 'start' }],
                },
              },
              custom_fields: {
                c: `[[[
                  const s = states['${ulId || dlId}'];
                  const v = parseFloat(s?.state);
                  const prec = hass?.entities?.['${ulId || dlId}']?.display_precision ?? s?.attributes?.suggested_display_precision ?? null;
                  const d = isNaN(v) ? '—' : (prec != null ? v.toFixed(prec) : (v >= 100 ? Math.round(v).toString() : v.toFixed(1)));
                  return '<div>'
                    + '<div style="display:flex;align-items:baseline;gap:4px;padding-left:6px;">'
                    + '<span style="font-size:26px;font-weight:400;color:var(--hemma-popup-tiles-text-primary);line-height:1.15;">' + d + '</span>'
                    + '<span style="font-size:14px;color:var(--hemma-popup-tiles-text-secondary);">Mbit/s</span>'
                    + '</div>'
                    + '<div style="display:flex;align-items:center;gap:6px;margin-top:7px;margin-left:6px;">'
                    + '<span style="width:8px;height:8px;background:var(--hemma-badge-network-active-color, #ffd600);border-radius:50%;display:inline-block;flex-shrink:0;"></span>'
                    + '<span style="font-size:14px;color:var(--hemma-popup-tiles-text-secondary);">Upload</span>'
                    + '</div>'
                    + '</div>';
                ]]]`,
              },
            };

            const statsWrapperCard = {
              ...baseCard,
              entity: dlId,
              tap_action: { action: 'none' },
              card_mod: { style: wrapperStyle },
              styles: {
                card: [
                  { background: 'transparent' },
                  { border: 'none' },
                  { 'box-shadow': 'none' },
                  { padding: '0' },
                ],
                grid: [
                  { display: 'flex' },
