hemma_popup_person_panel:
  template:
  - hemma_popup_base
  tap_action:
    haptic: light
    action: |
      [[[
        return window.hemmaPopupAction ? window.hemmaPopupAction() : 'more-info';
      ]]]
    entity: '[[[ const p = String(variables.person_entity || ""); return p.startsWith("person.") ? p : (entity?.entity_id || null); ]]]'
    hemma_popup:
      title: ''
      dismissable: true
      close: false
      style: '--popup-min-width: 300px; --popup-max-width: 300px; --popup-min-width-narrow: 300px; --hemma-popup-radius: 34px; --hemma-popup-tint: rgba(0, 0, 5, 0.16);'
      content:
        type: custom:hemma-person-panel
        entity: '[[[ const p = String(variables.person_entity || ""); return p.startsWith("person.") ? p : (entity?.entity_id || null); ]]]'
        name: |
          [[[
            const n = String(variables.person_name || this._config?.name || '').trim();
            return n.startsWith('[' + '[[') || n.indexOf('<') >= 0 ? '' : n;
          ]]]
  icon_tap_action:
    haptic: light
    action: |
      [[[
        return window.hemmaPopupAction ? window.hemmaPopupAction() : 'more-info';
      ]]]
    entity: '[[[ const p = String(variables.person_entity || ""); return p.startsWith("person.") ? p : (entity?.entity_id || null); ]]]'
    hemma_popup:
      title: ''
      dismissable: true
      close: false
      style: '--popup-min-width: 300px; --popup-max-width: 300px; --popup-min-width-narrow: 300px; --hemma-popup-radius: 34px; --hemma-popup-tint: rgba(0, 0, 5, 0.16);'
      content:
        type: custom:hemma-person-panel
        entity: '[[[ const p = String(variables.person_entity || ""); return p.startsWith("person.") ? p : (entity?.entity_id || null); ]]]'
        name: |
          [[[
            const n = String(variables.person_name || this._config?.name || '').trim();
            return n.startsWith('[' + '[[') || n.indexOf('<') >= 0 ? '' : n;
          ]]]
