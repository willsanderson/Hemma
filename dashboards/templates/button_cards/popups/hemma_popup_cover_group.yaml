hemma_popup_cover:
  template:
  - hemma_popup_base
  variables:
    room_name: Home
    cover_entity: null
    covers: []
    smart_automation_entity: null
    smart_automation_today_entity: null
    group_by_type: true
  tap_action:
    haptic: light
    action: |
      [[[
        return window.hemmaPopupAction ? window.hemmaPopupAction() : 'more-info';
      ]]]
    hemma_popup:
      title: "[[[ const T = window._hemmaT || ((k, en, v) => { let s = String(en); if (v) for (const p in v) s = s.split(String.fromCharCode(123) + p + String.fromCharCode(125)).join(String(v[p])); return s; }); const n = String(this._config?.name || '').trim(); const many = Array.isArray(variables.covers) && variables.covers.length > 1; return many || !n || n.startsWith('[' + '[[') ? T('covers.title', 'Covers') : n; ]]]"
      dismissable: true
      style: '--popup-min-width: 340px; --popup-max-width: 340px; --popup-min-width-narrow: 340px; --hemma-popup-row-min: 56px; --hemma-popup-row-pad-x: 14px; --hemma-popup-row-label-size: 16px; --hemma-popup-row-label-weight: 600; --hemma-popup-row-value-size: 15px; --hemma-popup-sub-size: 13px; --hemma-popup-icon-tile: 30px;'
      popup_styles:
      - style: all
        styles: |
          /* The pane stays - these are control sheets. Only the close control
             keeps what it gained: a surface of its own, and room above it so
             the fill is not against the top edge of the sheet. */
          .header { padding-top: var(--hemma-popup-header-gap, 10px); }
          /* Equal inset on both axes: the bar's own padding plus the
             close control's 2px optical nudge has to come to the same
             number as the padding above it, or the circle sits further
             from the left edge than it does from the top. */
          --hemma-popup-header-gap: 14px;
            --hemma-popup-gutter-wide: 20px;
            --hemma-popup-row-radius: 22px;
            /* The inactive presets read brighter than the tiles under them. */
            --hemma-popup-seg-fill: rgba(255, 255, 255, 0.10);
            --hemma-popup-seg-fill-hover: rgba(255, 255, 255, 0.16);
          /* The chrome arrives with the first plate instead of being there
             on frame one while everything under it fades in. */
          --hemma-popup-chrome-enter:
            hemma-popup-chrome-in 320ms cubic-bezier(0.2, 0.8, 0.3, 1) both;
          .header-title { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
          .header-close {
            border-radius: 50%;
            background: var(--hemma-popup-row-fill, rgba(255, 255, 255, 0.10));
            backdrop-filter: var(--hemma-popup-plate-backdrop, blur(24px) saturate(180%));
            -webkit-backdrop-filter: var(--hemma-popup-plate-backdrop, blur(24px) saturate(180%));
            box-shadow: var(--hemma-popup-plate-shadow, none);
          }
      content: |
        [[[
          const T = window._hemmaT || ((k, en, v) => { let s = String(en); if (v) for (const p in v) s = s.split(String.fromCharCode(123) + p + String.fromCharCode(125)).join(String(v[p])); return s; });
          const L = (k, en) => { const v = hass?.localize?.(k); return (v && v !== k) ? v : en; };
          /* Variables */
          const groupId  = variables.cover_entity || entity?.entity_id || null;
          const coverIds = Array.isArray(variables.covers) && variables.covers.length > 0
                         ? variables.covers
                         : (groupId ? [groupId] : []);
          const HZ_SYS   = variables.smart_automation_entity || null;       // shade-automation switch
          const HZ_HEUTE = variables.smart_automation_today_entity || null; // today's automation override
          const _hzSys   = JSON.stringify(HZ_SYS);
          const _gid      = JSON.stringify(groupId);
          const _coverIds = JSON.stringify(coverIds);
          const _countSnip = `
            const coverIds = ${_coverIds};
            const openIds = coverIds.filter(id => ['open','opening','stopping'].includes(states[id]?.state));
            const oc = openIds.length, tot = coverIds.length;
            const allClosed = oc === 0 && tot > 0;
            const allOpen   = oc === tot && tot > 0;
            const badgeColor = allClosed ? 'var(--hemma-popup-green-color,#30D158)' : '#0A84FF';
          `;

          /* Styles */
          const wrapperStyle = [
            ':host { --ha-card-box-shadow: none !important; --button-card-box-shadow: none !important; --button-card-box-shadow-hover: none !important; }',
            'ha-card { background: transparent !important; border: none !important; border-radius: 0 !important; box-shadow: none !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; cursor: default !important; }',
            'ha-card:hover { box-shadow: none !important; }',
            'ha-ripple { display: none !important; }',
          ].join('\n');

          const contentCardStyle = wrapperStyle + '\n@media (max-width: 600px) { ha-card { padding-left: 14px !important; padding-right: 14px !important; } }';

          const tapStyle = [
            ':host { --ha-card-box-shadow: none !important; --button-card-box-shadow: none !important; --button-card-box-shadow-hover: none !important; pointer-events: auto !important; }',
            'ha-card { background: transparent !important; border: none !important; border-radius: 0 !important; box-shadow: none !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; overflow: visible !important; }',
            'ha-card #container { transition: opacity 0.18s ease, filter 0.18s ease !important; }',
            'ha-card:hover #container { filter: brightness(1.12) saturate(1.08) drop-shadow(0 0 10px rgba(255,255,255,0.05)); }',
            'ha-ripple { display: none !important; }',
          ].join('\n');

          const tileTapStyle = [
            ':host { --ha-card-box-shadow: none !important; --button-card-box-shadow: none !important; --button-card-box-shadow-hover: inset 0 1px 0.5px -0.5px rgba(255,255,255,calc(var(--hemma-popup-tiles-glow-top-tight,0.20) * 1.5)), inset 0 -1px 0.5px -0.5px rgba(255,255,255,calc(var(--hemma-popup-tiles-glow-bottom-tight,0.15) * 1.5)), inset 0 3px 6px -3px rgba(255,255,255,calc(var(--hemma-popup-tiles-glow-top-soft,0.08) * 1.5)), inset 0 -3px 6px -3px rgba(255,255,255,calc(var(--hemma-popup-tiles-glow-bottom-soft,0.05) * 1.5)) !important; }',
            'ha-card { background: var(--hemma-popup-tiles-fill, rgba(255,255,255,0.08)) !important; border: none !important; border-radius: 24px !important; box-shadow: inset 0 1px 0.5px -0.5px rgba(255,255,255,var(--hemma-popup-tiles-glow-top-tight,0.20)), inset 0 -1px 0.5px -0.5px rgba(255,255,255,var(--hemma-popup-tiles-glow-bottom-tight,0.15)), inset 0 3px 6px -3px rgba(255,255,255,var(--hemma-popup-tiles-glow-top-soft,0.08)), inset 0 -3px 6px -3px rgba(255,255,255,var(--hemma-popup-tiles-glow-bottom-soft,0.05)) !important; backdrop-filter: var(--hemma-popup-tiles-backdrop, blur(10px) saturate(1.1)) !important; -webkit-backdrop-filter: var(--hemma-popup-tiles-backdrop, blur(10px) saturate(1.1)) !important; cursor: pointer !important; transform: scale(1) !important; transition: background var(--hemma-popup-tile-hover-duration, 0.2s) ease, transform var(--hemma-popup-tile-hover-duration, 0.2s) ease, box-shadow 0.2s ease !important; }',
            'ha-card:hover { background: var(--hemma-popup-tile-hover, rgba(255,255,255,0.09)) !important; transform: scale(var(--hemma-popup-tile-hover-scale, 1.004)) !important; }',
            'ha-ripple { display: none !important; }',
          ].join('\n');

          /* Hover overlay */
          const hoverOverlay = [
            'ha-card { position: relative !important; overflow: hidden !important; }',
            'ha-card::after { content: "" !important; position: absolute !important; inset: 0 !important; border-radius: inherit !important; background: transparent !important; transition: background 0.15s ease !important; pointer-events: none !important; }',
            'ha-card:hover::after { background: rgba(255,255,255,0.1) !important; }',
          ].join('\n');

          const pillTapStyle = [
            ':host { --ha-card-box-shadow: none !important; --button-card-box-shadow: none !important; --button-card-box-shadow-hover: none !important; }',
            'ha-card { border: none !important; border-radius: 999px !important; box-shadow: none !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; cursor: pointer !important; transition: background 0.2s ease, transform var(--hemma-popup-tile-hover-duration, 0.2s) ease !important; }',
            'ha-card:hover { transform: scale(var(--hemma-popup-tile-hover-scale, 1.004)) !important; }',
            'ha-card:active { transform: scale(0.97) !important; }',
            'ha-ripple { display: none !important; }',
            hoverOverlay,
          ].join('\n');

          /* Transparent wrapper */
          const segmentTrackStyle = [
            ':host { --ha-card-box-shadow: none !important; --button-card-box-shadow: none !important; --button-card-box-shadow-hover: none !important; }',
            'ha-card { border: none !important; border-radius: 0 !important; box-shadow: none !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; background: transparent !important; cursor: default !important; }',
            'ha-card:hover { box-shadow: none !important; }',
            'ha-ripple { display: none !important; }',
          ].join('\n');

          const iconBtnStyle = [
            ':host { --ha-card-box-shadow: none !important; --button-card-box-shadow: none !important; --button-card-box-shadow-hover: none !important; }',
            'ha-card { border: none !important; border-radius: 999px !important; box-shadow: none !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; cursor: pointer !important; display: flex !important; align-items: center !important; justify-content: center !important; transition: background 0.15s ease !important; }',
            '#container { display: flex !important; align-items: center !important; justify-content: center !important; }',
            '#icon { display: flex !important; align-items: center !important; justify-content: center !important; }',
            'ha-icon { --mdc-icon-size: 18px !important; display: flex !important; align-items: center !important; justify-content: center !important; }',
            'ha-ripple { display: none !important; }',
            hoverOverlay,
          ].join('\n');

          /* Header card */
          const headerCard = {
            type: 'custom:button-card',
            entity: groupId,
            tap_action: { action: 'none' },
            show_icon: false, show_name: false, show_label: false, show_state: false,
            card_mod: { style: contentCardStyle },
            styles: {
              card: [
                { background: 'transparent' }, { border: 'none' }, { 'box-shadow': 'none' },
                { padding: '28px 28px 20px 28px' },
              ],
              grid: [
                { 'grid-template-areas': '"title"' },
                { 'grid-template-columns': '1fr auto' },
                { 'align-items': 'flex-start' },
                { 'row-gap': '16px' },
              ],
              custom_fields: {
                title: [{ 'justify-self': 'start' }, { 'text-align': 'left' }],
                right: [{ 'justify-self': 'end' }, { 'align-self': 'flex-start' }],
              },
            },
            custom_fields: {
              title: '<div style="font-family:var(--primary-font-family,system-ui);color:var(--hemma-popup-tiles-text-primary,#ffffff);text-align:left;">'
                + '</div>',
            },
          };

          /* Smart automation toggle */
          let hitzeschutzCard = null;
          if (HZ_SYS) {
            const hzToggle = {
              type: 'custom:button-card',
              entity: HZ_SYS,
              show_name: false, show_state: false, show_icon: false,
              tap_action: { action: 'call-service', service: 'switch.toggle', service_data: { entity_id: HZ_SYS } },
              haptic: 'medium',
              custom_fields: {
                svg: `[[[
                  const isOn = states[${_hzSys}]?.state === 'on';
                  const KF_ID = 'hemma-toggle-kf-v1';
                  if (!document.getElementById(KF_ID)) {
                    const kf = document.createElement('style');
                    kf.id = KF_ID;
                    kf.textContent = [
                      '@keyframes hemma-thumb-on-d{from{transform:translateX(0)}to{transform:translateX(18px)}}',
                      '@keyframes hemma-thumb-off-d{from{transform:translateX(18px)}to{transform:translateX(0)}}',
                      '@keyframes hemma-thumb-on-m{from{transform:translateX(0)}to{transform:translateX(12px)}}',
                      '@keyframes hemma-thumb-off-m{from{transform:translateX(12px)}to{transform:translateX(0)}}'
                    ].join('');
                    document.head.appendChild(kf);
                  }
                  const mob = window.matchMedia('(max-width: 767px), (max-height: 600px)').matches;
                  const W = mob ? 38 : 44, H = 26, r = mob ? 8 : 9, cx0 = 14;
                  const SW = W + 2;
                  const travel = mob ? 12 : 18;
                  const stateKey = '_hemma_toggle_cover_automation_' + ${_hzSys};
                  const shouldAnimate = window[stateKey] !== undefined && window[stateKey] !== isOn;
                  window[stateKey] = isOn;
                  const anim = isOn ? (mob ? 'hemma-thumb-on-m' : 'hemma-thumb-on-d') : (mob ? 'hemma-thumb-off-m' : 'hemma-thumb-off-d');
                  const animStyle = shouldAnimate ? ('animation:' + anim + ' 0.2s ease forwards;') : '';
                  const circleCx = (!shouldAnimate && isOn) ? cx0 + travel : cx0;
                  const trackFill = 'var(--hemma-popup-orange-color,#ff9230)';
                  const offColor  = 'rgba(255,255,255,0.8)';
                  if (isOn) {
                    return '<svg width="' + SW + '" height="' + H + '" viewBox="0 0 ' + SW + ' ' + H + '" style="display:block;">'
                      + '<rect x="2" y="1" width="' + (W-2) + '" height="' + (H-2) + '" rx="' + ((H-2)/2) + '" fill="' + trackFill + '"/>'
                      + '<circle cx="' + circleCx + '" cy="' + (H/2) + '" r="' + r + '" fill="rgba(255,255,255,0.92)" style="' + animStyle + '"/>'
                      + '</svg>';
                  } else {
                    return '<svg width="' + SW + '" height="' + H + '" viewBox="0 0 ' + SW + ' ' + H + '" style="display:block;">'
                      + '<rect x="2" y="1" width="' + (W-2) + '" height="' + (H-2) + '" rx="' + ((H-2)/2) + '" fill="none" stroke="' + offColor + '" stroke-width="2"/>'
                      + '<circle cx="' + circleCx + '" cy="' + (H/2) + '" r="' + r + '" fill="' + offColor + '" style="' + animStyle + '"/>'
                      + '</svg>';
                  }
                ]]]`,
              },
              styles: {
                card: [
                  { background: 'transparent !important' }, { 'background-color': 'transparent !important' },
                  { '--ha-card-background': 'transparent' }, { 'box-shadow': 'none !important' },
                  { border: 'none !important' }, { 'backdrop-filter': 'none !important' },
                  { '-webkit-backdrop-filter': 'none !important' }, { padding: '0 !important' },
                  { overflow: 'visible !important' }, { '--button-card-ripple-color': 'transparent !important' },
                  { 'border-radius': '0 !important' },
                ],
                grid: [{ padding: '0 !important' }, { overflow: 'visible !important' }],
                custom_fields: { svg: [{ 'line-height': '0' }] },
              },
              extra_styles: [
                ':host { display: block !important; width: 46px !important; height: 26px !important; overflow: visible !important; cursor: pointer; }',
                '@media (max-width: 767px), (max-height: 600px) { :host { width: 40px !important; height: 26px !important; } }',
                'ha-card, #container { overflow: visible !important; background: transparent !important; --ha-card-background: transparent !important; }',
                '@media (hover: hover) { :host { transition: filter 0.2s ease; } :host(:hover) { filter: brightness(1.5) !important; } }',
              ].join('\n'),
            };

            const hzTileInner = {
              type: 'custom:button-card',
              entity: HZ_HEUTE || HZ_SYS,
              tap_action: { action: 'none' },
              show_icon: false, show_name: false, show_label: false, show_state: false,
              card_mod: { style: tileTapStyle },
              styles: {
                card: [{ 'box-shadow': 'none' }, { padding: '16px 18px 14px 18px' }],
                grid: [
                  { 'grid-template-areas': '"head action"' },
                  { 'grid-template-columns': '1fr auto' },
                  { 'align-items': 'center' },
                ],
                custom_fields: {
                  head:   [{ 'justify-self': 'start' }],
                  action: [{ 'justify-self': 'end' }, { 'align-self': 'center' }],
                },
              },
              custom_fields: {
                head: `[[[
                  const T = window._hemmaT || ((k, en, v) => { let s = String(en); if (v) for (const p in v) s = s.split(String.fromCharCode(123) + p + String.fromCharCode(125)).join(String(v[p])); return s; });
                  const autoName = (states[${_hzSys}]?.attributes?.friendly_name) || T('covers.automation', 'Cover Automation');
                  return '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">'
                    + '<span style="font-size:14px;color:var(--hemma-popup-tiles-text-primary,#ffffff);font-weight:500;">' + autoName + '</span>'
                  + '</div>';
                ]]]`,
                action: { card: hzToggle },
              },
            };

            hitzeschutzCard = {
              type: 'custom:button-card',
              entity: HZ_HEUTE || HZ_SYS,
              tap_action: { action: 'none' },
              show_icon: false, show_name: false, show_label: false, show_state: false,
              card_mod: { style: contentCardStyle },
              styles: {
                card: [
                  { background: 'transparent' }, { border: 'none' }, { 'box-shadow': 'none' },
                  { padding: '4px 28px 0 28px' },
                ],
                grid: [{ 'grid-template-areas': '"c"' }, { 'grid-template-columns': '1fr' }],
                custom_fields: { c: [{ 'justify-self': 'stretch' }] },
              },
              custom_fields: { c: { card: hzTileInner } },
            };
          }

          /* Action row */
          const _allEdgeSnip = `
            const coverIds = ${_coverIds};
            const allFullyOpen = coverIds.length > 0 && coverIds.every(id => {
              const p = states[id]?.attributes?.current_position;
              return p != null && Math.round(Number(p)) === 100;
            });
            const allFullyClosed = coverIds.length > 0 && coverIds.every(id => {
              const p = states[id]?.attributes?.current_position;
              return p != null && Math.round(Number(p)) === 0;
            });
          `;

          const makeEdgePill = (label, service, matchExpr) => ({
            type: 'custom:button-card',
            entity: groupId,
            name: label,
            tap_action: { action: 'call-service', service: service, service_data: { entity_id: coverIds } },
            haptic: 'medium',
            show_icon: false, show_name: true, show_label: false, show_state: false,
            card_mod: { style: pillTapStyle },
            styles: {
              card: [
                { background: `[[[
                  ${_allEdgeSnip}
                  if (!(${matchExpr})) return 'rgba(255,255,255,0.10)';
                  return 'rgba(255,255,255,0.88)';
                ]]]` },
                { 'box-shadow': 'none' }, { padding: '13px 6px' },
              ],
              name: [
                { 'font-size': '14px' }, { 'font-weight': '500' },
                { color: `[[[
                  ${_allEdgeSnip}
                  return (${matchExpr}) ? 'rgba(0,0,0,0.80)' : 'rgba(255,255,255,0.65)';
                ]]]` },
                { 'white-space': 'nowrap' }, { 'letter-spacing': '0.01em' },
              ],
            },
          });

          const makePresetPill = (label, pos) => {
            const _pos = JSON.stringify(pos);
            return {
              type: 'custom:button-card',
              entity: groupId,
              name: label,
              tap_action: { action: 'call-service', service: 'cover.set_cover_position', service_data: { entity_id: coverIds, position: pos } },
              haptic: 'light',
              show_icon: false, show_name: true, show_label: false, show_state: false,
              card_mod: { style: pillTapStyle },
              styles: {
                card: [
                  { background: `[[[
                    const coverIds = ${_coverIds};
                    const pos = ${_pos};
                    const allMatch = coverIds.length > 0 && coverIds.every(id => {
                      const p = states[id]?.attributes?.current_position;
                      return p != null && Math.round(Number(p)) === pos;
                    });
                    if (!allMatch) return 'rgba(255,255,255,0.10)';
                    return 'rgba(255,255,255,0.88)';
                  ]]]` },
                { 'box-shadow': 'none' }, { padding: '13px 6px' },
                ],
                name: [
                  { 'font-size': '14px' }, { 'font-weight': '500' },
                  { color: `[[[
                    const coverIds = ${_coverIds};
                    const pos = ${_pos};
                    const allMatch = coverIds.length > 0 && coverIds.every(id => {
                      const p = states[id]?.attributes?.current_position;
                      return p != null && Math.round(Number(p)) === pos;
                    });
                    return allMatch ? 'rgba(0,0,0,0.80)' : 'rgba(255,255,255,0.65)';
                  ]]]` },
                  { 'white-space': 'nowrap' }, { 'letter-spacing': '0.01em' },
                ],
              },
            };
          };

          const actionRow = {
            type: 'custom:button-card',
            entity: groupId,
            tap_action: { action: 'none' },
            show_icon: false, show_name: false, show_label: false, show_state: false,
            card_mod: { style: segmentTrackStyle },
            styles: {
              card: [{ background: 'transparent' }, { border: 'none' }, { 'box-shadow': 'none' }, { padding: '2px 0' }],
              grid: [
                { 'grid-template-areas': '"close p25 p50 p75 open"' },
                { 'grid-template-columns': 'repeat(5, 1fr)' },
                { gap: '6px' },
              ],
              custom_fields: {
                close: [{ 'justify-self': 'stretch' }],
                p25:   [{ 'justify-self': 'stretch' }],
                p50:   [{ 'justify-self': 'stretch' }],
                p75:   [{ 'justify-self': 'stretch' }],
                open:  [{ 'justify-self': 'stretch' }],
              },
            },
            custom_fields: {
              close: { card: makeEdgePill(T('covers.close', 'Close'), 'cover.close_cover', 'allFullyClosed') },
              p25:   { card: makePresetPill('25%', 25) },
              p50:   { card: makePresetPill('50%', 50) },
              p75:   { card: makePresetPill('75%', 75) },
              open:  { card: makeEdgePill(T('covers.open', 'Open'),  'cover.open_cover',  'allFullyOpen') },
            },
          };

          const controlsCard = {
            type: 'custom:button-card',
            entity: groupId,
            tap_action: { action: 'none' },
            show_icon: false, show_name: false, show_label: false, show_state: false,
            card_mod: { style: contentCardStyle },
            styles: {
              card: [
                { background: 'transparent' }, { border: 'none' }, { 'box-shadow': 'none' },
                { padding: '16px 28px 0 28px' },
              ],
              grid: [{ 'grid-template-areas': '"a"' }, { 'grid-template-columns': '1fr' }],
              custom_fields: { a: [{ 'justify-self': 'stretch' }] },
            },
            custom_fields: {
              a: { card: actionRow },
            },
          };

          /* Cover tiles */
          const makeIconBtn = (coverId, icon, service, activeFn) => {
            const _cid = JSON.stringify(coverId);
            return {
              type: 'custom:button-card',
              entity: coverId,
              icon: icon,
              tap_action: { action: 'call-service', service: service, service_data: { entity_id: coverId } },
              haptic: 'medium',
              show_icon: true, show_name: false, show_label: false, show_state: false,
              card_mod: { style: iconBtnStyle },
              styles: {
                card: [
                  { background: `[[[
                    const coverId = ${_cid};
                    const s = states[coverId]?.state || 'unavailable';
                    ${activeFn}
                  ]]]` },
                  { 'border-radius': '999px' }, { padding: '10px' }, { 'box-shadow': 'none' },
                ],
                grid: [{ display: 'flex' }, { 'align-items': 'center' }, { 'justify-content': 'center' }, { width: '100%' }, { height: '100%' }],
                icon: [{ color: '#ffffff' }, { width: '18px' }, { height: '18px' }, { display: 'flex' }, { 'align-items': 'center' }, { 'justify-content': 'center' }],
              },
            };
          };

          /* Curtain SVGs */
          const CURTAIN_OPEN_URI = 'data:image/svg+xml;base64,';
          const CURTAIN_CLOSED_URI = 'data:image/svg+xml;base64,';

          /* Palette matches hemma_popup_light's makeLightCard, teal instead of yellow. */
          const _cc = {
            onBg:    'rgba(255,255,255,0.94)',
            onName:  'rgba(0,0,0,0.85)',
            onLabel: 'rgba(0,0,0,0.50)',
            offBg:   'rgba(255,255,255,0.11)',
            offName: 'rgba(255,255,255,0.90)',
            offLabel:'rgba(255,255,255,0.50)',
          };

          const makeCoverCard = (coverId) => {
            const _cid = JSON.stringify(coverId);
            return {
              type: 'custom:button-card',
              entity: coverId,
              show_icon: false,
              show_entity_picture: true,
              entity_picture: window.hemmaIconUrl('curtain-open'),
              tap_action: { action: 'more-info' },
              hold_action: { action: 'more-info' },
              double_tap_action: { action: 'none' },
              icon_tap_action: { action: 'toggle' },
              show_name: true,
              show_state: false,
              show_label: true,
              label: `[[[
                const e = states[${_cid}];
                const s = e?.state || 'unknown';
                const lbl = s.charAt(0).toUpperCase() + s.slice(1);
                const pos = e?.attributes?.current_position;
                return (pos != null) ? lbl + ' · ' + Math.round(Number(pos)) + '%' : lbl;
              ]]]`,
              extra_styles: ':host{--hemma-card-hover-filter:brightness(1.10);width:100%!important;max-width:none!important;display:block!important;box-sizing:border-box!important;--button-card-ripple-color:transparent!important;--button-card-ripple-hover-color:transparent!important;--ha-ripple-color:transparent!important;--ha-ripple-hover-color:transparent!important;}ha-card{transition:background 0.45s ease,transform var(--hemma-popup-tile-hover-duration,0.2s) ease,filter var(--hemma-popup-tile-hover-duration,0.2s) ease!important;transform:scale(1)!important;}ha-card:hover{transform:scale(var(--hemma-popup-tile-hover-scale,1.01))!important;}ha-card:active{transform:scale(1)!important;}@media (hover:hover){ha-card:hover{filter:var(--hemma-card-hover-filter,brightness(1.06))!important;}ha-card:hover::after{background:var(--lc-hover-tint,rgba(255,255,255,0.06))!important;}}ha-card::before{display:none!important;}ha-card::after{content:""!important;position:absolute!important;inset:0!important;border-radius:inherit!important;background:transparent!important;transition:background var(--hemma-popup-tile-hover-duration,0.2s) ease!important;pointer-events:none!important;}ha-ripple{display:none!important;}div#img-cell{position:relative!important;overflow:hidden!important;transition:transform var(--hemma-popup-tile-hover-duration,0.2s) ease!important;}div#img-cell::before{display:none!important;}div#img-cell::after{content:""!important;display:block!important;position:absolute!important;inset:0!important;margin:auto!important;width:60%!important;height:60%!important;background-color:var(--cc-clr,#ffffff)!important;-webkit-mask-image:var(--cc-mask)!important;-webkit-mask-repeat:no-repeat!important;-webkit-mask-position:center!important;-webkit-mask-size:contain!important;mask-image:var(--cc-mask)!important;mask-repeat:no-repeat!important;mask-position:center!important;mask-size:contain!important;opacity:var(--cc-io,0.9)!important;pointer-events:none!important;transform:translateZ(0)!important;will-change:transform!important;}div#img-cell:hover,div#img-cell:active{transform:scale(1.03)!important;}#img-cell img{opacity:0!important;}',
              styles: {
                card: [
                  { background: `[[[ const s=(states[${_cid}]?.state||'').toLowerCase(); return ['open','opening'].includes(s)?"${_cc.onBg}":"${_cc.offBg}";]]]` },
                  { '--cc-nc': `[[[ const s=(states[${_cid}]?.state||'').toLowerCase(); return ['open','opening'].includes(s)?"${_cc.onName}":"${_cc.offName}";]]]` },
                  { '--cc-lc': `[[[ const s=(states[${_cid}]?.state||'').toLowerCase(); return ['open','opening'].includes(s)?"${_cc.onLabel}":"${_cc.offLabel}";]]]` },
                  { '--cc-io': `[[[ return "1";]]]` },
                  { '--cc-clr': `[[[ const s=(states[${_cid}]?.state||'').toLowerCase(); return ['open','opening'].includes(s)?"#ffffff":"var(--hemma-color-teal, #00c3d0)";]]]` },
                  { '--cc-mask': `[[[
                      const s = (states[${_cid}]?.state||'').toLowerCase();
                      const open = ['open','opening'].includes(s);
                      return "url('" + (open ? ${JSON.stringify(CURTAIN_OPEN_URI)} : ${JSON.stringify(CURTAIN_CLOSED_URI)}) + "')";
                    ]]]` },
                  { '--hemma-card-hover-filter': `[[[ const s=(states[${_cid}]?.state||'').toLowerCase(); return ['open','opening'].includes(s)?"none":"brightness(1.10)";]]]` },
                  { '--lc-hover-tint': `[[[ const s=(states[${_cid}]?.state||'').toLowerCase(); return ['open','opening'].includes(s)?"transparent":"rgba(255,255,255,0.06)";]]]` },
                  { border: 'none' },
                  { 'box-shadow': 'none' },
                  { 'border-radius': '26px' },
                  { cursor: 'pointer' },
                  { padding: '12px 12px' },
                  { width: '100%' },
                ],
                grid: [
                  { 'grid-template-areas': '"i n" "i l"' },
                  { 'grid-template-columns': 'auto 1fr' },
                  { 'grid-template-rows': 'auto auto' },
                  { 'column-gap': '10px' },
                  { 'row-gap': '1px' },
                  { 'align-items': 'start' },
                ],
                img_cell: [
                  { background: `[[[ const s=(states[${_cid}]?.state||'').toLowerCase(); return ['open','opening'].includes(s)?"var(--hemma-color-teal, #00c3d0)":"rgba(255,255,255,0.10)";]]]` },
                  { 'border-radius': '50%' },
                  { width: '38px' },
                  { height: '38px' },
                  { 'min-width': '38px' },
                  { display: 'flex' },
                  { 'align-items': 'center' },
                  { 'justify-content': 'center' },
                  { 'align-self': 'center' },
                ],
                entity_picture: [
                  { width: '100%' },
                  { height: '100%' },
                  { 'object-fit': 'contain' },
                ],
                name: [
                  { 'font-size': '14px' },
                  { 'font-weight': '500' },
                  { color: 'var(--cc-nc)' },
                  { 'text-align': 'left' },
                  { 'justify-self': 'start' },
                  { 'align-self': 'end' },
                  { 'line-height': '1.2' },
                  { overflow: 'hidden' },
                  { 'text-overflow': 'ellipsis' },
                  { 'white-space': 'nowrap' },
                ],
                label: [
                  { 'font-size': '12px' },
                  { color: 'var(--cc-lc)' },
                  { 'text-align': 'left' },
                  { 'justify-self': 'start' },
                  { 'align-self': 'start' },
                  { 'line-height': '1.2' },
                ],
              },
            };
          };

          /* Dynamic grid */
          const colCount = coverIds.length > 1 ? 2 : 1;
          let tileAreas;
          if (colCount === 1) {
            tileAreas = coverIds.map((_, i) => '"t' + i + '"').join(' ');
          } else {
            const rows = [];
            for (let i = 0; i < coverIds.length; i += 2) {
              if (i + 1 < coverIds.length) {
                rows.push('"t' + i + ' t' + (i + 1) + '"');
              } else {
                rows.push('"t' + i + ' t' + i + '"');
              }
            }
            tileAreas = rows.join(' ');
          }
          const tileColDef = colCount === 1 ? '1fr' : '1fr 1fr';

          const tileCF = {}, tileFS = {};
          coverIds.forEach((id, i) => {
            tileCF['t' + i] = { card: makeCoverCard(id) };
            tileFS['t' + i] = [{ 'justify-self': 'stretch' }, { 'text-align': 'left' }];
          });

          const tilesCard = {
            type: 'custom:button-card',
            entity: groupId,
            tap_action: { action: 'none' },
            show_icon: false, show_name: false, show_label: false, show_state: false,
            card_mod: { style: contentCardStyle },
            styles: {
              card: [
                { background: 'transparent' }, { border: 'none' }, { 'box-shadow': 'none' },
                { padding: '16px 28px 20px 28px' },
              ],
              grid: [
                { 'grid-template-areas': tileAreas },
                { 'grid-template-columns': tileColDef },
                { gap: '10px' },
                { 'align-items': 'start' },
              ],
              custom_fields: tileFS,
            },
            custom_fields: tileCF,
          };

          /* Shared popup anatomy. Position is the subject, so it is the hero;
             the preset pills become a segmented control; each cover becomes a
             row carrying its own position. */
          const UI = window._hemmaUI;
          if (UI) {
            const posOf = (id) => {
              const p = states[id]?.attributes?.current_position;
              return typeof p === 'number' ? Math.round(p) : null;
            };
            const openStates = ['open', 'opening', 'stopping'];
            const known = coverIds.map(posOf).filter(v => v != null);
            const avg = known.length
              ? Math.round(known.reduce((a, b) => a + b, 0) / known.length)
              : null;
            const openCount = coverIds.filter(id => openStates.includes(states[id]?.state)).length;
            const allClosed = openCount === 0 && coverIds.length > 0;
            const allOpen = openCount === coverIds.length && coverIds.length > 0;

            const areas = [], fields = {}, fstyle = {};
            const add = (name, html) => {
              areas.push('"' + name + '"');
              fields[name] = html;
              fstyle[name] = [{ 'justify-self': 'stretch' }];
            };

            /* The more-info state header: the word, then how long it has read
               that way, centered over the control. The percentage lives on the
               slider and on each row, so it is not repeated here. A [[[ ]]]
               template, not a string, or the time never ticks. */
            const _cids = JSON.stringify(coverIds);
            add('hero', `[[[
              const L = (k, en) => { const v = hass?.localize?.(k); return (v && v !== k) ? v : en; };
              const T = window._hemmaT || ((k, en, v) => { let s = String(en); if (v) for (const p in v) s = s.split(String.fromCharCode(123) + p + String.fromCharCode(125)).join(String(v[p])); return s; });
              const ids = ${_cids};
              const ago = (iso) => {
                if (!iso) return null;
                const ms = Date.now() - new Date(iso).getTime();
                if (isNaN(ms) || ms < 0) return null;
                const m = ms/60000, h = m/60, d = h/24;
                if (m < 1) return T('time.just_now', 'just now');
                if (m < 60) return (Math.floor(m)===1 ? T('time.minute_ago', '{n} minute ago', { n: 1 }) : T('time.minutes_ago', '{n} minutes ago', { n: Math.floor(m) }));
                if (h < 24) return (Math.floor(h)===1 ? T('time.hour_ago', '{n} hour ago', { n: 1 }) : T('time.hours_ago', '{n} hours ago', { n: Math.floor(h) }));
                if (d < 7)  return (Math.floor(d)===1 ? T('time.day_ago', '{n} day ago', { n: 1 }) : T('time.days_ago', '{n} days ago', { n: Math.floor(d) }));
                return T('time.short.weeks', '{n}w ago', { n: Math.floor(d/7) });
              };
              const posOf = (id) => {
                const p = states[id]?.attributes?.current_position;
                return typeof p === 'number' ? Math.round(p) : null;
              };
              const openStates = ['open', 'opening', 'stopping'];
              const known = ids.map(posOf).filter(v => v != null);
              const avg = known.length
                ? Math.round(known.reduce((a, b) => a + b, 0) / known.length)
                : null;
              const tot = ids.length;
              const openCount = ids.filter(id => openStates.includes(states[id]?.state)).length;
              const moving = ids.some(id => ['opening','closing'].includes(states[id]?.state));
              const part = avg != null && avg > 0 && avg < 100;
              const value = moving
                ? (ids.some(id => states[id]?.state === 'opening') ? T('covers.opening', 'Opening…') : T('covers.closing', 'Closing…'))
                : openCount === 0 ? (tot === 1 ? L('component.cover.entity_component._.state.closed', 'Closed') : T('covers.all_closed', 'All closed'))
                : openCount === tot ? (part ? T('covers.partly_open', 'Partly open') : (tot === 1 ? L('component.cover.entity_component._.state.open', 'Open') : T('covers.all_open', 'All open')))
                : T('covers.n_open', '{n} open', { n: openCount });
              const newest = ids.map(id => states[id]?.last_changed).filter(Boolean).sort().pop();
              return window._hemmaUI.hero({
                value: value,
                sub: ago(newest),
                center: true,
              });
            ]]]`);

            /* The height goes to the control: a grab-anywhere vertical track,
               the way Home does blinds. */
            const coverIcon = (() => {
              const id = (coverIds[0] || '').toLowerCase();
              const dc = (states[coverIds[0]]?.attributes?.device_class || '').toLowerCase();
              if (dc === 'blind' || id.includes('blind')) return 'blinds-vertical-open';
              if (dc === 'shade' || id.includes('shade')) return 'roller-shade-open';
              return 'curtain-open';
            })();
            add('slider', UI.slider({
              /* Shorter than the shared control height by the presets row this
                 popup has and the lock does not, so both sheets land their
                 tiles on the same line. */
              height: 297,
              value: avg == null ? (allClosed ? 0 : 100) : avg,
              invert: true,
              live: { entities: coverIds, attr: 'current_position' },
              icon: coverIcon,
              svc: { domain: 'cover', service: 'set_cover_position',
                     target: { entity_id: coverIds }, field: 'position' },
            }));

            const setTo = (pos) => ({
              domain: 'cover', service: 'set_cover_position',
              target: { entity_id: coverIds }, data: { position: pos },
            });
            add('presets', UI.segments([
              { label: T('covers.close', 'Close'), svc: setTo(0),   active: avg === 0 },
              { label: '25%',   svc: setTo(25),  active: avg === 25 },
              { label: '50%',   svc: setTo(50),  active: avg === 50 },
              { label: '75%',   svc: setTo(75),  active: avg === 75 },
              { label: T('covers.open', 'Open'),  svc: setTo(100), active: avg === 100 },
            ]));

            /* Sectioned by device class. A header earns its place by telling
               two things apart, so one type gets one section named for what it
               actually is - never the generic "Cover". */
            /* The taxonomy lives in hemma-core so the tile template resolves the
               same pair. The literal is only a guard for a stale core. */
            const CURTAIN = { key: 'curtain', label: 'Curtains',
                              open: 'curtain-open', closed: 'curtain-closed' };
            const kindOf = (id) => (window.hemmaCoverKind
              ? window.hemmaCoverKind(states[id]?.attributes?.device_class, id)
              : CURTAIN);

            const KIND = {};
            const byKind = {};
            coverIds.forEach((id) => {
              const k = kindOf(id);
              KIND[k.key] = k;
              (byKind[k.key] = byKind[k.key] || []).push(id);
            });
            const kinds = Object.keys(byKind);

            /* No per-row bar. The trailing word IS the state, the way the lock
               rows read - a 4px line under a row that already prints the number
               says the same thing twice, and it is not a control: it would be a
               drag target well under the 44px minimum, fighting the row's own
               tap-to-open. WORDS is shared so the first paint and the live
               repaint cannot drift apart. */
            const WORDS = {
              state: { opening: T('covers.opening', 'Opening…'), closing: T('covers.closing', 'Closing…') },
              attr: 'current_position',
              exact: { '0': L('component.cover.entity_component._.state.closed', 'Closed'), '100': L('component.cover.entity_component._.state.open', 'Open') },
              tpl: T('covers.pct_open', '{n}% open'),
              fallbackState: { open: L('component.cover.entity_component._.state.open', 'Open'), closed: L('component.cover.entity_component._.state.closed', 'Closed'), stopping: T('covers.stopped', 'Stopped') },
            };
            const wordFor = (id) => {
              const st = states[id]?.state;
              if (WORDS.state[st]) return WORDS.state[st];
              const p = posOf(id);
              if (p == null) return WORDS.fallbackState[st] || L('state.default.unknown', 'Unknown');
              return WORDS.exact[String(p)] || WORDS.tpl.replace('{n}', String(p));
            };

            const rowFor = (id, k) => {
              const open = openStates.includes(states[id]?.state);
              return {
                entity: id,
                icon: open ? KIND[k].open : KIND[k].closed,
                label: hass?.entities?.[id]?.name
                  || states[id]?.attributes?.friendly_name || id,
                value: wordFor(id),
                liveWords: WORDS,
              };
            };

            /* A heading earns its place by telling two things apart. With one
               kind, or with grouping off, there is nothing to tell apart. */
            const grouped = variables.group_by_type !== false && kinds.length > 1;
            if (grouped) {
              kinds.forEach((k, i) => {
                add('k' + i, UI.group(byKind[k].map(id => rowFor(id, k)), KIND[k].label));
              });
            } else {
              const all = [];
              kinds.forEach((k) => byKind[k].forEach((id) => all.push(rowFor(id, k))));
              if (all.length) add('k0', UI.group(all, null));
            }

            if (HZ_SYS && states[HZ_SYS]) {
              const on = states[HZ_SYS].state === 'on';
              add('auto', UI.group([{
                icon: 'scenes',
                label: hass?.entities?.[HZ_SYS]?.name
                  || states[HZ_SYS].attributes?.friendly_name || T('covers.shade_automation', 'Shade automation'),
                value: on ? L('component.automation.entity_component._.state.on', 'On') : L('component.automation.entity_component._.state.off', 'Off'),
                valueTone: on ? 'good' : null,
                svc: { domain: 'homeassistant', service: on ? 'turn_off' : 'turn_on',
                       target: { entity_id: HZ_SYS } },
              }], T('common.automation', 'Automation')));
            }

            const uiCard = {
              type: 'custom:button-card',
              card_mod: { style: contentCardStyle
                + '\n:host { --ha-card-backdrop-filter: none !important; --ha-card-background: transparent !important; --card-background-color: transparent !important; --ha-card-box-shadow: none !important; --ha-card-border-width: 0px !important; }'
                + '\nha-card::before, ha-card::after, #card::before, #card::after, #container::before, #container::after { display: none !important; }'
                + '\nha-card { will-change: auto !important; }'
                + '\n#container { background: transparent !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }' },
              entity: groupId || undefined,
              tap_action: { action: 'none' },
              show_icon: false, show_name: false, show_label: false, show_state: false,
              styles: {
                card: [
                  { background: 'transparent' }, { border: 'none' }, { 'box-shadow': 'none' },
                  { padding: '6px 26px 22px 26px' },
                ],
                grid: [
                  { 'grid-template-areas': areas.join(' ') },
                  { 'grid-template-columns': '1fr' },
                  { 'row-gap': '18px' },
                ],
                custom_fields: fstyle,
              },
              custom_fields: fields,
            };
            return { type: 'vertical-stack', cards: [uiCard] };
          }

          const stackCards = [headerCard, controlsCard, tilesCard];
          if (hitzeschutzCard) stackCards.splice(1, 0, hitzeschutzCard);
          return { type: 'vertical-stack', cards: stackCards };
        ]]]
  icon_tap_action:
    haptic: light
    action: more-info
