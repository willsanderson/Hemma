hemma_popup_cover:
  template:
  - hemma_popup_base
  variables:
    room_name: Home
    cover_entity: null
    covers: []
    smart_automation_entity: null
    smart_automation_today_entity: null
    group_by_type: true
  tap_action:
    haptic: light
    action: |
      [[[
        return window.hemmaPopupAction ? window.hemmaPopupAction() : 'more-info';
      ]]]
    hemma_popup:
      title: ''
      dismissable: true
      close: false
      style: '--popup-min-width: 300px; --popup-max-width: 300px; --popup-min-width-narrow: 300px; --hemma-popup-radius: 34px; --hemma-popup-tint: rgba(0, 0, 5, 0.16);'
      content:
        type: custom:hemma-cover-panel
        entity: '[[[ return variables.cover_entity || entity?.entity_id || null; ]]]'
        name: |
          [[[
            const n = String(this._config?.name || '').trim();
            const many = Array.isArray(variables.covers) && variables.covers.length > 1;
            return many ? (variables.room_name && variables.room_name !== 'Home' ? variables.room_name : '') : (n.startsWith('[' + '[[') || n.indexOf('<') >= 0 ? '' : n);
          ]]]
        covers: '[[[ return Array.isArray(variables.covers) ? variables.covers : []; ]]]'
        automation: '[[[ return variables.smart_automation_entity || null; ]]]'
        automation_today: '[[[ return variables.smart_automation_today_entity || null; ]]]'
  icon_tap_action:
    haptic: light
    action: call-service
    service: |
      [[[
        const ids = (Array.isArray(variables.covers) && variables.covers.length ? variables.covers : [variables.cover_entity || entity?.entity_id]).filter(Boolean);
        return ids.some((id) => ['open', 'opening'].includes(String(states[id]?.state || '').toLowerCase())) ? 'cover.close_cover' : 'cover.open_cover';
      ]]]
    service_data:
      entity_id: |
        [[[
          return (Array.isArray(variables.covers) && variables.covers.length ? variables.covers : [variables.cover_entity || entity?.entity_id]).filter(Boolean);
        ]]]
