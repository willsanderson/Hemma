# Light Popup
hemma_popup_light:
  template:
    - hemma_popup_base

  variables:
    room_name: null  # title override; falls back to the group's area, then "Home"
    lights: []
    group_rooms: true
    popup_group: null  # override the popup's group; 'none' keeps it on `entity` alone
    initial_filter: -1
    show_scenes: false

  custom_fields:
    lpc_init: |
      [[[
        if (typeof window._hemmaLPC !== 'function' || window._hemmaLPCv !== 37) {
              window._hemmaLPCv = 37;
              window._hemmaLPC = function(__entity, __states, __hass, __vars) {
              const entity = __entity, states = __states, hass = __hass, variables = __vars;
              const _pgVar   = variables.popup_group || variables.group_entity || null;
              const _pgOff   = _pgVar === 'none';
              let   groupId  = (_pgOff ? entity?.entity_id : (_pgVar || entity?.entity_id)) || null;
              let   _autoIdx = -1;
              // A flat room group is promoted to the parent group-of-groups, so a room's
              // light card opens the same popup its light badge does.
              if (!_pgOff && groupId && variables.group_rooms === true
                  && !(Array.isArray(variables.lights) && variables.lights.length > 0)) {
                const _mems0 = states[groupId]?.attributes?.entity_id;
                if (!Array.isArray(_mems0) || !Array.isArray(states[_mems0[0]]?.attributes?.entity_id)) {
                  const _from = groupId;
                  for (const sid of Object.keys(states)) {
                    if (!sid.startsWith('light.') || sid === _from) continue;
                    // Keys-then-lookup: reading states[sid] here subscribes to lights only.
                    const mems = states[sid]?.attributes?.entity_id;
                    if (Array.isArray(mems) && mems.includes(_from) && mems.length > 1
                        && Array.isArray(states[mems[0]]?.attributes?.entity_id)) {
                      groupId  = sid;
                      _autoIdx = mems.indexOf(_from);
                      break;
                    }
                  }
                }
              }
  
              if (!window._hemmaLightMoreInfoSetup) {
                window._hemmaLightMoreInfoSetup = true;
                window._hemmaLastScrollTs = 0;
                let _mig_tsy = 0;
                document.addEventListener('touchstart', (e) => {
                  _mig_tsy = e.touches[0].clientY;
                }, { capture: true, passive: true });
                document.addEventListener('touchmove', (e) => {
                  if (Math.abs(e.touches[0].clientY - _mig_tsy) > 8) {
                    window._hemmaLastScrollTs = Date.now();
                  }
                }, { capture: true, passive: true });
                document.addEventListener('ll-custom', (e) => {
                  const d = (e.detail && e.detail.event_data) ? e.detail.event_data : (e.detail || {});
                  if (!d.hemma_light_more_info) return;
                  if (Date.now() - window._hemmaLastScrollTs < 400) return;
                  const ha = document.querySelector('home-assistant');
                  if (ha) {
                    ha.dispatchEvent(new CustomEvent('hass-more-info', {
                      bubbles: true, composed: true,
                      detail: { entityId: d.hemma_light_more_info },
                    }));
                  }
                });
              }
  
              const _expand = (eid, seen = new Set()) => {
                if (!eid || seen.has(eid)) return [];
                seen.add(eid);
                const st = states[eid];
                if (!st) return [];
                const mems = st.attributes?.entity_id;
                if (Array.isArray(mems)) return mems.flatMap(m => _expand(m, seen));
                return eid.startsWith('light.') ? [eid] : [];
              };
  
              const topLevelIds = states[groupId]?.attributes?.entity_id || [];
              const hasRooms = variables.group_rooms === true
                            && topLevelIds.length > 1
                            && Array.isArray(states[topLevelIds[0]]?.attributes?.entity_id);
  
              const toTitle = s => s.replace(/_/g, ' ').replace(/\w\S*/g, w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase());

              const _hassObj = typeof hass !== 'undefined' ? hass : null;
              const _entReg = _hassObj?.entities || {};
              const _getReg = id => _entReg[id] || (_entReg.get && _entReg.get(id)) || null;

              // Group entities are often renamed to a bare "Lights" per area, so the area wins over friendly_name.
              const _areaName = (eid) => {
                const re = _getReg(eid);
                if (!re) return null;
                const aid = re.area_id || (re.device_id ? _hassObj?.devices?.[re.device_id]?.area_id : null);
                return aid ? (_hassObj?.areas?.[aid]?.name || null) : null;
              };

              // A single-room popup takes the group's area, since group helpers are
              // usually renamed to a bare "Lights"; a multi-room one is the whole home.
              const roomName = variables.room_name || _areaName(groupId)
                            || (hasRooms ? 'Home' : states[groupId]?.attributes?.friendly_name)
                            || 'Lighting';

              const rooms = hasRooms
                ? topLevelIds.map(rid => ({
                    name:   _areaName(rid) || states[rid]?.attributes?.friendly_name || toTitle(rid.split('.').pop()),
                    lights: states[rid]?.attributes?.entity_id || [],
                  }))
                : null;
  
              const lightIds = (Array.isArray(variables.lights) && variables.lights.length > 0)
                ? variables.lights
                : rooms ? rooms.flatMap(r => r.lights) : (groupId ? _expand(groupId) : []);
  
              const gidKey     = JSON.stringify(groupId);
              const _lightIds  = JSON.stringify(lightIds);
              const _countSnip = `
                const _all = ${_lightIds};
                const oc  = _all.filter(id => states[id]?.state === 'on').length;
                const tot = _all.length;
              `;
              const n = rooms ? rooms.length : 0;
              const isDesktop = window.innerWidth >= 600;
  
              // Scene detection
              // Keys-then-lookup: ownKeys doesn't register entities, get does.
              const _scopeLeaves = new Set(_expand(groupId));
              const _touchesGroup = (s) => {
                const targets = s.attributes?.entity_id;
                if (!Array.isArray(targets)) return false;
                return targets.some(id => {
                  if (typeof id !== 'string' || !id.startsWith('light.')) return false;
                  if (_scopeLeaves.has(id)) return true;
                  return _expand(id).some(leaf => _scopeLeaves.has(leaf));
                });
              };

              const _showScenes = variables.show_scenes === true;
              const sceneIds = (rooms && _showScenes) ? Object.keys(states || {})
                .filter(id => id.startsWith('scene.'))
                .map(id => states[id])
                .filter(s => !s.entity_id.startsWith('scene.hemma'))
                .filter(s => {
                  const re = _getReg(s.entity_id);
                  return re && !(re.hidden || re.hidden_by || re.disabled || re.disabled_by);
                })
                .filter(_touchesGroup)
                .sort((a, b) => (a.attributes?.friendly_name || a.entity_id)
                  .localeCompare(b.attributes?.friendly_name || b.entity_id))
                .map(s => s.entity_id) : [];
              if (variables.scene_order && Array.isArray(variables.scene_order)) {
                const _so = variables.scene_order;
                sceneIds.sort((a, b) => {
                  const ai = _so.indexOf(a), bi = _so.indexOf(b);
                  if (ai !== -1 && bi !== -1) return ai - bi;
                  if (ai !== -1) return -1;
                  if (bi !== -1) return 1;
                  return 0;
                });
              }
              const hasScenes = sceneIds.length > 0;
              const _scnIdsJson = JSON.stringify(sceneIds);
  
              // Initial filter
              const _popupSessionId = Math.random();
              let initialFilter = typeof variables.initial_filter === 'number' ? variables.initial_filter : -1;
              if (initialFilter === -1 && _autoIdx >= 0 && rooms) initialFilter = _autoIdx;
              if (initialFilter === -1 && variables.initial_filter_entity && rooms) {
                const _ifIdx = topLevelIds.indexOf(variables.initial_filter_entity);
                if (_ifIdx >= 0) initialFilter = _ifIdx;
              }
              // Auto-select
              if (initialFilter === -1 && rooms) {
                const _origId = entity?.entity_id;
                if (_origId) {
                  const _autoIdx = topLevelIds.indexOf(_origId);
                  if (_autoIdx >= 0) initialFilter = _autoIdx;
                }
              }
  
              const ghostStyle = [
                ':host { --ha-card-box-shadow: none !important; --button-card-box-shadow: none !important; --button-card-box-shadow-hover: none !important; --ha-card-border-radius: 0px !important; --ha-card-background: transparent !important; --ha-card-border-width: 0px !important; width: 100% !important; max-width: none !important; }',
                'ha-card { background: transparent !important; border: none !important; border-radius: 0px !important; box-shadow: none !important; overflow: visible !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }',
                'ha-card:hover { box-shadow: none !important; }',
                'ha-ripple { display: none !important; }',
              ].join('\n');
  
              /* Badge pill */
              const _tidsJson = JSON.stringify(topLevelIds);
              const _roomLIds = JSON.stringify(rooms ? rooms.map(r => r.lights) : []);
              const _gkBadge = JSON.stringify(groupId);
              const _badgeOc = `
                const _gid2=${_gkBadge};
                const _sel2=(window._hemmaLF&&window._hemmaLF[_gid2]!==undefined)?window._hemmaLF[_gid2]:-1;
                const _rLIds=${_roomLIds};
                const _aLIds=${_lightIds};
                const _aIds=(_sel2===-1||_sel2===${n})?_aLIds:(_rLIds[_sel2]||_aLIds);
                const oc=_aIds.filter(id=>states[id]?.state==="on").length;
              `;
              const badgePillCard = {
                type: 'custom:button-card',
                entity: groupId,
                tap_action: rooms
                  ? { action: 'fire-dom-event', event_data: { hemma_lf_badge_tap: groupId } }
                  : { action: 'call-service', service: 'script.hemma_light_smart_toggle', service_data: { light_entity: groupId } },
                haptic: 'medium',
                show_icon: false, show_name: false, show_label: false, show_state: false,
                card_mod: {
                  style: [
                    ':host { --ha-card-box-shadow: none !important; --button-card-box-shadow: none !important; --button-card-box-shadow-hover: inset 0 1px 0.5px -0.5px color-mix(in srgb, color-mix(in srgb, var(--pill-accent,#ffffff) var(--hemma-glass-pill-ring-tint-tight,65%), white) calc(var(--hemma-glass-pill-glow-top-tight,0.30) * 150%), transparent), inset 0 -1px 0.5px -0.5px color-mix(in srgb, color-mix(in srgb, var(--pill-accent,#ffffff) var(--hemma-glass-pill-ring-tint-tight,65%), white) calc(var(--hemma-glass-pill-glow-bottom-tight,0.20) * 150%), transparent), inset 0 3px 6px -3px color-mix(in srgb, color-mix(in srgb, var(--pill-accent,#ffffff) var(--hemma-glass-pill-ring-tint,40%), white) calc(var(--hemma-glass-pill-glow-top-soft,0.10) * 150%), transparent), inset 0 -3px 6px -3px color-mix(in srgb, color-mix(in srgb, var(--pill-accent,#ffffff) var(--hemma-glass-pill-ring-tint,40%), white) calc(var(--hemma-glass-pill-glow-bottom-soft,0.06) * 150%), transparent) !important; }',
                    'ha-card { background: var(--pill-fill) !important; border: none !important; border-radius: 50% !important; width: 36px !important; height: 36px !important; aspect-ratio: 1 !important; flex-shrink: 0 !important; backdrop-filter: var(--hemma-glass-pill-backdrop, none) !important; -webkit-backdrop-filter: var(--hemma-glass-pill-backdrop, none) !important; box-shadow: inset 0 1px 0.5px -0.5px var(--pill-glow-top-tight), inset 0 -1px 0.5px -0.5px var(--pill-glow-bottom-tight), inset 0 3px 6px -3px var(--pill-glow-top-soft), inset 0 -3px 6px -3px var(--pill-glow-bottom-soft) !important; cursor: pointer !important; position: relative !important; overflow: visible !important; display: flex !important; align-items: center !important; justify-content: center !important; transition: transform 0.15s ease, box-shadow 0.2s ease, background 0.2s ease !important; --pill-glow-top-tight: color-mix(in srgb, color-mix(in srgb, var(--pill-accent,#ffffff) var(--hemma-glass-pill-ring-tint-tight,65%), white) calc(var(--hemma-glass-pill-glow-top-tight,0.30) * 100%), transparent) !important; --pill-glow-top-soft: color-mix(in srgb, color-mix(in srgb, var(--pill-accent,#ffffff) var(--hemma-glass-pill-ring-tint,40%), white) calc(var(--hemma-glass-pill-glow-top-soft,0.10) * 100%), transparent) !important; --pill-glow-bottom-tight: color-mix(in srgb, color-mix(in srgb, var(--pill-accent,#ffffff) var(--hemma-glass-pill-ring-tint-tight,65%), white) calc(var(--hemma-glass-pill-glow-bottom-tight,0.20) * 100%), transparent) !important; --pill-glow-bottom-soft: color-mix(in srgb, color-mix(in srgb, var(--pill-accent,#ffffff) var(--hemma-glass-pill-ring-tint,40%), white) calc(var(--hemma-glass-pill-glow-bottom-soft,0.06) * 100%), transparent) !important; }',
                    'ha-card::after { content: ""; position: absolute; inset: -1px; border-radius: 50%; padding: 1px; background: conic-gradient(from 0deg, transparent 0deg 50deg, rgba(0,0,0,0.32) 80deg 100deg, transparent 130deg 230deg, rgba(0,0,0,0.32) 260deg 280deg, transparent 310deg 360deg); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); mask-composite: exclude; pointer-events: none; }',
                    '@media (hover: hover) { :host(:hover) ha-card { background: color-mix(in srgb, var(--pill-fill, var(--hemma-glass-pill-fill, rgba(255,255,255,0.12))) 88%, white 12%) !important; } }',
                    'ha-card:active { transform: scale(0.94) !important; }',
                    'ha-ripple { display: none !important; }',
                  ].join('\n'),
                },
                styles: {
                  card: [
                    { '--pill-fill': `[[[${_badgeOc}return oc>0?'#ffffff':'var(--hemma-glass-pill-fill, rgba(255,255,255,0.12))'; ]]]` },
                    { '--pill-accent': '#ffffff' },
                    { border: 'none' }, { padding: '0' },
                  ],
                  grid: [{ 'grid-template-areas': '"c"' }, { 'grid-template-columns': '1fr' }],
                  custom_fields: { c: [{ 'justify-self': 'center' }] },
                },
                custom_fields: {
                  c: `[[[${_badgeOc}return oc>0
                    ? '<img src="${window.hemmaIconUrl('power_on')}" style="width:16px;height:16px;filter:brightness(0);opacity:0.85;display:block;pointer-events:none;" />'
                    : '<img src="${window.hemmaIconUrl('power_on')}" style="width:16px;height:16px;filter:brightness(0) invert(1);opacity:0.92;display:block;pointer-events:none;" />'; ]]]`,
                },
              };
  
              /* Header */
              const headerCard = {
                type: 'custom:button-card',
                entity: groupId,
                tap_action: { action: 'none' },
                show_icon: false, show_name: false, show_label: false, show_state: false,
                card_mod: { style: ghostStyle },
                styles: {
                  card: [
                    { background: 'transparent' }, { border: 'none' }, { 'box-shadow': 'none' },
                    { padding: isDesktop ? '24px 24px 0 24px' : '20px 14px 0 14px' },
                  ],
                  grid: [
                    { 'grid-template-areas': '"f_init f_init" "hdr_t hdr_b"' },
                    { 'grid-template-columns': '1fr auto' },
                    { 'align-items': 'flex-start' },
                  ],
                  custom_fields: {
                    f_init: [{ height: '0' }, { overflow: 'hidden' }, { padding: '0' }, { margin: '0' }],
                    hdr_t: [{ 'justify-self': 'start' }, { 'text-align': 'left' }],
                    hdr_b: [{ 'justify-self': 'end' }, { 'align-self': 'flex-start' }],
                  },
                },
                custom_fields: {
                  f_init: '',
                  hdr_t: '<div style="font-family:var(--primary-font-family,system-ui);color:#fff;">'
                    + '<div style="font-size:16px;font-weight:400;letter-spacing:-0.01em;">' + roomName + '</div>'
                    + '<div style="font-size:13px;color:rgba(255,255,255,0.45);font-weight:400;margin-top:2px;">Light Control</div>'
                    + '</div>',
                  hdr_b: { card: badgePillCard },
                },
              };
  
              /* Light Mode colors */
              const _lc = {
                onBg:    'rgba(255,255,255,0.94)',
                onName:  'rgba(0,0,0,0.85)',
                onLabel: 'rgba(0,0,0,0.50)',
                offBg:   'rgba(255,255,255,0.11)',
                offName: 'rgba(255,255,255,0.90)',
                offLabel:'rgba(255,255,255,0.50)',
              };
              const _hp = {
                activeBg:  'rgba(255,255,255,0.88)',
                activeClr: 'rgba(0,0,0,0.80)',
                inactBg:   'rgba(255,255,255,0.10)',
                inactClr:  'rgba(255,255,255,0.85)',
              };
  
              /* Light entity card */
              const makeLightCard = (lightId) => ({
                type: 'custom:button-card',
                entity: lightId,
                show_icon: false,
                show_entity_picture: true,
                entity_picture: window.hemmaIconUrl('light'),
                tap_action: {
                  action: 'fire-dom-event',
                  event_data: { hemma_light_more_info: lightId },
                },
                hold_action: { action: 'more-info' },
                double_tap_action: { action: 'none' },
                icon_tap_action: { action: 'toggle' },
                show_name: true,
                show_state: false,
                show_label: true,
                label: `[[[ const e=states["${lightId}"]; const b=e?.attributes?.brightness; return b?Math.round(b/2.55)+"%":e?.state==="on"?"On":"Off"; ]]]`,
                extra_styles: ':host{--hemma-card-hover-filter:brightness(1.10);width:100%!important;max-width:none!important;display:block!important;box-sizing:border-box!important;--button-card-ripple-color:transparent!important;--button-card-ripple-hover-color:transparent!important;--ha-ripple-color:transparent!important;--ha-ripple-hover-color:transparent!important;}ha-card{transition:background 0.45s ease,transform var(--hemma-popup-tile-hover-duration,0.2s) ease,filter var(--hemma-popup-tile-hover-duration,0.2s) ease!important;transform:scale(1)!important;}ha-card:hover{transform:scale(var(--hemma-popup-tile-hover-scale,1.01))!important;}ha-card:active{transform:scale(1)!important;}@media (hover:hover){ha-card:hover{filter:var(--hemma-card-hover-filter,brightness(1.06))!important;}ha-card:hover::after{background:var(--lc-hover-tint,rgba(255,255,255,0.06))!important;}}ha-card::before{display:none!important;}ha-card::after{content:""!important;position:absolute!important;inset:0!important;border-radius:inherit!important;background:transparent!important;transition:background var(--hemma-popup-tile-hover-duration,0.2s) ease!important;pointer-events:none!important;}ha-ripple{display:none!important;}div#img-cell{position:relative!important;overflow:hidden!important;transition:transform var(--hemma-popup-tile-hover-duration,0.2s) ease!important;}div#img-cell::before{display:none!important;}div#img-cell::after{content:""!important;display:block!important;position:absolute!important;inset:0!important;background-color:var(--lc-clr,#ffffff)!important;-webkit-mask-image:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%27-0.4809 -0.8399 16.9931 29.6759%27%3E%3Crect height=%2729.6759%27 opacity=%270%27 width=%2716.9931%27 x=%27-0.4809%27 y=%27-0.8399%27/%3E%3Cpath d=%27M4.13672 23.8711L11.5547 23.8711C11.9414 23.8711 12.2344 23.5664 12.2344 23.1797C12.2344 22.8047 11.9414 22.5 11.5547 22.5L4.13672 22.5C3.75 22.5 3.44531 22.8047 3.44531 23.1797C3.44531 23.5664 3.75 23.8711 4.13672 23.8711ZM7.83984 27.2695C9.65625 27.2695 11.168 26.3789 11.2852 25.0312L4.40625 25.0312C4.48828 26.3789 6.01172 27.2695 7.83984 27.2695Z%27 fill=%27white%27/%3E%3Cpath d=%27M0 7.21875C0 11.7188 2.96484 12.832 3.44531 20.6484C3.46875 21.0703 3.72656 21.3398 4.17188 21.3398L11.5078 21.3398C11.9648 21.3398 12.2109 21.0703 12.2461 20.6484C12.7266 12.832 15.6797 11.7188 15.6797 7.21875C15.6797 3.17578 12.2227 0 7.83984 0C3.45703 0 0 3.17578 0 7.21875Z%27 fill=%27white%27/%3E%3C/svg%3E")!important;-webkit-mask-repeat:no-repeat!important;-webkit-mask-position:center!important;-webkit-mask-size:auto 61.5%!important;mask-image:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%27-0.4809 -0.8399 16.9931 29.6759%27%3E%3Crect height=%2729.6759%27 opacity=%270%27 width=%2716.9931%27 x=%27-0.4809%27 y=%27-0.8399%27/%3E%3Cpath d=%27M4.13672 23.8711L11.5547 23.8711C11.9414 23.8711 12.2344 23.5664 12.2344 23.1797C12.2344 22.8047 11.9414 22.5 11.5547 22.5L4.13672 22.5C3.75 22.5 3.44531 22.8047 3.44531 23.1797C3.44531 23.5664 3.75 23.8711 4.13672 23.8711ZM7.83984 27.2695C9.65625 27.2695 11.168 26.3789 11.2852 25.0312L4.40625 25.0312C4.48828 26.3789 6.01172 27.2695 7.83984 27.2695Z%27 fill=%27white%27/%3E%3Cpath d=%27M0 7.21875C0 11.7188 2.96484 12.832 3.44531 20.6484C3.46875 21.0703 3.72656 21.3398 4.17188 21.3398L11.5078 21.3398C11.9648 21.3398 12.2109 21.0703 12.2461 20.6484C12.7266 12.832 15.6797 11.7188 15.6797 7.21875C15.6797 3.17578 12.2227 0 7.83984 0C3.45703 0 0 3.17578 0 7.21875Z%27 fill=%27white%27/%3E%3C/svg%3E")!important;mask-repeat:no-repeat!important;mask-position:center!important;mask-size:auto 61.5%!important;opacity:var(--lc-io,0.9)!important;pointer-events:none!important;transform:translateZ(0)!important;will-change:transform!important;}div#img-cell:hover,div#img-cell:active{transform:scale(1.03)!important;}#img-cell img{opacity:0!important;}',
                styles: {
                  card: [
                    { background: `[[[ return states["${lightId}"]?.state==="on"?"${_lc.onBg}":"${_lc.offBg}";]]]` },
                    { '--lc-nc': `[[[ return states["${lightId}"]?.state==="on"?"${_lc.onName}":"${_lc.offName}"; ]]]` },
                    { '--lc-lc': `[[[ return states["${lightId}"]?.state==="on"?"${_lc.onLabel}":"${_lc.offLabel}"; ]]]` },
                    { '--lc-io': `[[[ return "1";]]]` },
                    { '--lc-clr': `[[[ return states["${lightId}"]?.state==="on"?"#ffffff":"var(--hemma-color-yellow, #FFCC00)";]]]` },
                    /* On-state cards are already near-white, so the hover lift just washes out
                       the dark text and yellow icon. Override via styles.card (inline, beats
                       the :host default in extra_styles) to kill both while the light is on. */
                    { '--hemma-card-hover-filter': `[[[ return states["${lightId}"]?.state==="on"?"none":"brightness(1.10)";]]]` },
                    { '--lc-hover-tint': `[[[ return states["${lightId}"]?.state==="on"?"transparent":"rgba(255,255,255,0.06)";]]]` },
                    { border: 'none' },
                    { 'box-shadow': 'none' },
                    { 'border-radius': '26px' },
                    { cursor: 'pointer' },
                    { padding: '12px 12px' },
                    { width: '100%' },
                  ],
                  grid: [
                    { 'grid-template-areas': '"i n" "i l"' },
                    { 'grid-template-columns': 'auto 1fr' },
                    { 'grid-template-rows': 'auto auto' },
                    { 'column-gap': '10px' },
                    { 'row-gap': '1px' },
                    { 'align-items': 'start' },
                  ],
                  img_cell: [
