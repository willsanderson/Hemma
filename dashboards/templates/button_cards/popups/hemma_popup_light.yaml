                let areas = '"' + Array(C).fill('rs_init').join(' ') + '" "' + Array(C).fill('rs_lbl').join(' ') + '"';
                let rsPhIdx = 0;
                const rowCount = Math.ceil(ids.length / C);
                for (let r = 0; r < rowCount; r++) {
