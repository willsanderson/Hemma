hemma_popup_light:
  template:
  - hemma_popup_base
  variables:
    room_name: null
    lights: []
    group_rooms: true
    popup_group: null
    initial_filter: -1
  custom_fields:
    lpc_init: |
      [[[
        const L = (k, en) => { const v = hass?.localize?.(k); return (v && v !== k) ? v : en; };
        const T = window._hemmaT || ((k, en, v) => { let s = String(en); if (v) for (const p in v) s = s.split(String.fromCharCode(123) + p + String.fromCharCode(125)).join(String(v[p])); return s; });
        if (typeof window._hemmaLPC !== 'function' || window._hemmaLPCv !== 73) {
              window._hemmaLPCv = 73;
              window._hemmaLPC = function(__entity, __states, __hass, __vars, __mode) {
              const entity = __entity, states = __states, hass = __hass, variables = __vars;
              const _pgVar   = variables.popup_group || variables.group_entity || null;
              const _pgOff   = _pgVar === 'none';
              let   groupId  = (_pgOff ? entity?.entity_id : (_pgVar || entity?.entity_id)) || null;
              let   _autoIdx = -1;
              if (!_pgOff && groupId && variables.group_rooms === true
                  && !(Array.isArray(variables.lights) && variables.lights.length > 0)) {
                const _mems0 = states[groupId]?.attributes?.entity_id;
                if (!Array.isArray(_mems0) || !Array.isArray(states[_mems0[0]]?.attributes?.entity_id)) {
                  const _from = groupId;
                  for (const sid of Object.keys(states)) {
                    if (!sid.startsWith('light.') || sid === _from) continue;
                    // Keys-then-lookup: reading states[sid] here subscribes to lights only.
                    const mems = states[sid]?.attributes?.entity_id;
                    if (Array.isArray(mems) && mems.includes(_from) && mems.length > 1
                        && Array.isArray(states[mems[0]]?.attributes?.entity_id)) {
                      groupId  = sid;
                      _autoIdx = mems.indexOf(_from);
                      break;
                    }
                  }
                }
              }

              if (!window._hemmaLightMoreInfoSetup) {
                window._hemmaLightMoreInfoSetup = true;
                window._hemmaLastScrollTs = 0;
                let _mig_tsy = 0;
                document.addEventListener('touchstart', (e) => {
                  _mig_tsy = e.touches[0].clientY;
                }, { capture: true, passive: true });
                document.addEventListener('touchmove', (e) => {
                  if (Math.abs(e.touches[0].clientY - _mig_tsy) > 8) {
                    window._hemmaLastScrollTs = Date.now();
                  }
                }, { capture: true, passive: true });
                document.addEventListener('ll-custom', (e) => {
                  const d = (e.detail && e.detail.event_data) ? e.detail.event_data : (e.detail || {});
                  /* The icon toggles through here rather than button-card's own
                     toggle action, for the same reason the row tap does: the
                     popup dismisses on a background tap and the tile re-renders
                     while the tap is still dispatching, so only the control can
                     say the tap belonged to it. */
                  if (d.hemma_light_toggle) {
                    if (Date.now() - window._hemmaLastScrollTs < 400) return;
                    window._hemmaSuppressDismiss = Date.now() + 600;
                    const _h = document.querySelector('home-assistant')?.hass;
                    if (_h) _h.callService('light', 'toggle', { entity_id: d.hemma_light_toggle });
                    return;
                  }
                  if (!d.hemma_light_more_info) return;
                  if (Date.now() - window._hemmaLastScrollTs < 400) return;
                  /* Claim the tap. The popup dismisses on a background tap and
                     cannot recognize this one from the event: the tile
                     re-renders while the tap is still being dispatched, so the
                     hit test finds nothing under the pointer and reads it as
                     bare ground. The tile knows it was tapped, so it says so -
                     the same way the room pills do. */
                  window._hemmaSuppressDismiss = Date.now() + 600;
                  const ha = document.querySelector('home-assistant');
                  if (ha) {
                    ha.dispatchEvent(new CustomEvent('hass-more-info', {
                      bubbles: true, composed: true,
                      detail: { entityId: d.hemma_light_more_info },
                    }));
                  }
                });
              }

              const _expand = (eid, seen = new Set()) => {
                if (!eid || seen.has(eid)) return [];
                seen.add(eid);
                const st = states[eid];
                if (!st) return [];
                const mems = st.attributes?.entity_id;
                if (Array.isArray(mems)) return mems.flatMap(m => _expand(m, seen));
                return eid.startsWith('light.') ? [eid] : [];
              };

              const topLevelIds = states[groupId]?.attributes?.entity_id || [];
              const hasRooms = variables.group_rooms === true
                            && topLevelIds.length > 1
                            && Array.isArray(states[topLevelIds[0]]?.attributes?.entity_id);

              const toTitle = s => s.replace(/_/g, ' ').replace(/\w\S*/g, w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase());

              const _hassObj = typeof hass !== 'undefined' ? hass : null;
              const _entReg = _hassObj?.entities || {};
              const _getReg = id => _entReg[id] || (_entReg.get && _entReg.get(id)) || null;

              // Group entities are often renamed to a bare "Lights" per area, so the area wins over friendly_name.
              const _areaName = (eid) => {
                const re = _getReg(eid);
                if (!re) return null;
                const aid = re.area_id || (re.device_id ? _hassObj?.devices?.[re.device_id]?.area_id : null);
                return aid ? (_hassObj?.areas?.[aid]?.name || null) : null;
              };

              const roomName = variables.room_name || _areaName(groupId)
                            || (hasRooms ? T('filter.all', 'Home') : states[groupId]?.attributes?.friendly_name)
                            || T('lights.lighting', 'Lighting');
              const LBL_ON = L('component.light.entity_component._.state.on', 'On'), LBL_OFF = L('component.light.entity_component._.state.off', 'Off');
              const HEAD_ALL_ON = T('lights.popup.all_on', 'All on'), HEAD_N_ON = T('lights.popup.n_on', '{n} on'), HEAD_TITLE = T('filter.lights', 'Lights');
              const ALL_OFF_POP = T('lights.popup.all_off', 'All off');

              const rooms = hasRooms
                ? topLevelIds.map(rid => ({
                    name:   _areaName(rid) || states[rid]?.attributes?.friendly_name || toTitle(rid.split('.').pop()),
                    lights: states[rid]?.attributes?.entity_id || [],
                  }))
                : null;

              const lightIds = (Array.isArray(variables.lights) && variables.lights.length > 0)
                ? variables.lights
                : rooms ? rooms.flatMap(r => r.lights) : (groupId ? _expand(groupId) : []);

              const gidKey     = JSON.stringify(groupId);
              const _lightIds  = JSON.stringify(lightIds);
              const _countSnip = `
                const _all = ${_lightIds};
                const oc  = _all.filter(id => states[id]?.state === 'on').length;
                const tot = _all.length;
              `;
              const n = rooms ? rooms.length : 0;
              const isDesktop = window.innerWidth >= 600;

              const TILE_W = 209;
              // The surface is capped at 92vw below, so a tablet fits fewer than five.
              const _fitCols = Math.floor((window.innerWidth * 0.92 - 44 + 10) / (TILE_W + 10));
              const _deskCols = Math.max(2, Math.min(5, _fitCols, rooms
                ? rooms.reduce((m, r) => Math.max(m, (r.lights || []).length), 1)
                : lightIds.length));
              const _deskW = Math.max(560, 44 + _deskCols * TILE_W + (_deskCols - 1) * 10);

              // Initial filter
              const _popupSessionId = Math.random();
              let initialFilter = typeof variables.initial_filter === 'number' ? variables.initial_filter : -1;
              if (initialFilter === -1 && _autoIdx >= 0 && rooms) initialFilter = _autoIdx;
              if (initialFilter === -1 && variables.initial_filter_entity && rooms) {
                const _ifIdx = topLevelIds.indexOf(variables.initial_filter_entity);
                if (_ifIdx >= 0) initialFilter = _ifIdx;
              }
              // Auto-select
              if (initialFilter === -1 && rooms) {
                const _origId = entity?.entity_id;
                if (_origId) {
                  const _autoIdx = topLevelIds.indexOf(_origId);
                  if (_autoIdx >= 0) initialFilter = _autoIdx;
                }
              }

              const ghostStyle = [
                ':host { --ha-card-box-shadow: none !important; --button-card-box-shadow: none !important; --button-card-box-shadow-hover: none !important; --ha-card-border-radius: 0px !important; --ha-card-background: transparent !important; --ha-card-border-width: 0px !important; width: 100% !important; max-width: none !important; }',
                'ha-card { background: transparent !important; border: none !important; border-radius: 0px !important; box-shadow: none !important; overflow: visible !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }',
                'ha-card:hover { box-shadow: none !important; }',
                'ha-ripple { display: none !important; }',
              ].join('\n');

              /* Widget plate. Three layers because each lands at a different
                 moment: styles.card paints on frame one, card_mod outranks the
                 theme but arrives half a second late, and extra_styles carries
                 the entrance because card_mod is far too late to start it. */
              const PLATE_FILL = 'var(--hemma-popup-row-fill, rgba(12,14,19,0.62))';
              const plateMod = [
                ':host { --ha-card-box-shadow: none !important;'
                  + ' --button-card-box-shadow: none !important;'
                  + ' --button-card-box-shadow-hover:'
                  + ' var(--hemma-popup-plate-shadow, none) !important;'
                  + ' --hemma-card-hover-shadow:'
                  + ' var(--hemma-popup-plate-shadow, none) !important;'
                  + ' --hemma-card-hover-filter: none !important;'
                  + ' --hemma-hover-filter: none !important;'
                  + ' --ha-card-backdrop-filter: none !important;'
                  + ' width: 100% !important; max-width: none !important; }',
                'ha-card { background: ' + PLATE_FILL + ' !important;'
                  + ' border: none !important;'
                  + ' border-radius: var(--hemma-popup-row-radius, 26px) !important;'
                  + ' box-shadow: var(--hemma-popup-plate-shadow, none) !important;'
                  + ' backdrop-filter: var(--hemma-popup-plate-backdrop, none) !important;'
                  + ' -webkit-backdrop-filter:'
                  + ' var(--hemma-popup-plate-backdrop, none) !important;'
                  + ' will-change: auto !important;'
                  + ' overflow: visible !important; cursor: default !important; }',
                'ha-card::before, ha-card::after { display: none !important; }',
                'ha-card:hover { box-shadow: var(--hemma-popup-plate-shadow, none) !important;'
                  + ' filter: none !important; }',
                'ha-ripple { display: none !important; }',
              ].join('\n');


              const plateCardStyles = (pad) => [
                { background: PLATE_FILL },
                { 'border-radius': 'var(--hemma-popup-row-radius, 26px)' },
                { 'backdrop-filter': 'var(--hemma-popup-plate-backdrop, none)' },
                { '-webkit-backdrop-filter': 'var(--hemma-popup-plate-backdrop, none)' },
                { 'box-shadow': 'var(--hemma-popup-plate-shadow, none)' },
                { border: 'none' },
                { margin: isDesktop ? '0 0 12px 0' : '0 0 10px 0' },
                { padding: pad },
              ];

              /* Transform only, no opacity. An animated opacity on an ANCESTOR
                 paints the subtree into its own layer and every backdrop-filter
                 inside it has nothing left to sample - so while a room section
                 faded in, its tiles lost their frost entirely and only picked
                 up the blur and the saturation once the animation ended.
                 Transform on an ancestor does not do that.
                 The delay is written in rather than read from a custom
                 property: one set on the same element that extra_styles reads
                 it back on resolves to the PREVIOUS render. */
              const sectionEnter = (delayMs) => '@keyframes hemma-section-in {'
                + ' from { transform: perspective(900px) translateZ(-70px); }'
                + ' to { transform: perspective(900px) translateZ(0); } }'
                + ' ha-card { animation: hemma-section-in 320ms'
                + ' cubic-bezier(0.2, 0.8, 0.3, 1) both;'
                + ' animation-delay: ' + delayMs + 'ms; }'
                + ' @media (prefers-reduced-motion: reduce) {'
                + ' ha-card { animation: none; } }';

              /* The close control's entrance, to the frame: hemma-popup-chrome-in
                 lives in the popup's own shadow root and keyframes do not cross
                 one, so it is restated here rather than referenced. */
              const rowEnter = (delayMs) => '@keyframes hemma-row-in {'
                + ' from { opacity: 0; transform: perspective(900px) translateZ(-70px); }'
                + ' to { opacity: 1; transform: perspective(900px) translateZ(0); } }'
                + ' ha-card { animation: hemma-row-in 320ms'
                + ' cubic-bezier(0.2, 0.8, 0.3, 1) both;'
                + ' animation-delay: ' + delayMs + 'ms; }'
                + ' @media (prefers-reduced-motion: reduce) {'
                + ' ha-card { animation: none; } }';

              /* No stagger here. A stagger reads as a sequence, and these
                 sections are not one - they are the rooms of a house, all
                 equally present. They keep the depth entrance; they just all
                 arrive on the same frame. */
              const nextPlateDelay = () => 0;

              const _tidsJson = JSON.stringify(topLevelIds);
              const _roomLIds = JSON.stringify(rooms ? rooms.map(r => r.lights) : []);
              const _gkBadge = JSON.stringify(groupId);
              const _badgeOc = `
                const _gid2=${_gkBadge};
                const _sel2=(window._hemmaLF&&window._hemmaLF[_gid2]!==undefined)?window._hemmaLF[_gid2]:-1;
                const _rLIds=${_roomLIds};
                const _aLIds=${_lightIds};
                const _aIds=(_sel2===-1)?_aLIds:(_rLIds[_sel2]||_aLIds);
                const oc=_aIds.filter(id=>states[id]?.state==="on").length;
              `;
              const _roomNamesJson = JSON.stringify(rooms ? rooms.map(r => r.name) : []);
              /* The toggle's scope is whatever the pills have selected, so the
                 label names it - and it is a toggle, not a one-way off: with
                 everything off it restores exactly the lights that were on. */
              const _pwrSnip = `
                const _pgid = ${_gkBadge};
                const _psel = (window._hemmaLF && window._hemmaLF[_pgid] !== undefined)
                  ? window._hemmaLF[_pgid] : -1;
                const _pRoom = ${_roomNamesJson};
                const _pAll = ${_lightIds};
                const _pRl = ${_roomLIds};
                const _pIds = (_psel === -1) ? _pAll : (_pRl[_psel] || _pAll);
                const _pName = (_psel >= 0 && _pRoom[_psel]) ? _pRoom[_psel]
                  : ${JSON.stringify(rooms ? T('lights.all_lights', 'All Lights') : (roomName || T('filter.lights', 'Lights')))};
                const oc = _pIds.filter(id => states[id]?.state === 'on').length;
                const _pText = (oc > 0 ? ${JSON.stringify(T('lights.turn_off', 'Turn {name} Off'))} : ${JSON.stringify(T('lights.turn_on', 'Turn {name} On'))}).split('{name}').join(_pName);
              `;

              /* Same object as the close control, mirrored across the bar: same
                 48px target, same flat dark circle, same material. Two chrome
                 controls in one bar in two different materials reads as a
                 mistake - so the state is carried by the fill, not by making one
                 of them glass. White fill with a dark glyph when anything in
                 scope is on, which is how a tile says the same thing. */
              const powerBtnCard = {
                type: 'custom:button-card',
                entity: groupId,
                tap_action: rooms
                  ? { action: 'fire-dom-event', event_data: { hemma_lf_badge_tap: groupId } }
                  : { action: 'call-service', service: 'script.hemma_light_smart_toggle',
                      service_data: { light_entity: groupId } },
                haptic: 'medium',
                show_icon: false, show_name: false, show_label: false, show_state: false,
                card_mod: { style: [
                  ':host { --ha-card-box-shadow: none !important;'
                    + ' --button-card-box-shadow: none !important;'
                    + ' --button-card-box-shadow-hover: none !important; }',
                  'ha-card { border: none !important; border-radius: 50% !important;'
                    + ' width: 48px !important; height: 48px !important;'
                    + ' aspect-ratio: 1 !important; flex-shrink: 0 !important;'
                    + ' background: var(--lp-pwr-bg) !important;'
                    + ' backdrop-filter: var(--hemma-popup-tile-backdrop, none) !important;'
                    + ' -webkit-backdrop-filter: var(--hemma-popup-tile-backdrop, none) !important;'
                    + ' box-shadow: none !important; will-change: auto !important;'
                    + ' cursor: pointer !important; display: flex !important;'
                    + ' align-items: center !important; justify-content: center !important;'
                    + ' transition: background 0.2s ease, transform 0.15s ease !important; }',
                  'ha-card::before, ha-card::after { display: none !important; }',
                  '@media (hover: hover) { ha-card:hover { filter: brightness(1.12) !important; } }',
                  'ha-card:active { transform: scale(0.94) !important; }',
                  'ha-ripple { display: none !important; }',
                ].join('\n') },
                styles: {
                  /* Inline, not only in card_mod: card_mod lands about half a
                     second late, so with the fill and the box only declared
                     there the toggle painted as a bare glyph with no circle and
                     no width - and then jumped to 48px and shoved the state
                     text sideways when card_mod arrived. Frame one has to be
                     the finished shape. */
                  card: [
                    { '--lp-pwr-bg': `[[[ ${_pwrSnip}
                      return oc > 0 ? 'var(--hemma-entity-background-active, rgba(255,255,255,1))'
                                    : 'var(--hemma-popup-row-fill, rgba(12,14,19,0.62))'; ]]]` },
                    { background: 'var(--lp-pwr-bg)' },
                    { width: '48px' }, { height: '48px' },
                    { 'border-radius': '50%' },
                    { 'box-sizing': 'border-box' },
                    { display: 'flex' },
                    { 'align-items': 'center' }, { 'justify-content': 'center' },
                    { border: 'none' }, { padding: '0' },
                  ],
                  grid: [{ 'grid-template-areas': '"pwr_init" "c"' },
                         { 'grid-template-columns': 'auto' },
                         { 'grid-template-rows': '0 auto' },
                         { 'align-items': 'center' }, { 'justify-items': 'center' }],
                  custom_fields: {
                    pwr_init: [{ height: '0' }, { overflow: 'hidden' },
                               { padding: '0' }, { margin: '0' }],
                    c: [{ 'justify-self': 'center' }],
                  },
                },
                custom_fields: {
                  pwr_init: `[[[
                    window._hemmaLPRbadgeEl = window._hemmaLPRbadgeEl || {};
                    window._hemmaLPRbadgeEl[${_gkBadge}] = this;
                    return '';
                  ]]]`,
                  c: `[[[ ${_pwrSnip}
                    return '<img class="lp-pwr" src="${window.hemmaIconUrl('power_on')}"'
                      + ' style="width:17px;height:17px;display:block;pointer-events:none;'
                      + 'filter:' + (oc > 0 ? 'brightness(0)' : 'brightness(0) invert(1)')
                      + ';opacity:' + (oc > 0 ? '0.85' : '0.92') + ';" />';
                  ]]]`,
                },
              };

              /* The state belongs beside the toggle, not in the middle of the
                 sheet: "All off" next to the button that turns them on says what
                 the button will do. Live, so it stays a card rather than the
                 chrome's eyebrow, which is evaluated once when the popup opens. */
              const headerActionsCard = {
                type: 'custom:button-card',
                entity: groupId,
                tap_action: { action: 'none' },
                show_icon: false, show_name: false, show_label: false, show_state: false,
                card_mod: { style: [
                  ':host { --ha-card-box-shadow: none !important;'
                    + ' --button-card-box-shadow: none !important;'
                    + ' --button-card-box-shadow-hover: none !important; }',
                  'ha-card { background: transparent !important; border: none !important;'
                    + ' box-shadow: none !important; backdrop-filter: none !important;'
                    + ' -webkit-backdrop-filter: none !important;'
                    + ' will-change: auto !important; padding: 0 !important;'
                    + ' cursor: default !important; overflow: visible !important; }',
                  'ha-card::before, ha-card::after { display: none !important; }',
                  '#container { padding: 0 !important; overflow: visible !important; }',
                  'ha-ripple { display: none !important; }',
                ].join('\n') },
                styles: {
                  card: [{ background: 'transparent' }, { padding: '0' },
                         { 'box-shadow': 'none' }, { width: 'max-content' }],
                  grid: [{ 'grid-template-areas': isDesktop ? '"pwr st"' : '"pwr"' },
                         { 'grid-template-columns': isDesktop ? 'auto max-content' : 'auto' },
                         { 'align-items': 'center' }, { 'column-gap': '10px' }],
                  custom_fields: {
                    pwr: [{ 'justify-self': 'start' }],
                    st:  [{ 'justify-self': 'start' }, { overflow: 'visible' }],
                  },
                },
                custom_fields: {
                  ...(isDesktop ? { st: `[[[ ${_pwrSnip}
                    const _w = oc === 0 ? ${JSON.stringify(ALL_OFF_POP)} : ${JSON.stringify(HEAD_N_ON)}.split('{n}').join(oc);
                    return '<div style="font-family:var(--primary-font-family,system-ui);'
                      + 'font-size:15px;font-weight:500;letter-spacing:-0.01em;white-space:nowrap;'
                      + 'color:var(--hemma-popup-tiles-text-secondary, rgba(255,255,255,0.56));'
                      + 'text-shadow:0 1px 3px rgba(0,0,0,0.35);">' + _w + '</div>';
                  ]]]` } : {}),
                  pwr: { card: powerBtnCard },
                },
              };

              const makeHeadCard = (field) => ({
                type: 'custom:button-card',
                entity: groupId,
                tap_action: { action: 'none' },
                show_icon: false, show_name: false, show_label: false, show_state: false,
                card_mod: { style: ghostStyle },
                styles: {
                  card: [{ background: 'transparent' }, { border: 'none' },
                         { 'box-shadow': 'none' },
                         { padding: isDesktop ? '4px 22px 14px 22px' : '2px 14px 12px 14px' }],
                  grid: [{ 'grid-template-areas': '"lp_head"' },
                         { 'grid-template-columns': 'minmax(0, 1fr)' }],
                  custom_fields: {
                    lp_head: [{ 'justify-self': 'stretch' }, { overflow: 'visible' }],
                  },
                },
                custom_fields: { lp_head: field },
              });

              const headField = `[[[ ${_countSnip}
                const _UI = window._hemmaUI;
                const _w = oc === 0 ? ${JSON.stringify(LBL_OFF)} : (oc === tot ? ${JSON.stringify(HEAD_ALL_ON)} : ${JSON.stringify(HEAD_N_ON)}.split('{n}').join(oc));
                return (_UI && _UI.headline)
                  ? _UI.headline({ title: ${JSON.stringify(HEAD_TITLE)}, state: _w, barTitle: true }) : '';
              ]]]`;


              /* Badge pill */
              const badgePillCard = {
                type: 'custom:button-card',
                entity: groupId,
                tap_action: rooms
                  ? { action: 'fire-dom-event', event_data: { hemma_lf_badge_tap: groupId } }
                  : { action: 'call-service', service: 'script.hemma_light_smart_toggle', service_data: { light_entity: groupId } },
                haptic: 'medium',
                show_icon: false, show_name: false, show_label: false, show_state: false,
                card_mod: {
                  style: [
                    ':host { --ha-card-box-shadow: none !important; --button-card-box-shadow: none !important; --button-card-box-shadow-hover: inset 0 1px 0.5px -0.5px color-mix(in srgb, color-mix(in srgb, var(--pill-accent,#ffffff) var(--hemma-glass-pill-ring-tint-tight,65%), white) calc(var(--hemma-glass-pill-glow-top-tight,0.30) * 150%), transparent), inset 0 -1px 0.5px -0.5px color-mix(in srgb, color-mix(in srgb, var(--pill-accent,#ffffff) var(--hemma-glass-pill-ring-tint-tight,65%), white) calc(var(--hemma-glass-pill-glow-bottom-tight,0.20) * 150%), transparent), inset 0 3px 6px -3px color-mix(in srgb, color-mix(in srgb, var(--pill-accent,#ffffff) var(--hemma-glass-pill-ring-tint,40%), white) calc(var(--hemma-glass-pill-glow-top-soft,0.10) * 150%), transparent), inset 0 -3px 6px -3px color-mix(in srgb, color-mix(in srgb, var(--pill-accent,#ffffff) var(--hemma-glass-pill-ring-tint,40%), white) calc(var(--hemma-glass-pill-glow-bottom-soft,0.06) * 150%), transparent) !important; }',
