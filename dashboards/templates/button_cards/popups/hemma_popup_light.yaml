             screen blend over noise is a pale panel where the pane used to be. */
          /* Removed, not hidden: at opacity 0 the blend layer is invisible
             and costs the same as a visible one. */
          --hemma-popup-grain-content: none;
          --hemma-popup-grain: 0;
          --hemma-popup-grain-dark: 0;
          --hemma-popup-scrim: rgba(0, 0, 0, 0.26);

          /* No chart to wait for, so the plates arrive as soon as they build. */
          --hemma-popup-plate-enter:
            hemma-plate-in 320ms cubic-bezier(0.2, 0.8, 0.3, 1) both;
          @media (prefers-reduced-motion: reduce) {
            --hemma-popup-plate-enter: none;
          }

          --hemma-popup-hero-label-size: 15px;
          --hemma-popup-row-radius: 26px;
          --hemma-popup-plate-backdrop: blur(24px) saturate(180%);
          /* The tiles and the room pills do blur - they are small, and an
             inactive tile with no blur reads as a hole rather than a control.
             Separate from the plate knob so this can go on its own. */
          --hemma-popup-tile-backdrop: blur(24px) saturate(180%);
          --hemma-popup-row-fill: rgba(12, 14, 19, 0.62);
          --hemma-popup-chart-fill: rgba(10, 12, 16, 0.68);
          /* The theme lifts every ha-card with filter: brightness(1.01) on
             hover, and a filter on an ancestor makes every backdrop-filter
             inside it inert - hovering the space around a plate knocked the
             frost out of it. Killed popup-wide; each plate re-declares its
             own shadow. */
          --hemma-card-hover-filter: none;
          --hemma-hover-filter: none;
          --hemma-card-hover-shadow: none;
          /* Lifted, not slabbed: one wide soft pass carries the height, one
             short contact pass keeps the edge off the room. */
          --hemma-popup-plate-shadow:
            0 18px 40px -22px rgba(0, 0, 0, 0.50),
            0 2px 8px -5px rgba(0, 0, 0, 0.28);

          /* Nothing bare on the room but the close control, and that control
             is itself a glass object. The title is clipped rather than
             removed so a screen reader still gets it - the header widget
             below carries it on screen. */
          /* The sheet's drag handle keeps working; only the little bar
             that advertises it goes. Nothing else on these popups is a hint. */
          --hemma-popup-grabber: transparent;

          /* The chrome arrives with the first plate instead of being there
             on frame one while everything under it fades in. */
          --hemma-popup-chrome-enter:
            hemma-popup-chrome-in 320ms cubic-bezier(0.2, 0.8, 0.3, 1) both;
          .content { animation: none; }
          /* The title lives in the bar now, centered and level with the
             close control, so it is no longer hidden. */
          .header-title { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
          /* The toggle sits with the close rather than opposite it: two
             controls that belong to the same popup read as a pair, and the
             state reads left-to-right off the button it describes. The title
             is absolutely centered on the bar either way. */
          .header-actions {
            order: 0;
            margin-left: 10px;
            margin-right: auto;
            padding-right: 0;
          }
          .header-close {
            border-radius: 50%;
            background: var(--hemma-popup-row-fill, rgba(255, 255, 255, 0.10));
            backdrop-filter: var(--hemma-popup-plate-backdrop, none);
            -webkit-backdrop-filter: var(--hemma-popup-plate-backdrop, none);
            box-shadow: var(--hemma-popup-plate-shadow, none);
          }

          ha-adaptive-dialog, ha-dialog, wa-drawer {
            --ha-card-backdrop-filter: none;
            --ha-card-background: transparent;
            --card-background-color: transparent;
            --ha-card-box-shadow: none;
            --ha-card-border-width: 0px;
          }

          .content .container > * {
            width: 100% !important;
            max-width: none !important;
            box-sizing: border-box !important;
          }
          .content .container {
            scrollbar-width: none;
            overscroll-behavior: contain;
            touch-action: pan-y;
            padding: 0 22px 24px 22px !important;
          }
          @media (max-width: 768px) {
            .content .container { padding: 0 0 24px 0 !important; }
            .header-actions { margin-left: auto !important; margin-right: 0 !important; }
          }
          .content .container::-webkit-scrollbar {
            display: none;
          }
          @media (max-width: 768px) {
          wa-drawer {
              --size: calc(100dvh - env(safe-area-inset-top, 0px)) !important;
              height: calc(100dvh - env(safe-area-inset-top, 0px)) !important;
              min-height: calc(100dvh - env(safe-area-inset-top, 0px)) !important;
          }
          .content .container {
              min-height: calc(100dvh - env(safe-area-inset-top, 0px)) !important;
          }
          wa-drawer.hemma-h-auto {
              --size: var(--ha-bottom-sheet-height, auto) !important;
              height: auto !important;
              min-height: 0 !important;
          }
          wa-drawer.hemma-h-auto .content .container {
              min-height: 0 !important;
          }
          }
      content: |
        [[[
          return typeof window._hemmaLPC === 'function'
            ? window._hemmaLPC(entity, states, typeof hass !== 'undefined' ? hass : null, variables)
            : null;
        ]]]
  hold_action:
    action: none
    hemma_popup: *hemma_light_popup
  icon_tap_action:
    haptic: light
    action: more-info
