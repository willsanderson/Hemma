              /* Room section: label + light cards */
              const makeRoomSection = (room, roomIdx, delayMs) => {
                const ids = room.lights;
                if (!ids || !ids.length) return null;
                const C = isDesktop ? Math.min(_deskCols, ids.length) : 2;
                const fields = {};
                const fstyle = {};

                const rsInitSnip = `
                  window._hemmaLPRooms = window._hemmaLPRooms || {};
