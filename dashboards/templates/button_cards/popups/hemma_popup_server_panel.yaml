hemma_popup_server_panel:
  template:
  - hemma_popup_base
  variables:
    room_name: null
  tap_action:
    hemma_popup:
      title: ''
      dismissable: true
      style: '--popup-min-width: 400px; --popup-max-width: 400px; --popup-min-width-narrow: 340px; --hemma-popup-radius: 34px;'
      content:
        type: custom:hemma-server-panel
        name: '[[[ return variables.room_name || ""; ]]]'
        entity: '[[[ return entity?.entity_id; ]]]'
        entity_memory: '[[[ return variables.entity_memory || null; ]]]'
        entity_disk: '[[[ return variables.entity_disk || null; ]]]'
        entity_status: '[[[ return variables.entity_status || null; ]]]'
