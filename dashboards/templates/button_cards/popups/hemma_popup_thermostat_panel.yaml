hemma_popup_thermostat_panel:
  template:
  - hemma_popup_base
  tap_action:
    haptic: light
    action: |
      [[[
        return window.hemmaPopupAction ? window.hemmaPopupAction() : 'more-info';
      ]]]
    entity: '[[[ return entity?.entity_id; ]]]'
    hemma_popup:
      title: ''
      dismissable: true
      close: false
      style: '--popup-min-width: 320px; --popup-max-width: 320px; --popup-min-width-narrow: 320px; --hemma-popup-radius: 34px; --hemma-popup-tint: rgba(0, 0, 5, 0.16);'
      content:
        type: custom:hemma-thermostat-panel
        entity: '[[[ return entity?.entity_id || null; ]]]'
        name: |
          [[[
            const n = String(this._config?.name || '').trim();
            return (variables.room_name || (n.startsWith('[' + '[[') || n.indexOf('<') >= 0 ? '' : n)).trim();
          ]]]
