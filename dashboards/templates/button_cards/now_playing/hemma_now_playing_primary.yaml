      }
    }

    .np-meta{
      display: flex;
      flex-direction: column;
      gap: 1px;
      min-width: 0;
    }

    .np-title{
      font-size: var(--np-title-size, 16px);
      font-weight: 600;
      letter-spacing: -0.2px;
      line-height: 1.15;
      color: var(--primary-text-color, #fff);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      /* overflow clips at the padding box, or descenders lose their tails. */
