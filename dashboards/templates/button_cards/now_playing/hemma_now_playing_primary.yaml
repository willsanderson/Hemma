      - --np-art-radius: calc(var(--hemma-u-np, 10px) * 1.5)
      - border: none !important
      - padding: var(--np-pad-tb, var(--np-pad-v, 12px)) calc(var(--hemma-u-np, 10px) * 1.6) var(--np-pad-tb, var(--np-pad-v, 12px)) var(--np-pad-v, 12px) !important
      # Forces the artwork (not the text column) to set tile height, or a tall text column grows the card and the centered art floats off-inset.
      - min-height: 'calc(var(--np-art-size, 100px) + (2 * var(--np-pad-tb, var(--np-pad-v, 12px))))'
      # Phone pins height outright: every tile in the row must measure the same regardless of transport controls, or the carousel's pages jump height as you swipe.
      - height: >
          [[[
            return variables.entry_direction === 'horizontal'
              ? 'calc(var(--np-art-size, 100px) + (2 * var(--np-pad-tb, var(--np-pad-v, 12px))))'
