# Now Playing panel (art/title/progress/transport) for one src record from window._hemmaNPSources; purely presentational so the same record can also drive a chip.
hemma_now_playing_primary:
  template:
    - hemma_default

  show_icon: false
  show_name: true
  show_state: false
  show_label: false

  variables:
    src: null
    extra_count: 0
    # Glass surface (rim/elevation/specular), shared with hemma_badge_media; false = flat tile.
    glass: true
    # Smaller transport glyphs (28px vs 36px); set by mobile to match entity-tile height.
    compact_controls: false
    # How many tiles the stack is showing. Transport and the progress bar come off
    # as the slot shrinks, or the text column outgrows the slot and the card grows
    # past min-height - which is exactly what the budget is meant to prevent.
    np_count: 1
    # 'corner' (desktop) grows from top-right; 'horizontal' (mobile row/rail) slides from the right and doesn't skip the first-content animation.
    entry_direction: corner
    swap_motion: true
    # Keys hold_src/--np-swap state into window._hemmaNPSlotState instead of `this`: mobile's row/rail rebuilds this element on an ordinary track change, which would otherwise reset state and replay the entrance animation.
    slot_id: null
    minimized_entity: null
    # force_eval: must resolve before other fields read the (already-changed) src. Holds departure only - keeps old content ~500ms so --np-swap's exit animation has something to animate away.
    hold_src:
      force_eval: true
      value: >
        [[[
          const horizontal = variables.entry_direction === 'horizontal';

          if (!horizontal) return variables.src;

          window._hemmaNPSlotState = window._hemmaNPSlotState || {};
          const store = variables.slot_id
            ? (window._hemmaNPSlotState[variables.slot_id] = window._hemmaNPSlotState[variables.slot_id] || {})
            : this;

          const el = this;
          const scheduleRecheck = (ms) => {
            try { clearTimeout(store._npRecheckTimer); } catch (e) {}
            store._npRecheckTimer = setTimeout(() => {
              try {
                // Forcing a render with no state change takes BOTH steps, and neither alone works:
                //  1. button-card defines `set hass` with no getter, so the old `if (el.hass)`
                //     guard always read undefined and fell through to a bare requestUpdate().
                //  2. button-card's shouldUpdate() only passes on a _config change, a timer tick,
                //     or _hasAnEntityChanged - so a hass clone carrying identical states is
                //     rejected, and a bare requestUpdate() never reaches render().
                // _config is a reactive @state(), so marking it dirty is what actually gets the
                // templates re-evaluated. This is the path a paused tile depends on to lapse: it
                // emits no state change of its own, so nothing else will re-run the collector.
                const h = el._hass || el.hass;
                if (h) el.hass = Object.assign({}, h);
                if (typeof el.requestUpdate === 'function') el.requestUpdate('_config', undefined);
              } catch (e) {}
              try { window._hemmaNPMobileRecheck?.(states); } catch (e) {}
            }, ms + 30);
          };

          const live = variables.src;
          const finish = (result) => {
            try { window._hemmaNPSyncMobileRow?.(el, states); } catch (e) {}
            if (result && result.state === 'paused') {
              const until = Number(result.pauseUntil) || 0;
              const left = until ? (until - Date.now()) : 0;
              scheduleRecheck(until ? Math.min(30000, Math.max(1000, left + 150)) : 20000);
            }
            return result;
          };

          if (live) {
            store._npHoldSrc = live;
            store._npHoldAt = 0;
            return finish(live);
          }

          if (!store._npHoldSrc) return finish(null);
          if (!store._npHoldAt) store._npHoldAt = Date.now();
          const heldFor = Date.now() - store._npHoldAt;
          if (heldFor < 500) {
            scheduleRecheck(500 - heldFor);
            return finish(store._npHoldSrc);
          }
          store._npHoldSrc = null;
          return finish(null);
        ]]]

  tap_action:
    action: >
      [[[
        return variables.src?.kind === 'plex'
          ? (window.hemmaPopupAction ? window.hemmaPopupAction() : 'more-info') : 'more-info';
      ]]]
    entity: '[[[ return variables.src?.entity || null; ]]]'
    hemma_popup:
      title: "[[[ const T = window._hemmaT || ((k, en, v) => { let s = String(en); if (v) for (const p in v) s = s.split('{' + p + '}').join(String(v[p])); return s; }); return T('now_playing.title', 'Now Playing'); ]]]"
      dismissable: true
      # Card builder in hemma-core.js (window._hemmaPlexPopupCard); shared with popups/hemma_popup_plex.yaml and this template's _art.yaml/_chip.yaml siblings.
      dismiss_on_background: true
      popup_styles:
        - style: all
          styles: |
            /* No pane. Unlike the other converted popups this one is not a set
               of widgets - it is a single player, and the four detail tiles
               inside it are panels of that one object rather than objects of
               their own. What it shares with the rest is the chrome: no box
               around the box, and the header reduced to a close control. */
            --hemma-popup-tint: transparent;
            /* The close control's box starts at the bar's padding and the
               content starts at its own gutter; they line up only when the
               two are the same number. */
            --hemma-popup-header-pad: 26px;
            --hemma-popup-header-pad-wide: 26px;
            /* The popups have no pane, so headings and captions sit straight
               on the room. 6px is enough behind a panel and not enough behind
               bare text - this is scoped to the pane-less popups rather than
               raised globally, so the cover and lock sheets keep the lighter
               scrim they are built against. */
            --hemma-popup-scrim-backdrop: blur(22px) saturate(1.5);
            --hemma-popup-backdrop: none;
            --hemma-popup-shadow: none;
            /* The grain is two pseudo-elements on .glass, blending overlay and
               screen. They keep painting after the tint goes transparent, and a
               screen blend over noise is exactly the pale panel that survived
               the first attempt. */
            /* Removed, not hidden: at opacity 0 the blend layer is invisible
               and costs the same as a visible one. */
            --hemma-popup-grain-content: none;
            --hemma-popup-grain: 0;
            --hemma-popup-grain-dark: 0;
            --hemma-popup-scrim: rgba(0, 0, 0, 0.26);

            /* One plate, so one arrival. */
            --hemma-popup-plate-enter:
              hemma-plate-in 320ms cubic-bezier(0.2, 0.8, 0.3, 1) both;
            @media (prefers-reduced-motion: reduce) {
              --hemma-popup-plate-enter: none;
            }

            --hemma-popup-header-pad-wide: 34px;
            /* The player is the tallest widget of any popup, so the standard
               112px drop left it sitting low with dead room above the close
               control. It starts higher and gets that room back. */
            --hemma-popup-top: 70px;
            --hemma-popup-hero-label-size: 15px;
            --hemma-popup-row-radius: 26px;
            /* Frosted, not opaque. The pane's blur used to sit under these, and
               .content still nulls --ha-card-backdrop-filter for every card in
               the popup, so the frost has to be asked for here. The fills drop
               to let it read. */
            /* The theme lifts every ha-card with filter: brightness(1.01) on
               hover. A filter on an ancestor makes every descendant's
               backdrop-filter inert, so hovering the empty space around a
               widget - the wrapper card - knocked the frost out of both of
               them. Killed popup-wide; the plate re-declares its own shadow. */
            --hemma-card-hover-filter: none;
            --hemma-hover-filter: none;
            --hemma-card-hover-shadow: none;

            --hemma-popup-row-pad-x: 26px;
            --hemma-popup-row-pad-y: 15px;
            --hemma-popup-plate-backdrop: blur(24px) saturate(180%);
            --hemma-popup-chart-fill: rgba(10, 12, 16, 0.68);
            --hemma-popup-row-fill: rgba(12, 14, 19, 0.62);
            /* Lifted, not slabbed: one wide soft pass carries the height, one
               short contact pass keeps the edge from dissolving into the room. */
            --hemma-popup-plate-shadow:
              0 18px 40px -22px rgba(0, 0, 0, 0.50),
              0 2px 8px -5px rgba(0, 0, 0, 0.28);

            /* visionOS puts nothing bare on the room: the only chrome outside a
               window is its close control, and that control is itself a glass
               object. The title was printed twice - here and in the widget
               eight pixels below - so it goes, clipped rather than removed so a
               screen reader still gets it. */
            --hemma-popup-grabber: transparent;
            /* The chrome arrives with the first plate instead of being there
               on frame one while everything under it fades in. */
            --hemma-popup-chrome-enter:
              hemma-popup-chrome-in 320ms cubic-bezier(0.2, 0.8, 0.3, 1) both;
            .content { animation: none; }
            /* The title lives in the bar now, centered and level with the
               close control, so it is no longer hidden. */
            .header-title { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
            /* 48px is left alone: the base sizes it so the glyph's ink lands on
               the same left margin as the widgets below. */
            .header-close {
              border-radius: 50%;
              background: var(--hemma-popup-row-fill, rgba(255, 255, 255, 0.10));
              backdrop-filter: var(--hemma-popup-plate-backdrop, none);
              -webkit-backdrop-filter: var(--hemma-popup-plate-backdrop, none);
              box-shadow: var(--hemma-popup-plate-shadow, none);
            }

            /* The player is the content card itself, with no wrapper card to
               inset it, so the gutter that the other popups get from their
               wrapper's padding comes from here. */
            .content .container > * {
              margin: 0 18px 20px !important;
              animation: var(--hemma-popup-plate-enter, none);
            }
            @keyframes hemma-plate-in {
              from { opacity: 0; transform: perspective(900px) translateZ(-70px); }
              to   { opacity: 1; transform: perspective(900px) translateZ(0); }
            }

            ha-adaptive-dialog, ha-dialog, wa-drawer {
              --ha-card-backdrop-filter: none;
              --ha-card-background: transparent;
              --card-background-color: transparent;
              --ha-card-box-shadow: none;
              --ha-card-border-width: 0px;
            }
      content: |
        [[[
          const sid = variables?.src?.entity || '';
          return window._hemmaPlexPopupCard(sid, states);
        ]]]
  # Hold clears any manual pin, handing the slot back to automatic ranking.
  hold_action:
    haptic: medium
    action: call-service
    service: input_text.set_value
    service_data:
      entity_id: input_text.hemma_now_playing_pinned
      value: ''
  double_tap_action:
    action: none

  styles:
    card:
      # Bloom wash strength - lower on desktop (over a photo), raised on mobile's dense grid.
      - --np-bloom-strength: 'var(--np-bloom-desktop, 0.30)'
      - --np-glass: >
          [[[
            return variables.glass === false ? 0 : 1;
          ]]]
      # Guard for the theme's global card-mod-card hover rule; also set in extra_styles :host since either alone has been unreliable (see feedback_card_mod_card_badge_hover).
      - --hemma-card-hover-shadow: var(--np-shadow)
      - --hemma-card-hover-filter: none
      # --np-art (below) keys off hold_src not src so the bloom survives --np-swap's exit animation; --np-has-src feeds ha-card's resting opacity in extra_styles so that same exit animation's cancel-on-finish (which resets opacity:1) lands on "invisible" not "visible".
      # Measures via a clip-wrapper + nowrap inline-block rather than container queries: container-type:inline-size zeroes the text's intrinsic width and collapses the tile. ResizeObserver re-measures on width change.
      - --np-marquee-scan: >
          [[[
            const el = this;
            const scan = () => {
              const root = el.shadowRoot;
              if (!root) return;
              const lines = root.querySelectorAll('.np-line');
              if (!lines.length) return;
              // Seamless one-direction loop: a second copy offset by GAP_PX; animating to -(singleWidth+GAP) lands it exactly where the original started.
              const SPEED_PX_S = 26;
              const GAP_PX = 48;
              const MIN_DUR_S = 4;
              // Plain CSS keyframe shape (not WAAPI offsets) so pause time scales with title length.
              const PAUSE_FRACTION = 0.12;
              lines.forEach((ln) => {
                // Measures the original (first child) alone - scrollWidth would double-count if a clone from a previous pass already exists.
                const original = ln.firstElementChild;
                if (!original) return;
                const singleWidth = original.getBoundingClientRect().width;
                const over = singleWidth - ln.clientWidth;
                const clone = ln.children[1] || null;

                if (over > 4) {
                  const loopDist = singleWidth + GAP_PX;
                  const dur = Math.max(MIN_DUR_S, (loopDist / SPEED_PX_S) / (1 - PAUSE_FRACTION));
                  const mqv = loopDist.toFixed(0) + 'px', durv = dur.toFixed(2) + 's';
                  const key = original.className.split(' ')[0] + '|' + original.textContent;
                  const mq = el._npMq = el._npMq || {};
                  const kept = mq[key] && mq[key].mq === mqv && mq[key].dur === durv && ln.classList.contains('np-scroll');
                  if (!kept) {
                    const base = ln.querySelector('.np-sub') ? 1.2 : 0;
                    Object.keys(mq).forEach((k) => { if (k.split('|')[0] === key.split('|')[0]) delete mq[k]; });
                    mq[key] = { mq: mqv, dur: durv, base, gap: GAP_PX, t0: Date.now() };
                    ln.style.setProperty('--np-mq', mqv);
                    ln.style.setProperty('--np-marquee-dur', durv);
                    // Set per line: edge-fade (on the line) and translateX (on the text) must share duration+delay to stay in lockstep.
                    ln.style.setProperty('--np-mq-delay', base + 's');
                  }
                  ln.classList.add('np-scroll');
                  if (!clone) {
                    const dupe = original.cloneNode(true);
                    dupe.classList.add('np-marquee-clone');
                    dupe.setAttribute('aria-hidden', 'true');
                    dupe.style.marginLeft = GAP_PX + 'px';
                    ln.appendChild(dupe);
                  }
                } else {
                  if (el._npMq) delete el._npMq[original.className.split(' ')[0] + '|' + original.textContent];
                  ln.style.removeProperty('--np-mq');
                  ln.style.removeProperty('--np-marquee-dur');
                  ln.style.removeProperty('--np-mq-delay');
                  ln.classList.remove('np-scroll');
                  if (clone) clone.remove();
                }
              });
              if (!el._npMqObs && window.ResizeObserver) {
                const target = root.getElementById('container');
                if (target) {
                  el._npMqObs = new ResizeObserver(() => requestAnimationFrame(scan));
                  try { el._npMqObs.observe(target); } catch (e) {}
                }
              }
            };
            // Bounded wait: field may not be in the shadow DOM yet the frame after render (same pattern as the artwork layers).
            let tries = 0;
            const wait = () => {
              if (el.shadowRoot?.querySelector('.np-line')) { scan(); return; }
              if (++tries < 30) requestAnimationFrame(wait);
            };
            requestAnimationFrame(wait);
            return 1;
          ]]]
      - --np-has-src: >
          [[[
            return variables.hold_src ? 1 : 0;
          ]]]
      # Gates on hold_src AND panel-expanded: this lives on ha-card, and a descendant's own pointer-events overrides the np_main wrapper's ancestor rule, so hold_src alone left a minimised tile fully tappable.
      - --np-src-ptr: >
          [[[
            const open = states[variables.minimized_entity]?.state !== 'on';
            return (variables.hold_src && open) ? 'auto' : 'none';
          ]]]
      - --np-art: >
          [[[
            const s = variables.hold_src;
            const hold = window._hemmaNPArtHold = window._hemmaNPArtHold || {};
            const warm = window._hemmaNPArtWarm = window._hemmaNPArtWarm || new Map();
            const k = s ? ((s.entity || '') + '|' + (s.key || s.kind || '')) : '';
            const cur = s?.art || null;
            const id = s ? ((s.title || '') + '|' + (s.subtitle || '')) : '';
            const el = this;

            const artk = (u) => {
              const t = String(u || '');
              const q = t.indexOf('?');
              if (q < 0) return t + '|' + id;
              const rest = t.slice(q + 1).split('&')
                .filter((p) => p.slice(0, 6) !== 'token=' && p.slice(0, 8) !== 'authSig=')
                .sort().join('&');
              return t.slice(0, q) + (rest ? '?' + rest : '') + '|' + id;
            };

            const touch = (p) => {
              const rec = warm.get(p);
              if (rec) { warm.delete(p); warm.set(p, rec); }
              return rec;
            };
            // LRU rather than insertion order, so the cover on screen is never the one evicted.
            const trim = () => {
              while (warm.size > 24) {
                const p = warm.keys().next().value;
                const rec = warm.get(p);
                warm.delete(p);
                if (rec && rec.obj) { try { URL.revokeObjectURL(rec.obj); } catch (e) {} }
              }
            };
            const rotates = (u) => {
              try {
                const p = new URL(u, location.origin);
                return p.origin === location.origin &&
                  (p.searchParams.has('token') || p.searchParams.has('authSig'));
              } catch (e) { return false; }
            };

            const claim = (u) => {
              const p = artk(u);
              let rec = touch(p);
              if (!rec) { rec = {}; warm.set(p, rec); trim(); }
              if (rec.obj || rec.busy || rec.tried === u) return rec;
              rec.tried = u;
              if (!rotates(u)) {
                try {
                  const im = new Image();
                  im.decoding = 'async';
                  im.src = u;
                  rec.img = im;
                  im.decode?.().catch(() => {});
                } catch (e) {}
                return rec;
              }
              rec.busy = true;
              fetch(u, { credentials: 'same-origin' })
                .then((r) => (r.ok ? r.blob() : Promise.reject(r.status)))
                .then((b) => {
                  const obj = URL.createObjectURL(b);
                  const publish = () => {
                    rec.busy = false;
                    rec.obj = obj;
                    const card = el.shadowRoot?.querySelector('ha-card');
                    if (card) card.style.setProperty('--np-art', 'url("' + obj + '")');
                  };
                  // Decoded first, or the swap off the token url is a repaint with nothing to show.
                  try {
                    const im = new Image();
                    im.decoding = 'async';
                    im.src = obj;
                    rec.img = im;
                    if (im.decode) im.decode().then(publish, publish); else publish();
                  } catch (e) { publish(); }
                })
                .catch(() => { rec.busy = false; });
              return rec;
            };

            let u = null;
            if (cur) {
              const rec = claim(cur);
              // Until the blob lands, paint the CURRENT url - it is the only one HA will serve.
              u = (rec && rec.obj) || cur;
              if (k) hold[k] = { id: id, url: u };
            } else if (k) {
              const prev = hold[k];
              // Transient null between polls - hold the last good art, but only for this track.
              u = (prev && prev.id === id) ? prev.url : null;
            }

            return u ? `url("${u}")` : 'none';
          ]]]
      # wash to zero on the very poll the held URL is covering for.
      - --np-has-art: >
          [[[
            const s = variables.hold_src;
            const hold = window._hemmaNPArtHold || {};
            const k = s ? ((s.entity || '') + '|' + (s.key || s.kind || '')) : '';
            const id = s ? ((s.title || '') + '|' + (s.subtitle || '')) : '';
            const rec = k ? hold[k] : null;
            return ((rec && rec.id === id && rec.url) || s?.art) ? 1 : 0;
          ]]]
      # Retriggers via JS since a CSS animation can't retrigger on a variable change (mirrors window._hemmaMediaAnim for media badges). Outgoing tile isn't animated here - the chip plays its exit via FLIP from this tile's published rect.
      - --np-swap: >
          [[[
            // hold_src (not src) avoids reading a one-poll-cycle blip as an exit+arrival bounce; store keyed by slot_id survives element rebuild (see slot_id note above).
            window._hemmaNPSlotState = window._hemmaNPSlotState || {};
            const store = variables.slot_id
              ? (window._hemmaNPSlotState[variables.slot_id] = window._hemmaNPSlotState[variables.slot_id] || {})
              : this;

            const key  = variables.hold_src?.key || '';
            const prev = store._npKey;
            const horizontal = variables.entry_direction === 'horizontal';

            // Container-owned motion: record the key so state stays coherent, but never animate.
            if (variables.swap_motion === false) {
              store._npKey = key;
              return key ? 1 : 0;
            }

            if (prev !== key) {
              const isExit  = !key;
              const isFirst = !prev && !isExit;
              // Boot timestamp distinguishes "already playing before page load" from "genuinely new arrival": store._npKey resets every page load, so !prev alone can't tell them apart. Only gates isFirst - exits/promotions/reassignments are untouched.
              window._hemmaNPBootAt = window._hemmaNPBootAt || Date.now();
              const booting = (Date.now() - window._hemmaNPBootAt) < 2500;
              const skipFirst = isFirst && (!horizontal || booting);

              if (!skipFirst && !isExit) {
                const c0 = this;
                if (c0) {
                  if (horizontal) {
                    c0.style.transformOrigin = '50% 50%';
                    c0.style.transform = 'translateX(40px)';
                  } else {
                    c0.style.transformOrigin = '100% 0%';
                    c0.style.transform = 'scale(0.16)';
                  }
                  c0.style.opacity = '0';
                }
              }

              requestAnimationFrame(() => {
                const card = this;
                // isConnected guard: mobile rebuilds this element on track changes (see slot_id note above), so a rebuild landing before this rAF fires would otherwise animate a disconnected ghost. Skipping lets the rebuilt element's own fresh eval retry the entrance correctly.
                if (!card || !card.isConnected) return;
                store._npKey = key;
                try { store._npBodyAnim?.cancel(); } catch (e) {}

                const clearStamp = () => {
                  card.style.removeProperty('transform');
                  card.style.removeProperty('opacity');
                };

                if (skipFirst) { clearStamp(); return; }

                if (isExit) {
                  clearStamp();
                  if (horizontal) {
                    card.style.transformOrigin = '50% 50%';
                    store._npBodyAnim = card.animate(
                      [
                        { opacity: 1, transform: 'translateX(0px)' },
                        { opacity: 0, transform: 'translateX(40px)' },
                      ],
                      { duration: 320, easing: 'cubic-bezier(0.4, 0, 0.2, 1)', fill: 'both' }
                    );
                  } else {
                    card.style.transformOrigin = '50% 0%';
                    store._npBodyAnim = card.animate(
                      [
                        { opacity: 1, transform: 'scale(1, 1)' },
                        { opacity: 0, transform: 'scale(0.78, 0.06)' },
                      ],
                      { duration: 320, easing: 'cubic-bezier(0.4, 0, 0.2, 1)', fill: 'both' }
                    );
                  }

                  store._npBodyAnim.finished
                    .then(() => { try { store._npBodyAnim?.cancel(); } catch (e) {} })
                    .catch(() => {});
                  return;
                }

                // One small overshoot and settle - two overshoots read as wobble.
                const R = 26;

                clearStamp();

                if (horizontal) {
                  const rectScope = String(variables.slot_id || '')
                    .replace(/\|np\d+$/, '');
                  const priorRect = (window._hemmaNPRowRects || {})[rectScope + '|' + key];
                  if (priorRect && tr.width > 4 && tr.height > 4) {
                    const sx = priorRect.width  / tr.width;
                    const sy = priorRect.height / tr.height;
                    const dx = (priorRect.left + priorRect.width  / 2) - (tr.left + tr.width  / 2);
                    const dy = (priorRect.top  + priorRect.height / 2) - (tr.top  + tr.height / 2);
                    card.style.transformOrigin = '50% 50%';
                    store._npBodyAnim = card.animate(
                      [
                        { transform: `translate(${dx.toFixed(1)}px, ${dy.toFixed(1)}px) scale(${sx.toFixed(4)}, ${sy.toFixed(4)})`, opacity: 1 },
                        { transform: 'translate(0px, 0px) scale(1, 1)', opacity: 1 },
                      ],
                      { duration: 460, easing: 'cubic-bezier(0.25, 0.9, 0.3, 1)', fill: 'both' }
                    );
                    store._npBodyAnim.finished
                      .then(() => { try { store._npBodyAnim?.cancel(); } catch (e) {} })
                      .catch(() => {});
                    return;
                  }

                  card.style.transformOrigin = '50% 50%';
                  store._npBodyAnim = card.animate(
                    [
                      { opacity: 0, transform: 'translateX(40px)' },
                      { opacity: 1, transform: 'translateX(-4px)', offset: 0.75 },
                      { opacity: 1, transform: 'translateX(0px)' },
                    ],
                    { duration: 460, easing: 'cubic-bezier(0.25, 0.9, 0.3, 1)', fill: 'both' }
                  );
                  store._npBodyAnim.finished
                    .then(() => { try { store._npBodyAnim?.cancel(); } catch (e) {} })
                    .catch(() => {});
                  return;
                }

                card.style.opacity = '0';
                const artUrl = variables.hold_src?.art;
                const reveal = () => {
                  card.style.transformOrigin = '50% 50%';
                  card.style.removeProperty('opacity');
                  store._npBodyAnim = card.animate(
                    [
                      { opacity: 0 },
                      { opacity: 1 },
                    ],
                    { duration: 420, easing: 'ease-out', fill: 'both' }
                  );
                  store._npBodyAnim.finished
                    .then(() => { try { store._npBodyAnim?.cancel(); } catch (e) {} })
                    .catch(() => {});
                };
                if (artUrl) {
                  let artDone = false;
                  const proceed = () => { if (artDone) return; artDone = true; reveal(); };
                  const img = new Image();
                  img.onload = proceed;
                  img.onerror = proceed;
                  img.src = artUrl;
                  setTimeout(proceed, 400);
                } else {
