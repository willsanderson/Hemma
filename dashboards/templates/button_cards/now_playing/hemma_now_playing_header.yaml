# Now Playing label + waveform toggle; typography matches hemma_time.yaml, motion timing matches filter-overlay's room headers.
hemma_now_playing_header:
  template:
    - hemma_default

  show_icon: false
  show_name: false
  show_state: false
  show_label: false

  variables:
    open: 0
    minimized_entity: input_boolean.hemma_now_playing_minimized
    playing: false

  tap_action:
    haptic: light
    action: call-service
    service: input_boolean.toggle
    service_data:
      entity_id: '[[[ return variables.minimized_entity; ]]]'
  hold_action:
    action: none
  double_tap_action:
    action: none

  styles:
    card:
      - --hemma-card-hover-shadow: none
      - --hemma-card-hover-filter: none
      - --np-head-open: '[[[ return variables.open ? 1 : 0; ]]]'
      - --np-head-min: >
          [[[
            return states[variables.minimized_entity]?.state === 'on' ? 1 : 0;
          ]]]
      - --np-head-playing: >
          [[[
            const run = variables.playing ? 'running' : 'paused';
            try { this.style.setProperty('--np-head-playing', run); } catch (e) {}
            return run;
          ]]]
      - background: none !important
      - backdrop-filter: none !important
      - -webkit-backdrop-filter: none !important
      - box-shadow: none !important
      - border: none !important
      - padding: 0 !important
      - margin: 0 !important
      - width: max-content !important
      - justify-self: end !important
      - cursor: pointer

    grid:
      - display: flex !important
      - flex-direction: row !important
      - align-items: center !important
      - justify-content: flex-end !important
      - gap: 10px !important

  custom_fields:
    label: >
      [[[
        return `<span class="np-head-label">Now Playing</span>`;
      ]]]
    caret: >
      [[[
        return `<div class="np-head-wave">
          <span class="np-wave-bar"></span>
          <span class="np-wave-bar"></span>
          <span class="np-wave-bar"></span>
          <span class="np-wave-bar"></span>
          <span class="np-wave-bar"></span>
        </div>`;
      ]]]

  extra_styles: |
    :host{
      display: block;
      overflow: visible;
      --hemma-card-hover-shadow: none;
      --hemma-card-hover-filter: none;
    }

    ha-ripple, mwc-ripple { display: none !important; }

    ha-card.button-card-main,
    #container,
    .button-card-content,
    #customfields,
    #label,
    #caret{
      overflow: visible !important;
    }

    #label.ellipsis,
    #caret.ellipsis{
      overflow: visible !important;
      text-overflow: clip !important;
    }

    .np-head-label{
      display: inline-block;
      color: rgba(255, 255, 255, var(--hemma-now-playing-text-opacity, 1));
      letter-spacing: var(--hemma-chrome-letter-spacing, 0.2px);
      font-size: var(--hemma-chrome-font-size, 18px);
      line-height: 1;
      padding: 0;
      font-weight: var(--hemma-chrome-font-weight, 700);
      white-space: nowrap;
      pointer-events: none;
      opacity: calc(var(--np-head-open, 0) * (1 - var(--np-head-min, 0)));
      transform: translateX(calc(var(--np-head-min, 0) * 5px));
      transition:
        transform 0.48s cubic-bezier(0.32, 0.72, 0, 1),
        opacity 0.40s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      transition-delay: calc((1 - var(--np-head-open, 0)) * 0.42s);
    }

    .np-head-wave{
      display: flex;
      align-items: center;
      justify-content: center;
      gap: calc(var(--hemma-u, 10px) * 0.3);
      flex: none;
      opacity: var(--np-head-open, 0);
      transition: opacity 0.40s cubic-bezier(0.32, 0.72, 0, 1);
      transition-delay: calc((1 - var(--np-head-open, 0)) * 0.42s);
    }

    .np-wave-bar{
      width: calc(calc(var(--hemma-u, 10px) * 0.25) + (var(--np-head-min, 0) * 0.5px));
      height: calc(var(--hemma-u, 10px) * 1.2);
      border-radius: 1px;
      transform-origin: center;
      background: rgba(255,255,255, calc(0.55 + (var(--np-head-min, 0) * 0.35)));
      transition: width 0.34s cubic-bezier(0.32, 0.72, 0, 1), background-color 0.34s cubic-bezier(0.32, 0.72, 0, 1);
      animation: np-wave-bounce 1.53s ease-in-out infinite;
      animation-play-state: var(--np-head-playing, paused);
    }

    .np-wave-bar:nth-child(1){ height: calc(var(--hemma-u, 10px) * 0.8);  animation-duration: 1.19s; animation-delay: 0.05s; }
    .np-wave-bar:nth-child(2){ height: calc(var(--hemma-u, 10px) * 1.3); animation-duration: 1.615s; animation-delay: 0.15s; }
    .np-wave-bar:nth-child(3){ height: calc(var(--hemma-u, 10px) * 1.7); animation-duration: 1.02s;  animation-delay: 0s;    }
    .np-wave-bar:nth-child(4){ height: calc(var(--hemma-u, 10px) * 1.2); animation-duration: 1.785s; animation-delay: 0.2s;  }
    .np-wave-bar:nth-child(5){ height: calc(var(--hemma-u, 10px) * 0.8);  animation-duration: 1.36s;  animation-delay: 0.1s;  }

    @keyframes np-wave-bounce{
      0%, 100% { transform: scaleY(0.42); }
      50%      { transform: scaleY(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .np-head-label, .np-head-wave, .np-wave-bar{ transition: none; animation: none !important; }
    }

    /* Tablet: drop the "Now Playing" label entirely — the waveform toggle
       alone is the collapse/expand control here. */
    @media (min-width: 768px) and (max-width: 1400px) and (min-height: 501px) and (pointer: coarse),
           (min-width: 768px) and (max-width: 1400px) and (min-height: 501px) and (hover: none) {
      .np-head-label{ display: none !important; }
    }
