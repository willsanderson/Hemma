hemma_now_playing_button:
  variables:
    src: null
    # play | pause | next | prev - keys into GLYPHS below.
    shape: play
    service: media_play_pause
    shown: false
    primary: false
    # Ink height of the glyph. Per-shape ratios keep the glyph set's own relative sizing (skip glyphs are shorter than play/pause).
    glyph_h: null

  show_icon: false
  show_name: false

  tap_action:
    haptic: light
    action: call-service
    service: >
      [[[
        return 'media_player.' + (variables.service || 'media_play_pause');
      ]]]
    service_data:
      # Read at tap time - primary source can change between renders (feedback_button_card_service_data_caching).
      entity_id: '[[[ return variables.src?.entity || ""; ]]]'

  hold_action:
    action: none
  double_tap_action:
    action: none

  styles:
    card:
      # Guards theme's global card-mod-card hover rule; hover feedback is the ::before tint instead (feedback_card_mod_card_badge_hover).
      - --hemma-card-hover-shadow: none
      - --hemma-card-hover-filter: none
      - width: var(--np-btn-size-current, var(--np-btn-size, 40px))
      - height: var(--np-btn-size-current, var(--np-btn-size, 40px))
      - border-radius: 9999px
      # The skip glyphs are two triangles, far wider than the triangle and bar
      # they replaced, so they reach past this fixed 40px box.
      - overflow: visible
      - background: rgba(0,0,0,0)
      - box-shadow: none !important
      - backdrop-filter: none !important
      - -webkit-backdrop-filter: none !important
      - border: none !important
      - padding: 6px
      - transform: none !important
      - position: relative
      - --np-glyph-h-current: >
          [[[
            return variables.glyph_h || '13px';
          ]]]
    grid:
      - display: flex !important
      - align-items: center !important
      - justify-content: center !important
    custom_fields:
      g:
        - line-height: 0

  custom_fields:
    g: >
      [[[
        const REF = 19.3945;
        const GLYPHS = {
          pause: { w: 14.6484, h: 19.3945, d: 'M1.55859 19.3828L4.23047 19.3828C5.25 19.3828 5.78906 18.8438 5.78906 17.8125L5.78906 1.55859C5.78906 0.480469 5.25 0 4.23047 0L1.55859 0C0.539062 0 0 0.527344 0 1.55859L0 17.8125C0 18.8438 0.539062 19.3828 1.55859 19.3828ZM10.0781 19.3828L12.7383 19.3828C13.7695 19.3828 14.2969 18.8438 14.2969 17.8125L14.2969 1.55859C14.2969 0.480469 13.7695 0 12.7383 0L10.0781 0C9.04688 0 8.50781 0.527344 8.50781 1.55859L8.50781 17.8125C8.50781 18.8438 9.04688 19.3828 10.0781 19.3828Z' },
          play:  { w: 19.6289, h: 19.6992, d: 'M2.13281 17.9766C2.13281 19.1367 2.80078 19.6875 3.59766 19.6875C3.94922 19.6875 4.3125 19.5703 4.67578 19.3828L18.3281 11.4023C19.3008 10.8398 19.6289 10.4531 19.6289 9.84375C19.6289 9.22266 19.3008 8.84766 18.3281 8.28516L4.67578 0.304688C4.3125 0.105469 3.94922 0 3.59766 0C2.80078 0 2.13281 0.550781 2.13281 1.71094Z' },
          next:  { w: 30.91, h: 17.43, d: 'M3.253 2.324L3.253 15.105Q3.253 16.964 4.86 16.028L15.822 9.65Q17.429 8.714 15.822 7.779L4.86 1.4Q3.253 0.465 3.253 2.324ZM16.267 2.324L16.267 15.105Q16.267 16.964 17.874 16.028L28.835 9.65Q30.442 8.714 28.835 7.779L17.874 1.4Q16.267 0.465 16.267 2.324Z' },
          prev:  { w: 30.91, h: 17.43, d: 'M27.653 2.324L27.653 15.105Q27.653 16.964 26.046 16.028L15.085 9.65Q13.478 8.714 15.085 7.779L26.046 1.4Q27.653 0.465 27.653 2.324ZM14.64 2.324L14.64 15.105Q14.64 16.964 13.033 16.028L2.072 9.65Q0.465 8.714 2.072 7.779L13.033 1.4Q14.64 0.465 14.64 2.324Z' },
        };
        const g = GLYPHS[variables.shape] || GLYPHS.play;
        return `
          <svg class="np-glyph" viewBox="0 0 ${g.w} ${g.h}" aria-hidden="true"
            style="height: calc(var(--np-glyph-h-current, 13px) * ${(g.h / REF).toFixed(4)}); aspect-ratio: ${g.w} / ${g.h};">
            <path d="${g.d}"></path>
          </svg>
        `;
      ]]]

  extra_styles: >
    [[[
      return `
        :host{
          display: ${variables.shown ? 'block' : 'none'} !important;
          --hemma-card-hover-shadow: none;
          --hemma-card-hover-filter: none;
        }

        ha-ripple,
        mwc-ripple {
          display: none !important;
        }

        /* A skip glyph wider than the button overflowed right only and #container cut its tip. */
        #container, #g{
          overflow: visible !important;
        }
        #g{
          display: flex !important;
          justify-content: center;
          align-items: center;
          width: 100%;
        }

        .np-glyph{
          display: block;
          flex: none;
          width: auto;
          overflow: visible;
        }

        .np-glyph path{
          fill: var(--np-glyph-color, rgba(255,255,255,0.96));
        }

        ha-card::before{
          content:"";
          position:absolute;
          inset:0;
          border-radius:9999px;
          background:#000;
          opacity:0;
          pointer-events:none;
          z-index: 2;
          transition: opacity .18s ease;
        }

        ha-card{
          transform: none !important;
        }

        ha-card:hover::before{
          opacity:${variables.primary ? '0.10' : '0.08'};
        }

        ha-card:active{
          transform: none !important;
        }

        ha-card:active::before{
          opacity:0.20;
        }
      `;
    ]]]
