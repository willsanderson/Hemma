# Now Playing transport button — copied from hemma_badge_media_player's play/next puck, glyph/service parameterised; don't restructure.
# Glyphs are Apple's SF Symbols, inlined from www/hemma/icons/{play,pause,forward,backward}.svg rather than
# referenced as <img>/mask-image: an inlined path takes a fill colour and skips /local/'s 31-day cache.
# Hidden via :host when the source lacks support, not via styles.card/enabled.
hemma_now_playing_button:
  variables:
    src: null
    # play | pause | next | prev — keys into GLYPHS below.
    shape: play
    service: media_play_pause
    shown: false
    primary: false
    # Ink height of the glyph. Per-shape ratios keep Apple's own relative sizing (skip glyphs are shorter than play/pause).
    glyph_h: null

  show_icon: false
  show_name: false

  tap_action:
    haptic: light
    action: call-service
    service: >
      [[[
        return 'media_player.' + (variables.service || 'media_play_pause');
      ]]]
    service_data:
      # Read at tap time — primary source can change between renders (feedback_button_card_service_data_caching).
      entity_id: '[[[ return variables.src?.entity || ""; ]]]'

  hold_action:
    action: none
  double_tap_action:
    action: none

  styles:
    card:
      # Guards theme's global card-mod-card hover rule; hover feedback is the ::before tint instead (feedback_card_mod_card_badge_hover).
      - --hemma-card-hover-shadow: none
      - --hemma-card-hover-filter: none
      - width: var(--np-btn-size-current, var(--np-btn-size, 40px))
      - height: var(--np-btn-size-current, var(--np-btn-size, 40px))
      - border-radius: 9999px
      - background: rgba(0,0,0,0)
      - backdrop-filter: none !important
      - -webkit-backdrop-filter: none !important
      - border: none !important
      - padding: 6px
      - transform: none !important
      - position: relative
      - --np-glyph-h-current: >
          [[[
            return variables.glyph_h || '13px';
          ]]]
    grid:
      - display: flex !important
      - align-items: center !important
      - justify-content: center !important
    custom_fields:
      g:
        - line-height: 0

  custom_fields:
    g: >
      [[[
        // Native viewBoxes are kept whole (not tightened to the path bbox) so Apple's own optical
        // centring survives — play.fill deliberately sits right of centre in its box.
        const REF = 19.3945;
        const GLYPHS = {
          pause: { w: 14.6484, h: 19.3945, d: 'M1.55859 19.3828L4.23047 19.3828C5.25 19.3828 5.78906 18.8438 5.78906 17.8125L5.78906 1.55859C5.78906 0.480469 5.25 0 4.23047 0L1.55859 0C0.539062 0 0 0.527344 0 1.55859L0 17.8125C0 18.8438 0.539062 19.3828 1.55859 19.3828ZM10.0781 19.3828L12.7383 19.3828C13.7695 19.3828 14.2969 18.8438 14.2969 17.8125L14.2969 1.55859C14.2969 0.480469 13.7695 0 12.7383 0L10.0781 0C9.04688 0 8.50781 0.527344 8.50781 1.55859L8.50781 17.8125C8.50781 18.8438 9.04688 19.3828 10.0781 19.3828Z' },
          play:  { w: 19.6289, h: 19.6992, d: 'M2.13281 17.9766C2.13281 19.1367 2.80078 19.6875 3.59766 19.6875C3.94922 19.6875 4.3125 19.5703 4.67578 19.3828L18.3281 11.4023C19.3008 10.8398 19.6289 10.4531 19.6289 9.84375C19.6289 9.22266 19.3008 8.84766 18.3281 8.28516L4.67578 0.304688C4.3125 0.105469 3.94922 0 3.59766 0C2.80078 0 2.13281 0.550781 2.13281 1.71094Z' },
          next:  { w: 22.0312, h: 17.918,  d: 'M0 16.2773C0 17.3789 0.632812 17.9062 1.39453 17.9062C1.72266 17.9062 2.07422 17.8008 2.41406 17.6133L14.7188 10.4414C15.6094 9.92578 15.9492 9.53906 15.9492 8.95312C15.9492 8.36719 15.6094 7.98047 14.7188 7.46484L2.41406 0.292969C2.07422 0.09375 1.72266 0 1.39453 0C0.632812 0 0 0.515625 0 1.61719ZM17.4492 17.8359L20.1094 17.8359C21.1406 17.8359 21.6797 17.2969 21.6797 16.2656L21.6797 1.62891C21.6797 0.550781 21.1406 0.0585938 20.1094 0.0585938L17.4492 0.0585938C16.418 0.0585938 15.8906 0.597656 15.8906 1.62891L15.8906 16.2656C15.8906 17.2969 16.418 17.8359 17.4492 17.8359Z' },
          prev:  { w: 22.0312, h: 17.918,  d: 'M21.6797 16.2773L21.6797 1.61719C21.6797 0.515625 21.0352 0 20.2852 0C19.9453 0 19.6055 0.09375 19.2656 0.292969L6.94922 7.46484C6.07031 7.98047 5.73047 8.36719 5.73047 8.95312C5.73047 9.53906 6.07031 9.92578 6.94922 10.4414L19.2656 17.6133C19.6055 17.8008 19.9453 17.9062 20.2852 17.9062C21.0352 17.9062 21.6797 17.3789 21.6797 16.2773ZM4.23047 17.8359C5.25 17.8359 5.78906 17.2969 5.78906 16.2656L5.78906 1.62891C5.78906 0.597656 5.25 0.0585938 4.23047 0.0585938L1.55859 0.0585938C0.539062 0.0585938 0 0.550781 0 1.62891L0 16.2656C0 17.2969 0.539062 17.8359 1.55859 17.8359Z' },
        };
        const g = GLYPHS[variables.shape] || GLYPHS.play;
        // Height only, width auto — one constrained axis keeps every glyph optically the same size
        // regardless of aspect ratio (feedback_svg_icon_sizing).
        return `
          <svg class="np-glyph" viewBox="0 0 ${g.w} ${g.h}" aria-hidden="true"
            style="height: calc(var(--np-glyph-h-current, 13px) * ${(g.h / REF).toFixed(4)}); aspect-ratio: ${g.w} / ${g.h};">
            <path d="${g.d}"></path>
          </svg>
        `;
      ]]]

  extra_styles: >
    [[[
      const glow = variables.primary
        ? '0 0 3px 0px rgba(255,255,255,0.05), 0 0 7px 0px rgba(255,255,255,0.02)'
        : '0 0 3px 0px rgba(255,255,255,0.18), 0 0 7px 0px rgba(255,255,255,0.09)';

      return `
        :host{
          display: ${variables.shown ? 'block' : 'none'} !important;
          --hemma-card-hover-shadow: none;
          --hemma-card-hover-filter: none;
        }

        ha-ripple,
        mwc-ripple {
          display: none !important;
        }

        .np-glyph{
          display: block;
          width: auto;
          overflow: visible;
        }

        .np-glyph path{
          fill: var(--np-glyph-color, rgba(255,255,255,0.96));
        }

        ha-card::after{
          content:"";
          position:absolute;
          inset:0;
          border-radius:9999px;
          pointer-events:none;
          mix-blend-mode: screen;
          z-index: 1;
          box-shadow: ${glow};
        }

        ha-card::before{
          content:"";
          position:absolute;
          inset:0;
          border-radius:9999px;
          background:#000;
          opacity:0;
          pointer-events:none;
          z-index: 2;
          transition: opacity .18s ease;
        }

        ha-card{
          transform: none !important;
        }

        ha-card:hover::before{
          opacity:${variables.primary ? '0.10' : '0.08'};
        }

        ha-card:active{
          transform: none !important;
        }

        ha-card:active::before{
          opacity:0.20;
        }
      `;
    ]]]
